    RunCycleView:
      additionalProperties: false
      description: One dispatch within a run. Branch, pull request (number and URL) and merge SHA are
        LEARNED FROM WEBHOOKS — the agent derives its own branch identity — so they stay empty on a
        cycle whose agent died before opening a pull request.
      properties:
        agentReason:
          description: >-
            Why this cycle's agent stopped without opening a pull request, as the
            platform's pod-truth watcher classified it — `timed_out` (the run
            deadline), `agent_failed[:<reason>]` (a non-zero exit or a killed
            container), `startup_failed:<reason>: <message>` (the runner never
            started: image pull, scheduling, or a secret that had not
            materialised) or `job_not_found` (the runner's workload disappeared).
            Absent on every cycle that opened a pull request: there the pull
            request is the outcome.
          type: string
        attempts:
          description: Dispatches of THIS cycle (the per-cycle re-dispatch budget, which resets at every
            cycle boundary).
          format: int64
          type: integer
        branch:
          type: string
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          nullable: true
          type: string
          x-go-type: '*time.Time'
        id:
          type: string
        jobRef:
          description: The dispatched runner Job for the current attempt; replaced on re-dispatch.
          type: string
        kind:
          enum:
          - coding
          - conflict
          - fix
          - validation
          type: string
        mergeReason:
          description: >-
            The merge policy's own words for `mergeVerdict` — the auto-merge
            decision's reason, or the host's refusal. Written for a reader, not
            parsed.
          type: string
        mergeSha:
          type: string
        mergeVerdict:
          description: >-
            Why this cycle's pull request did NOT merge, when something decided
            so: `declined` is the auto-merge policy saying the pull request is
            not this run's work, `refused` is the host declining an open pull
            request (a conflict — a conflict issue is minted and the next cycle
            works it). Absent on a cycle whose merge was never decided against,
            which includes every cycle that merged: a merge is recorded by
            `mergeSha`, and each fresh decision overwrites this field, so a
            declined pull request that later merges does not keep the verdict.
          enum:
          - declined
          - refused
          type: string
        prDraft:
          description: >-
            Is the recorded pull request still a draft? A draft is the agent
            saying it is not finished, so nothing merges while this is true —
            recorded because a cycle sitting behind a draft is otherwise
            indistinguishable from one whose agent never opened a pull request.
          type: boolean
        prNumber:
          format: int64
          type: integer
        prUrl:
          description: >-
            The pull request's own page on the host, as the webhook reported it —
            never composed from a repo URL and a number, so a console link either
            is the host's own or is absent. Empty until a pull request is seen.
          type: string
        recording:
          description: >-
            What the platform can serve of this cycle's RunEvent feed — a
            different question from what the cycle did, and one a client has to
            ask before it presents a feed as the story of the cycle.

            `none` — the platform has no record of this cycle's feed at all: a
            v1 cycle, or one whose recorder never started. `recording` — one is
            being written right now, so a reader should expect it to grow.
            `complete` — the attempt's events were recorded end to end.
            `gaps` — a record is being served that the platform KNOWS is
            incomplete, because events were dropped or arrived outside their
            attempt's sequence. `lost` — the platform had a record and cannot
            serve it.

            The last two exist so a partial feed is never presented as the whole
            of it, and so "there is nothing to show" (`none`) stays
            distinguishable from "something was here and is gone" (`lost`) —
            which are the same empty screen and very different bugs.
          enum:
          - none
          - recording
          - complete
          - gaps
          - lost
          type: string
          x-enum-varnames:
          - RunCycleViewRecordingNone
          - RunCycleViewRecordingRecording
          - RunCycleViewRecordingComplete
          - RunCycleViewRecordingGaps
          - RunCycleViewRecordingLost
        resolves:
          description: >-
            The milestone agent-work issues this cycle's pull request claims —
            the merge policy's matched set, which is what the merge closes.
            Recorded so a cycle's working set survives its issues being closed;
            empty until a pull request is seen.
          items:
            format: int64
            type: integer
          type: array
        validationIssue:
          description: >-
            The validation issue this cycle was dispatched at. Set on validation
            cycles only, and recorded per cycle rather than only on the run so a
            repeated validation stays navigable to the issue that framed each
            attempt.
          format: int64
          type: integer
        validationVerdict:
          description: >-
            What THIS validation attempt concluded, from the report at its own
            `mergeSha`. Set on validation cycles only, and only once the attempt
            settles. The run carries the latest attempt's verdict; this is how a
            self-healed run shows that an earlier attempt failed.
          enum:
          - passed
          - partial
          - failed
          - inconclusive
          - unreported
          - skipped
          type: string
      required:
      - id
      - kind
      - attempts
      - createdAt
      type: object
    RunEvent:
      additionalProperties: false
      description: >-
        One event on a run's live feed, envelope version 2. It replaces
        RunProgressLine, which stays for the compatibility window while v1 cycles
        are still in flight. The difference that matters is attribution: a
        RunProgressLine is stamped `main` or `subagent`, which cannot describe a
        run that fans out to a dozen agents at three depths, whereas every
        RunEvent names the agent that produced it and (for an agent's own
        lifecycle events) the agent that spawned it. That is what lets a reader
        rebuild the tree from the feed alone.

        It is ONE flat object with a `kind` discriminator and optional per-kind
        fields, NOT a oneOf. Both generators that consume this document handle a
        flat object cleanly, every consumer already switches on a kind, and
        RunProgressLine established the shape. Which fields a kind uses is stated
        on each field, so a reader of the generated type never has to open the
        design to learn that `phrase` belongs to `agent_progress` and `report` to
        `agent_settled`.

        `additionalProperties: false` holds: a producer that invents a field is
        rejected rather than having it silently dropped on the floor.
      properties:
        agentId:
          description: >-
            Which agent produced this event. `lead` is the session's top-level
            agent; any other value is the runtime's own stable id for a spawned
            agent, stable for that agent's whole life, which is what lets a
            consumer fold many concurrent agents into one row each. Every kind
            carries it — a tool call, a commit and a heartbeat all belong to
            somebody.
          type: string
        background:
          description: >-
            `agent_started` only: was this agent spawned detached from its
            parent's turn? Absence is not `false` — it means the runtime did not
            say, and a consumer must not read silence as either answer.

            `true` is the ordinary case for a builder: the platform does NOT
            constrain the shape of fan-out, the skill does, and it tells a lead
            to dispatch a whole wave in the background and wait on it. `false`
            means the parent is blocked inside this agent's call until it
            returns, which is what lets a reader be shown the lead as *waiting
            on* a named child rather than idle. (An earlier platform forced every
            fan-out into the foreground because a backgrounded subagent forwarded
            none of its messages. That was measured on an older runtime and no
            longer holds; the forcing is gone.)
          type: boolean
          x-go-type-skip-optional-pointer: false
        branch:
          description: '`git_push` and `gh_action`: the branch pushed to, or the branch the workflow run
            is on.'
          type: string
        code:
          description: >-
            `notice` only: WHICH condition, as a closed set. Closed on purpose,
            twice over — a consumer can react to one condition without parsing
            prose, and no free text (a prompt, a credential, a path) can ride a
            notice into a user-visible build log. It is also where the WORDING
            comes from: a surface renders a code's own sentence (`@aep/progress-view`
            owns those), so the same condition cannot read one way in the console
            and another in the playground, which is exactly what happened while
            each producer wrote its own prose.

            Nine conditions the RUN can hit. `api_retry` a retryable model
            failure the runtime is re-attempting; `compaction` the session's
            context being compacted; `refusal` the model declining to answer;
            `rate_limit` the provider throttling; `permission_denied` a tool call
            the harness refused; `terminated` the run being killed from outside;
            `workspace_guard` a write denied outside the workspace; `gap` the
            feed itself losing events (which also shows up as
            RunCycleView.recording `gaps`); `artifact_failed` something the run
            produced that could not be stored.

            Eight more describe the stretch BEFORE the first model turn — the
            dark zone, which is the slowest part of a run and used to show as a
            dead "waiting…". Six are the platform's reading of pod truth:
            `runner_scheduling` no runner has a node yet; `runner_unschedulable`
            the cluster has no room for one; `runner_pulling_image` the image is
            being fetched and the container prepared;
            `runner_image_pull_backoff` that fetch is failing and retrying;
            `runner_config_error` the container cannot start because its
            configuration or secrets are wrong; `runner_starting` the container
            is up and the agent is booting. Two are the runner's own, once it has
            a process but no session: `workspace_provisioning` it is cloning the
            repo, mirroring skills and installing credentials;
            `workspace_ready` that finished and the agent is about to start.
            They are notices rather than agent events for the same reason
            throughout: a pod that has not started is not an agent, and there is
            no session to report a phrase about.
          enum:
          - api_retry
          - compaction
          - refusal
          - rate_limit
          - permission_denied
          - terminated
          - workspace_guard
          - gap
          - artifact_failed
          - runner_scheduling
          - runner_unschedulable
          - runner_pulling_image
          - runner_image_pull_backoff
          - runner_config_error
          - runner_starting
          - workspace_provisioning
          - workspace_ready
          type: string
          x-enum-varnames:
          - RunEventCodeAPIRetry
          - RunEventCodeCompaction
          - RunEventCodeRefusal
          - RunEventCodeRateLimit
          - RunEventCodePermissionDenied
          - RunEventCodeTerminated
          - RunEventCodeWorkspaceGuard
          - RunEventCodeGap
          - RunEventCodeArtifactFailed
          - RunEventCodeRunnerScheduling
          - RunEventCodeRunnerUnschedulable
          - RunEventCodeRunnerPullingImage
          - RunEventCodeRunnerImagePullBackOff
          - RunEventCodeRunnerConfigError
          - RunEventCodeRunnerStarting
          - RunEventCodeWorkspaceProvisioning
          - RunEventCodeWorkspaceReady
        command:
          description: >-
            `tool_use`, `tool_result` and the `git_*` kinds: the command line
            that ran, as the producer scrubbed it. The producer is the only layer
            that can scrub it — by the time it reaches a consumer it is already
            on a user-visible feed — so a producer that cannot redact a command
            omits this rather than sending it.
          type: string
        depth:
          description: >-
            `agent_started`, `agent_progress` and `agent_settled`: how far from
            the lead this agent sits. 1 is spawned by the lead itself. Absent on
            the lead's own events. Recorded rather than derived because a
            consumer that joined the stream late never saw the parents, and it is
            what lets a console indent a tree it did not watch being built.
          type: integer
        detail:
          description: >-
            `notice` only: the human-readable half, capped and scrubbed. `code`
            is what a consumer branches on and what the reader's SENTENCE is
            looked up from; this is the specifics that sentence cannot carry —
            the scheduler's own explanation of why there is no room, the error
            the retry is retrying. Absent when the condition has nothing to add
            beyond its code. A notice carrying detail and NO code is the one case
            where the prose stands alone: a scrubbed line the run itself printed,
            which no closed set could name.
          maxLength: 500
          type: string
        durationMs:
          description: >-
            `agent_settled` (the agent's whole life) and `tool_result` (that one
            call), measured by the producer between the start and the outcome —
            so a tool's number includes model turnaround, not just execution.
          format: int64
          type: integer
        elapsedMs:
          description: >-
            `heartbeat` only: how long the run has already been waiting on `ref`.
            Sent as an elapsed time rather than a start timestamp because a
            consumer that joined the stream late has nothing to subtract from.
          format: int64
          type: integer
        error:
          description: >-
            `turn_ended` and `run_settled`: why it failed, in the producer's own
            words, capped and scrubbed. Absent on a `success` outcome, and absent
            on `cancelled` — nothing failed there, so a message would invent one.
          maxLength: 500
          type: string
        exitCode:
          description: >-
            `tool_result` only: the process status of a shell call. A pointer,
            because a tool that is not a shell reports no code at all — read
            absence as "no code was reported", never as "exited 0".
          type: integer
          x-go-type-skip-optional-pointer: false
        files:
          description: '`git_commit` only: how many files the commit touched.'
          type: integer
        itemId:
          description: >-
            `work_item` only: WHICH named unit of work this event is about — the
            key a consumer folds on, since one item's status changes several
            times over a run and a reader wants one row repainted rather than
            five rows printed. A criterion id ("AC-003-a") when `source` is
            `criterion`, the runtime's own task id when it is `plan`.
          type: string
        itemStatus:
          description: >-
            `work_item` only: where that item now stands. The enum is the union
            of both sources and `source` says which half applies. `planned |
            exploring | authoring | running | healing | pass | fail` is a
            validation criterion moving through the method in ADR-0009; `pending
            | in_progress | completed | deleted` is an entry of an agent's own
            plan, in the vocabulary the runtime's task-list tool uses. They are
            not interchangeable: `completed` says a plan entry was ticked off,
            `pass` says a criterion was asserted and held.
          enum:
          - planned
          - exploring
          - authoring
          - running
          - healing
          - pass
          - fail
          - pending
          - in_progress
          - completed
          - deleted
          type: string
          x-enum-varnames:
          - RunEventItemStatusPlanned
          - RunEventItemStatusExploring
          - RunEventItemStatusAuthoring
          - RunEventItemStatusRunning
          - RunEventItemStatusHealing
          - RunEventItemStatusPass
          - RunEventItemStatusFail
          - RunEventItemStatusPending
          - RunEventItemStatusInProgress
          - RunEventItemStatusCompleted
          - RunEventItemStatusDeleted
        kind:
          allOf:
          - $ref: '#/components/schemas/RunEventKind'
          description: >-
            What this event reports; it decides which of the optional fields
            above are meaningful. Wrapped in a single-member `allOf` rather than
            written as a bare `$ref` because OpenAPI 3.0 discards a `$ref`'s
            siblings, and a property with no description at all reaches the
            generated types as an unexplained field.
        label:
          description: >-
            `agent_started`, `agent_progress` and `agent_settled`: the
            description the parent gave this agent when it spawned it ("Implement
            todo-api service (issue #3)"). It is the only human name an agent
            has — `agentId` is the runtime's opaque handle — so a console with no
            label has nothing to title the row with. Absent when the parent gave
            none.
          maxLength: 200
          type: string
        level:
          description: >-
            `notice` only: how loudly to render it. `error` is a notice about
            something that has already gone wrong, `warn` about something that
            may, `info` about something that merely happened (a compaction). It
            says nothing about the run's fate — that is `run_settled`'s
            `outcome`, and a run can end successfully having emitted several
            `error` notices.
          enum:
          - info
          - warn
          - error
          type: string
          x-enum-varnames:
          - RunEventLevelInfo
          - RunEventLevelWarn
          - RunEventLevelError
        linesAdded:
          description: >-
            `agent_settled` only: lines added by that agent's work, off the
            runtime's own report on the agent's result. Present only there —
            nothing else on this feed can reconstruct it, because a spawned
            agent's individual edits need not reach the feed at all.
          type: integer
        linesRemoved:
          description: '`agent_settled` only: lines removed by that agent''s work, from the same report
            as `linesAdded`.'
          type: integer
        model:
          description: >-
            `run_started`: the model the lead runs on. `agent_started`: repeated
            ONLY when this agent runs on a different model from the lead's, so
            absence there means "the same as the run's" rather than "unknown".
          type: string
        ok:
          description: >-
            `tool_result`, the `git_*` kinds and `gh_action`: did it succeed? A
            pointer, because absence means the producer did not say — read it as
            unknown, never as success.
          type: boolean
          x-go-type-skip-optional-pointer: false
        outcome:
          description: >-
            `turn_ended` and `run_settled`: how it ended. `cancelled` is
            deliberately not a `failure`: the work was taken away rather than
            going wrong, and a run someone stopped on purpose must not be
            reported as broken.
          enum:
          - success
          - failure
          - cancelled
          type: string
          x-enum-varnames:
          - RunEventOutcomeSuccess
          - RunEventOutcomeFailure
          - RunEventOutcomeCancelled
        outputBytes:
          description: >-
            `task_settled` only: how much the backgrounded command wrote. The
            output itself is never on the feed — it can be a build log of any
            size — so this is what tells a reader whether there is anything worth
            going to fetch.
          format: int64
          type: integer
        ownerAgentId:
          description: >-
            `work_item` with `source: plan` only: which agent owns the plan
            entry. Absent means the lead owns it, which is the common case; a
            plan item the lead handed to a spawned agent names that agent here.
          type: string
        parentAgentId:
          description: >-
            `agent_started`, `agent_progress` and `agent_settled`: the agent that
            spawned this one. Absent on a depth-1 agent, whose parent is the lead
            by definition, and on the lead's own events — so absence means "the
            lead", not "unknown".
          type: string
        phrase:
          description: >-
            `agent_progress` only: what the agent says it is doing right now, in
            its own words, capped and scrubbed. It is a state, not a log line — a
            new phrase REPLACES the previous one on that agent's row rather than
            appending, which is the whole reason the kind exists separately from
            `notice`.
          maxLength: 200
          type: string
        ref:
          description: >-
            `heartbeat` only: WHAT is being waited on — the `toolUseId` when
            `waitingOn` is `tool`, the `agentId` when it is `agent`. Absent when
            `waitingOn` is `model`, because the wait is then the emitting agent's
            own turn and `agentId` already names it.
          type: string
        report:
          description: >-
            `agent_settled` only: the agent's closing summary of what it did,
            capped and scrubbed. Treat it as the only copy — a spawned agent's
            transcript does not reach this feed and dies with the pod — so an
            agent that settles without one leaves a reader nothing but counters.
          maxLength: 500
          type: string
        role:
          description: >-
            `agent_started`: what KIND of agent this is, in the runtime's own
            vocabulary (`subagent_type` under claude-code, the agent name under
            opencode). Distinct from `label`: `role` is the reusable definition
            somebody configured, `label` is this one instance's job.
          type: string
        runtime:
          description: >-
            `run_started` only: which coding runtime executed this attempt.
            Recorded on the event rather than looked up from the run, because a
            feed is read back long after the org's runtime setting may have
            moved on, and the two runtimes emit different agent ids, model names
            and tool names — a reader that guesses wrong misreads all three.
          enum:
          - claude-code
          - opencode
          type: string
          x-enum-varnames:
          - RunEventRuntimeClaudeCode
          - RunEventRuntimeOpencode
        seq:
          description: >-
            Position of this event within its attempt, monotonic from the
            attempt's first event. This is what the recorder dedupes on: a
            producer that retries a flush, or a client that reconnects and
            replays, sends the same `seq` again and the second write is a no-op.
            It is NOT unique across a cycle — a re-dispatch starts a new attempt
            at the beginning — so anything that orders or dedupes needs
            RunProgressEvent.attempt alongside it.
          format: int64
          type: integer
        sha:
          description: '`git_commit` and `git_push`: the commit.'
          type: string
        source:
          description: >-
            `work_item` only: which kind of thing the item is. `criterion` is a
            validation criterion the platform put in front of the run; `plan` is
            an entry of an agent's own plan, from the runtime's task-list tool.
            One kind serves both because both are "a named thing whose status
            changes over the run", which is what a console folds on — but only
            `plan` items carry `title` and `ownerAgentId`.
          enum:
          - criterion
          - plan
          type: string
          x-enum-varnames:
          - RunEventSourceCriterion
          - RunEventSourcePlan
        status:
          allOf:
          - $ref: '#/components/schemas/AgentStatus'
          description: >-
            `agent_settled` and `task_settled` only: how the agent, or the
            backgrounded task it owned, ended. See AgentStatus — in particular
            that `stopped` is a cancellation and not a failure.
        summary:
          description: >-
            `tool_use`, `tool_result`, the `git_*` kinds, `gh_action`,
            `task_started` and `task_settled`: one line describing the call,
            composed by the producer for a reader — a file path, a search term, a
            workflow name. Capped, and never the raw arguments, which is what
            keeps a feed readable when an agent passes a whole file as a
            parameter.

            A `task_settled` carries the SAME summary its `task_started` did.
            Without it the only thing left to name a finished background command
            is its `taskId`, and a row reading `background bql1cn6sh · failed`
            cannot be matched by eye to the command that failed.
          maxLength: 200
          type: string
        taskId:
          description: >-
            `task_started` and `task_settled`: the backgrounded command's id,
            which is what pairs the two. Distinct from `toolUseId` on purpose —
            the tool call that STARTS a background task settles immediately while
            the task runs on, so `toolUseId` cannot join a task's start to its
            end.
          type: string
        taskKind:
          description: >-
            `run_started` only: what this run was dispatched to do — write code
            (`implementation`) or verify an already-deployed system
            (`validation`). The two emit different work items and reach for
            different skills, so a reader holding nothing but the feed still
            needs to be able to tell them apart.
          enum:
          - implementation
          - validation
          type: string
          x-enum-varnames:
          - RunEventTaskKindImplementation
          - RunEventTaskKindValidation
        title:
          description: >-
            `work_item` with `source: plan` only: the plan entry's own text. A
            criterion carries no title here — its `itemId` resolves against the
            criteria the platform already holds, and repeating the text would let
            the two copies drift.
          maxLength: 200
          type: string
        tokens:
          description: >-
            `agent_settled` only: total tokens that agent's work consumed, for
            the row's badge. The priced, per-model breakdown of a whole turn is
            `usage` on `turn_ended`; this is a single number about one agent, and
            the two are not summable into each other.
          format: int64
          type: integer
        tool:
          description: >-
            `tool_use` and `tool_result`: the tool's name as the runtime calls it
            ("Bash", "Edit", "Agent"). Deliberately NOT normalised across
            runtimes — their tool sets differ, and a normalised name would hide
            which tool actually ran.
          type: string
        toolCount:
          description: >-
            `agent_settled` only: how many tool calls that agent made, from the
            runtime's report on it. A spawned agent's individual calls need not
            reach this feed, so this is often the only measure of how much work
            it did.
          type: integer
        toolUseId:
          description: >-
            The tool call this event is about, and the join key of the whole
            feed: a `tool_result` carries the id of the `tool_use` it answers,
            and `git_commit`, `git_push` and `gh_action` carry the id of the
            shell call that caused them.

            `task_started` and `task_settled` carry it too, where the runtime
            named the call that launched the task. That is what lets a surface
            draw ONE row for a backgrounded command — the action, marked
            background, later gaining its outcome — instead of an action row and
            an unattached settle row repeating the same command line. `taskId`
            still joins a task's start to its end; this joins both of them to the
            call that started it, which `taskId` cannot do.

            Absent on every other kind, and absent on a task whose launching
            call the runtime did not name.
          type: string
        ts:
          description: >-
            When the producer emitted the event, from the producer's own clock.
            Ordering within an attempt is `seq`'s job, not this field's — two
            events can share a timestamp, and a producer's clock is not the
            platform's.
          format: date-time
          type: string
        usage:
          allOf:
          - $ref: '#/components/schemas/TurnUsage'
          description: >-
            `turn_ended` and `run_settled`: the token usage of what just settled,
            with its per-model split. See TurnUsage for the two facts a reader
            gets wrong otherwise — `model: ""` is a mixed-model aggregate rather
            than an unknown one, and the figure is CUMULATIVE across the
            session's turns, so `turn_ended`'s number must never be summed and
            `run_settled` carries the last of them. The tokens and the models are
            the persisted truth; the cost is stamped at capture time. An explicit
            pointer under this contract's prefer-skip-optional-pointer default,
            because a value type would put a zero usage on EVERY event and "the
            producer reported no usage" has to stay distinguishable from "this
            turn cost nothing".
          x-go-type-skip-optional-pointer: false
        v:
          description: >-
            Envelope version, always 2. It is what lets a reader tell a v2 event
            from the v1 RunProgressLine records that share the store during the
            compatibility window, and it is the field a future incompatible
            change bumps — rather than that change being smuggled in as a new
            meaning for an existing field, which is what makes a stored feed
            unreadable years later.
          enum:
          - 2
          type: integer
          x-enum-varnames:
          - RunEventV2
        waitingOn:
          description: >-
            `heartbeat` only: what the run is blocked on while it emits nothing
            else — a `tool` still executing, the `model` still producing a turn,
            or a spawned `agent` still running. The kind exists because bare
            silence is indistinguishable from a stall; this field is what makes
            the silence explainable.
          enum:
          - tool
          - model
          - agent
          type: string
          x-enum-varnames:
          - RunEventWaitingOnTool
          - RunEventWaitingOnModel
          - RunEventWaitingOnAgent
      required:
      - v
      - seq
      - ts
      - kind
      - agentId
      type: object
    RunEventKind:
      description: >-
        What a RunEvent reports. It selects which of the event's optional fields
        are meaningful, and each of those fields names the kinds it belongs to.

        `run_started` opens an attempt and states its runtime, model and task
        kind. `agent_started`, `agent_progress` and `agent_settled` are one
        agent's life — the lead's or a spawned one's — carrying its label, role,
        depth and parent, then its live phrase, then its status, report and
        counters. `tool_use` and `tool_result` pair a call with its outcome
        through `toolUseId`. `task_started` and `task_settled` are a backgrounded
        shell command, which outlives the tool call that started it and so needs
        its own `taskId`. `git_commit`, `git_push` and `gh_action` are the run's
        effects on the repository and its host. `work_item` is a named unit of
        work whose status changed — a validation criterion, or an entry of an
        agent's own plan. `heartbeat` says the run is alive and what it is
        waiting on, so silence is never ambiguous. `notice` is an out-of-band
        condition (a retry, a refusal, a denied write) under a closed `code`.
        `turn_ended` closes one model turn with its outcome and usage, and
        `run_settled` closes the attempt.
      enum:
      - run_started
      - agent_started
      - agent_progress
      - agent_settled
      - tool_use
      - tool_result
      - task_started
      - task_settled
      - git_commit
      - git_push
      - gh_action
      - work_item
      - heartbeat
      - notice
      - turn_ended
      - run_settled
      type: string
      x-enum-varnames:
      - RunEventKindRunStarted
      - RunEventKindAgentStarted
      - RunEventKindAgentProgress
      - RunEventKindAgentSettled
      - RunEventKindToolUse
      - RunEventKindToolResult
      - RunEventKindTaskStarted
      - RunEventKindTaskSettled
      - RunEventKindGitCommit
      - RunEventKindGitPush
      - RunEventKindGhAction
      - RunEventKindWorkItem
      - RunEventKindHeartbeat
      - RunEventKindNotice
      - RunEventKindTurnEnded
      - RunEventKindRunSettled
    RunProgressEvent:
      additionalProperties: false
      description: >-
        One SSE frame on the run progress stream. `type` discriminates the
        payload: `cycle` carries a RunCycleView (the client upserts by id and
        renders one accordion section per cycle), `event` one RunEvent — the v2
        feed — stamped with the cycle and attempt that produced it, `line` one
        RunProgressLine attributed to its own cycle, and `done` the terminal run
        state, after which the server closes the stream.

        `event` and `line` are the same feed in two envelope versions and a
        single stream can carry both: a run whose earlier cycles were dispatched
        before the v2 cutover replays them as `line` frames and its later ones as
        `event` frames. A consumer must therefore handle whichever it is given
        rather than choosing one, for as long as the compatibility window lasts.
      properties:
        attempt:
          description: >-
            Which dispatch of `cycleId` produced the frame's `event`. Stamped by
            aep-api on `event` frames. RunEvent.seq is monotonic only WITHIN one
            attempt — a re-dispatch starts again at the beginning — so anything
            that orders or dedupes events needs this alongside it.
          type: integer
        cycle:
          $ref: '#/components/schemas/RunCycleView'
        cycleId:
          description: >-
            Which cycle produced the frame's `event`. Stamped by aep-api as it
            relays, because a runner knows what it is doing but not which cycle
            of which run it turned out to be. Present on `event` frames only — a
            `line` frame carries its own cycle attribution inside
            RunProgressLine.
          type: string
        event:
          $ref: '#/components/schemas/RunEvent'
        line:
          $ref: '#/components/schemas/RunProgressLine'
        state:
          description: Terminal run state — present only on the `done` frame.
          type: string
        type:
          enum:
          - cycle
          - line
          - event
          - done
          type: string
          x-enum-varnames:
          - RunProgressEventTypeCycle
          - RunProgressEventTypeLine
          - RunProgressEventTypeEvent
          - RunProgressEventTypeDone
      required:
      - type
      type: object
    RunProgressLine:
      additionalProperties: false
      description: 'One line of a cycle''s agent log: the runner''s progress envelope (phase | tool_use
        | activity | tool_result | git_commit | git_push | gh_action | log | progress_item | result)
        plus the attribution the console groups on — which cycle produced it, and whether the main
        agent or one of its Task subagents did.'
      properties:
        branch:
          type: string
        command:
          type: string
        cycleId:
          description: Id of the cycle this line belongs to — the accordion section key.
          type: string
        cycleIndex:
          description: 1-based position of that cycle in the run, so the console can label a section
            without holding the whole cycle list.
          format: int64
          type: integer
        cycleKind:
          description: Kind of that cycle (coding | conflict | fix | validation) — the section label.
          type: string
        durationMs:
          description: '`tool_result` only: how long the call took, measured by the runner between
            the call and its outcome, so it includes model turnaround.'
          format: int64
          type: integer
        emitter:
          description: Who produced the line. The runner stamps `subagent` only on lines forwarded from
            inside a Task tool call; everything else is the main agent.
          enum:
          - main
          - subagent
          type: string
          x-enum-varnames:
          - RunProgressLineEmitterMain
          - RunProgressLineEmitterSubagent
        emitterId:
          description: Which subagent, for the cycles that fan out to several at once — the id of the
            fan-out tool call, stable for that subagent's whole life. Absent on main-agent lines.
          type: string
        emitterLabel:
          description: The description the main agent gave that subagent ("Implement todo-api service
            (issue #3)"). Absent on main-agent lines, and on a fan-out that carried no description.
          type: string
        error:
          type: string
        exitCode:
          description: '`tool_result` only: the process status of a failed shell call, parsed from the
            SDK''s own `Exit code N` first line. Absent when the tool was not a shell — those report a
            `<tool_use_error>` with no code — so read absence as "no code was reported", never as
            "exited 0".'
          format: int64
          type: integer
        files:
          format: int64
          type: integer
        itemId:
          description: '`progress_item` only: WHICH named unit of work the line is about — the key a
            consumer folds on, since many lines describe the same item and a reader wants one row
            repainted rather than many rows printed. Validation binds items to acceptance criteria
            ("AC-003-a"), which `cycleKind` already implies, so this never repeats it. The status
            itself rides on `status`, scoped by `kind`: planned | exploring | authoring | running |
            healing | pass | fail.'
          type: string
        kind:
          type: string
        level:
          type: string
        linesAdded:
          description: A fanned-out subagent's total lines added, off the SDK's own report on its fan-out
            call's result. Present only there; nothing in the feed can reconstruct it.
          format: int64
          type: integer
        linesRemoved:
          description: A fanned-out subagent's total lines removed, from the same report.
          format: int64
          type: integer
        ok:
          description: '`tool_result` only: whether the call succeeded. Absent on every other kind — so
            read absence as "not a tool result", never as success.'
          type: boolean
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        sha:
          type: string
        status:
          type: string
        summary:
          type: string
        tool:
          type: string
        toolCount:
          description: A fanned-out subagent's total tool calls, off the SDK's own report on its fan-out
            call's result. Present only there.
          format: int64
          type: integer
        toolUseId:
          description: The tool call this line is about. A `tool_result` carries the id of the `tool_use`
            it answers, which is what pairs a call with its outcome once several subagents interleave
            the feed.
          type: string
        ts:
          type: string
      required:
      - cycleId
      - cycleKind
      - cycleIndex
      - kind
      - emitter
      type: object
    RunFailure:
      additionalProperties: false
      description: >-
        The platform's own record of why a run is failing — the facts that used
        to survive only as one aep-api log line once the run settled. Present on
        a run that has met a fault: while the run is still non-terminal it is the
        fault being RETRIED (read `attempts` against `maxAttempts`); on a failed
        run it is the terminal fault `terminalReason` names. Absent on a run
        that met none, on a cancelled run (a person stopping an increment is not
        a fault), and on every run failed before this record existed — a
        consumer renders the terminal reason alone and says the platform recorded
        no further details.
        `code` is a closed set and the console owns each code's sentence, the
        rule RunEvent.notice established; `detail` is the platform's recorded
        error text — never model output or a request body — scrubbed and capped
        by the producer, for a reader who wants the platform's exact words.
      properties:
        code:
          description: >-
            Which failure class. `dependency-unprovisionable` a dependency the
            platform cannot author however often it tries (a schema the
            ResourceType builder refuses, a ClusterResourceType nobody installed,
            a Resource that never cuts a release) — the design has to change;
            `dependency-provision-failed` provisioning failed for a reason the
            platform could not call permanent, and the bounded retry is being or
            has been spent; `plan-turn-failed` the planning turn errored (an LLM
            or transport error, retried); `repository-unavailable` the run's
            repository, issue or credential is gone.
          enum:
          - dependency-unprovisionable
          - dependency-provision-failed
          - plan-turn-failed
          - repository-unavailable
          type: string
          x-go-type: string
        phase:
          description: The run phase the fault was met in.
          type: string
        component:
          description: The component that declared the failing dependency, when the fault has one.
          type: string
        dependency:
          description: The dependency the platform could not provision, when the fault has one.
          type: string
        permanent:
          description: Repeating cannot change the answer. The producer's own classification — the
            one that also decided the retry policy — so "retrying cannot fix this" and the single
            attempt it took are two readings of one fact.
          type: boolean
        attempts:
          description: Attempts that have hit this fault so far.
          format: int64
          type: integer
        maxAttempts:
          description: The activity's retry bound; 0 when unbounded.
          format: int64
          type: integer
        firstAt:
          format: date-time
          type: string
        lastAt:
          format: date-time
          type: string
        detail:
          description: The platform's recorded error text, scrubbed and capped at the producer.
          type: string
        workflowId:
          description: The run's workflow id — the handle an operator reads history by. Derived at
            read time, never stored.
          type: string
      required:
      - code
      - phase
      - permanent
      - attempts
      - maxAttempts
      - firstAt
      - lastAt
      type: object
    RunValidation:
      additionalProperties: false
      description: The run's validation outcome. The verdict is a RUN property, not a per-issue one, and
        this is where the deployment surface reads it.
      properties:
        issue:
          description: The validation issue this run worked, so a SETTLED run stays navigable to the
            criteria behind its verdict. 0 before the validation cycle mints it, and on incident runs.
          format: int64
          type: integer
        reportPath:
          description: Repository path of the validation runner's committed report. Present when a
            report can actually be there, and ABSENT for `skipped` and `unreported` — the first never
            ran a validation cycle and the second is precisely the verdict meaning nothing was
            committed, so advertising a path for either would send the client to a 404 and make a
            known-absent report look like a read failure. Fetch it through read-file with `ref` set to
            the validation cycle's mergeSha (RunCycleView.mergeSha) — the report lives at a fixed path
            that every run overwrites, so reading it at the branch tip returns the NEWEST run's
            results whichever run you asked about.
          type: string
        verdict:
          description: >-
            What the run learned about the deployed system. Empty until the validation cycle settles.

            passed (every criterion was automated and passed), partial (some passed, none failed, and
            some were never covered — so `passed` would claim a result for criteria nobody checked),
            failed (a criterion asserted and lost), inconclusive (no test results at all), unreported
            (no usable report at the cycle's merge commit), skipped (no validation criteria, and
            incident runs, which get no validation cycle at all).

            `failed` and `unreported` fail the run ONCE ITS VALIDATION ATTEMPTS ARE SPENT, under
            terminal reasons validation-failed and validation-unreported respectively; while
            attempts remain the run repairs and validates again, so this field can hold a fatal
            verdict on a run that is still live and about to try once more. A client rendering it
            as the run's answer therefore needs the lifecycle too — that is DeployStage.validation,
            which reports awaiting-fix for exactly that state. The rest settle succeeded.
          enum:
          - passed
          - partial
          - failed
          - inconclusive
          - unreported
          - skipped
          type: string
      type: object
    SaveValuesBody:
      additionalProperties: false
      properties:
        environments:
          additionalProperties:
            additionalProperties:
              type: string
            type: object
          description: 'Per-environment { configKey: value } maps. Secret keys are routed to the secret
            manager by the registered schema.'
          type: object
      required:
      - environments
      type: object
    SkillDetailBody:
      additionalProperties: false
      properties:
        binaryReferences:
          description: |-
            Sorted paths of aux files whose content is NOT valid UTF-8 (e.g.
            images, other binaries). Their bytes are never inlined into
            `references` — encoding/json silently replaces invalid UTF-8 with
            U+FFFD rather than erroring, so inlining would corrupt the file
            content without any visible failure. The console renders these
            entries name-only.
          items:
            type: string
          type: array
        compatibility:
          type: string
        contentSha:
          type: string
        deletable:
          type: boolean
        description:
          type: string
        editable:
          type: boolean
        enabled:
          type: boolean
        kind:
          type: string
        license:
          type: string
        name:
          type: string
        orgId:
          type: string
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
        updatedAt:
          format: date-time
          type: string
        required:
          description: >-
            True when the coding runner reads this skill on every run and cannot
            start without it (`aep`, and `aep-validation` for a validation task).
            The mirror only copies enabled skills, so disabling one of these would
            take the procedure away from every build in the org — `PATCH
            /skills/{name}` refuses it with 409. The console renders the
            availability toggle as unavailable rather than letting the call fail.
          type: boolean
      required:
      - editable
      - deletable
      - enabled
      - orgId
      - name
      - kind
      - description
      - skillMd
      - references
      - binaryReferences
      - contentSha
      - updatedAt
      - required
      type: object
    SkillSummary:
      additionalProperties: false
      properties:
        contentSha:
          type: string
        deletable:
          type: boolean
        description:
          type: string
        editable:
          type: boolean
        enabled:
          type: boolean
        kind:
          type: string
        name:
          type: string
        required:
          description: >-
            True when the coding runner reads this skill on every run and cannot
            start without it (`aep`, and `aep-validation` for a validation task).
            The mirror only copies enabled skills, so disabling one of these would
            take the procedure away from every build in the org — `PATCH
            /skills/{name}` refuses it with 409. The console renders the
            availability toggle as unavailable rather than letting the call fail.
          type: boolean
      required:
      - name
      - kind
      - description
      - contentSha
      - editable
      - deletable
      - enabled
      - required
      type: object
    SkillSummaryList:
      additionalProperties: false
      properties:
        repoUrl:
          description: HTML URL of the org skills repo backing the catalogue.
          type: string
        skills:
          items:
            $ref: '#/components/schemas/SkillSummary'
          type: array
          nullable: true
      required:
      - skills
      - repoUrl
      type: object
    SkillSyncOutput:
      additionalProperties: false
      properties:
        status:
          type: string
        updated:
          format: int64
          type: integer
      required:
      - status
      - updated
      type: object
    SkillUpdate:
      additionalProperties: false
      description: |
        One platform-shipped skill whose state differs from the org's baseline: state
        "update" = org copy clean, platform shipped new content (sync will refresh);
        "overridden" = org modified its copy (sync will never touch it);
        "conflict" = both moved since the baseline (review required).
      properties:
        name:
          type: string
        state:
          enum:
          - update
          - overridden
          - conflict
          type: string
      required:
      - name
      - state
      type: object
    SkillUpdateList:
      additionalProperties: false
      properties:
        count:
          format: int64
          type: integer
        updates:
          items:
            $ref: '#/components/schemas/SkillUpdate'
          type: array
          nullable: true
      required:
      - updates
      - count
      type: object
    SpecStage:
      additionalProperties: false
      description: Spec-stage aggregate on ProjectStatus (#184). Approved/draft is derived, not stored
        — version set and not dirty = approved (vN); dirty = draft changes (vN+); no version = unpublished
        draft; exists false = no spec yet.
      properties:
        agent:
          description: >-
            Whether an agent is working on this project's spec right now, and how the last
            attempt ended (#562). `never-started` — no turn has EVER run for this project;
            `""` — a turn has run and the newest one completed; `working` — a turn is in
            flight; `failed` — the newest turn ended in failure and none has run since.
            `never-started` is distinct from `""` because the two need opposite treatment:
            one means the journey has not begun and the user needs a way to begin it, the
            other means it is under way between turns and offering to restart it would
            supersede a live interview. Derived from the newest `agent_turns` row for the project,
            which is what `exists`/`version`/`dirty` cannot say: all three read committed git,
            and a kickoff writes nothing until it lands. The overview's spec card needs it to
            say *Writing requirements* while the platform-fired `/start` runs, and the spec
            view needs it to explain an empty workspace instead of offering a file picker.
          type: string
        agentFlow:
          description: >-
            WHICH work the running turn is doing — the `/<skill>` token it runs under
            (`start`, `design`, `settle`, `amend`, …); `""` for plain chat or when nothing is
            running (#575). `agent` says an agent is working; this says on what, which the spec
            rail needs to pulse the right section.

            Without it the rail could only guess from which sections were still empty, and guessed
            wrongly in both directions: settling an assumption lit Design (the first empty section,
            though the work was requirements), and the moment a design run wrote its first file the
            pulse jumped to Validation while the rest of the design was still being written.

            Reported for the RUNNING turn only. A finished turn's flow says nothing about what is
            happening now, and the section states are derived from committed files from then on.
          type: string
        design:
          description: Design files exist for the spec (gates the Spec view's design button).
          type: boolean
        designOutdated:
          description: >-
            The requirements have changed since the design was last derived from them (#575), so
            the design may no longer describe what the user asked for. Derived by comparing the
            requirements as they stand now against the requirements as they stood in the snapshot
            the newest successful `/design` turn read — no stored fingerprint, so there is nothing
            to fall out of sync and it answers for projects that predate the field.

            Coarse ON PURPOSE: it reports that the requirements moved, never which components are
            affected. The two failures are not symmetric — over-marking costs one re-derivation
            the agent mostly no-ops through, while under-marking ships a design the user has
            already changed their mind about to the coding agents.

            False while a project has no design or no successful design turn: there is nothing to
            be behind.
          type: boolean
        dirty:
          description: specs/ moved on GitHub past the latest tag.
          type: boolean
        exists:
          description: Any spec file created; false renders the Generate-spec CTA.
          type: boolean
        version:
          description: Latest v<N> spec tag; "" if never published.
          type: string
      required:
      - exists
      - version
      - dirty
      - design
      - agent
      type: object
    StartConnectInputBody:
      additionalProperties: false
      properties:
        installationId:
          description: Optional installation to pin (set when the user picks a candidate from the 2+ picker)
          format: int64
          type: integer
      type: object
    StartConnectOutputBody:
