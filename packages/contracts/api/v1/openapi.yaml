      - issueUrl
      - executorClass
      - dependsOn
      - lineage
      - derivedStatus
      - hold
      - attention
      - executions
      type: object
    TaskStreamEvent:
      additionalProperties: false
      description: 'One SSE frame on the task-log stream. `type` discriminates the payload: `task` carries
        the full TaskView (client upserts by issue), `execution` one ExecutionView (client upserts by
        id), `line` one TimelineEvent (client appends, deduped by executionId+seq), and `done` the settled
        derivedStatus (the server then closes the stream).'
      properties:
        derivedStatus:
          description: Settled derived status — present only on the `done` frame.
          type: string
        execution:
          $ref: '#/components/schemas/ExecutionView'
        line:
          $ref: '#/components/schemas/TimelineEvent'
        task:
          $ref: '#/components/schemas/TaskView'
        type:
          enum:
          - task
          - execution
          - line
          - done
          type: string
          x-enum-varnames:
          - TaskStreamEventTypeTask
          - TaskStreamEventTypeExecution
          - TaskStreamEventTypeLine
          - TaskStreamEventTypeDone
      required:
      - type
      type: object
    TaskView:
      additionalProperties: false
      properties:
        attention:
          items:
            type: string
          type: array
          nullable: true
        blockedBy:
          description: Names of the dependencies this task is waiting on; present when derivedStatus is
            on_hold.
          items:
            type: string
          type: array
        body:
          type: string
        comments:
          description: The issue's newest comments, OLDEST FIRST, capped per issue, with the
            platform's own machine comments excluded. Present only on a `tag`-scoped read taken with
            `comments=true` (the default); a read spanning versions omits it, for the same reason
            ledger issues are invisible there — the fetch is anchored on one milestone and a
            cross-version read has no bounded set to ask for. Absence covers every empty case
            (not asked for, nothing there, nothing left after the machine comments were dropped);
            the field is never an empty array.
          items:
            $ref: '#/components/schemas/IssueComment'
          minItems: 1
          type: array
        component:
          type: string
        dependsOn:
          items:
            type: string
          type: array
          nullable: true
        derivedStatus:
          type: string
        executions:
          additionalProperties:
            $ref: '#/components/schemas/ExecutionView'
          type: object
        executorClass:
          description: >-
            WHO works this issue, derived from its labels: `coding` for anything
            a coding agent is dispatched at (planned work, a bug, a merge
            conflict — all armed with the `aep` label), `provision` for a
            dispatch gate the platform resolves, `validation` for the version's
            validation task, `ledger` for a bare human issue that joined the
            milestone unarmed. Deliberately coarser than `kind`: the three
            coding kinds are dispatched identically, so they are one class here
            and are told apart by `kind`. Nothing here is parsed out of the body
            — issue bodies are prose the platform writes for the agent and never
            reads back.
          enum:
          - coding
          - provision
          - validation
          - ledger
          type: string
        kind:
          description: >-
            The issue's raw label kind: `development` for planned work minted
            from the spec, `bug` for a defect, `conflict` for a pull request
            that will not merge, `validation` for the version's validation
            task, `provision` for a dispatch gate. Absent when the issue carries
            no kind label (a ledger issue, or one a human armed without
            classifying); a consumer that does not recognise a kind should render
            the row untagged rather than guess.
          type: string
        hold:
          type: boolean
        issueNumber:
          format: int64
          type: integer
        issueUrl:
          type: string
        lineage:
          $ref: '#/components/schemas/Lineage'
        operation:
          type: string
        origin:
          type: string
        rationale:
          type: string
        title:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
          description: Aggregate actual usage across the task's executions (#245); absent for tasks that predate usage capture.
      required:
      - issueNumber
      - title
      - issueUrl
      - executorClass
      - dependsOn
      - lineage
      - derivedStatus
      - hold
      - attention
      - executions
      type: object
    TestUserPassword:
      additionalProperties: false
      description: A test account's password, disclosed deliberately by reveal or rotate. It is
        never returned by any read.
      properties:
        password:
          type: string
        rotatedAt:
          description: When the password was last replaced; null when it is the one minted at create.
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        username:
          type: string
      required:
      - username
      - password
      type: object
    TimelineEvent:
      additionalProperties: false
      description: 'A unified-timeline entry: today''s ProgressEvent (phase | tool_use | activity |
        tool_result | git_commit | git_push | gh_action | build_step | log | progress_item | result) plus its attribution — which execution attempt
        it came from. This is the per-row shape the console renders; the FE groups rows by executionId/kind.'
      properties:
        branch:
          type: string
        command:
          type: string
        completedAt:
          type: string
        durationMs:
          description: '`tool_result` only: how long the call took, measured by the runner between
            the call and its outcome, so it includes model turnaround.'
          format: int64
          type: integer
        emitter:
          description: Who produced the line — `subagent` for work the main agent fanned out with the
            Task tool, absent for the main agent itself. Absence is a positive fact, not an unknown.
          enum:
          - main
          - subagent
          type: string
        emitterId:
          description: Which subagent, for the cycles that fan out to several at once — the id of the
            fan-out tool call, stable for that subagent's whole life. Absent on main-agent lines.
          type: string
        emitterLabel:
          description: The description the main agent gave that subagent ("Implement todo-api service
            (issue #3)"). Absent on main-agent lines, and on a fan-out that carried no description.
          type: string
        error:
          type: string
        exitCode:
          description: '`tool_result` only: the process status of a failed shell call, parsed from the
            SDK''s own `Exit code N` first line. Absent when the tool was not a shell — those report a
            `<tool_use_error>` with no code — so read absence as "no code was reported", never as
            "exited 0".'
          format: int64
          type: integer
        executionId:
          description: Id of the execution attempt this line belongs to.
          type: string
        executionKind:
          description: Kind of that attempt (coding | build | ops) — client-side grouping/section labels.
          type: string
        files:
          format: int64
          type: integer
        itemId:
          description: '`progress_item` only: WHICH named unit of work the line is about — the key a
            consumer folds on, since many lines describe the same item and a reader wants one row
            repainted rather than many rows printed. Validation binds items to acceptance criteria
            ("AC-003-a"), which `cycleKind` already implies, so this never repeats it. The status
            itself rides on `status`, scoped by `kind`: planned | exploring | authoring | running |
            healing | pass | fail.'
          type: string
        kind:
          type: string
        level:
          type: string
        linesAdded:
          description: A fanned-out subagent's total lines added, off the SDK's own report on its fan-out
            call's result. Present only there; nothing in the feed can reconstruct it.
          format: int64
          type: integer
        linesRemoved:
          description: A fanned-out subagent's total lines removed, from the same report.
          format: int64
          type: integer
        message:
          type: string
        ok:
          description: '`tool_result` only: whether the call succeeded. Absent on every other kind — so
            read absence as "not a tool result", never as success.'
          type: boolean
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        sha:
          type: string
        startedAt:
          type: string
        status:
          type: string
        step:
          type: string
        summary:
          type: string
        tool:
          type: string
        toolCount:
          description: A fanned-out subagent's total tool calls, off the SDK's own report on its fan-out
            call's result. Present only there.
          format: int64
          type: integer
        toolUseId:
          description: The tool call this line is about. A `tool_result` carries the id of the `tool_use`
            it answers, which is what pairs a call with its outcome once several subagents interleave
            the feed.
          type: string
        ts:
          type: string
      required:
      - schemaVersion
      - ts
      - seq
      - kind
      - executionId
      - executionKind
      type: object
    GetConversationOutputBody:
      additionalProperties: false
      description: A conversation's history, oldest first. An empty list is a real answer — a
        known thread with no turns yet — never an error.
      properties:
        messages:
          items:
            $ref: '#/components/schemas/ConversationMessage'
          type: array
      required:
      - messages
      type: object
    TurnAnchor:
      additionalProperties: false
      description: >
        What the user pointed at when they aimed this turn at part of a spec document
        (#666; console ADR-0024). It LOCATES — it never carries the selected content.


        The agent joins the spec collab room as a live peer, so between the selection and
        the turn starting the user may keep typing and a teammate may edit too: content
        captured at selection time is a photograph of a document that has since moved. The
        agent resolves these names against the CURRENT document instead. The same reasoning
        already reversed an embedded copy once — #252 Task 17 stripped a dependency's full
        JSON entry back to its name, because the agent reads the live entry in its own turn
        snapshot.


        Absent for an ordinary chat turn.
      properties:
        file:
          description: The authored spec file the selection resolves to. Always present — one
            view renders exactly one file, so a selection never spans two.
          type: string
        nodes:
          description: The selected nodes, in document order. A list because both surfaces
            multi-select — a drag across three paragraphs, a shift-click across three
            operations.
          items:
            $ref: '#/components/schemas/TurnAnchorNode'
          minItems: 1
          type: array
      required:
      - file
      - nodes
      type: object
    TurnAnchorNode:
      additionalProperties: false
      description: One selected node — the name the agent resolves, and the name the transcript
        shows back to a user who can no longer see what they clicked.
      properties:
        context:
          description: Where the node sits, for a name that cannot stand alone. Markdown — the
            heading path, root-first (`Solution > Slack integration`). A structured view — the
            parent (`lunch-api`). Optional; a name that stands alone needs none.
          type: string
        kind:
          description: >
            The node's vocabulary word. It carries the whole difference between a name authored
            AS a name and a sentence pressed into service as one, which is what lets prose and
            structured views share this schema.


            Markdown uses structural terms — `paragraph`, `heading`, `list item` — deliberately
            NOT document-specific readings like `open question`, so an arbitrary `.md` produces
            the same shape as the PRD. A structured view uses its own terms (`operation`,
            `external dependency`). Kept as a raw string rather than a closed enum so a view can
            name its nodes without a contract change.
          type: string
        name:
          description: >
            What the agent resolves and the transcript shows. A structured view supplies the
            node's own name (`POST /rounds`, `slack`). Markdown has none, so it supplies a
            BOUNDED excerpt of the block's RENDERED text — at most 80 characters, cut at a word
            boundary.


            The bound is the load-bearing part, not the number: an excerpt that grows with the
            selection is the carried content this schema exists to avoid. It only has to be
            unique enough to locate — the model receives the full block regardless, because the
            agent read it from the file.


            RENDERED, not source: the source carries `**bold**`, `*assumed*`, links and hard
            wraps the reader never saw, so a source-exact excerpt fails to match for most
            blocks. The agent matches on prose, tolerantly, and asks when a name is genuinely
            ambiguous rather than guessing. `maxLength` is the contract's ceiling against
            carry; the 80-character rule is the markdown client's.
          maxLength: 200
          type: string
      required:
      - name
      - kind
      type: object
    TurnInputBody:
      additionalProperties: false
      properties:
        anchor:
          $ref: '#/components/schemas/TurnAnchor'
        collab:
          description: 'Room-scoped turn (#86 phase 4): the agent joins the project''s spec collab room
            as a live peer, reads and edits the shared doc, and commits nothing to git.'
          type: boolean
        instruction:
          description: User message / generation directive. `/<skill>` flow commands (`/start`, `/design`,
            …) are sent VERBATIM — the server expands them, attaches the flow's eager skills, and enriches
            `/start` with the captured project idea.
          type: string
        intent:
          description: >
            What the user wants done with `anchor` — `change` rewrites the selected nodes in
            place, `discuss` opens the same selection as a grilling. Read by the agents service
            when it renders the anchor into the prompt; the two differ only in how that
            preamble is phrased.


            Deliberately a field and NOT a `/command` prefix on `instruction`: a command IS the
            user's message (the console adds nothing to a line they typed), and an anchored turn
            carries prose they wrote in their own words, so a prefix would put machinery in their
            voice. Mirrors the console's own resolve/reconsider intent, whose only job is the
            same. Absent for a turn with no anchor.
          enum:
          - change
          - discuss
          type: string
        target:
          description: Optional target (e.g. a doc type)
          type: string
      required:
      - instruction
      type: object
    TurnInputMultipart:
      additionalProperties: false
      description: >
        The same turn input as `TurnInputBody`, sent as multipart so it can carry chat
        attachments (#428). The JSON form stays the canonical one — a message with no
        attachments MUST use it, and every existing caller is unaffected.


        Attachments are CONVERSATION-SCOPED MODEL CONTENT (console ADR-0019): the platform
        never writes them to disk and never commits them. They ride this request into the
        turn and are durable only as parts of the conversation's history, which is also
        what makes re-sending one free — the agents service dedupes by file name.


        Deliberately NOT the reference-document channel: `POST /projects/{name}/references`
        REPLACES a project's whole stored set, and the create view is the only door to it.
        A file attached here never becomes a project reference, even when the instruction
        is `/start`.
      properties:
        anchor:
          $ref: '#/components/schemas/TurnAnchor'
        collab:
          description: As `TurnInputBody.collab`.
          type: boolean
        files:
          description: >
            Chat attachments, two groups and the split matters downstream. Read NATIVELY as
            file parts: `.pdf`, and the four image media types the Messages API accepts —
            `.png`, `.jpg`, `.jpeg`, `.gif`, `.webp`. Read AS TEXT (sent as `text/plain`,
            the only text document type the Anthropic provider maps): `.md`, `.txt`, `.csv`,
            `.tsv`, `.json`, `.yaml`, `.yml`, `.xml`, `.html`, `.rst`. Office formats are
            not accepted — the models do not read them natively.


            Three caps, and all of them restate ONE number: the agents service already
            enforces a 20 MiB base64-ENCODED per-turn attachment budget (#384), past which
            it warns and skips. So at most 10 files, each at most 5 MiB, and at most 15 MiB
            of raw bytes in TOTAL — 15 MiB raw is 20 MiB encoded. The total is the load-
            bearing one: a per-file cap alone cannot hold the line, since ten 5 MiB files
            each pass it and together overrun the budget by 3x.
          items:
            format: binary
            type: string
          maxItems: 10
          type: array
        instruction:
          description: As `TurnInputBody.instruction`. Required — an attachment alone cannot
            start a turn, and the shared TurnSpec validator rejects an empty chat text.
          type: string
        intent:
          description: >
            As `TurnInputBody.intent`. What the user wants done with `anchor` — `change` rewrites the selected nodes in
            place, `discuss` opens the same selection as a grilling. Read by the agents service
            when it renders the anchor into the prompt; the two differ only in how that
            preamble is phrased.


            Deliberately a field and NOT a `/command` prefix on `instruction`: a command IS the
            user's message (the console adds nothing to a line they typed), and an anchored turn
            carries prose they wrote in their own words, so a prefix would put machinery in their
            voice. Mirrors the console's own resolve/reconsider intent, whose only job is the
            same. Absent for a turn with no anchor.
          enum:
          - change
          - discuss
          type: string
        target:
          description: As `TurnInputBody.target`.
          type: string
      required:
      - instruction
      type: object
    TurnOutputBody:
      additionalProperties: false
      properties:
        turnId:
          description: The started turn's id — poll/attach with it
          type: string
      required:
      - turnId
      type: object
    TurnStatus:
      additionalProperties: false
      description: One turn's lifecycle view (create-turn 202 → poll/attach).
      properties:
        authorDisplayName:
          description: The acting user's display name, paired with authorId.
          type: string
        authorId:
          description: >-
            Who started this turn — EMAIL-anchored, matching the console's live author identity,
            which is what lets a client tell its own turn from a teammate's. Empty when no
            attributable human sent it (an M2M token, a minimal user token, or a turn dispatched
            before the display record was stored). Flat rather than a nested object so "absent"
            is one convention across this schema: the empty string, exactly as `instruction`
            uses it.
          type: string
        commitSha:
          type: string
        conversationId:
          type: string
        createdAt:
          format: date-time
          type: string
        instruction:
          description: >-
            What this turn's DISPLAY record says — the transcript line for the message that
            started it. Present so a client attaching to a turn it did not send can render the
            sender's message immediately, instead of narration under a blank space: the
            conversation store persists a turn's transcript only when the turn ENDS, so a
            history read mid-turn cannot supply it. Empty on turns dispatched before this field
            existed. Not the model's prompt — the agents service composes that from the turn
            spec and it never crosses this boundary.
          type: string
        message:
          type: string
        noChanges:
          type: boolean
        paths:
          items:
            type: string
          type: array
          nullable: true
        reason:
          type: string
        status:
          description: running, completed, failed
          type: string
        turnId:
          type: string
        updatedAt:
          format: date-time
          type: string
        useCase:
          type: string
      required:
      - turnId
      - conversationId
      - useCase
      - status
      - createdAt
      - updatedAt
      type: object
    TurnUsage:
      additionalProperties: false
      description: >-
        The token usage RunEvent carries: the folded aggregate every reader
        already consumes, plus the per-model split the platform prices against
        its rate table. It is Usage with one field added, rather than Usage
        itself, because `models` is meaningful only on a producer's own report of
        what it just spent — the project and cycle roll-ups that Usage serves sum
        already-stamped rows and have nothing to break down.

        The split is not a nicety. Cost is stamped per model, from that model's
        own rate row, so an aggregate whose `model` is "" (see below) cannot be
        priced at all — and a real coding run regularly touches a second model,
        both because the runtime reaches for small-model helpers of its own and
        because a lead is expected to pick the model for the job. Without
        `models` those runs are simply unpriceable, which is the defect this
        schema exists to close (#291).

        TWO facts a consumer will otherwise get wrong. First, `model: ""` means a
        MIXED-MODEL aggregate, never "unknown" — the producer folded several
        models into one total and refuses to name one of them as the run's;
        `models` is where the answer is. Second, the runtime reports usage
        CUMULATIVELY across a session, so `turn_ended.usage` is the run's total
        AS OF that turn rather than that turn's own spend: summing several of
        them multiplies the bill. `run_settled` carries the last and largest one,
        and that is the figure to price. (Measured: a two-turn session reports 20
        input tokens on its first result and 48 — 20 + 28 — on its second.)
      properties:
        cacheCreationTokens:
          format: int64
          type: integer
        cacheReadTokens:
          format: int64
          type: integer
        costUsd:
          description: >-
            Write-time-stamped USD, and null from a producer: the platform stamps
            cost at capture from the rates then in force (ADR-0011 as amended),
            and a runner that priced its own run would be a second answer to what
            the run cost.
          format: double
          type: number
          nullable: true
          x-go-type: '*float64'
        inputTokens:
          format: int64
          type: integer
        model:
          description: Model id the work ran on; "" on a mixed-model aggregate — see this
            schema's description, and read `models` for the breakdown.
          type: string
        models:
          description: >-
            One entry per model that actually spent tokens, each with its own
            `model` id, so the platform can price each slice against that model's
            rate row. Entries carry canonical model ids — two dated releases of
            one model are ONE entry, since they share a rate. Absent or empty
            from a producer that predates the split, and the reader then falls
            back to pricing the aggregate by its single `model`. Its tokens sum
            to the aggregate above; it is a breakdown, not extra spend.
          items:
            $ref: '#/components/schemas/Usage'
          type: array
          nullable: true
        outputTokens:
          format: int64
          type: integer
      required:
        - inputTokens
        - outputTokens
        - cacheReadTokens
        - cacheCreationTokens
        - model
        - costUsd
      type: object
    UpdateConfigBody:
      additionalProperties: false
      properties:
        envVars:
          items:
            $ref: '#/components/schemas/EnvVar'
          type: array
          nullable: true
      required:
      - envVars
      type: object
    TurnConflict:
      additionalProperties: false
      description: create-turn 409 body. turn_in_progress carries the active
        turn's id; requirements_missing means the design use-case has no
        requirements to work from; conversation_rotated means the addressed
        thread is no longer the project's current one — re-resolve via
        list-conversations and retry.
      properties:
        code:
          enum:
          - turn_in_progress
          - requirements_missing
          - conversation_rotated
          type: string
        activeTurnId:
          type: string
      required:
      - code
      type: object
    UpdateSkillInput:
      additionalProperties: false
      properties:
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
      required:
      - skillMd
      type: object
    Usage:
      additionalProperties: false
      description: Actual token usage for one unit of agent work or an aggregate (#245, #291). Tokens + model are the persisted truth; costUsd is stamped at capture time from the model rates then in force (ADR-0011 as amended) and null when the row predates stamping or its model had no rate. Aggregates sum stamps and never reprice.
      properties:
        cacheCreationTokens:
          format: int64
          type: integer
        cacheReadTokens:
          format: int64
          type: integer
        costUsd:
          description: Write-time-stamped USD (sum, for aggregates); null when no stamp exists.
          format: double
          type: number
          nullable: true
          x-go-type: '*float64'
        inputTokens:
          format: int64
          type: integer
        model:
          description: Model id the work ran on; "" on mixed-model aggregates.
          type: string
        outputTokens:
          format: int64
          type: integer
      required:
        - inputTokens
        - outputTokens
        - cacheReadTokens
        - cacheCreationTokens
        - model
        - costUsd
      type: object
    Warning:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
      - path
      - code
      - message
      type: object
    WorkflowRun:
      additionalProperties: false
      properties:
        completed:
          type: boolean
        componentName:
          type: string
        name:
          type: string
        projectName:
          type: string
        startedAt:
          type: string
        status:
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/WorkflowRunTask'
          type: array
          nullable: true
      type: object
    WorkflowRunList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/WorkflowRun'
          type: array
          nullable: true
      required:
      - items
      type: object
    WorkflowRunTask:
      additionalProperties: false
      properties:
        completedAt:
          type: string
        message:
          type: string
        name:
          type: string
        phase:
          type: string
        startedAt:
          type: string
      required:
      - name
      type: object
    WriteOp:
      additionalProperties: false
      properties:
        baseSha:
          type: string
        content:
          type: string
        path:
          type: string
      required:
      - path
      - content
      type: object
  securitySchemes:
    userJWT:
      bearerFormat: JWT
      description: Thunder end-user JWT (RS256, JWKS-verified)
      scheme: bearer
      type: http
