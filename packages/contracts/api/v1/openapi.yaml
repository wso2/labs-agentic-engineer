components:
  schemas:
    ConversationMessage:
      additionalProperties: false
      description: >
        One rehydrated message from a conversation's server-side history, sourced from the
        turn journal. The console's local chat log is display state; this is the durable
        record, and it is what makes a chip survive a reload.
      properties:
        anchor:
          $ref: '#/components/schemas/TurnAnchor'
        attachments:
          description: File NAMES that went up with this message (#428) — never bytes, which
            are conversation-scoped model content the platform does not store (console
            ADR-0019). Absent for every message without attachments.
          items:
            type: string
          type: array
        author:
          $ref: '#/components/schemas/ConversationMessageAuthor'
        content:
          description: The message body as the journal recorded it. Deliberately untyped — a
            turn's content is model-shaped and varies by role, and this endpoint's job is to
            replay it, not to interpret it.
        role:
          description: Who the message is from, as the journal recorded it.
          type: string
      required:
      - role
      type: object
    ConversationMessageAuthor:
      additionalProperties: false
      description: Who sent this message (#130 multi-user threads). Absent for the agent, and
        for history written before attribution existed.
      properties:
        displayName:
          type: string
        id:
          type: string
      required:
      - id
      - displayName
      type: object
    AccessRequest:
      additionalProperties: false
      properties:
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - consumerProjectId
      - consumerComponentName
      - orgServiceName
      - status
      - createdAt
      - updatedAt
      type: object
    ActivityEvent:
      additionalProperties: false
      description: One project activity event (issue #239). The console renders the line from these structured facts; tone is derived client-side from type.
      properties:
        id:
          type: string
        type:
          enum: [spec_updated, spec_published, plan_derived, task_started, task_deployed, task_failed]
          type: string
          x-go-type: string
        actorKind:
          enum: [user, agent]
          type: string
          x-go-type: string
        actorId:
          type: string
        actorName:
          type: string
        issue:
          format: int64
          type: integer
        title:
          type: string
        component:
          type: string
        environment:
          type: string
        tag:
          type: string
        occurredAt:
          format: date-time
          type: string
      required:
      - id
      - type
      - actorKind
      - actorName
      - occurredAt
      type: object
    ActivityFeed:
      additionalProperties: false
      description: A page of activity events plus the cursor for the next (older) page.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityEvent'
          type: array
          nullable: true
        nextBefore:
          description: occurredAt cursor for the next page; absent when there are no older events.
          type: string
        nextBeforeId:
          description: id cursor tiebreak for the next page.
          type: string
      required:
      - items
      type: object
    ApplyRequest:
      additionalProperties: false
      properties:
        deletes:
          items:
            $ref: '#/components/schemas/DeleteOp'
          type: array
          nullable: true
        message:
          type: string
        writes:
          items:
            $ref: '#/components/schemas/WriteOp'
          type: array
          nullable: true
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        commitSha:
          type: string
        files:
          items:
            $ref: '#/components/schemas/FileMeta'
          type: array
          nullable: true
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          nullable: true
      required:
      - commitSha
      - files
      type: object
    ApplyConflict:
      additionalProperties: false
      description: One file whose baseSha no longer matches HEAD.
      properties:
        baseSha:
          type: string
        currentSha:
          type: string
        path:
          type: string
      required:
      - path
      - baseSha
      - currentSha
      type: object
    ApplyConflicts:
      additionalProperties: false
      description: apply-files 409 body — the full conflict set; nothing was applied.
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/ApplyConflict'
          type: array
      required:
      - conflicts
      type: object
    BuildInputItem:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        component:
          description: Owning component name
          type: string
        dependency:
          description: Dependency name
          type: string
        kind:
          enum:
          - external-config
          - external-spec
          - platform-resource
          - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        specContent:
          type: string
        specUrl:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ConfigValue'
          type: array
          nullable: true
      required:
      - component
      - dependency
      - kind
      type: object
    BuildList:
      additionalProperties: false
      description: list-project-builds response — the version ledger, one entry per built spec version
        tag, newest first.
      properties:
        builds:
          items:
            $ref: '#/components/schemas/BuildSummary'
          type: array
          nullable: true
      required:
      - builds
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
      - log
      type: object
    BuildLogs:
      additionalProperties: false
      description: One read of a build's log. A build that is still running returns an incomplete
        response and the client re-reads from `nextCursor`; a terminal build returns everything it has
        in one call. A complete response carrying no entries is the honest "nothing retained" answer,
        not an error.
      properties:
        complete:
          description: True when the build is terminal and this response carries everything there
            will ever be — the client stops polling. False means re-read from `nextCursor`.
          type: boolean
        logs:
          items:
            $ref: '#/components/schemas/BuildLogEntry'
          type: array
          nullable: true
        nextCursor:
          description: Epoch millis of the newest entry returned; pass back as `since`. Absent when
            nothing was returned, in which case the previous cursor stands.
          format: int64
          type: integer
        totalCount:
          format: int64
          type: integer
      required:
      - logs
      - complete
      type: object
    BuildPreflight:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/PreflightItem'
          type: array
          nullable: true
        needsInput:
          description: Whether preflight emitted any item at all. Kept as the broad "there is
            something to show" flag; it does NOT gate Build, because an external dependency's
            values are collected on the Builds page while the coding agent runs and are enforced
            at the deploy gate instead.
          type: boolean
        needsResolution:
          description: Whether any emitted item blocks the version cut — a dependency the design
            itself cannot resolve (ambiguous, unresolved, missing spec, or an org service awaiting
            access). This is the ONLY flag a client may block Build on.
          type: boolean
      required:
      - needsInput
      - needsResolution
      - items
      type: object
    BuildRequest:
      additionalProperties: false
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/BuildInputItem'
          type: array
          nullable: true
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        failures:
          items:
            $ref: '#/components/schemas/InputFailure'
          type: array
          nullable: true
        tag:
          type: string
      type: object
    BuildStage:
      additionalProperties: false
      description: Build-stage aggregate on ProjectStatus (#184) — the version the newest milestone run
        is working, and how that run is doing. Deliberately count-free - the only honest source of a
        per-version task tally is the version's milestone on GitHub, and this endpoint is polled at 5s.
        The console renders counts from the list-tasks response it already holds, on the surface that
        already pays for it.
      properties:
        status:
          description: idle (never built), running, failed, cancelled, succeeded. `cancelled` is its
            own value for the same reason it is on BuildSummary — a person abandoning an increment is
            a different fact from the platform failing to deliver one, and the project badge read
            "Build failed" over a build somebody had deliberately stopped.
          enum:
          - idle
          - running
          - failed
          - cancelled
          - succeeded
          type: string
          x-go-type: string
        version:
          description: Spec tag the current/last build built; "" if never built.
          type: string
      required:
      - version
      - status
      type: object
    BuildProgressEvent:
      additionalProperties: false
      description: 'One SSE frame on the VERSION progress stream, which spans every run that has worked
        the version. `type` discriminates the payload: `cycle` carries a RunCycleView (client upserts by
        id), `line` one RunProgressLine, and `done` says why the stream ended (the server then closes
        it). `cycle` and `line` frames also carry `run` — a version''s story spans several executions,
        so a cycle is only identified once you know which run opened it.'
      properties:
        cycle:
          $ref: '#/components/schemas/RunCycleView'
        line:
          $ref: '#/components/schemas/RunProgressLine'
        reason:
          description: 'Why the stream ended — present only on the `done` frame, and deliberately NOT
            a run state. `no_live_run` means no run on the version''s milestone is currently live, so
            there is nothing further to report RIGHT NOW. It is not a verdict on the version: a later
            validation or task run may be admitted on the same milestone, and the console reopens the
            stream when its run-list poll shows one.'
          enum:
          - no_live_run
          type: string
          x-enum-varnames:
          - BuildProgressEventReasonNoLiveRun
        run:
          $ref: '#/components/schemas/BuildProgressRun'
        type:
          enum:
          - cycle
          - line
          - done
          type: string
          x-enum-varnames:
          - BuildProgressEventTypeCycle
          - BuildProgressEventTypeLine
          - BuildProgressEventTypeDone
      required:
      - type
      type: object
    BuildProgressRun:
      additionalProperties: false
      description: Which run a frame's cycle belongs to. The version's narrative spans several runs, so
        the run is the SECTION and the cycle is a step inside it — `RunProgressLine.cycleIndex` stays
        run-relative and is only unique when paired with `run.id`.
      properties:
        id:
          description: Milestone run id — the same id list-build-runs reports and cancel-run takes.
          type: string
        index:
          description: 1-based chronological position of this run among the version's runs, so the
            console can label a section without holding the whole run list — the same reason
            `cycleIndex` exists, one level up. Two runs of one kind are ordinary (a version can be
            repaired more than once), so the kind alone does not name a section.
          format: int64
          type: integer
        kind:
          description: What the run DOES, and the section marker the console renders — `dev` delivered
            the version, `task` worked a defect inside it, `validation` re-judged it. Same vocabulary
            as MilestoneRunView.kind.
          enum:
          - dev
          - task
          - validation
          type: string
      required:
      - id
      - kind
      - index
      type: object
    BuildRunList:
      additionalProperties: false
      description: A version's milestone runs. `milestoneNumber` is the platform key the tag resolved
        to through the run rows; a tag with no run rows is a 404, not an empty list.
      properties:
        milestoneNumber:
          format: int64
          type: integer
        runs:
          description: Newest run first. A milestone sees SEQUENTIAL runs across its life — the spec
            build that created the version, then any later incident adoption into it.
          items:
            $ref: '#/components/schemas/MilestoneRunView'
          type: array
        tag:
          type: string
      required:
      - tag
      - milestoneNumber
      - runs
      type: object
    BuildSummary:
      additionalProperties: false
      description: One entry of the version ledger — a spec version tag and the state of the newest
        milestone run that has worked it. A ledger read has no live workflow query, so "started"
        never occurs here.
      properties:
        completedAt:
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        milestoneNumber:
          description: The GitHub milestone this version's work lives in — the platform key the tag
            resolves to, and the handle list-build-runs is read by.
          format: int64
          type: integer
        reason:
          description: The run's terminal reason for a failed version (empty otherwise), surfaced
            beside the Failed badge in the console. A cancelled version carries none — a person
            abandoning an increment is not a fault with a cause to report.
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          description: What became of this version. `cancelled` is its own value rather than a
            flavour of `failed`, because the two are different facts and a reader acts on them
            differently — a failure is the platform reporting it could not deliver the increment,
            while a cancel is a person deciding not to. Folding them lost that; a build somebody
            deliberately stopped rendered as Failed, with no reason beside it to say why, while the
            same page's run row said Cancelled two lines below.
          enum:
          - started
          - in_progress
          - completed
          - failed
          - cancelled
          type: string
        tag:
          type: string
        waitingReason:
          description: Why an in-progress version is waiting rather than moving. Empty for the
            ordinary between-cycles park, which needs no explanation. `external-values` is the
            deploy gate — the run is built and ready to deploy, and every remaining blocker is a
            value only a human can supply. It is carried here so a ledger row can say the version
            is waiting on the reader instead of reading as a run an agent is still working; the
            dependency NAMES stay on MilestoneRunView, where the run read that has them is already
            being made.
          enum:
          - external-values
          type: string
      required:
      - tag
      - milestoneNumber
      - status
      - startedAt
      type: object
    ClientSecretOutputBody:
      additionalProperties: false
      properties:
        clientSecret:
          type: string
      required:
      - clientSecret
      type: object
    CollabSessionOutputBody:
      additionalProperties: false
      properties:
