    RunValidation:
      additionalProperties: false
      description: The run's validation outcome. The verdict is a RUN property, not a per-issue one, and
        this is where the deployment surface reads it.
      properties:
        issue:
          description: The validation issue this run worked, so a SETTLED run stays navigable to the
            criteria behind its verdict. 0 before the validation cycle mints it, and on incident runs.
          format: int64
          type: integer
        reportPath:
          description: Repository path of the validation runner's committed report. Present when a
            report can actually be there, and ABSENT for `skipped` and `unreported` — the first never
            ran a validation cycle and the second is precisely the verdict meaning nothing was
            committed, so advertising a path for either would send the client to a 404 and make a
            known-absent report look like a read failure. Fetch it through read-file with `ref` set to
