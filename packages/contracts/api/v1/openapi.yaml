            validation. cancelled is a person STOPPING the judging: a validation run
            settled cancelled before recording a verdict, so nothing will answer for
            this version unless somebody re-asks. The rest are the verdict verbatim.
            They are mutually exclusive in time, so nothing is hidden behind another.

