          description: Turn id from the 202 create response
          type: string
      - description: Replay from this absolute event index (wins over Last-Event-ID)
        in: query
        name: from
        schema:
          # Keep an explicit pointer under the global prefer-skip-optional-pointer:
          # the handler must distinguish 'absent' from the zero value (from).
          x-go-type-skip-optional-pointer: false
          description: Replay from this absolute event index (wins over Last-Event-ID)
          minimum: -1
          type: integer
      - description: 'SSE auto-reconnect resume cursor: the last frame id the client saw; replay
          resumes after it. Opaque per the SSE spec — non-numeric values are ignored (full replay).
          The from query param wins when both are present.'
        in: header
