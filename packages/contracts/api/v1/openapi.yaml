            that every run overwrites, so reading it at the branch tip returns the NEWEST run's
            results whichever run you asked about.
          type: string
        verdict:
          description: >-
            What the run learned about the deployed system. Empty until the validation cycle settles.

            passed (every criterion was automated and passed), partial (some passed, none failed, and
            some were never covered — so `passed` would claim a result for criteria nobody checked),
            failed (a criterion asserted and lost), inconclusive (no test results at all), unreported
            (no usable report at the cycle's merge commit), skipped (no acceptance criteria, and
            incident runs, which get no validation cycle at all).

            `failed` and `unreported` fail the run ONCE ITS VALIDATION ATTEMPTS ARE SPENT, under
            terminal reasons validation-failed and validation-unreported respectively; while
            attempts remain the run repairs and validates again, so this field can hold a fatal
            verdict on a run that is still live and about to try once more. A client rendering it
            as the run's answer therefore needs the lifecycle too — that is DeployStage.validation,
            which reports awaiting-fix for exactly that state. The rest settle succeeded.
          enum:
          - passed
          - partial
          - failed
          - inconclusive
          - unreported
          - skipped
