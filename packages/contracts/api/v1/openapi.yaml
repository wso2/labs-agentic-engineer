          type:
            - array
            - "null"
        dependsOnExternalResources:
          items:
            type: string
          type:
            - array
            - "null"
        dependsOnOrgServices:
          items:
            type: string
          type:
            - array
            - "null"
        dependsOnResources:
          items:
            type: string
          type:
            - array
            - "null"
        description:
          type: string
        dispatchedAt:
          format: date-time
          type: string
        errorMessage:
          type: string
        execType:
          type: string
        externalResourceName:
          type: string
        id:
          type: string
        labels:
          items:
            $ref: "#/components/schemas/LabelInfo"
          type:
            - array
            - "null"
        lifecycleStatus:
          type: string
