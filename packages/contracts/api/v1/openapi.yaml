openapi: 3.0.3
info:
  title: AEP BFF API
  version: 1.0.0
servers:
- url: /api/v1
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
      parameters:
      - description: Collaboration room ID (spec-<org>-<project>)
        in: header
        name: X-Room-Id
        schema:
          description: Collaboration room ID (spec-<org>-<project>)
          type: string
      - description: Bearer token; the display identity is decoded from it
        in: header
        name: Authorization
        schema:
          description: Bearer token; the display identity is decoded from it
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabValidateOutputBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
      - Collaboration
  /config:
    get:
      operationId: get-config
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigProjection'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Get the organization's integration config (statuses/kinds, no secrets)
      tags:
      - Org Config
    patch:
      operationId: update-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigProjection'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Patch the organization's integration config (per-section, atomic)
      tags:
      - Org Config
  /config/git-provider/connect-sessions:
    post:
      operationId: start-git-provider-connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConnectInputBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartConnectOutputBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Start App-mode git-provider connect (OAuth-driven)
      tags:
      - Org Config
  /config/git-provider/disconnect:
    post:
      operationId: disconnect-git-provider
      parameters:
      - description: 'App-mode only: when false, leave the install on GitHub for later re-adoption (defaults
          true)'
        explode: false
        in: query
        name: uninstall
        schema:
          # Keep an explicit pointer under the global prefer-skip-optional-pointer:
          # the handler must distinguish 'absent' from the zero value (uninstall).
          x-go-type-skip-optional-pointer: false
          default: true
          description: 'App-mode only: when false, leave the install on GitHub for later re-adoption (defaults
            true)'
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisconnectOutputBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Disconnect the git provider (cascade) for the org
      tags:
      - Org Config
  /config/idp/client-secret:
    post:
      operationId: rotate-idp-client-secret
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSecretOutputBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Rotate the IDP publisher client secret (returned once)
      tags:
      - Org Config
  /config/idp/discovery:
    get:
      operationId: discover-idp
      parameters:
      - description: OIDC issuer URL to fetch the discovery document for
        explode: false
        in: query
        name: issuer
        schema:
          description: OIDC issuer URL to fetch the discovery document for
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverOutputBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Discover an OIDC issuer's metadata
      tags:
      - Org Config
  /dependencies/external-resources:
    get:
      operationId: list-external-resources
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ExternalResourceDTO'
                type: array
                nullable: true
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List the org's external-resource catalog
      tags:
      - Dependencies
  /dependencies/external-resources/{name}:
    delete:
      operationId: delete-external-resource
      parameters:
      - description: External resource name
        in: path
        name: name
        required: true
        schema:
          description: External resource name
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Delete an external-resource catalog entry (409 if in use)
      tags:
      - Dependencies
  /dependencies/platform-resource-types:
    get:
      operationId: list-platform-resource-types
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PlatformResourceTypeDTO'
                type: array
                nullable: true
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List the platform-provisioned resource types available on the cluster
      tags:
      - Dependencies
  /organizations:
    get:
      operationId: list-organizations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List organizations
      tags:
      - Organizations
  /projects:
    get:
      operationId: list-projects
      parameters:
      - description: Opaque pagination cursor
        explode: false
        in: query
        name: cursor
        schema:
          description: Opaque pagination cursor
          type: string
      - description: Case-insensitive substring match on name and displayName
        explode: false
        in: query
        name: search
        schema:
          description: Case-insensitive substring match on name and displayName
          type: string
      - description: Maximum number of items to return (server default when absent)
        explode: false
        in: query
        name: limit
        schema:
          description: Maximum number of items to return (server default when absent)
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List projects
      tags:
      - Projects
    post:
      operationId: create-project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Create a project
      tags:
      - Projects
  /projects/{projectName}:
    delete:
      operationId: delete-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Delete a project
      tags:
      - Projects
    get:
      operationId: get-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Get a project
      tags:
      - Projects
  /projects/{projectName}/activity:
    get:
      operationId: list-activity
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Max events to return (default 50, max 200).
        explode: false
        in: query
        name: limit
        schema:
          description: Max events to return (default 50, max 200).
          format: int64
          type: integer
      - description: 'Keyset cursor: return events strictly older than this occurredAt (RFC3339); pair with beforeId.'
        explode: false
        in: query
        name: before
        schema:
          description: 'Keyset cursor: occurredAt of the last event seen.'
          type: string
      - description: 'Keyset cursor tiebreak: the id of the last event seen (pair with before).'
        explode: false
        in: query
        name: beforeId
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeed'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List a project's activity events (newest first, cursor-paginated)
      tags:
      - Projects
  /projects/{projectName}/activity/stream:
    get:
      operationId: stream-activity
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: 'SSE resume cursor: the last frame id seen (occurredAt|id). Replay resumes after it.'
        in: header
        name: Last-Event-ID
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ActivityEvent'
          description: 'SSE stream of the project''s activity feed: an initial replay of recent events (oldest-first on the wire so the client appends in order), then a live tail as new events are recorded. One data: JSON ActivityEvent per frame, id: occurredAt|id. Reconnect-safe: the client dedups by id.'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Stream a project's activity feed (replay + live tail) as SSE
      tags:
      - Projects
  /projects/{projectName}/agents/{conversationId}/messages:
    get:
      operationId: get-conversation
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: FE-chosen conversation uuid
        in: path
        name: conversationId
        required: true
        schema:
          description: FE-chosen conversation uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Rehydrate a chat conversation (messages only)
      tags:
      - GenAI
    post:
      operationId: create-turn
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: FE-chosen conversation uuid
        in: path
        name: conversationId
        required: true
        schema:
          description: FE-chosen conversation uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnInputBody'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnOutputBody'
          description: Accepted
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnConflict'
          description: A turn is already running for this project, or the design
            use-case has no requirements yet.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Start a generation/chat turn (202 — runs detached; attach via the turn stream)
      tags:
      - GenAI
  /projects/{projectName}/build:
    post:
      operationId: build-project
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Trigger a project build
      tags:
      - Projects
  /projects/{projectName}/build/preflight:
    get:
      operationId: get-build-preflight
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildPreflight'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Compute the build dependency-drawer preflight
      tags:
      - Projects
  /projects/{projectName}/builds:
    get:
      description: The version ledger — one entry per built spec version tag, newest first, each
        carrying the state of the newest milestone run that has worked it. DB-only (no GitHub, no
        cluster), so the console may fetch it on demand and poll it while a run is live. Task counts
        are deliberately absent; the console renders them from the list-tasks response it already
        holds.
      operationId: list-project-builds
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List project builds
      tags:
      - Projects
  /projects/{projectName}/builds/{tag}/runs:
    get:
      description: The version's whole run story, straight from the platform's own tables — every
        milestone run that has worked this version (a spec build, then any incident adoption into the
        same milestone), newest first, each with its cycle records in dispatch order. DB-only, so the
        console may poll it while a run is live without spending GitHub rate. The validation verdict is
        a RUN property and is read here; there is no separate validation endpoint.
      operationId: list-build-runs
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Spec version tag (`v<N>`), resolved to a milestone number through the run rows —
          never by matching titles against GitHub.
        in: path
        name: tag
        required: true
        schema:
          description: Spec version tag
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildRunList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List a version's milestone runs and their cycles
      tags:
      - Runs
  /projects/{projectName}/builds/{tag}/revalidate:
    post:
      description: >-
        Ask a version's acceptance criteria again, against the system already deployed. It starts a
        fresh run over that version's milestone which ENTERS THE LOOP AT VALIDATION rather than at
        the working set — nothing is rebuilt to answer the question.


        What happens after the verdict is the run loop's ordinary behaviour, selected by
        `validationAttempts`: with 1, the run reports and settles, so a failure files no work and
        rebuilds nothing. With the default, a `failed` verdict files one issue per failed criterion,
        an ordinary coding cycle fixes them, the components build and deploy, and the version is
        validated again.


        The newest run on a milestone owns that version's verdict, so a revalidate's answer becomes
        the version's answer. 409 when a run is already live on the milestone (nothing to hand off
        to — its verdict may be hours away or may never come) or when the milestone still has open
        work (the loop would work that first, which is a build resume, not a revalidation). 422 when
        the version has no acceptance criteria, refused rather than run so a `skipped` verdict
        cannot overwrite a real one.
      operationId: revalidate-build
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Spec version tag (`v<N>`), resolved to a milestone number through the run rows —
          never by matching titles against GitHub.
        in: path
        name: tag
        required: true
        schema:
          description: Spec version tag
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevalidateRequest'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevalidateAccepted'
          description: Revalidation started
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Validate a deployed version again
      tags:
      - Runs
  /projects/{projectName}/builds/{tag}/cycles/{cycleId}/builds:
    get:
      description: The builds one cycle's merge fanned out to, DERIVED from OpenChoreo and never
        stored — per-component build state has exactly one source of truth, and a stored copy could
        desynchronise from the cluster. Deliberately NOT folded into list-build-runs, which is DB-only
        so the console can poll it cheaply — this read costs a cluster call, so the console fetches it
        only for a cycle that has a merge SHA. A cycle without one returns an empty list.
      operationId: list-cycle-builds
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Spec version tag (`v<N>`), resolved to a milestone number through the run rows.
        in: path
        name: tag
        required: true
        schema:
          description: Spec version tag
          type: string
      - description: Cycle id, as carried by RunCycleView.id on the run read.
        in: path
        name: cycleId
        required: true
        schema:
          description: Cycle id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleBuildList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List the builds a cycle's merge produced
      tags:
      - Runs
  /projects/{projectName}/components:
    get:
      operationId: list-components
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List components
      tags:
      - Components
  /projects/{projectName}/components/{componentName}:
    get:
      operationId: get-component
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Component'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Get a component
      tags:
      - Components
  /projects/{projectName}/components/{componentName}/builds:
    get:
      operationId: list-builds
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunList'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List component builds
      tags:
      - Components
    post:
      operationId: trigger-build
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
          type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRun'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Trigger a component build
      tags:
      - Components
  /projects/{projectName}/components/{componentName}/builds/{buildName}/logs:
    get:
      operationId: get-build-logs
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Component name (DNS-label slug)
        in: path
        name: componentName
        required: true
        schema:
          description: Component name (DNS-label slug)
