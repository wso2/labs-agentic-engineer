components:
  schemas:
    AccessRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/AccessRequest.json
          format: uri
          readOnly: true
          type: string
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
