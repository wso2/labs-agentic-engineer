components:
  schemas:
    AccessRequest:
      additionalProperties: false
      properties:
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - consumerProjectId
      - consumerComponentName
      - orgServiceName
      - status
      - createdAt
      - updatedAt
      type: object
    ActivityEvent:
      additionalProperties: false
      description: One project activity event (issue #239). The console renders the line from these structured facts; tone is derived client-side from type.
      properties:
        id:
          type: string
        type:
          enum: [spec_updated, spec_published, plan_derived, task_started, task_deployed, task_failed]
          type: string
          x-go-type: string
        actorKind:
          enum: [user, agent]
          type: string
          x-go-type: string
        actorId:
          type: string
        actorName:
          type: string
        issue:
          format: int64
          type: integer
        title:
          type: string
        component:
          type: string
        environment:
          type: string
        tag:
          type: string
        occurredAt:
          format: date-time
          type: string
      required:
      - id
      - type
      - actorKind
      - actorName
      - occurredAt
      type: object
    ActivityFeed:
      additionalProperties: false
      description: A page of activity events plus the cursor for the next (older) page.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityEvent'
          type: array
          nullable: true
        nextBefore:
          description: occurredAt cursor for the next page; absent when there are no older events.
          type: string
        nextBeforeId:
          description: id cursor tiebreak for the next page.
          type: string
      required:
      - items
      type: object
    ApplyRequest:
      additionalProperties: false
      properties:
        deletes:
          items:
            $ref: '#/components/schemas/DeleteOp'
          type: array
          nullable: true
        message:
          type: string
        writes:
          items:
            $ref: '#/components/schemas/WriteOp'
          type: array
          nullable: true
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        commitSha:
          type: string
        files:
          items:
            $ref: '#/components/schemas/FileMeta'
          type: array
          nullable: true
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          nullable: true
      required:
      - commitSha
      - files
      type: object
    ApplyConflict:
      additionalProperties: false
      description: One file whose baseSha no longer matches HEAD.
      properties:
        baseSha:
          type: string
        currentSha:
          type: string
        path:
          type: string
      required:
      - path
      - baseSha
      - currentSha
      type: object
    ApplyConflicts:
      additionalProperties: false
      description: apply-files 409 body — the full conflict set; nothing was applied.
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/ApplyConflict'
          type: array
      required:
      - conflicts
      type: object
    BuildInputItem:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        component:
          description: Owning component name
          type: string
        dependency:
          description: Dependency name
          type: string
        kind:
          enum:
          - external-config
          - external-spec
          - platform-resource
          - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        specContent:
          type: string
        specUrl:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ConfigValue'
          type: array
          nullable: true
      required:
      - component
      - dependency
      - kind
      type: object
    BuildList:
      additionalProperties: false
      description: list-project-builds response — the version ledger, one entry per built spec version
        tag, newest first.
      properties:
        builds:
          items:
            $ref: '#/components/schemas/BuildSummary'
          type: array
          nullable: true
      required:
      - builds
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
      - log
      type: object
    BuildLogs:
      additionalProperties: false
      description: One read of a build's log. A build that is still running returns an incomplete
        response and the client re-reads from `nextCursor`; a terminal build returns everything it has
        in one call. A complete response carrying no entries is the honest "nothing retained" answer,
        not an error.
      properties:
        complete:
          description: True when the build is terminal and this response carries everything there
            will ever be — the client stops polling. False means re-read from `nextCursor`.
          type: boolean
        logs:
          items:
            $ref: '#/components/schemas/BuildLogEntry'
          type: array
          nullable: true
        nextCursor:
          description: Epoch millis of the newest entry returned; pass back as `since`. Absent when
            nothing was returned, in which case the previous cursor stands.
          format: int64
          type: integer
        totalCount:
          format: int64
          type: integer
      required:
      - logs
      - complete
      type: object
    BuildPreflight:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/PreflightItem'
          type: array
          nullable: true
        needsInput:
          type: boolean
      required:
      - needsInput
      - items
      type: object
    BuildRequest:
      additionalProperties: false
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/BuildInputItem'
          type: array
          nullable: true
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        failures:
          items:
            $ref: '#/components/schemas/InputFailure'
          type: array
          nullable: true
        tag:
          type: string
      type: object
    BuildStage:
      additionalProperties: false
      description: Build-stage aggregate on ProjectStatus (#184) — the version the newest milestone run
        is working, and how that run is doing. Deliberately count-free - the only honest source of a
        per-version task tally is the version's milestone on GitHub, and this endpoint is polled at 5s.
        The console renders counts from the list-tasks response it already holds, on the surface that
        already pays for it.
      properties:
        status:
          description: idle (never built), running, failed, succeeded
          enum:
          - idle
          - running
          - failed
          - succeeded
          type: string
          x-go-type: string
        version:
          description: Spec tag the current/last build built; "" if never built.
          type: string
      required:
      - version
      - status
      type: object
    BuildRunList:
      additionalProperties: false
      description: A version's milestone runs. `milestoneNumber` is the platform key the tag resolved
        to through the run rows; a tag with no run rows is a 404, not an empty list.
      properties:
        milestoneNumber:
          format: int64
          type: integer
        runs:
          description: Newest run first. A milestone sees SEQUENTIAL runs across its life — the spec
            build that created the version, then any later incident adoption into it.
          items:
            $ref: '#/components/schemas/MilestoneRunView'
          type: array
        tag:
          type: string
      required:
      - tag
      - milestoneNumber
      - runs
      type: object
    BuildSummary:
      additionalProperties: false
      description: One entry of the version ledger — a spec version tag and the state of the newest
        milestone run that has worked it. A ledger read has no live workflow query, so "started"
        never occurs here.
      properties:
        completedAt:
          format: date-time
          type: string
          nullable: true
          x-go-type: '*time.Time'
        milestoneNumber:
          description: The GitHub milestone this version's work lives in — the platform key the tag
            resolves to, and the handle list-build-runs is read by.
          format: int64
          type: integer
        reason:
          description: The run's terminal reason for a failed version (empty otherwise), surfaced
            beside the Failed badge in the console.
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          enum:
          - started
          - in_progress
          - completed
          - failed
          type: string
        tag:
          type: string
      required:
      - tag
      - milestoneNumber
      - status
      - startedAt
      type: object
    ClientSecretOutputBody:
      additionalProperties: false
      properties:
        clientSecret:
          type: string
      required:
      - clientSecret
      type: object
    CollabSessionOutputBody:
      additionalProperties: false
      properties:
        email:
          type: string
        roomId:
          type: string
        userName:
          type: string
        wsUrl:
          type: string
      required:
      - roomId
      - wsUrl
      - userName
      - email
      type: object
    CollabValidateOutputBody:
      additionalProperties: false
      properties:
        email:
          type: string
        name:
          type: string
        projectName:
          description: The room's project, resolved by the oracle from `spec-<org>-<project>`; the collab
            service uses it for the seed read (#114).
          type: string
      required:
      - name
      - email
      - projectName
      type: object
    Component:
      additionalProperties: false
      properties:
        autoBuild:
          type: boolean
        autoDeploy:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
        displayName:
          type: string
        endpointUrl:
          description: Public URL of the running dev deployment. Populated for web applications only;
            absent until deployed.
          type: string
        name:
          type: string
        projectName:
          type: string
        status:
          type: string
