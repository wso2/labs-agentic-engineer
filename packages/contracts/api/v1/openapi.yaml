            type: string
          type: array
          nullable: true
      required:
      - tags
      type: object
    TaskDetail:
      additionalProperties: false
      properties:
        blockedBy:
          description: Names of the dependencies this task is waiting on; present when derivedStatus is
            on_hold.
          items:
            type: string
          type: array
          nullable: true
        attention:
          items:
            type: string
          type: array
          nullable: true
        body:
          type: string
        comments:
          description: The issue's newest comments, OLDEST FIRST, capped, with the platform's own
            machine comments excluded — the same population the list read serves, read here for
            ONE issue because a detail page names its issue and needs no milestone to bound the
            fetch. Always attempted on this read; absence covers every empty case (nothing there,
            nothing left after the machine comments were dropped), and the field is never an empty
            array. The newest comment's first line is an agent's current status on this issue.
          items:
            $ref: '#/components/schemas/IssueComment'
          minItems: 1
          type: array
        component:
          type: string
        dependsOn:
          items:
            type: string
          type: array
          nullable: true
        derivedStatus:
          type: string
        executionHistory:
          items:
            $ref: '#/components/schemas/ExecutionView'
          type: array
          nullable: true
        executions:
          additionalProperties:
            $ref: '#/components/schemas/ExecutionView'
          type: object
        executorClass:
          description: >-
            WHO works this issue, derived from its labels: `coding` for anything
            a coding agent is dispatched at (planned work, a bug, a merge
            conflict — all armed with the `aep` label), `provision` for a
            dispatch gate the platform resolves, `validation` for the version's
            validation task, `ledger` for a bare human issue that joined the
            milestone unarmed. Deliberately coarser than `kind`: the three
            coding kinds are dispatched identically, so they are one class here
            and are told apart by `kind`. Nothing here is parsed out of the body
            — issue bodies are prose the platform writes for the agent and never
            reads back.
          enum:
          - coding
          - provision
          - validation
          - ledger
          type: string
        kind:
          description: >-
            The issue's raw label kind: `development` for planned work minted
            from the spec, `bug` for a defect, `conflict` for a pull request
            that will not merge, `validation` for the version's validation
            task, `provision` for a dispatch gate. Absent when the issue carries
            no kind label (a ledger issue, or one a human armed without
            classifying); a consumer that does not recognise a kind should render
            the row untagged rather than guess.
          type: string
        hold:
          type: boolean
        issueNumber:
          format: int64
          type: integer
        issueUrl:
          type: string
        lineage:
          $ref: '#/components/schemas/Lineage'
        operation:
          type: string
        origin:
          type: string
        rationale:
          type: string
        title:
          type: string
      required:
      - executionHistory
      - issueNumber
