info:
  title: AEP BFF API
  version: 1.0.0
openapi: 3.1.0
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
      parameters:
        - description: Collaboration room ID (spec-<org>-<project>)
          in: header
          name: X-Room-Id
          schema:
            description: Collaboration room ID (spec-<org>-<project>)
            type: string
        - description: Bearer token; the display identity is decoded from it
          in: header
          name: Authorization
          schema:
            description: Bearer token; the display identity is decoded from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabValidateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
        - Collaboration
  /config:
    get:
      operationId: get-config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigProjection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get the organization's integration config (statuses/kinds, no secrets)
      tags:
        - Org Config
    patch:
      operationId: update-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigProjection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Patch the organization's integration config (per-section, atomic)
      tags:
        - Org Config
  /config/git-provider/connect-sessions:
    post:
      operationId: start-git-provider-connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConnectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Start App-mode git-provider connect (OAuth-driven)
      tags:
        - Org Config
  /config/git-provider/disconnect:
    post:
      operationId: disconnect-git-provider
      parameters:
        - description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
          explode: false
          in: query
          name: uninstall
          schema:
            default: true
            description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Disconnect the git provider (cascade) for the org
      tags:
        - Org Config
  /config/idp/client-secret:
    post:
