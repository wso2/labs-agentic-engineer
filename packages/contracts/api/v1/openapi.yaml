  /projects/{projectName}/runs/{runId}/cancel:
    post:
      description: Abandon an increment. Cancel is the only expiry the run's unbounded wait state has.
        It is delivered as a SIGNAL rather than a workflow cancellation, so the run settles its own row
        and closes its own cycle on the ordinary path. 202 means the signal was sent; the run row flips
        to `cancelled` when the supervisor acts on it. 503 when the workflow engine is unreachable —
        nothing was cancelled and the caller may retry.
      operationId: cancel-run
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Milestone run id
        in: path
        name: runId
        required: true
        schema:
          description: Milestone run id
          type: string
      responses:
        '202':
          description: Cancel signalled
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Cancel a milestone run
      tags:
      - Runs
  /projects/{projectName}/runs/{runId}/progress:
    get:
      operationId: stream-run-progress
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Milestone run id
        in: path
        name: runId
        required: true
        schema:
          description: Milestone run id
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunProgressEvent'
          description: 'ONE SSE stream stitching every cycle of the run: a `cycle` frame per cycle record
            (client upserts by id) and a `line` frame per agent-log entry, each line carrying the id of
            the cycle that produced it so the console can render one accordion section per cycle. Each
            line also carries an `emitter` chip — `main` for the run''s main agent, `subagent` for work
            it fanned out with the Task tool. One `data:` JSON frame per event (a RunProgressEvent
            discriminated by `type`), each stamped `id: <seq>`; `: keep-alive` comments pace idle waits.
            ONLY a terminal run settles the stream: a terminal run streams its whole history then ends
            with a `done` frame, `data: [DONE]`, and a server close, while a live run stays open
            indefinitely. Reconnects are idempotent — the client upserts cycles by id and dedups lines
            by cycleId+seq.'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Stream a milestone run's per-cycle agent progress as SSE
      tags:
      - Runs
