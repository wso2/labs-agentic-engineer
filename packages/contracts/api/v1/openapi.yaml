  /projects/{projectName}/files/bundle:
    get:
      operationId: read-file-bundle
      description: |-
        Every readable file under `prefix`, with content, in ONE response read at ONE
        commit. Equivalent to list-files followed by a read-file per entry, except that
        the whole bundle is resolved at a single commit — so a push landing mid-read
        cannot yield a mix of two trees, and the returned shas are all from that one
        tree (the caller's baseSha preconditions stay coherent).

        Reads are gated exactly like read-file: only paths under specs/ plus the
        read-only allow-list are included. Anything else in the tree is omitted, never
        an error — `prefix` narrows what a caller wants, the gate decides what it may
        have.

        `bundle` is a literal segment under a path that is otherwise a trailing
        wildcard. It can never shadow a real read: a readable path always starts with
        `specs/`, so `files/bundle` is not a reachable file address.
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Only include paths under this prefix (e.g. specs/design/). Empty includes everything
          the read gate admits.
        explode: false
        in: query
        name: prefix
        schema:
          description: Only include paths under this prefix (e.g. specs/design/). Empty includes everything
            the read gate admits.
          type: string
      - description: 'Commit to read at (a hex object name). Empty reads the branch tip. Same gate as
          read-file''s ref: an object name, never a revision expression.'
        explode: false
        in: query
        name: ref
        schema:
          description: 'Commit to read at (a hex object name). Empty reads the branch tip. Same gate as
            read-file''s ref: an object name, never a revision expression.'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileBundle'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Read every readable file under a prefix at one commit
      tags:
      - Files
