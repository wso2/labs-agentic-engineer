      - description: Filter to the Tasks of one spec/build version tag (e.g. v3). The tag is resolved
          to a milestone number through the platform's run rows and the filter is milestone
          MEMBERSHIP — never a title match against GitHub. Empty returns every version.
        explode: false
        in: query
        name: tag
        schema:
          description: Filter to the Tasks of one spec/build version tag (e.g. v3), by milestone
            membership. Empty returns every version.
          type: string
      - description: Include each issue's newest comments (defaults true). Honoured only on a
          `tag`-scoped read — the comment fetch is anchored on the milestone, so a read spanning
          versions has no bounded set to ask for. Pass false to skip the GitHub round trip when
          the caller does not render them.
        explode: false
        in: query
        name: comments
        schema:
          # Keep an explicit pointer under the global prefer-skip-optional-pointer:
          # the handler must distinguish 'absent' (default true) from an explicit false.
          x-go-type-skip-optional-pointer: false
          default: true
          description: Include each issue's newest comments (defaults true). Honoured only on a
            `tag`-scoped read.
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
