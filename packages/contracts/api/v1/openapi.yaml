      additionalProperties: false
      description: One run of the milestone loop, with the cycle records that make up its timeline. Loop
        POSITION is deliberately absent — it renders from the latest cycle, because fix and conflict
        cycles re-enter earlier phases and a stored phase enum would lie mid-loop.
      properties:
        budgets:
