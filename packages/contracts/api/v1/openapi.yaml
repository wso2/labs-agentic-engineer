                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List a project's issues (live from GitHub), optionally scoped to one spec/build version
        tag by milestone membership. Every row carries the label-derived `executorClass` the console
        sections on — agent work, a dispatch gate, or a bare human ledger issue. The aep:validation
        issue is excluded (it is a phase of the run, surfaced with the run's verdict on the deployment
        surface); get-task still serves it by number. Ledger issues have no label to query by, so they
        are only discoverable through milestone membership and appear only on a `tag`-scoped read.
      tags:
