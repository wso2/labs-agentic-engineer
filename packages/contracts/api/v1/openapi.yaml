  securitySchemes:
    userJWT:
      bearerFormat: JWT
      description: Thunder end-user JWT (RS256, JWKS-verified)
      scheme: bearer
      type: http
info:
  title: AEP BFF API
  version: 1.0.0
openapi: 3.1.0
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
      parameters:
        - description: Collaboration room ID (spec-<org>-<project>)
          in: header
          name: X-Room-Id
          schema:
            description: Collaboration room ID (spec-<org>-<project>)
            type: string
        - description: Bearer token; the display identity is decoded from it
          in: header
          name: Authorization
          schema:
            description: Bearer token; the display identity is decoded from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabValidateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
        - Collaboration
  /config:
    get:
      operationId: get-config
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigProjection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get the organization's integration config (statuses/kinds, no secrets)
      tags:
        - Org Config
    patch:
      operationId: update-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigPatch"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigProjection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Patch the organization's integration config (per-section, atomic)
      tags:
        - Org Config
  /config/git-provider/connect-sessions:
    post:
      operationId: start-git-provider-connect
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConnectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Start App-mode git-provider connect (OAuth-driven)
      tags:
        - Org Config
  /config/git-provider/disconnect:
    post:
      operationId: disconnect-git-provider
      parameters:
        - description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
          explode: false
          in: query
          name: uninstall
          schema:
            default: true
            description: "App-mode only: when false, leave the install on GitHub for later re-adoption (defaults true)"
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Disconnect the git provider (cascade) for the org
      tags:
        - Org Config
  /config/idp/client-secret:
    post:
      operationId: rotate-idp-client-secret
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSecretOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Rotate the IDP publisher client secret (returned once)
      tags:
        - Org Config
  /config/idp/discovery:
    get:
      operationId: discover-idp
      parameters:
        - description: OIDC issuer URL to fetch the discovery document for
          explode: false
          in: query
          name: issuer
          schema:
            description: OIDC issuer URL to fetch the discovery document for
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Discover an OIDC issuer's metadata
      tags:
        - Org Config
  /dependencies/external-resources:
    get:
      operationId: list-external-resources
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ExternalResourceDTO"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List the org's external-resource catalog
      tags:
        - Dependencies
  /dependencies/external-resources/{name}:
    delete:
      operationId: delete-external-resource
      parameters:
        - description: External resource name
          in: path
          name: name
          required: true
          schema:
            description: External resource name
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Delete an external-resource catalog entry (409 if in use)
      tags:
        - Dependencies
  /organizations:
    get:
      operationId: list-organizations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List organizations
      tags:
        - Organizations
  /projects:
    get:
      operationId: list-projects
      parameters:
        - description: Opaque pagination cursor
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque pagination cursor
            type: string
        - description: Case-insensitive substring match on name and displayName
          explode: false
          in: query
          name: search
          schema:
            description: Case-insensitive substring match on name and displayName
            type: string
        - description: Maximum number of items to return (server default when absent)
          explode: false
          in: query
          name: limit
          schema:
            description: Maximum number of items to return (server default when absent)
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List projects
      tags:
        - Projects
    post:
      operationId: create-project
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Create a project
      tags:
        - Projects
  /projects/{projectName}:
    delete:
      operationId: delete-project
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Delete a project
      tags:
        - Projects
    get:
      operationId: get-project
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get a project
      tags:
        - Projects
  /projects/{projectName}/build:
    post:
      operationId: build-project
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Trigger a project build
      tags:
        - Projects
  /projects/{projectName}/build/{tag}:
    get:
      operationId: get-project-build
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
        - description: Build tag
          in: path
          name: tag
          required: true
          schema:
            description: Build tag
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Get project build status
      tags:
        - Projects
  /projects/{projectName}/components:
    get:
      operationId: list-components
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: List components
      tags:
        - Components
  /projects/{projectName}/components/{componentName}:
    get:
      operationId: get-component
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
