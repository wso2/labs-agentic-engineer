components:
  schemas:
    ConversationMessage:
      additionalProperties: false
      description: >
        One rehydrated message from a conversation's server-side history, sourced from the
        turn journal. The console's local chat log is display state; this is the durable
        record, and it is what makes a chip survive a reload.
      properties:
        anchor:
          $ref: '#/components/schemas/TurnAnchor'
        attachments:
          description: File NAMES that went up with this message (#428) — never bytes, which
            are conversation-scoped model content the platform does not store (console
            ADR-0019). Absent for every message without attachments.
          items:
            type: string
          type: array
        author:
          $ref: '#/components/schemas/ConversationMessageAuthor'
        content:
          description: The message body as the journal recorded it. Deliberately untyped — a
            turn's content is model-shaped and varies by role, and this endpoint's job is to
            replay it, not to interpret it.
        role:
          description: Who the message is from, as the journal recorded it.
          type: string
      required:
      - role
      type: object
    ConversationMessageAuthor:
      additionalProperties: false
      description: Who sent this message (#130 multi-user threads). Absent for the agent, and
        for history written before attribution existed.
      properties:
        displayName:
          type: string
        id:
          type: string
      required:
      - id
      - displayName
      type: object
    AccessRequest:
      additionalProperties: false
      properties:
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
      - id
      - consumerProjectId
      - consumerComponentName
      - orgServiceName
      - status
      - createdAt
      - updatedAt
      type: object
    ActivityEvent:
      additionalProperties: false
      description: One project activity event (issue #239). The console renders the line from these structured facts; tone is derived client-side from type.
      properties:
        id:
          type: string
        type:
          enum: [spec_updated, spec_published, plan_derived, task_started, task_deployed, task_failed, run_failed]
          type: string
          x-go-type: string
        reason:
          description: '`run_failed` only: the run''s failure code (RunFailure.code) when the platform
            recorded one, else its terminal reason. A code, never prose — the console owns the
            sentence, the same rule RunEvent.notice follows.'
          type: string
        actorKind:
          enum: [user, agent]
          type: string
          x-go-type: string
        actorId:
          type: string
        actorName:
          type: string
        issue:
          format: int64
          type: integer
        title:
          type: string
        component:
          type: string
        environment:
          type: string
        tag:
          type: string
        occurredAt:
          format: date-time
          type: string
      required:
      - id
      - type
      - actorKind
      - actorName
      - occurredAt
      type: object
    ActivityFeed:
      additionalProperties: false
      description: A page of activity events plus the cursor for the next (older) page.
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityEvent'
          type: array
          nullable: true
        nextBefore:
          description: occurredAt cursor for the next page; absent when there are no older events.
          type: string
        nextBeforeId:
          description: id cursor tiebreak for the next page.
          type: string
      required:
      - items
      type: object
    AgentStatus:
      description: >-
        How an agent, or a backgrounded task an agent owns, ended — as the
        runtime itself reported it. `running` is the only non-terminal value and
        exists so a consumer can repaint a row without waiting for the end;
        `completed` is a clean finish; `failed` is one the runtime called an
        error; `stopped` is a cancellation or a kill from outside, which is NOT
        a failure — the work did not go wrong, it was taken away, and a run a
        user stopped must not be shown as broken.

        Carried by RunEvent's `agent_settled` and `task_settled`, which are the
        only places a status is authoritative. A settle event that never arrives
        means the platform never learned how the agent ended; it does not mean
        the agent is still running.
      enum:
      - running
      - completed
      - failed
      - stopped
      type: string
      x-enum-varnames:
      - AgentStatusRunning
      - AgentStatusCompleted
      - AgentStatusFailed
      - AgentStatusStopped
    AgentRuntime:
      description: >-
        Which coding-agent runtime an organization's builds run on.


        The values are the same two RunEvent.runtime records, and deliberately
        so: what an org SELECTS and what a finished run REPORTS have to be the
        same vocabulary or a reader cannot line them up. The lifetimes differ —
        this is a setting that can change, that one is a fact about an attempt
        that cannot.


        `opencode` is in the enum because the design carries it and because a
        client should be able to render the choice; it is NOT selectable while
        the platform ships no adapter for it, and the API rejects it with a
        reason naming what is missing. Do not treat membership of this enum as
        availability.
      enum:
      - claude-code
      - opencode
      type: string
      x-enum-varnames:
      - AgentRuntimeClaudeCode
      - AgentRuntimeOpencode
    ApplyRequest:
      additionalProperties: false
      properties:
        deletes:
          items:
            $ref: '#/components/schemas/DeleteOp'
          type: array
          nullable: true
        message:
          type: string
        writes:
          items:
            $ref: '#/components/schemas/WriteOp'
          type: array
          nullable: true
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        commitSha:
          type: string
        files:
          items:
            $ref: '#/components/schemas/FileMeta'
          type: array
          nullable: true
        warnings:
          items:
            $ref: '#/components/schemas/Warning'
          type: array
          nullable: true
      required:
      - commitSha
      - files
      type: object
    ApplyConflict:
      additionalProperties: false
      description: One file whose baseSha no longer matches HEAD.
      properties:
        baseSha:
          type: string
        currentSha:
          type: string
        path:
          type: string
      required:
      - path
      - baseSha
      - currentSha
      type: object
    ApplyConflicts:
      additionalProperties: false
      description: apply-files 409 body — the full conflict set; nothing was applied.
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/ApplyConflict'
          type: array
      required:
      - conflicts
      type: object
    BuildInputItem:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        component:
          description: Owning component name
          type: string
        dependency:
          description: Dependency name
          type: string
        kind:
          enum:
          - external-config
          - external-spec
          - platform-resource
          - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        specContent:
          type: string
        specUrl:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ConfigValue'
          type: array
          nullable: true
      required:
      - component
      - dependency
      - kind
      type: object
    BuildList:
      additionalProperties: false
      description: list-project-builds response — the version ledger, one entry per built spec version
        tag, newest first.
      properties:
        builds:
          items:
            $ref: '#/components/schemas/BuildSummary'
          type: array
          nullable: true
      required:
      - builds
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
      - log
      type: object
    BuildLogs:
      additionalProperties: false
      description: One read of a build's log. A build that is still running returns an incomplete
        response and the client re-reads from `nextCursor`; a terminal build returns everything it has
        in one call. A complete response carrying no entries is the honest "nothing retained" answer,
        not an error.
      properties:
        complete:
          description: True when the build is terminal and this response carries everything there
            will ever be — the client stops polling. False means re-read from `nextCursor`.
          type: boolean
        logs:
          items:
            $ref: '#/components/schemas/BuildLogEntry'
          type: array
          nullable: true
        nextCursor:
          description: Epoch millis of the newest entry returned; pass back as `since`. Absent when
            nothing was returned, in which case the previous cursor stands.
          format: int64
          type: integer
        totalCount:
          format: int64
          type: integer
      required:
      - logs
      - complete
      type: object
    BuildChange:
      additionalProperties: false
      description: One thing this version changes, compared with the newest version — the row the
        Start build dialog lists. Every row names something that EXISTS once the version is built,
        which is why the requirements are not one of them — they are the input, not the output.
        `removed` is a statement rather than an action — a build deprovisions nothing, so a removed
        dependency's resource stays.
      properties:
        kind:
          description: What the name belongs to, and the group the dialog lists it under. The two
            dependency kinds carry opposite obligations — an `external` needs a provider and its
            keys from the user, a `platform-resource` is provisioned by the build — so they are
            never one group.
          enum:
          - component
          - external
          - platform-resource
          type: string
        name:
          description: The component, dependency or resource name, as the design writes it.
          type: string
        state:
          enum:
          - new
          - changed
          - removed
          type: string
      required:
      - name
      - kind
      - state
      type: object
    BuildPreflight:
      additionalProperties: false
      properties:
        changes:
          description: What this version changes against the newest one, computed from the diff
            between that version's tag and HEAD. Empty when specUnchanged, and every row is `new`
            when the project has no version yet.
          items:
            $ref: '#/components/schemas/BuildChange'
          type: array
          nullable: true
        currentVersion:
          description: The newest version's tag name, or empty when the project has never been
            built. Ordered by tag creation time, not by any number in the name.
          type: string
        items:
          items:
            $ref: '#/components/schemas/PreflightItem'
          type: array
          nullable: true
        needsInput:
          description: Whether preflight emitted any item at all. Kept as the broad "there is
            something to show" flag; it does NOT gate Build, because an external dependency's
            values are collected on the Builds page while the coding agent runs and are enforced
            at the deploy gate instead.
          type: boolean
        needsResolution:
          description: Whether any emitted item blocks the version cut — a dependency the design
            itself cannot resolve (unresolved, missing spec, or an org service awaiting
            access). This is the ONLY flag a client may block Build on.
          type: boolean
        specUnchanged:
          description: Whether the `specs/` tree at HEAD matches the newest version's, so a build
            reuses that version and reopens its milestone instead of cutting a new one. The client
            locks the version field and says Rebuild.
          type: boolean
        suggestedVersion:
          description: What the version field is prefilled with — `v<count of versions + 1>`,
            incremented until the name is free. A suggestion only; the user may replace it.
          type: string
      required:
      - needsInput
      - needsResolution
      - items
      type: object
    BuildRequest:
      additionalProperties: false
      properties:
        inputs:
          items:
            $ref: '#/components/schemas/BuildInputItem'
          type: array
          nullable: true
        version:
          description: The tag name to cut for this version. Empty takes the suggested one. Must be
            a valid tag name; a name already in use is a 409. Ignored when the spec tree is
            unchanged, because that build reuses the existing version.
          type: string
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        failures:
          items:
            $ref: '#/components/schemas/InputFailure'
          type: array
          nullable: true
        tag:
          type: string
      type: object
    BuildStage:
      additionalProperties: false
      description: Build-stage aggregate on ProjectStatus (#184) — the version the newest milestone run
        is working, and how that run is doing. Deliberately count-free - the only honest source of a
        per-version task tally is the version's milestone on GitHub, and this endpoint is polled at 5s.
        The console renders counts from the list-tasks response it already holds, on the surface that
        already pays for it.
      properties:
        status:
          description: idle (never built), running, failed, cancelled, succeeded. `cancelled` is its
            own value for the same reason it is on BuildSummary — a person abandoning an increment is
            a different fact from the platform failing to deliver one, and the project badge read
            "Build failed" over a build somebody had deliberately stopped.
          enum:
          - idle
          - running
          - failed
          - cancelled
          - succeeded
          type: string
          x-go-type: string
        version:
          description: Spec tag the current/last build built; "" if never built.
          type: string
        failureCode:
          description: Why the build failed, as RunFailure.code, when status is `failed` and the
            platform recorded a failure — so the overview's track can say what went wrong in the
            same words as the build page. Empty otherwise.
          type: string
      required:
      - version
      - status
      type: object
    BuildProgressEvent:
      additionalProperties: false
      description: 'One SSE frame on the VERSION progress stream, which spans every run that has worked
        the version. `type` discriminates the payload: `cycle` carries a RunCycleView (client upserts by
        id), `line` one RunProgressLine, and `done` says why the stream ended (the server then closes
        it). `cycle` and `line` frames also carry `run` — a version''s story spans several executions,
        so a cycle is only identified once you know which run opened it.'
      properties:
        cycle:
          $ref: '#/components/schemas/RunCycleView'
        line:
          $ref: '#/components/schemas/RunProgressLine'
        reason:
          description: 'Why the stream ended — present only on the `done` frame, and deliberately NOT
            a run state. `no_live_run` means no run on the version''s milestone is currently live, so
            there is nothing further to report RIGHT NOW. It is not a verdict on the version: a later
            validation or task run may be admitted on the same milestone, and the console reopens the
            stream when its run-list poll shows one.'
          enum:
          - no_live_run
          type: string
          x-enum-varnames:
          - BuildProgressEventReasonNoLiveRun
        run:
          $ref: '#/components/schemas/BuildProgressRun'
        type:
          enum:
          - cycle
          - line
          - done
          type: string
          x-enum-varnames:
          - BuildProgressEventTypeCycle
          - BuildProgressEventTypeLine
          - BuildProgressEventTypeDone
      required:
      - type
      type: object
    BuildProgressRun:
      additionalProperties: false
      description: Which run a frame's cycle belongs to. The version's narrative spans several runs, so
        the run is the SECTION and the cycle is a step inside it — `RunProgressLine.cycleIndex` stays
        run-relative and is only unique when paired with `run.id`.
      properties:
        id:
          description: Milestone run id — the same id list-build-runs reports and cancel-run takes.
          type: string
        index:
          description: 1-based chronological position of this run among the version's runs, so the
            console can label a section without holding the whole run list — the same reason
            `cycleIndex` exists, one level up. Two runs of one kind are ordinary (a version can be
            repaired more than once), so the kind alone does not name a section.
