    TaskDetail:
      additionalProperties: false
      properties:
        blockedBy:
          description: Names of the dependencies this task is waiting on; present when derivedStatus is
            on_hold.
          items:
            type: string
          type: array
          nullable: true
        attention:
          items:
            type: string
          type: array
          nullable: true
        body:
          type: string
        component:
          type: string
        dependsOn:
          items:
            type: string
          type: array
          nullable: true
        derivedStatus:
          type: string
        executionHistory:
          items:
            $ref: '#/components/schemas/ExecutionView'
          type: array
          nullable: true
        executions:
          additionalProperties:
            $ref: '#/components/schemas/ExecutionView'
          type: object
        executorClass:
          description: >-
            Label-derived kind of the issue, and the only classification the
            platform makes of one: `coding` for agent work (the `aep` label),
            `provision` for a dispatch gate (`aep:provision`), `validation` for
            the run's validation issue, `ledger` for a bare human issue that
            joined the milestone carrying none of them. Nothing here is parsed
            out of the body — issue bodies are prose the platform writes for
            the agent and never reads back.
          enum:
          - coding
          - provision
          - validation
          - ledger
          type: string
        hold:
          type: boolean
        issueNumber:
          format: int64
          type: integer
        issueUrl:
          type: string
        lineage:
          $ref: '#/components/schemas/Lineage'
        operation:
          type: string
        origin:
          type: string
        rationale:
          type: string
        title:
          type: string
      required:
      - executionHistory
      - issueNumber
      - title
      - issueUrl
      - executorClass
      - dependsOn
      - lineage
      - derivedStatus
      - hold
      - attention
      - executions
      type: object
    TaskStreamEvent:
      additionalProperties: false
      description: 'One SSE frame on the task-log stream. `type` discriminates the payload: `task` carries
        the full TaskView (client upserts by issue), `execution` one ExecutionView (client upserts by
        id), `line` one TimelineEvent (client appends, deduped by executionId+seq), and `done` the settled
        derivedStatus (the server then closes the stream).'
      properties:
        derivedStatus:
          description: Settled derived status — present only on the `done` frame.
          type: string
        execution:
          $ref: '#/components/schemas/ExecutionView'
        line:
          $ref: '#/components/schemas/TimelineEvent'
        task:
          $ref: '#/components/schemas/TaskView'
        type:
          enum:
          - task
          - execution
          - line
          - done
          type: string
          x-enum-varnames:
          - TaskStreamEventTypeTask
          - TaskStreamEventTypeExecution
          - TaskStreamEventTypeLine
          - TaskStreamEventTypeDone
      required:
      - type
      type: object
    TaskView:
      additionalProperties: false
      properties:
        attention:
          items:
            type: string
          type: array
          nullable: true
        blockedBy:
          description: Names of the dependencies this task is waiting on; present when derivedStatus is
            on_hold.
          items:
            type: string
          type: array
        body:
          type: string
        component:
          type: string
        dependsOn:
          items:
            type: string
          type: array
          nullable: true
        derivedStatus:
          type: string
        executions:
          additionalProperties:
            $ref: '#/components/schemas/ExecutionView'
          type: object
        executorClass:
          description: >-
            Label-derived kind of the issue, and the only classification the
            platform makes of one: `coding` for agent work (the `aep` label),
            `provision` for a dispatch gate (`aep:provision`), `validation` for
            the run's validation issue, `ledger` for a bare human issue that
            joined the milestone carrying none of them. Nothing here is parsed
            out of the body — issue bodies are prose the platform writes for
            the agent and never reads back.
          enum:
          - coding
          - provision
          - validation
          - ledger
          type: string
        hold:
          type: boolean
        issueNumber:
          format: int64
          type: integer
        issueUrl:
          type: string
        lineage:
          $ref: '#/components/schemas/Lineage'
        operation:
          type: string
        origin:
          type: string
        rationale:
          type: string
        title:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
          description: Aggregate actual usage across the task's executions (#245); absent for tasks that predate usage capture.
      required:
      - issueNumber
      - title
      - issueUrl
      - executorClass
      - dependsOn
      - lineage
      - derivedStatus
      - hold
      - attention
      - executions
      type: object
    TimelineEvent:
      additionalProperties: false
      description: 'A unified-timeline entry: today''s ProgressEvent (phase | tool_use | git_commit |
        git_push | gh_action | build_step | log | result) plus its attribution — which execution attempt
        it came from. This is the per-row shape the console renders; the FE groups rows by executionId/kind.'
      properties:
        branch:
          type: string
        command:
          type: string
        completedAt:
          type: string
        durationMs:
          description: '`tool_result` only: how long the call took, measured by the runner between
            the call and its outcome, so it includes model turnaround.'
          format: int64
          type: integer
        emitter:
          description: Who produced the line — `subagent` for work the main agent fanned out with the
            Task tool, absent for the main agent itself. Absence is a positive fact, not an unknown.
          enum:
          - main
          - subagent
          type: string
        emitterId:
          description: Which subagent, for the cycles that fan out to several at once — the id of the
            fan-out tool call, stable for that subagent's whole life. Absent on main-agent lines.
          type: string
        emitterLabel:
          description: The description the main agent gave that subagent ("Implement todo-api service
            (issue #3)"). Absent on main-agent lines, and on a fan-out that carried no description.
          type: string
        error:
          type: string
        exitCode:
          description: '`tool_result` only: the process status of a failed shell call, parsed from the
            SDK''s own `Exit code N` first line. Absent when the tool was not a shell — those report a
            `<tool_use_error>` with no code — so read absence as "no code was reported", never as
            "exited 0".'
          format: int64
          type: integer
        executionId:
          description: Id of the execution attempt this line belongs to.
          type: string
        executionKind:
          description: Kind of that attempt (coding | build | ops) — client-side grouping/section labels.
          type: string
        files:
          format: int64
          type: integer
        kind:
          type: string
        level:
          type: string
        linesAdded:
          description: A fanned-out subagent's total lines added, off the SDK's own report on its fan-out
            call's result. Present only there; nothing in the feed can reconstruct it.
          format: int64
          type: integer
        linesRemoved:
          description: A fanned-out subagent's total lines removed, from the same report.
          format: int64
          type: integer
        message:
          type: string
        ok:
          description: '`tool_result` only: whether the call succeeded. Absent on every other kind — so
            read absence as "not a tool result", never as success.'
          type: boolean
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        sha:
          type: string
        startedAt:
          type: string
        status:
          type: string
        step:
          type: string
        summary:
          type: string
        tool:
          type: string
        toolCount:
          description: A fanned-out subagent's total tool calls, off the SDK's own report on its fan-out
            call's result. Present only there.
          format: int64
          type: integer
        toolUseId:
          description: The tool call this line is about. A `tool_result` carries the id of the `tool_use`
            it answers, which is what pairs a call with its outcome once several subagents interleave
            the feed.
          type: string
        ts:
          type: string
      required:
      - schemaVersion
      - ts
      - seq
      - kind
      - executionId
      - executionKind
      type: object
    TurnInputBody:
      additionalProperties: false
      properties:
        collab:
          description: 'Room-scoped turn (#86 phase 4): the agent joins the project''s spec collab room
            as a live peer, reads and edits the shared doc, and commits nothing to git.'
          type: boolean
        instruction:
          description: User message / generation directive. `/<skill>` flow commands (`/start`, `/design`,
            …) are sent VERBATIM — the server expands them, attaches the flow's eager skills, and enriches
            `/start` with the captured project idea.
