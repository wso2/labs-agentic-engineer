          description: Who produced the line. The runner stamps `subagent` only on lines forwarded from
            inside a Task tool call; everything else is the main agent.
          enum:
          - main
          - subagent
          type: string
          x-enum-varnames:
          - RunProgressLineEmitterMain
          - RunProgressLineEmitterSubagent
        emitterId:
          description: Which subagent, for the cycles that fan out to several at once — the id of the
            fan-out tool call, stable for that subagent's whole life. Absent on main-agent lines.
          type: string
        emitterLabel:
          description: The description the main agent gave that subagent ("Implement todo-api service
