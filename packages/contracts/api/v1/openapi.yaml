          readOnly: true
          type: string
        componentName:
          type: string
        componentType:
          type: string
        spec:
          type: string
      required:
        - componentName
        - componentType
        - spec
      type: object
    ComponentTask:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentTask.json
          format: uri
          readOnly: true
          type: string
        batchId:
          type: string
        body:
          type: string
        bodySyncPending:
          type: boolean
        branchName:
          type: string
        buildAuthRetryCount:
          format: int64
          type: integer
        cause:
          type: string
        componentName:
          type: string
        createdAt:
          format: date-time
          type: string
        dependsOnComponents:
          items:
            type: string
          type:
            - array
            - "null"
        dependsOnExternalResources:
          items:
            type: string
          type:
            - array
            - "null"
        dependsOnOrgServices:
          items:
            type: string
          type:
            - array
            - "null"
        dependsOnResources:
          items:
            type: string
          type:
            - array
            - "null"
        dispatchDeferredAt:
          format: date-time
          type: string
        dispatchedAt:
          format: date-time
          type: string
        errorMessage:
          type: string
        execType:
          type: string
        externalResourceName:
          type: string
        id:
          type: string
        issueNumber:
          format: int64
          type: integer
        issueUrl:
          type: string
        labels:
          items:
            type: string
          type:
            - array
            - "null"
        lastBuildRunName:
          type: string
        lastBuildSha:
          type: string
        lastCodingAgentRunName:
          type: string
        lastEventAt:
          format: date-time
          type: string
        lifecycleStatus:
          type: string
        mergeCommitSha:
          type: string
        order:
          format: int64
          type: integer
        projectId:
          type: string
        pullRequestNumber:
          format: int64
          type: integer
        pullRequestUrl:
          type: string
        rationale:
          type: string
        resourceName:
          type: string
        sourceDesignVersion:
          type: string
        sourceSpecVersion:
          type: string
        status:
          type: string
        title:
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        workspacePath:
          type: string
