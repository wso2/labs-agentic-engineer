        endedAt:
          format: date-time
          nullable: true
          type: string
          x-go-type: '*time.Time'
        id:
          type: string
        kind:
          description: What this run DOES, and the value every platform predicate is written on.
            `dev` delivers a version — it plans its own milestone, and is the only kind that takes
            the one-active-build-per-project mutex. `task` works a defect inside a version already
            delivered; task runs execute concurrently on their own milestones. `validation` asks a
            shipped version's validation criteria again — it has no working set, builds nothing, and
            is outside the mutex so it never holds up the next build.
          enum:
          - dev
          - task
          - validation
          type: string
        milestoneNumber:
          format: int64
          type: integer
        milestoneTitle:
          description: The milestone's GitHub title at creation. Display only — the number is the
            key, and the version this run builds is the list's tag.
          type: string
        origin:
          description: Where this run was started from. A label on the trigger — the behaviour is
            the run's kind.
          enum:
          - spec-build
          - incident-adoption
          - revalidate
          type: string
        startedAt:
          format: date-time
          nullable: true
          type: string
          x-go-type: '*time.Time'
        state:
          description: planning is the fill window — the version's milestone is still being
            written (gates minted, then issues planned in). waiting is the unbounded wait
            between cycles, where something outside the platform is needed. blocked is
            terminal and is NOT a failure — the org has no agent concurrency slot left, so
            the cycle was never launched (see terminalReason agent-quota-blocked).
          enum:
          - planning
          - waiting
          - running
          - succeeded
          - failed
          - cancelled
          - blocked
          type: string
        terminalReason:
          description: Why a non-succeeded run stopped. Each value names exactly one failure class;
            empty while the run is non-terminal and on a succeeded run. agent-quota-blocked
            explains state=blocked.
          type: string
        waitingReason:
          description: Why a `waiting` run is waiting. Empty for the ordinary between-cycles park,
            which needs no explanation. `external-values` is the deploy gate — the run is built and
            ready to deploy, and every remaining blocker is a value only a human can supply. That
            park is unbounded and only cancellation or the values arriving exits it, so a client
            that renders `waiting` without this reads a working run as a hung one.
          enum:
          - external-values
          type: string
        blockingDependencies:
          description: The external dependency names a `waiting` run is blocked on, so a client can
            name them and link straight to their configuration. Empty unless waitingReason is set.
          items:
            type: string
          type: array
        validation:
          $ref: '#/components/schemas/RunValidation'
