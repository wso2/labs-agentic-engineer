        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DispatchResult.json
          format: uri
          readOnly: true
          type: string
        componentName:
          type: string
        error:
          type: string
        runName:
          type: string
        status:
          type: string
        taskId:
          type: string
      required:
        - taskId
