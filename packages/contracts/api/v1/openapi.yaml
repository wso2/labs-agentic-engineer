          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMsg'
          description: Deleted; status names any other projects still referencing the account
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The project does not reference this username, or the platform does not own
            the account
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Delete a test user
      tags:
      - Identity
  /projects/{projectName}/runs/{runId}/cancel:
    post:
      description: Abandon an increment. Cancel is the only expiry the run's unbounded wait state has.
        It is delivered as a SIGNAL rather than a workflow cancellation, so the run settles its own row
        and closes its own cycle on the ordinary path. 202 means the signal was sent; the run row flips
        to `cancelled` when the supervisor acts on it. 503 when the workflow engine is unreachable —
        nothing was cancelled and the caller may retry.
      operationId: cancel-run
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Milestone run id
        in: path
        name: runId
        required: true
        schema:
          description: Milestone run id
          type: string
      responses:
        '202':
          description: Cancel signalled
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Cancel a milestone run
