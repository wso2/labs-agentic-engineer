    RunCycleView:
      additionalProperties: false
      description: One dispatch within a run. Branch, pull request (number and URL) and merge SHA are
        LEARNED FROM WEBHOOKS — the agent derives its own branch identity — so they stay empty on a
        cycle whose agent died before opening a pull request.
      properties:
        agentReason:
          description: >-
            Why this cycle's agent stopped without opening a pull request, as the
            platform's pod-truth watcher classified it — `timed_out` (the run
            deadline), `agent_failed[:<reason>]` (a non-zero exit or a killed
            container), `startup_failed:<reason>: <message>` (the runner never
            started: image pull, scheduling, or a secret that had not
            materialised) or `job_not_found` (the runner's workload disappeared).
            Absent on every cycle that opened a pull request: there the pull
            request is the outcome.
          type: string
        attempts:
          description: Dispatches of THIS cycle (the per-cycle re-dispatch budget, which resets at every
            cycle boundary).
          format: int64
          type: integer
        branch:
          type: string
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          nullable: true
          type: string
          x-go-type: '*time.Time'
        id:
          type: string
        jobRef:
          description: The dispatched runner Job for the current attempt; replaced on re-dispatch.
          type: string
        kind:
          enum:
          - coding
          - conflict
          - fix
          - validation
          type: string
        mergeReason:
          description: >-
            The merge policy's own words for `mergeVerdict` — the auto-merge
            decision's reason, or the host's refusal. Written for a reader, not
            parsed.
          type: string
        mergeSha:
          type: string
        mergeVerdict:
          description: >-
            Why this cycle's pull request did NOT merge, when something decided
            so: `declined` is the auto-merge policy saying the pull request is
            not this run's work, `refused` is the host declining an open pull
            request (a conflict — a conflict issue is minted and the next cycle
            works it). Absent on a cycle whose merge was never decided against,
            which includes every cycle that merged: a merge is recorded by
            `mergeSha`, and each fresh decision overwrites this field, so a
            declined pull request that later merges does not keep the verdict.
          enum:
          - declined
          - refused
          type: string
        prDraft:
          description: >-
            Is the recorded pull request still a draft? A draft is the agent
            saying it is not finished, so nothing merges while this is true —
            recorded because a cycle sitting behind a draft is otherwise
            indistinguishable from one whose agent never opened a pull request.
          type: boolean
        prNumber:
          format: int64
          type: integer
        prUrl:
          description: >-
            The pull request's own page on the host, as the webhook reported it —
            never composed from a repo URL and a number, so a console link either
            is the host's own or is absent. Empty until a pull request is seen.
          type: string
        resolves:
          description: >-
            The milestone agent-work issues this cycle's pull request claims —
            the merge policy's matched set, which is what the merge closes.
            Recorded so a cycle's working set survives its issues being closed;
            empty until a pull request is seen.
          items:
            format: int64
            type: integer
          type: array
        validationIssue:
          description: >-
            The validation issue this cycle was dispatched at. Set on validation
            cycles only, and recorded per cycle rather than only on the run so a
            repeated validation stays navigable to the issue that framed each
            attempt.
          format: int64
          type: integer
        validationVerdict:
          description: >-
            What THIS validation attempt concluded, from the report at its own
            `mergeSha`. Set on validation cycles only, and only once the attempt
            settles. The run carries the latest attempt's verdict; this is how a
            self-healed run shows that an earlier attempt failed.
          enum:
          - passed
          - partial
          - failed
          - inconclusive
          - unreported
          - skipped
          type: string
      required:
      - id
      - kind
      - attempts
      - createdAt
      type: object
