            $ref: "#/components/schemas/Component"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ComponentOpenAPI:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentOpenAPI.json
