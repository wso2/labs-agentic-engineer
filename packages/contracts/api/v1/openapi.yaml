  /projects/{projectName}/files/{path}:
    get:
      operationId: read-file
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: 'Repo-relative file path (trailing wildcard: may span multiple segments, i.e. contain
          slashes). Reads are scoped to specs/ plus a small read-only allow-list — currently the
          runner-authored validation report at tests/validation/report.json.'
        in: path
        name: path
        required: true
        schema:
          description: Repo-relative file path — specs/ or an allow-listed read-only path (tests/validation/report.json)
          type: string
      - description: >-
          Commit to read the file AT. Omitted reads the default-branch tip.

          It exists because an artifact at a fixed path is otherwise unaddressable:
          the validation report is overwritten by every run, so reading the tip
          returns the newest run's results whichever run you asked about. Pin it to
          that run's validation-cycle mergeSha (RunCycleView.mergeSha) to get the
          report that run actually produced.

          A hex object name only — deliberately not a revision expression, so this
          cannot become a browser over the repo's history. The path allow-list
          still decides what is readable at all.
        in: query
        name: ref
        schema:
          pattern: '^[0-9a-fA-F]{7,64}$'
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Read a spec file (or an allow-listed read-only artifact) at HEAD
      tags:
      - Files
