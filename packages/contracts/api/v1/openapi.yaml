      type: object
  securitySchemes:
    userJWT:
      bearerFormat: JWT
      description: Thunder end-user JWT (RS256, JWKS-verified)
      scheme: bearer
      type: http
info:
  title: AEP BFF API
  version: 1.0.0
openapi: 3.1.0
paths:
  /collab/validate:
    get:
      operationId: validate-collab-access
