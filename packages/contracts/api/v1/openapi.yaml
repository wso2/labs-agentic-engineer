          type: string
        name:
          type: string
        projectName:
          type: string
        status:
          type: string
        type:
          type: string
        uid:
          type: string
      required:
        - name
      type: object
    ComponentConfig:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentConfig.json
