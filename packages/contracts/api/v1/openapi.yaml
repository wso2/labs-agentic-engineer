          description: '`progress_item` only: WHICH named unit of work the line is about — the key a
            consumer folds on, since many lines describe the same item and a reader wants one row
            repainted rather than many rows printed. Validation binds items to acceptance criteria
            ("AC-003-a"), which `cycleKind` already implies, so this never repeats it. The status
            itself rides on `status`, scoped by `kind`: planned | exploring | authoring | running |
            healing | pass | fail.'
          type: string
        kind:
          type: string
        level:
          type: string
        linesAdded:
          description: A fanned-out subagent's total lines added, off the SDK's own report on its fan-out
            call's result. Present only there; nothing in the feed can reconstruct it.
          format: int64
          type: integer
        linesRemoved:
          description: A fanned-out subagent's total lines removed, from the same report.
          format: int64
          type: integer
        ok:
          description: '`tool_result` only: whether the call succeeded. Absent on every other kind — so
            read absence as "not a tool result", never as success.'
          type: boolean
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        sha:
          type: string
        status:
          type: string
        summary:
          type: string
        tool:
          type: string
        toolCount:
          description: A fanned-out subagent's total tool calls, off the SDK's own report on its fan-out
            call's result. Present only there.
          format: int64
          type: integer
        toolUseId:
