        specDirty:
          description: True when specs/ changed after latest was tagged.
          type: boolean
        tags:
          description: Spec version tags, newest first. A version carries the name the user gave
            it at build time (`v<N>` when they kept the suggestion), and "newest" is the tags'
            creation order, not any number in the name.
