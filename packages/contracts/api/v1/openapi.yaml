        - description: Collaboration room ID (spec-<org>-<project>)
          in: header
          name: X-Room-Id
          schema:
            description: Collaboration room ID (spec-<org>-<project>)
            type: string
        - description: Bearer token; the display identity is decoded from it
          in: header
          name: Authorization
          schema:
            description: Bearer token; the display identity is decoded from it
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabValidateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Authorize a collaboration room (server-to-server)
      tags:
        - Collaboration
  /config:
