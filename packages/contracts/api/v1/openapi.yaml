  /projects/{projectName}/roles/test-users/{username}/reveal:
    post:
      description: Disclose a platform-owned test account's password. A POST, deliberately, even
        though it reads. A password in a GET would land in the request URL, and from there in the
        browser's history, the proxy access log, and any referrer — none of which the platform can
        redact. Only an account this project references AND the platform owns (it holds a sealed
        password for it) can be revealed; anything else is 404, so one project cannot read a shared
        account another project provisioned.
      operationId: reveal-test-user-password
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Test-user username
        in: path
        name: username
        required: true
        schema:
          description: Test-user username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestUserPassword'
          description: The account's current password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The project does not reference this username, or the platform does not own
            the account
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Reveal a test user's password
      tags:
      - Identity
  /projects/{projectName}/roles/test-users/{username}/rotate:
    post:
      description: Replace a platform-owned test account's password and return the new one. The
        identity provider is written FIRST and the sealed copy second; if the seal fails after the
        directory accepted the change the response is a 500 saying the password was changed but not
        recorded, and the caller must rotate again. Same fence as reveal — the project must
        reference the username and the platform must own the account.
      operationId: rotate-test-user-password
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Test-user username
        in: path
        name: username
        required: true
        schema:
          description: Test-user username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestUserPassword'
          description: The account's new password
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The project does not reference this username, or the platform does not own
            the account
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Rotate a test user's password
      tags:
      - Identity
  /projects/{projectName}/roles/test-users/{username}:
    delete:
      description: Delete a platform-owned test account from the identity provider and forget the
        platform's record of it. The ROLE is left standing — roles are shared, and deleting one
        because a single test account went away would take it from every other project naming it.
        The account is shared too, so a delete while other projects still reference it is logged as
        a warning and reported in the response status. Same fence as reveal and rotate.
      operationId: delete-test-user
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Test-user username
        in: path
        name: username
        required: true
        schema:
          description: Test-user username
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMsg'
          description: Deleted; status names any other projects still referencing the account
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The project does not reference this username, or the platform does not own
            the account
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Delete a test user
      tags:
      - Identity
  /projects/{projectName}/runs/{runId}/cancel:
    post:
      description: Abandon an increment. Cancel is the only expiry the run's unbounded wait state has.
        It is delivered as a SIGNAL rather than a workflow cancellation, so the run settles its own row
        and closes its own cycle on the ordinary path. 202 means the signal was sent; the run row flips
        to `cancelled` when the supervisor acts on it. 503 when the workflow engine is unreachable —
        nothing was cancelled and the caller may retry.
      operationId: cancel-run
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Milestone run id
        in: path
        name: runId
        required: true
        schema:
          description: Milestone run id
          type: string
      responses:
        '202':
          description: Cancel signalled
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Cancel a milestone run
      tags:
      - Runs
  /projects/{projectName}/runs/{runId}/progress:
    get:
      operationId: stream-run-progress
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          description: Project name (DNS-label slug)
          type: string
      - description: Milestone run id
        in: path
        name: runId
        required: true
        schema:
          description: Milestone run id
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/RunProgressEvent'
          description: 'ONE SSE stream stitching every cycle of the run: a `cycle` frame per cycle record
            (client upserts by id) and a `line` frame per agent-log entry, each line carrying the id of
            the cycle that produced it so the console can render one accordion section per cycle. Each
            line also carries an `emitter` chip — `main` for the run''s main agent, `subagent` for work
            it fanned out with the Task tool. One `data:` JSON frame per event (a RunProgressEvent
            discriminated by `type`), each stamped `id: <seq>`; `: keep-alive` comments pace idle waits.
            ONLY a terminal run settles the stream: a terminal run streams its whole history then ends
            with a `done` frame, `data: [DONE]`, and a server close, while a live run stays open
            indefinitely. Reconnects are idempotent — the client upserts cycles by id and dedups lines
            by cycleId+seq.'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: Stream a milestone run's per-cycle agent progress as SSE
      tags:
      - Runs
