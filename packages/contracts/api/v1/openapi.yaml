          type:
            - array
            - "null"
        description:
          type: string
        kind:
          type: string
        name:
          type: string
        needsSpec:
          type: boolean
        parameters:
          additionalProperties:
            type: string
          type: object
        reason:
          type: string
        resourceType:
          type: string
        specPath:
          type: string
        specUrl:
          type: string
        status:
          type: string
      required:
        - kind
        - name
      type: object
    DependencyCandidate:
      additionalProperties: false
