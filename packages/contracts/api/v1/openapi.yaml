components:
  schemas:
    AccessRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/AccessRequest.json
          format: uri
          readOnly: true
          type: string
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - consumerProjectId
        - consumerComponentName
        - orgServiceName
        - status
        - createdAt
        - updatedAt
      type: object
    ApplyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ApplyRequest.json
          format: uri
          readOnly: true
          type: string
        deletes:
          items:
            $ref: "#/components/schemas/DeleteOp"
          type:
            - array
            - "null"
        message:
          type: string
        writes:
          items:
            $ref: "#/components/schemas/WriteOp"
          type:
            - array
            - "null"
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ApplyResult.json
          format: uri
          readOnly: true
          type: string
        commitSha:
          type: string
        files:
          items:
            $ref: "#/components/schemas/FileMeta"
          type:
            - array
            - "null"
        warnings:
          items:
            $ref: "#/components/schemas/Warning"
          type:
            - array
            - "null"
      required:
        - commitSha
        - files
      type: object
    BuildInputItem:
      additionalProperties: false
      properties:
        approved:
          type: boolean
        component:
          description: Owning component name
          type: string
        dependency:
          description: Dependency name
          type: string
        kind:
          enum:
            - external-config
            - external-spec
            - platform-resource
            - org-service
          type: string
        parameters:
          additionalProperties: {}
          type: object
        specContent:
          type: string
        specUrl:
          type: string
        values:
          items:
            $ref: "#/components/schemas/ConfigValue"
          type:
            - array
            - "null"
      required:
        - component
        - dependency
        - kind
      type: object
    BuildList:
      additionalProperties: false
      description: list-project-builds response — one entry per built spec version tag, newest first.
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildList.json
          format: uri
          readOnly: true
          type: string
        builds:
          items:
            $ref: "#/components/schemas/BuildSummary"
          type:
            - array
            - "null"
      required:
        - builds
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
        - log
      type: object
    BuildLogs:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildLogs.json
          format: uri
          readOnly: true
          type: string
        logs:
          items:
            $ref: "#/components/schemas/BuildLogEntry"
          type:
            - array
            - "null"
        totalCount:
          format: int64
          type: integer
      required:
        - logs
      type: object
    BuildPreflight:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildPreflight.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/PreflightItem"
          type:
            - array
            - "null"
        needsInput:
          type: boolean
      required:
        - needsInput
        - items
      type: object
    BuildRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildRequest.json
          format: uri
          readOnly: true
          type: string
        inputs:
          items:
            $ref: "#/components/schemas/BuildInputItem"
          type:
            - array
            - "null"
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildResponse.json
          format: uri
          readOnly: true
          type: string
        failures:
          items:
            $ref: "#/components/schemas/InputFailure"
          type:
            - array
            - "null"
        tag:
          type: string
      type: object
    BuildStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildStatus.json
          format: uri
          readOnly: true
          type: string
        reason:
          description: Failure detail for a failed build (empty otherwise) — the devflow's recorded error, so the console can show WHY it failed.
          type: string
        status:
          enum:
            - started
            - in_progress
            - completed
            - failed
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/BuildStatusTask"
          type:
            - array
            - "null"
        workflow_status:
          type: string
      required:
        - status
        - workflow_status
      type: object
    BuildStage:
      additionalProperties: false
      description: Build-stage aggregate on ProjectStatus (#184) — the tag being/last built and its task counts, so the overview needs no list-tasks read.
      properties:
        status:
          description: idle (never built), running, failed, succeeded
          enum:
            - idle
            - running
            - failed
            - succeeded
          type: string
        tasks:
          additionalProperties: false
          description: Task counts bucketed from derivedStatus.
          properties:
            active:
              format: int64
              type: integer
            done:
              format: int64
              type: integer
            failed:
              format: int64
              type: integer
            total:
              format: int64
              type: integer
          required:
            - total
            - done
            - failed
            - active
          type: object
        version:
          description: Spec tag the current/last build built; "" if never built.
          type: string
      required:
        - version
        - status
        - tasks
      type: object
    BuildStatusTask:
      additionalProperties: false
      properties:
        issueNumber:
          description: GitHub issue number of the Task — links a build-status row to its issue (and to the task-log stream); replaces the old title-join.
          format: int64
          type: integer
        status:
          enum:
            - started
            - in_progress
            - completed
            - failed
          type: string
        title:
          type: string
      required:
        - title
        - status
      type: object
    BuildSummary:
      additionalProperties: false
      description: One entry of list-project-builds — a spec version tag's newest run. A list read has no live workflow query, so "started" never occurs here.
      properties:
        completedAt:
          format: date-time
          type: string
        reason:
          description: Failure detail for a failed build (empty otherwise) — the devflow's recorded error, surfaced beside the Failed badge in the console.
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          enum:
            - started
            - in_progress
            - completed
            - failed
          type: string
        tag:
          type: string
        tasks:
          $ref: "#/components/schemas/BuildTally"
          description: The run's own frozen task tally, written by the workflow — not a live task recount.
      required:
        - tag
        - status
        - tasks
        - startedAt
      type: object
    BuildTally:
      additionalProperties: false
      properties:
        active:
          format: int64
          type: integer
        done:
          format: int64
          type: integer
        failed:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - total
        - done
        - failed
        - active
      type: object
    ClientSecretOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ClientSecretOutputBody.json
          format: uri
          readOnly: true
          type: string
        clientSecret:
          type: string
      required:
        - clientSecret
      type: object
    CollabSessionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollabSessionOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        roomId:
          type: string
        userName:
          type: string
        wsUrl:
          type: string
      required:
        - roomId
        - wsUrl
        - userName
        - email
      type: object
    CollabValidateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollabValidateOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        name:
          type: string
        projectName:
          description: The room's project, resolved by the oracle from `spec-<org>-<project>`; the collab service uses it for the seed read (#114).
          type: string
      required:
        - name
        - email
        - projectName
      type: object
    Component:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/Component.json
          format: uri
          readOnly: true
          type: string
        autoBuild:
          type: boolean
        autoDeploy:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
        displayName:
          type: string
        endpointUrl:
          description: >-
            Public URL of the running dev deployment. Populated for web
            applications only; absent until deployed.
          type: string
        name:
          type: string
        projectName:
          type: string
        status:
          type: string
        type:
          description: >-
            Component kind in AEP's design vocabulary — "web-application" or
            "service" (matching design.json's componentType). OpenChoreo's
            prefixed ComponentType names (deployment/*) never appear on this
            API.
          type: string
        uid:
          type: string
      required:
        - name
      type: object
    ComponentConfig:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentConfig.json
          format: uri
          readOnly: true
          type: string
        componentName:
          type: string
        createdAt:
          format: date-time
          type: string
        envVars:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        projectName:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - projectName
        - componentName
        - envVars
        - createdAt
        - updatedAt
      type: object
    ComponentList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Component"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ComponentOpenAPI:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentOpenAPI.json
          format: uri
          readOnly: true
          type: string
        componentName:
          type: string
        componentType:
          type: string
        spec:
          type: string
      required:
        - componentName
        - componentType
        - spec
      type: object
    ConfigKeyDTO:
      additionalProperties: false
      properties:
        defaultValue:
          type: string
        description:
          type: string
        key:
          type: string
        secret:
          type: boolean
      required:
        - key
      type: object
    ConfigKeyView:
      additionalProperties: false
      properties:
        defaultValue:
          type: string
        description:
          type: string
        key:
          type: string
        secret:
          type: boolean
      required:
        - key
      type: object
    ConfigPatch:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ConfigPatch.json
          format: uri
          readOnly: true
          type: string
        gitProvider:
          additionalProperties: false
          properties:
            githubLogin:
              type: string
            kind:
              enum:
                - github
              type: string
            mode:
              enum:
                - pat
              type: string
            pat:
              type: string
          required:
            - kind
            - mode
            - pat
          type:
            - object
            - "null"
        idp:
          additionalProperties: false
          properties:
            issuer:
              type: string
            jwksUrl:
              type: string
            kind:
              enum:
                - platform
                - asgardeo
                - custom
              type: string
          required:
            - kind
          type:
            - object
            - "null"
        llm:
          additionalProperties: false
          properties:
            apiKey:
              type: string
            kind:
              enum:
                - anthropic
              type: string
          required:
            - kind
            - apiKey
          type:
            - object
            - "null"
      type: object
    ConfigProjection:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ConfigProjection.json
          format: uri
          readOnly: true
          type: string
        gitProvider:
          oneOf:
            - $ref: "#/components/schemas/GitProviderProjection"
            - type: "null"
        idp:
          $ref: "#/components/schemas/IDPProjection"
        llm:
          oneOf:
            - $ref: "#/components/schemas/LLMProjection"
            - type: "null"
      required:
        - llm
        - gitProvider
        - idp
      type: object
    ConfigValue:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
    ConsumerDTO:
      additionalProperties: false
      properties:
        componentName:
          type: string
        projectId:
          type: string
      required:
        - projectId
        - componentName
      type: object
    CreateProjectRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CreateProjectRequest.json
          format: uri
          readOnly: true
          type: string
        deploymentPipeline:
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        prompt:
          description: >-
            The user's initial requirement — what they want built. Persisted
            as the project's requirement and kicks off spec derivation for
            the new project (issue #72). Projects created without a prompt
            keep today's behavior.
          type: string
        repoName:
          description: >-
            Repository name for the project's GitHub repo; defaults to the
            project name, the organization is fixed server-side (issue #71).
          type: string
      required:
        - name
      type: object
    CreateRcaAgentReportRequest:
      additionalProperties: false
      description: Write-side request for a new RCA-agent alert report (issue #156). Server assigns id and createdAt.
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CreateRcaAgentReportRequest.json
          format: uri
          readOnly: true
          type: string
        classification:
          description: "code-level, config-level, mixed, or none — set by the handoff agent"
          type: string
        component:
          type: string
        deployed:
          type: boolean
        deployedAt:
          type: string
          format: date-time
        diagnosis:
          description: Full RCA diagnosis + remediation content (markdown)
          type: string
        dispatched:
          type: boolean
        issueExcerpt:
          type: string
        issueNumber:
          format: int64
          type: integer
        issueTitle:
          type: string
        issueUrl:
          type: string
        project:
          type: string
        summary:
          type: string
        title:
          type: string
      required:
        - project
        - title
        - summary
        - classification
        - diagnosis
      type: object
    CreateSkillInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CreateSkillInput.json
          format: uri
          readOnly: true
          type: string
        name:
          type: string
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
      required:
        - name
        - skillMd
      type: object
    DeleteOp:
      additionalProperties: false
      properties:
        baseSha:
          type: string
        path:
          type: string
      required:
        - path
      type: object
    DependencyStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DependencyStatus.json
          format: uri
          readOnly: true
          type: string
        outputs:
          items:
            type: string
          type:
            - array
            - "null"
        ready:
          type: boolean
        status:
          type: string
      required:
        - status
        - ready
        - outputs
      type: object
    Deployment:
      additionalProperties: false
      properties:
        componentName:
          type: string
        createdAt:
          type: string
        endpointUrl:
          type: string
        environment:
          type: string
        name:
          type: string
        releaseName:
          type: string
        status:
          type: string
      type: object
    DeploymentList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DeploymentList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Deployment"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    DeployStage:
      additionalProperties: false
      description: Deploy-stage aggregate on ProjectStatus (#184) — what's live in dev and rollout progress.
      properties:
        components:
          additionalProperties: false
          description: Component rollout progress for the current deploy.
          properties:
            ready:
              format: int64
              type: integer
            total:
              format: int64
              type: integer
          required:
            - total
            - ready
          type: object
        status:
          enum:
            - none
            - deploying
            - deployed
            - failed
          type: string
        version:
          description: Spec tag live in dev; "" if nothing deployed.
          type: string
      required:
        - version
        - status
        - components
      type: object
    DisconnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DisconnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DiscoverOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DiscoverOutputBody.json
          format: uri
          readOnly: true
          type: string
        issuer:
          type: string
        jwksUrl:
          type: string
      required:
        - issuer
        - jwksUrl
      type: object
    EnvVar:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExecutionView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        reason:
          type: string
        runName:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
        - id
        - kind
        - status
        - createdAt
      type: object
    ExternalResourceDTO:
      additionalProperties: false
      properties:
        config:
          items:
            $ref: "#/components/schemas/ConfigKeyDTO"
          type:
            - array
            - "null"
        consumers:
          items:
            $ref: "#/components/schemas/ConsumerDTO"
          type:
            - array
            - "null"
        description:
          type: string
        name:
          type: string
      required:
        - name
        - config
        - consumers
      type: object
    FileContent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/FileContent.json
          format: uri
          readOnly: true
          type: string
        content:
          type: string
        path:
          type: string
        sha:
          type: string
      required:
        - path
        - content
        - sha
      type: object
    FileMeta:
      additionalProperties: false
      properties:
        path:
          type: string
        sha:
          type: string
        size:
          format: int64
          type: integer
      required:
        - path
        - sha
      type: object
    GitProviderProjection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        githubLogin:
          type: string
        identityChangedAt:
          format: date-time
          type: string
        identityEmail:
          type: string
        identityLogin:
          type: string
        identityName:
          type: string
        installationId:
          format: int64
          type: integer
        kind:
          enum:
            - github
          type: string
        lastValidatedAt:
          format: date-time
          type: string
        mode:
          enum:
            - app
            - pat
          type: string
        prevIdentityLogin:
          type: string
        selectedRepos:
          items:
            type: string
          type:
            - array
            - "null"
        status:
          type: string
      required:
        - kind
        - mode
        - status
        - connectedAt
      type: object
    IDPProjection:
      additionalProperties: false
      properties:
        hasClientSecret:
          type: boolean
        issuer:
          type: string
        jwksUrl:
          type: string
        kind:
          enum:
            - platform
            - asgardeo
            - custom
          type: string
        publisherClientId:
          type: string
      required:
        - kind
        - issuer
        - jwksUrl
        - publisherClientId
        - hasClientSecret
