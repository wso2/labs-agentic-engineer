              schema:
                $ref: '#/components/schemas/Error'
          description: Error
      security:
      - userJWT: []
      summary: List a project's issues (live from GitHub), optionally scoped to one spec/build version
        tag by milestone membership. Every row carries the label-derived `executorClass` the console
        sections on — agent work, a dispatch gate, or a bare human ledger issue — plus the finer
