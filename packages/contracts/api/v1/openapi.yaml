components:
  schemas:
    AccessRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/AccessRequest.json
          format: uri
          readOnly: true
          type: string
        consumerComponentName:
          type: string
        consumerProjectId:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        orgServiceName:
          type: string
        providerComponentName:
          type: string
        providerIssueNumber:
          format: int64
          type: integer
        providerIssueUrl:
          type: string
        providerProjectId:
          type: string
        providerTaskId:
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - consumerProjectId
        - consumerComponentName
        - orgServiceName
        - status
        - createdAt
        - updatedAt
      type: object
    ApplyRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ApplyRequest.json
          format: uri
          readOnly: true
          type: string
        deletes:
          items:
            $ref: "#/components/schemas/DeleteOp"
          type:
            - array
            - "null"
        message:
          type: string
        writes:
          items:
            $ref: "#/components/schemas/WriteOp"
          type:
            - array
            - "null"
      type: object
    ApplyResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ApplyResult.json
          format: uri
          readOnly: true
          type: string
        commitSha:
          type: string
        files:
          items:
            $ref: "#/components/schemas/FileMeta"
          type:
            - array
            - "null"
        warnings:
          items:
            $ref: "#/components/schemas/Warning"
          type:
            - array
            - "null"
      required:
        - commitSha
        - files
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
        - log
      type: object
    BuildLogs:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildLogs.json
          format: uri
          readOnly: true
          type: string
        logs:
          items:
            $ref: "#/components/schemas/BuildLogEntry"
          type:
            - array
            - "null"
        totalCount:
          format: int64
          type: integer
      required:
        - logs
      type: object
    BuildRequest:
      additionalProperties: false
      type: object
    BuildResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildResponse.json
          format: uri
          readOnly: true
          type: string
        tag:
          type: string
      required:
        - tag
      type: object
    BuildStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildStatus.json
          format: uri
          readOnly: true
          type: string
        status:
          enum:
            - started
            - in_progress
            - completed
            - failed
          type: string
        tasks:
          items:
            $ref: "#/components/schemas/BuildStatusTask"
          type:
            - array
            - "null"
        workflow_status:
          type: string
      required:
        - status
        - workflow_status
      type: object
    BuildStatusTask:
      additionalProperties: false
      properties:
        status:
          enum:
            - started
            - in_progress
            - completed
            - failed
          type: string
        title:
          type: string
      required:
        - title
        - status
      type: object
    ClientSecretOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ClientSecretOutputBody.json
          format: uri
          readOnly: true
          type: string
        clientSecret:
          type: string
      required:
        - clientSecret
      type: object
    CollabSessionOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollabSessionOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        roomId:
          type: string
        userName:
          type: string
        wsUrl:
          type: string
      required:
        - roomId
        - wsUrl
        - userName
        - email
      type: object
    CollabValidateOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollabValidateOutputBody.json
          format: uri
          readOnly: true
          type: string
        email:
          type: string
        name:
          type: string
        projectName:
          description: The room's project, resolved by the oracle from `spec-<org>-<project>`; the collab service uses it for the seed read (#114).
          type: string
      required:
        - name
        - email
        - projectName
      type: object
    CollectSpecInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollectSpecInputBody.json
          format: uri
          readOnly: true
          type: string
        rawSpec:
          description: Raw OpenAPI 3.x YAML/JSON (paste path)
          type: string
        specUrl:
          description: HTTPS URL to fetch the OpenAPI spec from
          type: string
      type: object
    CollectSpecOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CollectSpecOutputBody.json
          format: uri
          readOnly: true
          type: string
        specPath:
          description: Component-relative path where the spec was stored
          type: string
      required:
        - specPath
      type: object
    Component:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/Component.json
          format: uri
          readOnly: true
          type: string
        autoBuild:
          type: boolean
        autoDeploy:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
        displayName:
          type: string
        endpointUrl:
          description: >-
            Public URL of the running dev deployment. Populated for web
            applications only; absent until deployed.
          type: string
        name:
          type: string
        projectName:
          type: string
        status:
          type: string
        type:
          description: >-
            Component kind in AEP's design vocabulary — "web-application" or
            "service" (matching design.json's componentType). OpenChoreo's
            prefixed ComponentType names (deployment/*) never appear on this
            API.
          type: string
        uid:
          type: string
      required:
        - name
      type: object
    ComponentConfig:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentConfig.json
          format: uri
          readOnly: true
          type: string
        componentName:
          type: string
        createdAt:
          format: date-time
          type: string
        envVars:
          items:
            $ref: "#/components/schemas/EnvVar"
          type:
            - array
            - "null"
        id:
          type: string
        projectName:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - projectName
        - componentName
        - envVars
        - createdAt
        - updatedAt
      type: object
    ComponentList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Component"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    ComponentOpenAPI:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ComponentOpenAPI.json
          format: uri
          readOnly: true
          type: string
        componentName:
          type: string
        componentType:
          type: string
        spec:
          type: string
      required:
        - componentName
        - componentType
        - spec
      type: object
    ConfigKeyDTO:
      additionalProperties: false
      properties:
        credentialClass:
          type: string
        key:
          type: string
        secret:
          type: boolean
      required:
        - key
        - secret
      type: object
    ConfigPatch:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ConfigPatch.json
          format: uri
          readOnly: true
          type: string
        gitProvider:
          additionalProperties: false
          properties:
            githubLogin:
              type: string
            kind:
              enum:
                - github
              type: string
            mode:
              enum:
                - pat
              type: string
            pat:
              type: string
          required:
            - kind
            - mode
            - pat
          type:
            - object
            - "null"
        idp:
          additionalProperties: false
          properties:
            issuer:
              type: string
            jwksUrl:
              type: string
            kind:
              enum:
                - platform
                - asgardeo
                - custom
              type: string
          required:
            - kind
          type:
            - object
            - "null"
        llm:
          additionalProperties: false
          properties:
            apiKey:
              type: string
            kind:
              enum:
                - anthropic
              type: string
          required:
            - kind
            - apiKey
          type:
            - object
            - "null"
      type: object
    ConfigProjection:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ConfigProjection.json
          format: uri
          readOnly: true
          type: string
        gitProvider:
          oneOf:
            - $ref: "#/components/schemas/GitProviderProjection"
            - type: "null"
        idp:
          $ref: "#/components/schemas/IDPProjection"
        llm:
          oneOf:
            - $ref: "#/components/schemas/LLMProjection"
            - type: "null"
      required:
        - llm
        - gitProvider
        - idp
      type: object
    ConsumerDTO:
      additionalProperties: false
      properties:
        componentName:
          type: string
        projectId:
          type: string
      required:
        - projectId
        - componentName
      type: object
    CreateProjectRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CreateProjectRequest.json
          format: uri
          readOnly: true
          type: string
        deploymentPipeline:
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        prompt:
          description: >-
            The user's initial requirement — what they want built. Persisted
            as the project's requirement and kicks off spec derivation for
            the new project (issue #72). Projects created without a prompt
            keep today's behavior.
          type: string
        repoName:
          description: >-
            Repository name for the project's GitHub repo; defaults to the
            project name, the organization is fixed server-side (issue #71).
          type: string
      required:
        - name
      type: object
    CreateSkillInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/CreateSkillInput.json
          format: uri
          readOnly: true
          type: string
        name:
          type: string
        references:
          additionalProperties:
            type: string
          type: object
        skillMd:
          type: string
      required:
        - name
        - skillMd
      type: object
    DeleteOp:
      additionalProperties: false
      properties:
        baseSha:
          type: string
        path:
          type: string
      required:
        - path
      type: object
    DependencyStatus:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DependencyStatus.json
          format: uri
          readOnly: true
          type: string
        outputs:
          items:
            type: string
          type:
            - array
            - "null"
        ready:
          type: boolean
        status:
          type: string
      required:
        - status
        - ready
        - outputs
      type: object
    Deployment:
      additionalProperties: false
      properties:
        componentName:
          type: string
        createdAt:
          type: string
        endpointUrl:
          type: string
        environment:
          type: string
        name:
          type: string
        releaseName:
          type: string
        status:
          type: string
      type: object
    DeploymentList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DeploymentList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Deployment"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    DisconnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DisconnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    DiscoverOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/DiscoverOutputBody.json
          format: uri
          readOnly: true
          type: string
        issuer:
          type: string
        jwksUrl:
          type: string
      required:
        - issuer
        - jwksUrl
      type: object
    EnvVar:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ExecutionView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        endedAt:
          format: date-time
          type: string
        id:
          type: string
        kind:
          type: string
        reason:
          type: string
        runName:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
        - id
        - kind
        - status
        - createdAt
      type: object
    ExternalResourceDTO:
      additionalProperties: false
      properties:
        config:
          items:
            $ref: "#/components/schemas/ConfigKeyDTO"
          type:
            - array
            - "null"
        consumers:
          items:
            $ref: "#/components/schemas/ConsumerDTO"
          type:
            - array
            - "null"
        description:
          type: string
        name:
          type: string
      required:
        - name
        - config
        - consumers
      type: object
    FileContent:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/FileContent.json
          format: uri
          readOnly: true
          type: string
        content:
          type: string
        path:
          type: string
        sha:
          type: string
      required:
        - path
        - content
        - sha
      type: object
    FileMeta:
      additionalProperties: false
      properties:
        path:
          type: string
        sha:
          type: string
        size:
          format: int64
          type: integer
      required:
        - path
        - sha
      type: object
    GitProviderProjection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        githubLogin:
          type: string
        identityChangedAt:
          format: date-time
          type: string
        identityEmail:
          type: string
        identityLogin:
          type: string
        identityName:
          type: string
        installationId:
          format: int64
          type: integer
        kind:
          enum:
            - github
          type: string
        lastValidatedAt:
          format: date-time
          type: string
        mode:
          enum:
            - app
            - pat
          type: string
        prevIdentityLogin:
          type: string
        selectedRepos:
          items:
            type: string
          type:
            - array
            - "null"
        status:
          type: string
      required:
        - kind
        - mode
        - status
        - connectedAt
      type: object
    IDPProjection:
      additionalProperties: false
      properties:
        hasClientSecret:
          type: boolean
        issuer:
          type: string
        jwksUrl:
          type: string
        kind:
          enum:
            - platform
            - asgardeo
            - custom
          type: string
        publisherClientId:
          type: string
      required:
        - kind
        - issuer
        - jwksUrl
        - publisherClientId
        - hasClientSecret
      type: object
    ImportResult:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ImportResult.json
          format: uri
          readOnly: true
          type: string
        compatibility:
          type: string
        kind:
          type: string
        license:
          type: string
        name:
          type: string
        warnings:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - name
        - kind
        - warnings
      type: object
    ImportSkillUrlInput:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ImportSkillUrlInput.json
          format: uri
          readOnly: true
          type: string
        url:
          description: Direct file URL — a raw SKILL.md or a gzip-compressed AgentSkills tarball. Fetched server-side.
          format: uri
          type: string
      required:
        - url
      type: object
    LLMProjection:
      additionalProperties: false
      properties:
        connectedAt:
          format: date-time
          type: string
        keyLast4:
          type: string
        keyPrefix:
          type: string
        kind:
          enum:
            - anthropic
          type: string
        lastValidatedAt:
          format: date-time
          type: string
        status:
          type: string
        validationError:
          type: string
      required:
        - kind
        - keyPrefix
        - keyLast4
        - status
        - connectedAt
      type: object
    Lineage:
      additionalProperties: false
      properties:
        designTag:
          type: string
        specTag:
          type: string
      type: object
    OrganizationList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/OrganizationList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/OrganizationView"
          type:
            - array
            - "null"
      required:
        - items
      type: object
    OrganizationView:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        status:
          type: string
        uuid:
          type: string
      required:
        - uuid
        - name
        - createdAt
      type: object
    ProgressEvent:
      additionalProperties: false
      properties:
        branch:
          type: string
        command:
          type: string
        completedAt:
          type: string
        error:
          type: string
        files:
          format: int64
          type: integer
        kind:
          type: string
        level:
          type: string
        message:
          type: string
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        seq:
          format: int64
          type: integer
        sha:
          type: string
        startedAt:
          type: string
        status:
          type: string
        step:
          type: string
        summary:
          type: string
        tool:
          type: string
        ts:
          type: string
      required:
        - schemaVersion
        - ts
        - seq
        - kind
      type: object
    ProgressResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ProgressResponse.json
          format: uri
          readOnly: true
          type: string
        cursorMillis:
          format: int64
          type: integer
        final:
          type: boolean
        lines:
          items:
            $ref: "#/components/schemas/ProgressEvent"
          type:
            - array
            - "null"
        phase:
          type: string
        schemaVersion:
          format: int64
          type: integer
        truncated:
          type: boolean
      required:
        - schemaVersion
        - lines
        - cursorMillis
        - final
      type: object
    Project:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/Project.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          type: string
        deploymentPipeline:
          type: string
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        namespaceName:
          type: string
        repoUrl:
          description: Clone URL of the project's Git repository; absent when no repo is provisioned (issue #108).
          type: string
        status:
          type: string
        uid:
          type: string
      required:
        - name
      type: object
    ProjectList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ProjectList.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/Project"
          type:
            - array
            - "null"
        nextCursor:
          description: Cursor for the next page; absent on the last page.
          type: string
      required:
        - items
      type: object
    ProjectStatus:
      additionalProperties: false
      description: Computed SDLC phase and artifact states.
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ProjectStatus.json
          format: uri
          readOnly: true
          type: string
        designStatus:
          description: '"", draft, approved'
          type: string
        hasDesign:
          type: boolean
        hasSpec:
          type: boolean
        hasTasks:
          type: boolean
        phase:
          description: no-repo, repo-cloning, repo-error, prompt, spec, architecture, tasks, components
          type: string
        repoErrorMessage:
          description: Set when phase is repo-error.
          type: string
        repoStatus:
