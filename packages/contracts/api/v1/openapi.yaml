      - projectName
      type: object
    Component:
      additionalProperties: false
      properties:
        autoBuild:
          type: boolean
        autoDeploy:
          type: boolean
        createdAt:
          type: string
        description:
          type: string
        displayName:
          type: string
        endpointUrl:
