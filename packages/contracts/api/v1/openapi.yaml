  /projects/{projectName}/tasks/{issueNumber}/log:
    get:
      operationId: stream-task-log
      parameters:
        - description: Project name (DNS-label slug)
          in: path
          name: projectName
          required: true
          schema:
            description: Project name (DNS-label slug)
            type: string
        - description: GitHub issue number of the Task
          in: path
          name: issueNumber
          required: true
          schema:
            description: GitHub issue number of the Task
            format: int64
            type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/TaskStreamEvent"
          description: >-
            SSE stream of the Task's entire live state — status, executions, and
            a unified timeline across all attempts. One `data:` JSON frame per
            event (a TaskStreamEvent discriminated by `type`: task | execution |
            line | done), each stamped `id: <seq>`; `: keep-alive` comments pace
            idle waits. A settled Task streams its full history then ends with
            `data: [DONE]` and the server closes the connection. Reconnects are
            idempotent: the client upserts task/execution by id and dedups lines,
            so state re-emitted on reconnect is safe. There are deliberately no
            server-side filters (executionId/kind) — every line carries its own
            attribution and the console groups by attempt client-side.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - userJWT: []
      summary: Stream a Task's live state (status + executions + unified timeline) as SSE
      tags:
        - Tasks
