          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/ConfigPatch.json
          format: uri
          readOnly: true
          type: string
        gitProvider:
          additionalProperties: false
          properties:
            githubLogin:
              type: string
            kind:
              enum:
                - github
              type: string
            mode:
              enum:
                - pat
              type: string
            pat:
              type: string
          required:
            - kind
            - mode
            - pat
          type:
            - object
            - "null"
        idp:
          additionalProperties: false
          properties:
            issuer:
              type: string
            jwksUrl:
              type: string
            kind:
              enum:
                - platform
                - asgardeo
                - custom
              type: string
          required:
            - kind
          type:
            - object
            - "null"
        llm:
          additionalProperties: false
          properties:
            apiKey:
              type: string
            kind:
              enum:
                - anthropic
              type: string
          required:
            - kind
            - apiKey
          type:
            - object
            - "null"
      type: object
    ConfigProjection:
      additionalProperties: false
