          type: string
          x-go-type: string
        validation:
          description: >-
            Validation state of the newest milestone run. This MIRRORS the run's
            verdict rather than folding it, so the chip says what the run
            concluded: a fold would have to discard `partial`, `inconclusive` and
            `unreported` at exactly the surface that needs them, and `completed`
            never said whether anything passed.

            Four LIFECYCLE values. none is PENDING, never settled: a verdict is
            expected and has not arrived, because a run is live or a dev run filed
            the version's validation task and nothing has started it yet. A client
            must not read it as "there is no verdict to wait for" — that is what
            skipped and inconclusive say. running is a validation CYCLE in flight,
            not merely a live run with no verdict yet. awaiting-fix is validation
            having failed with the run repairing it — the work in flight is a CODING
            cycle, which is why the state names the implementation rather than
            validation. cancelled is a person STOPPING the judging: a validation run
            settled cancelled before recording a verdict, so nothing will answer for
            this version unless somebody re-asks. The rest are the verdict verbatim.
            They are mutually exclusive in time, so nothing is hidden behind another.

            passed (every criterion was automated and passed), partial (some
            passed, none failed, some were never covered), failed (a criterion
            asserted and lost), inconclusive (no test results at all), unreported
            (no usable report at the validation cycle's merge commit), skipped (no
            validation criteria, and incident runs, which get no validation cycle).

            failed and unreported fail the run only once its validation attempts
            are spent: while attempts remain the run repairs and re-validates, and
            reads awaiting-fix in the meantime.

            The report path and per-cycle detail live on the version's run story
            (list-build-runs).
          enum:
          - none
          - running
          - awaiting-fix
          - cancelled
          - passed
          - partial
          - failed
          - inconclusive
          - unreported
          - skipped
          type: string
