          description: >-
            Validation state of the newest milestone run. This MIRRORS the run's
            verdict rather than folding it, so the chip says what the run
            concluded: a fold would have to discard `partial`, `inconclusive` and
            `unreported` at exactly the surface that needs them, and `completed`
            never said whether anything passed.

            Three LIFECYCLE values: none (the run has not reached validation),
            running (a validation CYCLE is in flight — not merely a live run with
            no verdict yet) and awaiting-fix (validation failed and the run is
            repairing it — the work in flight is a CODING cycle, which is why the
            state names the implementation rather than validation). The rest are
            the verdict verbatim. They are mutually exclusive in time, so nothing
            is hidden behind another.

            passed (every criterion was automated and passed), partial (some
            passed, none failed, some were never covered), failed (a criterion
            asserted and lost), inconclusive (no test results at all), unreported
            (no usable report at the validation cycle's merge commit), skipped (no
            acceptance criteria, and incident runs, which get no validation cycle).

            failed and unreported fail the run only once its validation attempts
            are spent: while attempts remain the run repairs and re-validates, and
            reads awaiting-fix in the meantime.

            The report path and per-cycle detail live on the version's run story
            (list-build-runs).
          enum:
