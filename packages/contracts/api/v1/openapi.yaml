          type: string
        status:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string
      required:
        - id
        - title
        - url
      type: object
    BuildLogEntry:
      additionalProperties: false
      properties:
        level:
          type: string
        log:
          type: string
        timestamp:
          type: string
      required:
        - log
      type: object
    BuildLogs:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /api/v1/BuildLogs.json
          format: uri
          readOnly: true
          type: string
        logs:
          items:
            $ref: "#/components/schemas/BuildLogEntry"
          type:
            - array
            - "null"
        totalCount:
          format: int64
          type: integer
      required:
        - logs
      type: object
    CallerIdentity:
      additionalProperties: false
