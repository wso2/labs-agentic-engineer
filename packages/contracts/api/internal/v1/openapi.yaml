openapi: 3.0.3
info:
  title: AEP Internal S2S API
  description: |-
    aep-api's internal service-to-service surface. Its audience is machines,
    never the console: non-public, never gateway-advertised. Every operation's
    tags name its caller (Runner, AE Studio, SRE), so the spec reads as who
    calls what. Callers authenticate with a Thunder per-org publisher
    client-credentials token, a BFF-signed per-task RS256 JWT, or (sre/ ops
    only) the static per-org SRE handoff bearer; the acting org is always
    derived from the verified credential, never from request input.

    Requests are validated against this spec and body-capped per operation
    (1 MiB by default) before any handler runs.

    RUNNER LOCKSTEP: the credentials-refresh exchange is consumed by the
    coding runner — its request/response bytes must not change without a
    coordinated runner release.
  version: 1.0.0
servers:
- url: /internal/v1
paths:
  /executions/{executionId}/credentials/refresh:
    post:
      operationId: runner-refresh-credentials
      summary: Refresh an execution's git credentials (runner callback)
      tags:
      - Runner
      security:
      - taskJWT: []
      - publisherCC: []
      parameters:
      - description: Execution id the runner callback is scoped to
        in: path
        name: executionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /validation/{cycleId}/context:
    get:
      operationId: runner-validation-context
      summary: Fetch a validation run's deployed endpoints (runner callback)
      tags:
      - Runner
      security:
      - taskJWT: []
      - publisherCC: []
      parameters:
      - description: Validation cycle id the runner callback is scoped to — the
          run cycle the platform dispatched this runner for, carried to the pod as
          AEP_TASK_ID and bound into its bearer token
        in: path
        name: cycleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationContextResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /sre/projects/{projectName}/issues:
    get:
      operationId: sre-list-issues
      summary: List/search GitHub issues on a project's repo (SRE handoff)
      tags:
      - SRE
      security:
      - sreHandoff: []
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          type: string
      - description: Comma-separated GitHub labels to filter by
        in: query
        name: labels
        schema:
          type: string
      - description: Keyword search over issue title/body, ranked by distinct-term
          overlap (title weighted double), capped at 25. Recall-biased — used to
          surface related issues before filing a new one.
        in: query
        name: q
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IssueInfo'
                type: array
                nullable: true
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      operationId: sre-create-issue
      summary: Create a GitHub issue on a project's repo (SRE handoff)
      tags:
      - SRE
      security:
      - sreHandoff: []
      parameters:
      - description: Project name (DNS-label slug)
        in: path
        name: projectName
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResult'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /sre/rca-reports:
    post:
      operationId: sre-create-rca-report
      summary: Record a new RCA-agent alert report (SRE handoff)
      tags:
      - SRE
      security:
      - sreHandoff: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRcaAgentReportRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RcaAgentReport'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /mcp:
    post:
      operationId: call-mcp-tool
      summary: MCP JSON-RPC (tools/list, tools/call)
      description: |-
        One opaque JSON-RPC 2.0 operation; mcpdiscovery serves it. Declared so
        this spec lists every internal route. Excluded from code generation
        (internal/igen/oapi-codegen.yaml exclude-operation-ids): the handler is a
        raw JSON-RPC handler, not a strict-server method.
      tags:
      - Runner
      - AE Studio
      security:
      - publisherCC: []
      - taskJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    RefreshResponse:
      description: Fresh GitHub token + commit identity for the execution.
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/Identity'
        taskId:
          type: string
      required:
      - token
      - expiresAt
      - identity
      - taskId
      # Generated as igen.RefreshResponse (no x-go-type). The org domain owns the
      # RefreshResponse value type and projects onto this wire shape at the edge —
      # igen must stay a leaf, so it cannot import the domain that owns the type.
      # This schema IS the runner-lockstep wire contract; keep it field-aligned
      # with the domain's mapping.
    Identity:
      description: 'Git commit identity. Field names are CAPITALIZED on the
        wire (historical lockstep — changing them needs a coordinated runner
        release). KNOWN GAP: the runner''s credhelper currently reads
        lowercase keys, so its identity-drift rewrite never fires; fix belongs
        runner-side (case-tolerant parse), not here.'
      type: object
      additionalProperties: false
      properties:
        Name:
          type: string
        Email:
          type: string
        Login:
          type: string
      required:
      - Name
      - Email
      - Login
    ValidationContextResponse:
      description: The deployed endpoints a validation run drives. Generated as
        igen.ValidationContextResponse (no x-go-type) — igen must stay a leaf,
        so the edge's internal handler projects the delivery domain's own struct
        onto this wire shape (the same decoupling as RefreshResponse).

        It carries no oracle path; the runner already knows where the oracle is.
      type: object
      additionalProperties: false
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ComponentEndpoint'
      required:
      - endpoints
    ComponentEndpoint:
      type: object
      additionalProperties: false
      properties:
        component:
          type: string
        url:
          type: string
      required:
      - component
      - url
    # The sre/ ops' schemas below are copied VERBATIM from the public spec
    # (packages/contracts/api/v1), one spec per audience. Edit both sides
    # together: TestInternalSpec_SharedSchemasMatchPublic fails on drift.
    # CreateRcaAgentReportRequest lives only here (its op moved off /api/v1).
    CreateIssueRequest:
      additionalProperties: false
      description: Issue to file on the project's repo. dedupeKey makes creation
        idempotent per open issue (label-encoded), for concurrent alert handlers.
        componentName and actionStatuses carry the SRE incident handoff context;
        they do not declare issue-create outcomes.
      properties:
        actionStatuses:
          description: Ordered per-action statuses from the incident handoff. A null
            entry is meaningful and preserves the action's position when it has no status.
          items:
            type: string
            nullable: true
          type: array
          nullable: true
        title:
          type: string
        body:
          type: string
        componentName:
          description: Component affected by the incident.
          type: string
        labels:
          items:
            type: string
          type: array
          nullable: true
        dedupeKey:
          type: string
      required:
      - title
      - body
      type: object
    CreateRcaAgentReportRequest:
      additionalProperties: false
      description: Write-side request for a new RCA-agent alert report (issue
      properties:
        classification:
          description: code-level, config-level, mixed, or none — set by the handoff agent
          type: string
        component:
          type: string
        deployed:
          type: boolean
        deployedAt:
          type: string
          format: date-time
          nullable: true
          x-go-type: '*time.Time'
        diagnosis:
          description: Full RCA diagnosis + remediation content (markdown)
          type: string
        dispatched:
          type: boolean
        issueExcerpt:
          type: string
        issueNumber:
          format: int64
          type: integer
          nullable: true
          x-go-type: '*int64'
        issueTitle:
          type: string
        issueUrl:
          type: string
        project:
          type: string
        summary:
          type: string
        title:
          type: string
      required:
      - project
      - title
      - summary
      - classification
      - diagnosis
      type: object
    IssueInfo:
      additionalProperties: false
      description: 'One issue from list/search. Field names are CAPITALIZED on
        the wire (historical shape the deployed aep-mcp-server parses — do not
        "fix" without a coordinated MCP-server release).'
      properties:
        Number:
          format: int64
          type: integer
        Title:
          type: string
        Body:
          type: string
        URL:
          type: string
        State:
          type: string
        Labels:
          items:
            type: string
          type: array
          nullable: true
        StateReason:
          description: Provider-supplied reason for the issue state, when available.
          type: string
          nullable: true
        attentionReason:
          description: Console attention state. Omitted when the issue needs no attention.
          enum:
          - unverified_fix
          - no_change_verdict
          - escalated
          type: string
      required:
      - Number
      - Title
      - Body
      - URL
      - State
      - Labels
      type: object
    IssueResult:
      additionalProperties: false
      description: Server-derived issue-create outcome. deduped=true means an open
        issue with the same dedupeKey already existed — number/url refer to it.
        Callers never supply classification, suppression, reopening, adoption, or
        recurrence outcomes.
      properties:
        adoptionError:
          description: Server-derived reason adoption did not complete, when present.
          type: string
          nullable: true
        adopted:
          description: True when the server adopted the incident into an existing issue.
          type: boolean
        classification:
          description: Server-derived incident classification.
          type: string
        number:
          format: int64
          type: integer
        url:
          type: string
        nodeId:
          type: string
        deduped:
          type: boolean
        reopened:
          description: True when the server reopened a matching closed issue.
          type: boolean
        recurrenceCount:
          description: Server-derived count of recorded recurrences for this incident.
          format: int64
          type: integer
        suppressed:
          description: True when the server suppressed creation for this incident.
          type: boolean
      required:
      - number
      - url
      - nodeId
      type: object
    RcaAgentReport:
      additionalProperties: false
      description: An RCA report from the OpenChoreo SRE/RCA-agent handoff (console issues
      properties:
        classification:
          description: code-level, config-level, mixed, or none — set by the handoff agent
          type: string
        component:
          type: string
        createdAt:
          type: string
          format: date-time
        deployed:
          description: Whether the resulting fix has been deployed (Verify Fix threshold, not merely PR-merged)
          type: boolean
        deployedAt:
          type: string
          format: date-time
          x-go-type: '*time.Time'
        diagnosis:
          description: Full RCA diagnosis + remediation content (markdown)
          type: string
        dispatched:
          description: Whether the coding agent has been dispatched for the linked issue (false in issue-only/manual-dispatch
            mode until a human dispatches)
          type: boolean
        id:
          type: string
        issueExcerpt:
          description: Short excerpt of the linked GitHub issue; absent when no issue was created
          type: string
        issueNumber:
          description: GitHub issue number created by the handoff; also the Task key (see /projects/{projectName}/tasks/{issueNumber});
            absent when the handoff was config-only
          format: int64
          type: integer
          x-go-type: '*int64'
        issueTitle:
          type: string
        issueUrl:
          type: string
        project:
          type: string
        summary:
          description: Short RCA summary; the console truncates this further for list rows
          type: string
        title:
          type: string
      required:
      - id
      - project
      - createdAt
      - title
      - summary
      - classification
      - diagnosis
      - dispatched
      - deployed
      type: object
    Error:
      description: Flat error envelope returned by every non-2xx response.
      type: object
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code (stable slug).
          type: string
        message:
          description: Human-readable error message.
          type: string
        details:
          description: Field-level details for validation errors.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
  securitySchemes:
    taskJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BFF-signed per-task RS256 JWT (runner pods)
    publisherCC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Thunder per-org publisher client-credentials token
    sreHandoff:
      type: http
      scheme: bearer
      description: Static per-org SRE handoff bearer (SRE_HANDOFF_TOKEN), aep-mcp-server
