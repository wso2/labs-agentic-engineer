openapi: 3.0.3
info:
  title: AEP Internal S2S API
  description: |-
    The BFF's internal service-to-service surface: runner-pod callbacks.
    Non-public — never gateway-advertised. Callers authenticate with a
    BFF-signed per-task RS256 JWT (runner pods) or a Thunder per-org publisher
    client-credentials token; the acting org is always derived from the
    verified credential, never from request input.

    RUNNER LOCKSTEP: the credentials-refresh exchange is consumed by the
    coding runner — its request/response bytes must not change without a
    coordinated runner release.
  version: 1.0.0
servers:
- url: /internal/v1
paths:
  /executions/{executionId}/credentials/refresh:
    post:
      operationId: runner-refresh-credentials
      summary: Refresh an execution's git credentials (runner callback)
      tags:
      - Internal
      security:
      - taskJWT: []
      - publisherCC: []
      parameters:
      - description: Execution id the runner callback is scoped to
        in: path
        name: executionId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /validation/{cycleId}/context:
    get:
      operationId: runner-validation-context
      summary: Fetch a validation run's deployed endpoints (runner callback)
      tags:
      - Internal
      security:
      - taskJWT: []
      - publisherCC: []
      parameters:
      - description: Validation cycle id the runner callback is scoped to — the
          run cycle the platform dispatched this runner for, carried to the pod as
          AEP_TASK_ID and bound into its bearer token
        in: path
        name: cycleId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationContextResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
components:
  schemas:
    RefreshResponse:
      description: Fresh GitHub token + commit identity for the execution.
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        identity:
          $ref: '#/components/schemas/Identity'
        taskId:
          type: string
      required:
      - token
      - expiresAt
      - identity
      - taskId
      # Generated as igen.RefreshResponse (no x-go-type). The org domain owns the
      # RefreshResponse value type and projects onto this wire shape at the edge —
      # igen must stay a leaf, so it cannot import the domain that owns the type.
      # This schema IS the runner-lockstep wire contract; keep it field-aligned
      # with the domain's mapping.
    Identity:
      description: 'Git commit identity. Field names are CAPITALIZED on the
        wire (historical lockstep — changing them needs a coordinated runner
        release). KNOWN GAP: the runner''s credhelper currently reads
        lowercase keys, so its identity-drift rewrite never fires; fix belongs
        runner-side (case-tolerant parse), not here.'
      type: object
      additionalProperties: false
      properties:
        Name:
          type: string
        Email:
          type: string
        Login:
          type: string
      required:
      - Name
      - Email
      - Login
    ValidationContextResponse:
      description: Deployed endpoints + criteria path for a validation run.
        Generated as igen.ValidationContextResponse (no x-go-type) — igen must
        stay a leaf, so the edge's internal handler projects the delivery
        domain's own struct onto this wire shape (the same decoupling as
        RefreshResponse).
      type: object
      additionalProperties: false
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/ComponentEndpoint'
        criteriaPath:
          type: string
      required:
      - endpoints
      - criteriaPath
    ComponentEndpoint:
      type: object
      additionalProperties: false
      properties:
        component:
          type: string
        url:
          type: string
      required:
      - component
      - url
    Error:
      description: Flat error envelope returned by every non-2xx response.
      type: object
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code (stable slug).
          type: string
        message:
          description: Human-readable error message.
          type: string
        details:
          description: Field-level details for validation errors.
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - message
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
  securitySchemes:
    taskJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: BFF-signed per-task RS256 JWT (runner pods)
    publisherCC:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Thunder per-org publisher client-credentials token
