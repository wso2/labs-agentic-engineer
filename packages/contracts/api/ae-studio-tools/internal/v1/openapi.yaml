openapi: 3.0.3
info:
  title: ae-studio-tools internal API
  description: |-
    Machine API of an org's AE Studio. Caller: aep-api only, with the AE-only
    M2M token (client_credentials, aud and client_id = the pinned client, no
    org claim) and X-Impersonate-Org naming the pod's org. When the IdP's keys
    cannot be fetched the answer is 503 idp_unavailable with Retry-After (no
    verdict on the token).

    Every request body is capped (1 MiB; 4 MiB for start-repo-turn, 16 MiB
    for create-commit, 80 MiB for put-repo-references), then the caller is
    authenticated, then the request is validated against this spec, before
    any handler runs. A multipart body is the exception: its handler reads and
    checks the parts itself.

    Every /repos/{owner}/{repo}/... operation answers 403 owner_not_allowed,
    once the request is validated and before the operation runs, when owner
    is not the org's connected GitHub account (compared case-insensitively).
    Errors are RFC 9457 problems (application/problem+json).
  version: 1.0.0
servers:
- url: /internal/v1
tags:
- name: GitHub
  description: The org's GitHub identity, as the gitpat sees it.
- name: Turns
  description: Turns aep-api starts in the studio (kickoff and plan).
- name: Repos
  description: Per-repository data the studio keeps outside git.
- name: Git
  description: The repository's git content, read from and written through the
    studio's mirror. No path allow-list.
security:
- aeOnly: []
paths:
  /github/identity:
    get:
      operationId: get-github-identity
      summary: The GitHub user the org's gitpat belongs to
      tags:
      - GitHub
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      responses:
        '200':
          description: The gitpat's user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIdentity'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/turns:
    post:
      operationId: start-repo-turn
      summary: Start (or reattach to) a kickoff or plan turn and stream its result
      description: |-
        Forwarded to the design agent over the Turn socket. The answer is
        `application/x-ndjson`, one JSON object per line: zero or more
        TaskOpFrame, KeepAliveFrame every 15 s, then one ResultFrame. The turn
        keeps running when the caller goes away, and a retry with the same turnId
        reattaches. The gateway route allows 35 minutes.
      tags:
      - Turns
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: The turn's NDJSON stream (frames TaskOpFrame, KeepAliveFrame,
            ResultFrame)
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: 'The project is not one of this repository''s (problem code:
            project_unknown).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A different turn runs for the project (TurnInProgress), or
            the studio has no default model key (problem code no_default_key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnInProgress'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 'The body is over 4 MiB, the design agent''s own cap (problem
            code: payload_too_large).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/references:
    put:
      operationId: put-repo-references
      summary: Replace a project's stored reference documents
      description: |-
        The whole stored set is replaced by the sent files. At most 10 files, each
        at most 5 MiB, 80 MiB in total. Each file is stored under its file name
        reduced to a bare, lower-case name; two files that reduce to the same
        name, a type the models cannot read, or no file at all is refused. The
        owner must be the org's connected GitHub account, else 403
        owner_not_allowed and nothing is stored.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              files:
                contentType: application/octet-stream
            schema:
              $ref: '#/components/schemas/ReferenceUpload'
      responses:
        '204':
          description: Stored
        '400':
          description: 'A file was refused (problem code: reference_rejected).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: 'The gate refused the caller, or the owner is not the org''s
            connected GitHub account (problem code: owner_not_allowed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '503':
          description: 'Not serving right now (problem codes: disk_full, idp_unavailable).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /repos/{owner}/{repo}/head:
    get:
      operationId: get-head
      summary: Resolve a ref to its commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The commit `at` names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Head'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/tree:
    get:
      operationId: list-tree
      summary: List every file of a commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/Prefix'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The files of the commit (blobs, recursive), under prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/files/{path}:
    get:
      operationId: read-file
      summary: Read one file of a commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - name: path
        in: path
        required: true
        description: Repo-relative file path. A trailing wildcard, it may span
          several segments (contain slashes) and is served by a catch-all. No
          allow-list, any file of the repository.
        schema:
          type: string
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The file at the commit `at` names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/bundle:
    get:
      operationId: read-bundle
      summary: Read a set of files of one commit
      description: |-
        With `path`, exactly the named files (a missing one is left out);
        otherwise every file under `prefix` whose name ends in one of `ext`
        (any, when `ext` is not given).
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/Prefix'
      - name: ext
        in: query
        required: false
        description: File-name endings to keep (e.g. `.json`), repeated.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: ^\.[A-Za-z0-9._-]{1,32}$
      - name: path
        in: query
        required: false
        description: Exact repo-relative paths to read, repeated. Overrides
          prefix and ext.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The files read, at one commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/tags:
    get:
      operationId: list-tags
      summary: List the repository's tags
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Prefix'
      - name: local
        in: query
        required: false
        description: List the tags the studio's mirror already holds, without
          fetching from GitHub (every tag the studio cuts is there).
        schema:
          type: boolean
      responses:
        '200':
          description: The tags whose name starts with prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: create-tag
      summary: Cut an annotated tag and push it
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/DefaultBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tagged and pushed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '409':
          description: 'The tag name is taken (problem code: tag_exists).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/commits:
    post:
      operationId: create-commit
      summary: Commit writes and deletes to the default branch
      description: |-
        One commit of the writes then the deletes, each pinned to the blob it
        expects (`baseSha`), pushed to the default branch under a lease. Every
        precondition is checked against the tip the commit builds on; one
        failure answers 409 conflict and nothing is applied. The engine's
        commit only: no scaffolding, soft validation or completions, so
        `warnings` is empty. The body is capped at 16 MiB.
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/DefaultBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitRequest'
      responses:
        '200':
          description: Committed (changed false when the content equals the tip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '409':
          description: 'A baseSha no longer holds (problem code: conflict, with
            conflicts), or the branch kept moving through every retry (problem
            code: not_fast_forward).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CommitConflict'
        '413':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    aeOnly:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImpersonateOrg:
      name: X-Impersonate-Org
      in: header
      required: true
      description: The org the call acts for; must be the pod's org id.
      schema:
        type: string
    Owner:
      name: owner
      in: path
      required: true
      description: GitHub owner of the repository (one path segment, the
        store's rule)
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,200}$
    Repo:
      name: repo
      in: path
      required: true
      description: GitHub repository name (one path segment, the store's rule)
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,200}$
    At:
      name: at
      in: query
      required: false
      description: The commit to read. Omitted, the default-branch tip (fetched
        from GitHub first); `tags/<name>`, the commit the tag points at; a
        40-hex sha, that commit (read locally, fetched only when missing).
      schema:
        type: string
        pattern: ^(tags/[A-Za-z0-9._/-]{1,200}|[0-9a-f]{40})$
    Local:
      name: local
      in: query
      required: false
      description: Read the default-branch tip the studio's mirror already
        holds, without fetching from GitHub (every commit the studio writes is
        there; a push made elsewhere shows after the next fetching call). Only
        with `at` omitted, else 400.
      schema:
        type: boolean
    Prefix:
      name: prefix
      in: query
      required: false
      description: Only paths (tag names, for list-tags) starting with this.
      schema:
        type: string
        maxLength: 1024
    DefaultBranch:
      name: defaultBranch
      in: query
      required: false
      description: The repository's default branch, as aep-api's row names it
        (the branch the Room reads for the same repository). Omitted, main.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._/-]{1,255}$
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: GitHub rate-limited the gitpat; retry after the given delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitNotFound:
      description: 'The ref or the file does not exist (problem codes:
        ref_not_found, path_not_found).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitHubError:
      description: 'GitHub refused or failed a git clone, fetch or push (problem
        code: github_error; githubStatus is GitHub''s HTTP status when git
        reported one).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    GitHubIdentity:
      type: object
      required:
      - login
      - id
      properties:
        login:
          type: string
        id:
          type: integer
          format: int64
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        githubStatus:
          type: integer
          description: With code github_error, GitHub's HTTP status, when it
            answered one.
    Head:
      type: object
      required:
      - sha
      properties:
        sha:
          type: string
          description: The commit's 40-hex sha
    Tree:
      type: object
      required:
      - commitSha
      - entries
      properties:
        commitSha:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
    TreeEntry:
      type: object
      required:
      - path
      - sha
      - size
      properties:
        path:
          type: string
        sha:
          type: string
          description: The blob's sha
        size:
          type: integer
          format: int64
    FileContent:
      type: object
      required:
      - commitSha
      - path
      - sha
      - content
      properties:
        commitSha:
          type: string
        path:
          type: string
        sha:
          type: string
          description: The blob's sha (the next write's baseSha)
        content:
          type: string
          format: byte
    Bundle:
      type: object
      required:
      - commitSha
      - files
      properties:
        commitSha:
          type: string
        files:
          type: object
          description: path → content
          additionalProperties:
            type: string
    TagList:
      type: object
      required:
      - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    Tag:
      type: object
      required:
      - name
      - commitHash
      properties:
        name:
          type: string
        commitHash:
          type: string
          description: The commit the tag points at (annotated tags peeled)
        message:
          type: string
          description: The annotated tag's subject; absent for a lightweight tag
        createdAt:
          type: string
          format: date-time
          description: When the tag was made (the commit's date for a
            lightweight tag); absent when git could not date it
          x-go-type-skip-optional-pointer: false
    CreateTagRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - message
      properties:
        name:
          type: string
          description: The tag name, a valid git ref name
          pattern: ^[A-Za-z0-9._/-]{1,200}$
        target:
          type: string
          description: The commit to tag, as `at` names one; omitted, the
            default-branch tip
          pattern: ^(tags/[A-Za-z0-9._/-]{1,200}|[0-9a-f]{40})$
        message:
          type: string
          minLength: 1
        tagger:
          $ref: '#/components/schemas/GitIdentity'
      description: tagger omitted, the AEP default identity.
    TagCreated:
      type: object
      additionalProperties: false
    GitIdentity:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
    CreateCommitRequest:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        writes:
          type: array
          items:
            $ref: '#/components/schemas/CommitWrite'
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/CommitDelete'
        message:
          type: string
          minLength: 1
        author:
          $ref: '#/components/schemas/GitIdentity'
        committer:
          $ref: '#/components/schemas/GitIdentity'
      description: At least one write or delete, no path twice. author omitted,
        the gitpat's user; committer omitted, the author.
    CommitWrite:
      type: object
      additionalProperties: false
      required:
      - path
      - content
      - baseSha
      properties:
        path:
          type: string
          minLength: 1
        content:
          type: string
          format: byte
        baseSha:
          type: string
          description: The blob sha the path must have at the tip; empty, the
            path must not exist
          pattern: ^([0-9a-f]{40})?$
    CommitDelete:
      type: object
      additionalProperties: false
      required:
      - path
      - baseSha
      properties:
        path:
          type: string
          minLength: 1
        baseSha:
          type: string
          description: The blob sha the path must have at the tip; empty,
            whatever is there (it must exist)
          pattern: ^([0-9a-f]{40})?$
    CommitResult:
      type: object
      required:
      - commitSha
      - changed
      - files
      - warnings
      properties:
        commitSha:
          type: string
        changed:
          type: boolean
        files:
          type: array
          description: Each written file and its new blob sha, in request order
          items:
            $ref: '#/components/schemas/CommitFile'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CommitWarning'
    CommitFile:
      type: object
      required:
      - path
      - sha
      properties:
        path:
          type: string
        sha:
          type: string
    CommitWarning:
      type: object
      required:
      - path
      - code
      - message
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    CommitConflict:
      type: object
      description: A problem; with code conflict, conflicts names every failed
        baseSha.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Conflict:
      type: object
      required:
      - path
      - baseSha
      - currentSha
      properties:
        path:
          type: string
        baseSha:
          type: string
        currentSha:
          type: string
          description: The blob sha at the tip; empty when the path is absent
    TurnRequest:
      type: object
      additionalProperties: false
      description: Starts one turn that is not a browser chat turn, a kickoff
        (`start`) or a plan. Idempotent on turnId, a retry reattaches to the
        running turn. A different turnId while a turn runs is 409.
      required:
      - turnId
      - project
      - kind
      - credit
      properties:
        turnId:
          type: string
          format: uuid
        project:
          type: string
          description: Project name (DNS-label slug)
        kind:
          type: string
          enum:
          - start
          - plan
        credit:
          $ref: '#/components/schemas/TurnCredit'
        scope:
          $ref: '#/components/schemas/PlanScope'
        taskContext:
          type: array
          description: The existing-Task renders of a plan turn. Platform state,
            not repository files.
          items:
            $ref: '#/components/schemas/PlanContextFile'
        text:
          type: string
          description: The free text of the turn (the project idea of a start turn).
    TurnCredit:
      type: object
      additionalProperties: false
      description: Who the turn's commits and records are credited to.
      required:
      - userId
      - name
      - email
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
    PlanScope:
      type: object
      additionalProperties: false
      description: The milestone a plan turn covers and which of its stories
        already have Tasks.
      required:
      - tag
      - stories
      properties:
        tag:
          type: string
        stories:
          type: array
          items:
            $ref: '#/components/schemas/PlanStory'
    PlanStory:
      type: object
      additionalProperties: false
      required:
      - number
      - covered
      properties:
        number:
          type: integer
        title:
          type: string
        covered:
          type: boolean
          description: The story already has Tasks, the planner leaves it alone.
    PlanContextFile:
      type: object
      additionalProperties: false
      description: One existing-Task render under its tasks/<n>.md name.
      required:
      - path
      - body
      properties:
        path:
          type: string
        body:
          type: string
    TurnInProgress:
      type: object
      additionalProperties: false
      description: 409 body, a different turn already runs for the project.
      required:
      - code
      - activeTurnId
      properties:
        code:
          type: string
          enum:
          - turn_in_progress
        activeTurnId:
          type: string
          format: uuid
    TaskOpFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, a Task operation the agent produced.
      required:
      - type
      - op
      - output
      properties:
        type:
          type: string
          enum:
          - task-op
        op:
          type: string
          enum:
          - plan
          - update
        output:
          type: object
          additionalProperties: true
          description: The operation's payload, as the plan or update tool emitted it.
    KeepAliveFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, sent every 15 s.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - keep-alive
    ResultFrame:
      type: object
      additionalProperties: false
      description: The last line of the turn stream. A shutdown ends a running turn
        with status failed and code shutdown.
      required:
      - type
      - status
      properties:
        type:
          type: string
          enum:
          - result
        status:
          type: string
          enum:
          - completed
          - failed
        code:
          type: string
        message:
          type: string
        resetAt:
          type: string
          format: date-time
          description: With code provider_limit, when the model provider said its
            limit resets, if it said.
    ReferenceUpload:
      type: object
      additionalProperties: false
      required:
      - files
      properties:
        files:
          type: array
          maxItems: 10
          description: The reference documents, at most 5 MiB each.
          items:
            type: string
            format: binary
