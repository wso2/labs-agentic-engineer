openapi: 3.0.3
info:
  title: ae-studio-tools internal API
  description: |-
    Machine API of an org's AE Studio. Caller: aep-api only, with the AE-only
    M2M token (client_credentials, aud and client_id = the pinned client, no
    org claim) and X-Impersonate-Org naming the pod's org. When the IdP's keys
    cannot be fetched the answer is 503 idp_unavailable with Retry-After (no
    verdict on the token).

    Every request body is capped (1 MiB, 80 MiB for put-repo-references),
    then the caller is authenticated, then the request is validated against
    this spec, before any handler runs. A multipart body is the exception: its
    handler reads and checks the parts itself.
    Errors are RFC 9457 problems (application/problem+json).
  version: 1.0.0
servers:
- url: /internal/v1
tags:
- name: GitHub
  description: The org's GitHub identity, as the gitpat sees it.
- name: Turns
  description: Turns aep-api starts in the studio (kickoff and plan).
- name: Repos
  description: Per-repository data the studio keeps outside git.
security:
- aeOnly: []
paths:
  /github/identity:
    get:
      operationId: get-github-identity
      summary: The GitHub user the org's gitpat belongs to
      tags:
      - GitHub
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      responses:
        '200':
          description: The gitpat's user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIdentity'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/turns:
    post:
      operationId: start-repo-turn
      summary: Start (or reattach to) a kickoff or plan turn and stream its result
      description: |-
        Forwarded to the design agent over the Turn socket. The answer is
        `application/x-ndjson`, one JSON object per line: zero or more
        TaskOpFrame, KeepAliveFrame every 15 s, then one ResultFrame. The turn
        keeps running when the caller goes away, and a retry with the same turnId
        reattaches. The gateway route allows 35 minutes.
      tags:
      - Turns
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: The turn's NDJSON stream (frames TaskOpFrame, KeepAliveFrame,
            ResultFrame)
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: 'The project is not one of this repository''s (problem code:
            project_unknown).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A different turn runs for the project (TurnInProgress), or
            the studio has no default model key (problem code no_default_key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnInProgress'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 'The body is over 4 MiB, the design agent''s own cap (problem
            code: payload_too_large).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/references:
    put:
      operationId: put-repo-references
      summary: Replace a project's stored reference documents
      description: |-
        The whole stored set is replaced by the sent files. At most 10 files, each
        at most 5 MiB, 80 MiB in total. Each file is stored under its file name
        reduced to a bare, lower-case name; two files that reduce to the same
        name, a type the models cannot read, or no file at all is refused. The
        owner must be the org's connected GitHub account, else 403
        owner_refused and nothing is stored.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              files:
                contentType: application/octet-stream
            schema:
              $ref: '#/components/schemas/ReferenceUpload'
      responses:
        '204':
          description: Stored
        '400':
          description: 'A file was refused (problem code: reference_rejected).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: 'The gate refused the caller, or the owner is not the org''s
            connected GitHub account (problem code: owner_refused).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '503':
          description: 'Not serving right now (problem codes: disk_full, idp_unavailable).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    aeOnly:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImpersonateOrg:
      name: X-Impersonate-Org
      in: header
      required: true
      description: The org the call acts for; must be the pod's org id.
      schema:
        type: string
    Owner:
      name: owner
      in: path
      required: true
      description: GitHub owner of the repository (one path segment, the
        store's rule)
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,200}$
    Repo:
      name: repo
      in: path
      required: true
      description: GitHub repository name (one path segment, the store's rule)
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,200}$
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: GitHub rate-limited the gitpat; retry after the given delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    GitHubIdentity:
      type: object
      required:
      - login
      - id
      properties:
        login:
          type: string
        id:
          type: integer
          format: int64
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
    TurnRequest:
      type: object
      additionalProperties: false
      description: Starts one turn that is not a browser chat turn, a kickoff
        (`start`) or a plan. Idempotent on turnId, a retry reattaches to the
        running turn. A different turnId while a turn runs is 409.
      required:
      - turnId
      - project
      - kind
      - credit
      properties:
        turnId:
          type: string
          format: uuid
        project:
          type: string
          description: Project name (DNS-label slug)
        kind:
          type: string
          enum:
          - start
          - plan
        credit:
          $ref: '#/components/schemas/TurnCredit'
        scope:
          $ref: '#/components/schemas/PlanScope'
        taskContext:
          type: array
          description: The existing-Task renders of a plan turn. Platform state,
            not repository files.
          items:
            $ref: '#/components/schemas/PlanContextFile'
        text:
          type: string
          description: The free text of the turn (the project idea of a start turn).
    TurnCredit:
      type: object
      additionalProperties: false
      description: Who the turn's commits and records are credited to.
      required:
      - userId
      - name
      - email
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
    PlanScope:
      type: object
      additionalProperties: false
      description: The milestone a plan turn covers and which of its stories
        already have Tasks.
      required:
      - tag
      - stories
      properties:
        tag:
          type: string
        stories:
          type: array
          items:
            $ref: '#/components/schemas/PlanStory'
    PlanStory:
      type: object
      additionalProperties: false
      required:
      - number
      - covered
      properties:
        number:
          type: integer
        title:
          type: string
        covered:
          type: boolean
          description: The story already has Tasks, the planner leaves it alone.
    PlanContextFile:
      type: object
      additionalProperties: false
      description: One existing-Task render under its tasks/<n>.md name.
      required:
      - path
      - body
      properties:
        path:
          type: string
        body:
          type: string
    TurnInProgress:
      type: object
      additionalProperties: false
      description: 409 body, a different turn already runs for the project.
      required:
      - code
      - activeTurnId
      properties:
        code:
          type: string
          enum:
          - turn_in_progress
        activeTurnId:
          type: string
          format: uuid
    TaskOpFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, a Task operation the agent produced.
      required:
      - type
      - op
      - output
      properties:
        type:
          type: string
          enum:
          - task-op
        op:
          type: string
          enum:
          - plan
          - update
        output:
          type: object
          additionalProperties: true
          description: The operation's payload, as the plan or update tool emitted it.
    KeepAliveFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, sent every 15 s.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - keep-alive
    ResultFrame:
      type: object
      additionalProperties: false
      description: The last line of the turn stream. A shutdown ends a running turn
        with status failed and code shutdown.
      required:
      - type
      - status
      properties:
        type:
          type: string
          enum:
          - result
        status:
          type: string
          enum:
          - completed
          - failed
        code:
          type: string
        message:
          type: string
        resetAt:
          type: string
          format: date-time
          description: With code provider_limit, when the model provider said its
            limit resets, if it said.
    ReferenceUpload:
      type: object
      additionalProperties: false
      required:
      - files
      properties:
        files:
          type: array
          maxItems: 10
          description: The reference documents, at most 5 MiB each.
          items:
            type: string
            format: binary
