      summary: Delete a hook (already gone is success)
      tags:
      - Hooks
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/HookID'
      responses:
        '204':
          description: Deleted, or GitHub no longer had it (404, 410)
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/skills-mirror:
    post:
      operationId: mirror-skills
      summary: Mirror the org skill library into the repository's .claude/skills
      description: |-
        Reads skillsRepo (the org skill library) at its default-branch tip and
        makes `.claude/skills/` in owner/repo the coding agent's slice of it:
        every enabled skill whose audience includes coding, plus every skill
        named in pinned (a pin overrides audience and the enabled flag). One
        commit to the default branch writes every desired file that differs
        and deletes every other file under `.claude/skills/`, each pinned to
        the blob it read; nothing differing commits nothing (changed false,
        commitSha the tip). A failed library read answers before owner/repo
        is touched. A commit conflict (the tree moved under
        `.claude/skills/`) recomputes against the new tip, at most three
        times, then answers 409 conflict. skillsRepo's owner must be the
        org's connected GitHub account, else 403 owner_not_allowed.
      tags:
      - Skills
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/DefaultBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillsMirrorRequest'
      responses:
        '200':
          description: Mirrored (changed false when the tree was already the mirror)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsMirrorResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '409':
          description: 'The tree kept moving under `.claude/skills/` (problem
            code: conflict), or the branch kept moving through every push retry
            (problem code: not_fast_forward).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /trash:
    post:
      operationId: trash-repo
      summary: Drop the studio's mirror and references of a repository
      description: |-
        Moves the repository's mirror and its stored reference documents into
        the studio's trash (purged within the hour); GitHub is not touched.
        Nothing stored is success. A later operation on the repository clones
        it again. The owner must be the org's connected GitHub account
        (compared case-insensitively), else 403 owner_not_allowed and nothing
        moves.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashRepoRequest'
      responses:
        '204':
          description: Trashed (or there was no mirror)
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          description: 'The studio could not move the mirror or the references
            into its trash, a failure of its own disk; GitHub is not involved
            (problem code: trash_failed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    aeOnly:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ImpersonateOrg:
      name: X-Impersonate-Org
      in: header
      required: true
      description: The org the call acts for; must be the pod's org id.
      schema:
        type: string
    Owner:
      name: owner
      in: path
      required: true
      description: GitHub owner of the repository (one path segment, the
        store's rule; never . or ..)
      schema:
        type: string
        maxLength: 200
        pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
    Repo:
      name: repo
      in: path
      required: true
      description: GitHub repository name (one path segment, the store's
        rule; never . or ..)
      schema:
        type: string
        maxLength: 200
        pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
    At:
      name: at
      in: query
      required: false
      description: The commit to read. Omitted, the default-branch tip (fetched
        from GitHub first); `tags/<name>`, the commit the tag points at; a
        40-hex sha, that commit (read locally, fetched only when missing).
      schema:
        type: string
        pattern: ^(tags/[A-Za-z0-9._/-]{1,200}|[0-9a-f]{40})$
    Local:
      name: local
      in: query
      required: false
      description: Read the default-branch tip the studio's mirror already
        holds, without fetching from GitHub (every commit the studio writes is
        there; a push made elsewhere shows after the next fetching call). Only
        with `at` omitted, else 400.
      schema:
        type: boolean
    Prefix:
      name: prefix
      in: query
      required: false
      description: Only paths (tag names, for list-tags) starting with this.
      schema:
        type: string
        maxLength: 1024
    TagPrefix:
      name: prefix
      in: query
      required: false
      description: Only tags whose name starts with this. Matched literally, so
        it is limited to the ref-name characters (no glob character).
      schema:
        type: string
        pattern: ^[A-Za-z0-9._/-]{0,255}$
    DefaultBranch:
      name: defaultBranch
      in: query
      required: false
      description: The repository's default branch, as aep-api's row names it
        (the branch the Room reads for the same repository). Omitted, main.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._/-]{1,255}$
    Number:
      name: number
      in: path
      required: true
      description: The issue, milestone or pull request number
      schema:
        type: integer
        minimum: 1
    Label:
      name: label
      in: path
      required: true
      description: The label's name, percent-encoded (a label may hold `/`
        and `:`)
      schema:
        type: string
        minLength: 1
        maxLength: 50
    HookID:
      name: hookId
      in: path
      required: true
      description: The hook's GitHub id (register-hook's answer)
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: GitHub rate-limited the gitpat; retry after the given delay.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitNotFound:
      description: 'The ref or the file does not exist (problem codes:
        ref_not_found, path_not_found).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitHubError:
      description: 'GitHub refused or failed a git clone, fetch or push (problem
        code: github_error; githubStatus is GitHub''s HTTP status when git
        reported one).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IssueNotFound:
      description: 'No issue carries that number (problem code: issue_not_found).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MilestoneNotFound:
      description: 'No milestone carries that number (problem code:
        milestone_not_found).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    GitHubAPIError:
      description: 'GitHub refused or failed the call (problem code:
        github_error; githubStatus is GitHub''s HTTP status when it answered
        one, 404 for a GraphQL NOT_FOUND).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    GitHubIdentity:
      type: object
      required:
      - login
      - id
      properties:
        login:
          type: string
        id:
          type: integer
          format: int64
        name:
          type: string
          description: The user's public name; absent when not public
        email:
          type: string
          description: The user's public email; absent when not public
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        githubStatus:
          type: integer
          description: With code github_error, GitHub's HTTP status, when it
            answered one.
    Head:
      type: object
      required:
      - sha
      properties:
        sha:
          type: string
          description: The commit's 40-hex sha
    Tree:
      type: object
      required:
      - commitSha
      - entries
      properties:
        commitSha:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TreeEntry'
    TreeEntry:
      type: object
      required:
      - path
      - sha
      - size
      properties:
        path:
          type: string
        sha:
          type: string
          description: The blob's sha
        size:
          type: integer
          format: int64
    FileContent:
      type: object
      required:
      - commitSha
      - path
      - sha
      - content
      properties:
        commitSha:
          type: string
        path:
          type: string
        sha:
          type: string
          description: The blob's sha (the next write's baseSha)
        content:
          type: string
          format: byte
    Bundle:
      type: object
      required:
      - commitSha
      - files
      properties:
        commitSha:
          type: string
        files:
          type: object
          description: path → content, base64 per file (binary-safe)
          additionalProperties:
            type: string
            format: byte
    TagList:
      type: object
      required:
      - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
    Tag:
      type: object
      required:
      - name
      - commitHash
      properties:
        name:
          type: string
        commitHash:
          type: string
          description: The commit the tag points at (annotated tags peeled)
        message:
          type: string
          description: The annotated tag's subject; absent for a lightweight tag
        body:
          type: string
          description: The annotated tag's message after its subject (git's
            contents:body), trimmed; absent for a lightweight tag or an
            annotation that is a subject alone. A spec version records its
            build selection here.
        createdAt:
          type: string
          format: date-time
          description: When the tag was made (the commit's date for a
            lightweight tag); absent when git could not date it
          x-go-type-skip-optional-pointer: false
    CreateTagRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - message
      properties:
        name:
          type: string
          description: The tag name, a valid git ref name
          pattern: ^[A-Za-z0-9._/-]{1,200}$
        target:
          type: string
          description: The commit to tag, as `at` names one; omitted, the
            default-branch tip
          pattern: ^(tags/[A-Za-z0-9._/-]{1,200}|[0-9a-f]{40})$
        message:
          type: string
          minLength: 1
        tagger:
          $ref: '#/components/schemas/GitIdentity'
      description: tagger omitted, the AEP default identity.
    TagCreated:
      type: object
      additionalProperties: false
    GitIdentity:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
    CreateCommitRequest:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        writes:
          type: array
          items:
            $ref: '#/components/schemas/CommitWrite'
        deletes:
          type: array
          items:
            $ref: '#/components/schemas/CommitDelete'
        message:
          type: string
          minLength: 1
        author:
          $ref: '#/components/schemas/GitIdentity'
        committer:
          $ref: '#/components/schemas/GitIdentity'
      description: At least one write or delete, no path twice. author omitted,
        the gitpat's user; committer omitted, the author.
    CommitWrite:
      type: object
      additionalProperties: false
      required:
      - path
      - content
      - baseSha
      properties:
        path:
          type: string
          minLength: 1
        content:
          type: string
          format: byte
        baseSha:
          type: string
          description: The blob sha the path must have at the tip; empty, the
            path must not exist
          pattern: ^([0-9a-f]{40})?$
    CommitDelete:
      type: object
      additionalProperties: false
      required:
      - path
      - baseSha
      properties:
        path:
          type: string
          minLength: 1
        baseSha:
          type: string
          description: The blob sha the path must have at the tip; empty,
            whatever is there (it must exist)
          pattern: ^([0-9a-f]{40})?$
    CommitResult:
      type: object
      required:
      - commitSha
      - changed
      - files
      - warnings
      properties:
        commitSha:
          type: string
        changed:
          type: boolean
        files:
          type: array
          description: Each written file and its new blob sha, in request order
          items:
            $ref: '#/components/schemas/CommitFile'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CommitWarning'
    CommitFile:
      type: object
      required:
      - path
      - sha
      properties:
        path:
          type: string
        sha:
          type: string
    CommitWarning:
      type: object
      required:
      - path
      - code
      - message
      properties:
        path:
          type: string
        code:
          type: string
        message:
          type: string
    CommitConflict:
      type: object
      description: A problem; with code conflict, conflicts names every failed
        baseSha.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
    Conflict:
      type: object
      required:
      - path
      - baseSha
      - currentSha
      properties:
        path:
          type: string
        baseSha:
          type: string
        currentSha:
          type: string
          description: The blob sha at the tip; empty when the path is absent
    TurnRequest:
      type: object
      additionalProperties: false
      description: Starts one turn that is not a browser chat turn, a kickoff
        (`start`) or a plan. Idempotent on turnId, a retry reattaches to the
        running turn. A different turnId while a turn runs is 409.
      required:
      - turnId
      - project
      - kind
      - credit
      properties:
        turnId:
          type: string
          format: uuid
        project:
          type: string
          description: Project name (DNS-label slug)
        kind:
          type: string
          enum:
          - start
          - plan
        credit:
          $ref: '#/components/schemas/TurnCredit'
        at:
          type: string
          description: A plan turn only, the commit the planner reads the
            repository at, as the git reads' `at` names one; aep-api sends
            `tags/<version>` so an edit made after the version is not planned.
            Omitted, the default-branch tip. The studio resolves it to a commit
            sha (as a git read resolves `at`) before the turn starts, and passes
            the sha on the Turn socket's `at`; a tag or sha the repository does
            not have is 404 ref_not_found and no turn starts. It is the pin and
            wins; scope.tag only describes the version and is not checked
            against it. A start turn that sends it is refused (400
            validation_failed).
          pattern: ^(tags/[A-Za-z0-9._/-]{1,200}|[0-9a-f]{40})$
        scope:
          $ref: '#/components/schemas/PlanScope'
        taskContext:
          type: array
          description: The existing-Task renders of a plan turn. Platform state,
            not repository files.
          items:
            $ref: '#/components/schemas/PlanContextFile'
        text:
          type: string
          description: The free text of the turn (the project idea of a start turn).
    TurnCredit:
      type: object
      additionalProperties: false
      description: Who the turn's commits and records are credited to.
      required:
      - userId
      - name
      - email
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
    PlanScope:
      type: object
      additionalProperties: false
      description: The spec version a plan turn covers, its stories and which
        of them already have Tasks, the features it carries and its
        product-wide items.
      required:
      - tag
      - stories
      properties:
        tag:
          type: string
          description: The version's tag name, describing the version to the
            planner. Not the pin and not checked against it; the turn's `at`
            is.
          pattern: ^[A-Za-z0-9._/-]{1,200}$
        stories:
          type: array
          description: Each story the version builds, in ID order.
          items:
            $ref: '#/components/schemas/PlanStory'
        features:
          type: array
          description: The features the version carries, in ID order, each
            with the carried features it is built after; the planner cuts one
            Task per feature per component.
          items:
            $ref: '#/components/schemas/PlanFeature'
        productWide:
          type: array
          description: The product-wide items the version carries, in ID
            order; each component's Foundation Task builds them.
          items:
            $ref: '#/components/schemas/PlanItem'
    PlanStory:
      type: object
      additionalProperties: false
      required:
      - id
      - covered
      properties:
        id:
          type: string
          description: The story's ID, F<feature>.<story>.
          pattern: ^F[0-9]+\.[0-9]+$
        title:
          type: string
        covered:
          type: boolean
          description: The story already has Tasks, the planner leaves it alone.
    PlanFeature:
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          type: string
          pattern: ^F[0-9]+$
        name:
          type: string
        needs:
          type: array
          description: The carried features this one is built after, in ID
            order (one an earlier version built is left out).
          items:
            type: string
            pattern: ^F[0-9]+$
    PlanItem:
      type: object
      additionalProperties: false
      description: One product-wide item.
      required:
      - id
      properties:
        id:
          type: string
          pattern: ^P[0-9]+$
        text:
          type: string
        appliesTo:
          type: array
          description: The feature IDs the item applies to, or the single
            entry `all`.
          items:
            type: string
            pattern: ^(F[0-9]+|all)$
    PlanContextFile:
      type: object
      additionalProperties: false
      description: One existing-Task render under its tasks/<n>.md name.
      required:
      - path
      - body
      properties:
        path:
          type: string
        body:
          type: string
    TurnInProgress:
      type: object
      additionalProperties: false
      description: 409 body, a different turn already runs for the project.
      required:
      - code
      - activeTurnId
      properties:
        code:
          type: string
          enum:
          - turn_in_progress
        activeTurnId:
          type: string
          format: uuid
    TaskOpFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, a Task operation the agent produced.
      required:
      - type
      - op
      - output
      properties:
        type:
          type: string
          enum:
          - task-op
        op:
          type: string
          enum:
          - plan
          - update
        output:
          type: object
          additionalProperties: true
          description: The operation's payload, as the plan or update tool emitted it.
    KeepAliveFrame:
      type: object
      additionalProperties: false
      description: One line of the turn stream, sent every 15 s.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - keep-alive
    ResultFrame:
      type: object
      additionalProperties: false
      description: The last line of the turn stream. A shutdown ends a running turn
        with status failed and code shutdown.
      required:
      - type
      - status
      properties:
        type:
          type: string
          enum:
          - result
        status:
          type: string
          enum:
          - completed
          - failed
        code:
          type: string
        message:
          type: string
        resetAt:
          type: string
          format: date-time
          description: With code provider_limit, when the model provider said its
            limit resets, if it said.
    ReferenceList:
      type: object
      additionalProperties: false
      required:
      - names
      properties:
        names:
          type: array
          maxItems: 10
          description: The stored documents' bare, lower-case file names, sorted.
          items:
            type: string
    ReferenceUpload:
      type: object
      additionalProperties: false
      required:
      - files
      properties:
        files:
          type: array
          maxItems: 10
          description: The reference documents, at most 5 MiB each.
          items:
            type: string
            format: binary
    IssueList:
      type: object
      required:
      - issues
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueInfo'
    IssueInfo:
      type: object
      description: An issue as GitHub holds it.
      required:
      - number
      - title
      - body
      - url
      - state
      - labels
      properties:
        number:
          type: integer
        title:
          type: string
        body:
          type: string
        url:
          type: string
          description: The issue's html_url
        state:
          type: string
          description: open or closed
        stateReason:
          type: string
          description: GitHub's state_reason; absent while it has none
        closedAt:
          type: string
          description: GitHub's closed_at; absent while open
        labels:
          type: array
          items:
            type: string
    CreateIssueRequest:
      type: object
      additionalProperties: false
      required:
      - title
      - body
      properties:
        title:
          type: string
          minLength: 1
        body:
          type: string
        labels:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
        milestone:
          type: integer
          minimum: 1
          description: The milestone number; omitted, none
          x-go-type-skip-optional-pointer: false
    IssueResult:
      type: object
      required:
      - number
      - url
      - nodeId
      properties:
        number:
          type: integer
        url:
          type: string
          description: The issue's html_url
        nodeId:
          type: string
    IssueCommentList:
      type: object
      required:
      - comments
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/IssueComment'
    IssueComment:
      type: object
      description: One comment as GitHub holds it, the platform's marker
        stripped from body and reported as machine or observed (never both).
      required:
      - id
      - author
      - body
      - url
      - createdAt
      - machine
      - observed
      properties:
        id:
          type: string
          description: GitHub's node id
        author:
          type: string
          description: The author's login; empty when the account is gone
        body:
          type: string
        url:
          type: string
        createdAt:
          type: string
          format: date-time
        machine:
          type: boolean
          description: The platform wrote it for the agent
        observed:
          type: boolean
          description: The platform wrote it for a person, from what a run did
    IssueCommentRequest:
      type: object
      additionalProperties: false
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
    IssueBodyRequest:
      type: object
      additionalProperties: false
      required:
      - body
      properties:
        body:
          type: string
    IssueTitleRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
    IssueMilestoneRequest:
      type: object
      additionalProperties: false
      required:
      - number
      properties:
        number:
          type: integer
          minimum: 1
          description: The milestone number
    IssueLabelsRequest:
      type: object
      additionalProperties: false
      required:
      - labels
      properties:
        labels:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 50
    EnsureLabelRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - color
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          description: Six hex digits, no leading '#'
          pattern: ^[0-9A-Fa-f]{6}$
    MilestoneList:
      type: object
      required:
      - milestones
      properties:
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/Milestone'
    Milestone:
      type: object
      required:
      - number
      - title
      - state
      - description
      - nodeId
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          description: open or closed (display only)
        description:
          type: string
        nodeId:
          type: string
    CreateMilestoneRequest:
      type: object
      additionalProperties: false
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
          pattern: \S
        description:
          type: string
    MilestoneResult:
      type: object
      required:
      - number
      - created
      properties:
        number:
          type: integer
        created:
          type: boolean
    MilestoneIssueCounts:
      type: object
      description: A milestone's open issues per population, each the count of
        one label (the working-set arithmetic over them is the caller's).
      required:
      - openProvision
      - openTotal
      - openAgentWork
      - openDevelopment
      - openValidation
      - openValidationRepairs
      properties:
        openProvision:
          type: integer
          description: Label provision (dispatch gates)
        openTotal:
          type: integer
          description: Every open issue
        openAgentWork:
          type: integer
          description: Label aep
        openDevelopment:
          type: integer
          description: Label development
        openValidation:
          type: integer
          description: Label validation
        openValidationRepairs:
          type: integer
          description: Label src/validation
    MilestoneComments:
      type: object
      required:
      - issues
      properties:
        issues:
          type: array
          items:
            $ref: '#/components/schemas/IssueComments'
    IssueComments:
      type: object
      required:
      - number
      - comments
      properties:
        number:
          type: integer
        comments:
          type: array
          items:
            $ref: '#/components/schemas/IssueComment'
    PullRequestState:
      type: object
      required:
      - state
      - merged
      - mergeCommitSha
      properties:
        state:
          type: string
          description: open or closed
        merged:
          type: boolean
        mergeCommitSha:
          type: string
          description: Empty until GitHub has one
    PullRequestFiles:
      type: object
      required:
      - files
      properties:
        files:
          type: array
          items:
            type: string
    CreateRepoRequest:
      type: object
      additionalProperties: false
      required:
      - owner
      - name
      - private
      properties:
        owner:
          type: string
          description: Must be the org's connected GitHub account
          maxLength: 200
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
        name:
          type: string
          description: GitHub's charset; never . or ..
          maxLength: 100
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
        private:
          type: boolean
        description:
          type: string
          maxLength: 350
        adoptExisting:
          type: boolean
          description: A taken name answers the existing repository (200)
            instead of 409
    RepoCoordinates:
      type: object
      required:
      - owner
      - repo
      - cloneUrl
      - defaultBranch
      properties:
        owner:
          type: string
        repo:
          type: string
        cloneUrl:
          type: string
          description: https://github.com/<owner>/<repo>.git
        defaultBranch:
          type: string
    HookEventsRequest:
      type: object
      additionalProperties: false
      required:
      - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
            - pull_request
            - push
            - issue_comment
            - issues
    Hook:
      type: object
      required:
      - id
      properties:
        id:
          type: integer
          format: int64
    SkillsMirrorRequest:
      type: object
      additionalProperties: false
      required:
      - skillsRepo
      - pinned
      properties:
        skillsRepo:
          $ref: '#/components/schemas/SkillsRepo'
        pinned:
          type: array
          description: The skill names the project's components pin
            (skillsPinned, read by aep-api from their design.json). Compared
            with the library's names only; a name the library lacks is
            ignored.
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 200
    SkillsRepo:
      type: object
      additionalProperties: false
      required:
      - owner
      - repo
      properties:
        owner:
          type: string
          description: Must be the org's connected GitHub account
          maxLength: 200
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
        repo:
          type: string
          maxLength: 200
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
        defaultBranch:
          type: string
          description: The skills repository's default branch, as aep-api's
            row names it. Omitted, main.
          pattern: ^[A-Za-z0-9._/-]{1,255}$
    SkillsMirrorResult:
      type: object
      required:
      - commitSha
      - changed
      properties:
        commitSha:
          type: string
          description: The mirror commit, or the tip when nothing changed
        changed:
          type: boolean
    TrashRepoRequest:
      type: object
      additionalProperties: false
      required:
      - owner
      - repo
      properties:
        owner:
          type: string
          description: Must be the org's connected GitHub account
          maxLength: 200
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
        repo:
          type: string
          maxLength: 200
          pattern: ^(\.?[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)$
