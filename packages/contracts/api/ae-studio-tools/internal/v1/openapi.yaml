  /repos:
    post:
      operationId: create-repo
      summary: Create the org's repository on GitHub (or adopt the existing one)
      description: |-
        Creates owner/name under the org's connected GitHub account,
        initialised (auto_init) so its default branch exists. The owner must be
        that account (compared case-insensitively), else 403 owner_not_allowed
        before any GitHub call. A taken name is 409 repo_name_conflict, unless
        adoptExisting is set: then 200 with the existing repository's
        coordinates. A repository GitHub created or holds under another owner
        is also 403 owner_not_allowed. cloneUrl is always
        `https://github.com/<owner>/<repo>.git`, in GitHub's case.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoRequest'
      responses:
