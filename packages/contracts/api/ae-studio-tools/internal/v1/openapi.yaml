openapi: 3.0.3
info:
  title: ae-studio-tools internal API
  description: |-
    Machine API of an org's AE Studio. Caller: aep-api only, with the AE-only
    M2M token (client_credentials, aud and client_id = the pinned client, no
    org claim) and X-Impersonate-Org naming the pod's org. When the IdP's keys
    cannot be fetched the answer is 503 idp_unavailable with Retry-After (no
    verdict on the token).

    Every request body is capped (1 MiB; 4 MiB for start-repo-turn, 16 MiB
    for create-commit, 80 MiB for put-repo-references), then the caller is
    authenticated, then the request is validated against this spec, before
    any handler runs. A multipart body is the exception: its handler reads and
    checks the parts itself.

    Every /repos/{owner}/{repo}/... operation, and create-repo, trash-repo
    and mirror-skills (its skillsRepo) for their body's owner, answer 403
    owner_not_allowed, once the
    request is validated and before the operation runs, when owner is not the
    org's connected GitHub account (compared case-insensitively).
    Errors are RFC 9457 problems (application/problem+json).

    The Issues, Milestones, Pulls, Hooks and create-repo operations call
    GitHub over the org's gitpat and are never retried here: a rate limit is
    429 github_rate_limited with Retry-After, any other refusal 502
    github_error with githubStatus.
  version: 1.0.0
servers:
- url: /internal/v1
tags:
- name: GitHub
  description: The org's GitHub identity, as the gitpat sees it.
- name: Turns
  description: Turns aep-api starts in the studio (kickoff and plan).
- name: Repos
  description: The org's repositories, and per-repository data the studio
    keeps outside git.
- name: Git
  description: The repository's git content, read from and written through the
    studio's mirror. No path allow-list.
- name: Issues
  description: The repository's issues, comments and labels on GitHub.
- name: Milestones
  description: The repository's milestones on GitHub (one spec version each).
- name: Pulls
  description: The repository's pull requests on GitHub.
- name: Hooks
  description: The studio's webhook on the repository.
- name: Skills
  description: The org skill library's mirror in a project repository.
security:
- aeOnly: []
paths:
  /github/identity:
    get:
      operationId: get-github-identity
      summary: The GitHub user the org's gitpat belongs to
      tags:
      - GitHub
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      responses:
        '200':
          description: The gitpat's user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitHubIdentity'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/turns:
    post:
      operationId: start-repo-turn
      summary: Start (or reattach to) a kickoff or plan turn and stream its result
      description: |-
        Forwarded to the design agent over the Turn socket. The answer is
        `application/x-ndjson`, one JSON object per line: zero or more
        TaskOpFrame, KeepAliveFrame every 15 s, then one ResultFrame. The turn
        keeps running when the caller goes away, and a retry with the same turnId
        reattaches. The gateway route allows 35 minutes.
      tags:
      - Turns
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnRequest'
      responses:
        '200':
          description: The turn's NDJSON stream (frames TaskOpFrame, KeepAliveFrame,
            ResultFrame)
          content:
            application/x-ndjson:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          description: 'The project is not one of this repository''s (problem code:
            project_unknown), or a plan turn''s `at` names no tag or commit the
            repository has (problem code: ref_not_found; permanent, nothing is
            started).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A different turn runs for the project (TurnInProgress), or
            the studio has no default model key (problem code no_default_key).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnInProgress'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: 'The body is over 4 MiB, the design agent''s own cap (problem
            code: payload_too_large).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/references:
    get:
      operationId: list-repo-references
      summary: List the names of a project's stored reference documents
      description: |-
        The names the stored set's files carry (as put-repo-references stored
        them), sorted; empty when none are stored. Read from the studio's
        store, never from git or GitHub. The owner must be the org's connected
        GitHub account, else 403 owner_not_allowed. Like put-repo-references
        it has no 502: the owner check compares with the connected account
        the studio is configured with and calls no one.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: The stored documents' names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: 'The gate refused the caller, or the owner is not the org''s
            connected GitHub account (problem code: owner_not_allowed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 'Not serving right now (problem codes: disk_full, idp_unavailable).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: put-repo-references
      summary: Replace a project's stored reference documents
      description: |-
        The whole stored set is replaced by the sent files. At most 10 files, each
        at most 5 MiB, 80 MiB in total. Each file is stored under its file name
        reduced to a bare, lower-case name; two files that reduce to the same
        name, a type the models cannot read, or no file at all is refused. The
        owner must be the org's connected GitHub account, else 403
        owner_not_allowed and nothing is stored.
      tags:
      - Repos
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              files:
                contentType: application/octet-stream
            schema:
              $ref: '#/components/schemas/ReferenceUpload'
      responses:
        '204':
          description: Stored
        '400':
          description: 'A file was refused (problem code: reference_rejected).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          description: 'The gate refused the caller, or the owner is not the org''s
            connected GitHub account (problem code: owner_not_allowed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '503':
          description: 'Not serving right now (problem codes: disk_full, idp_unavailable).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /repos/{owner}/{repo}/head:
    get:
      operationId: get-head
      summary: Resolve a ref to its commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The commit `at` names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Head'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/tree:
    get:
      operationId: list-tree
      summary: List every file of a commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/Prefix'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The files of the commit (blobs, recursive), under prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tree'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/files/{path}:
    get:
      operationId: read-file
      summary: Read one file of a commit
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - name: path
        in: path
        required: true
        description: Repo-relative file path. A trailing wildcard, it may span
          several segments (contain slashes) and is served by a catch-all. No
          allow-list, any file of the repository.
        schema:
          type: string
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The file at the commit `at` names
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileContent'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/bundle:
    get:
      operationId: read-bundle
      summary: Read a set of files of one commit
      description: |-
        With `path`, exactly the named files (a missing one is left out);
        otherwise every file under `prefix` whose name ends in one of `ext`
        (any, when `ext` is not given).
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/At'
      - $ref: '#/components/parameters/Local'
      - $ref: '#/components/parameters/Prefix'
      - name: ext
        in: query
        required: false
        description: File-name endings to keep (e.g. `.json`), repeated.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 20
          items:
            type: string
            pattern: ^\.[A-Za-z0-9._-]{1,32}$
      - name: path
        in: query
        required: false
        description: Exact repo-relative paths to read, repeated. Overrides
          prefix and ext.
        style: form
        explode: true
        schema:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
      - $ref: '#/components/parameters/DefaultBranch'
      responses:
        '200':
          description: The files read, at one commit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/tags:
    get:
      operationId: list-tags
      summary: List the repository's tags
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/TagPrefix'
      - name: local
        in: query
        required: false
        description: List the tags the studio's mirror already holds, without
          fetching from GitHub (every tag the studio cuts is there).
        schema:
          type: boolean
      responses:
        '200':
          description: The tags whose name starts with prefix
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: create-tag
      summary: Cut an annotated tag and push it
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/DefaultBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tagged and pushed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '409':
          description: 'The tag name is taken (problem code: tag_exists).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/commits:
    post:
      operationId: create-commit
      summary: Commit writes and deletes to the default branch
      description: |-
        One commit of the writes then the deletes, each pinned to the blob it
        expects (`baseSha`), pushed to the default branch under a lease. Every
        precondition is checked against the tip the commit builds on; one
        failure answers 409 conflict and nothing is applied. The engine's
        commit only: no scaffolding, soft validation or completions, so
        `warnings` is empty. The body is capped at 16 MiB.
      tags:
      - Git
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/DefaultBranch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommitRequest'
      responses:
        '200':
          description: Committed (changed false when the content equals the tip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/GitNotFound'
        '409':
          description: 'A baseSha no longer holds (problem code: conflict, with
            conflicts), or the branch kept moving through every retry (problem
            code: not_fast_forward).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CommitConflict'
        '413':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/GitHubError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues:
    get:
      operationId: list-issues
      summary: List the repository's issues, newest first
      description: |-
        Every state, newest first, at most 10 pages of 100; get-issue reaches
        the rest.
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - name: labels
        in: query
        required: false
        description: Only issues carrying every one of these labels.
        schema:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        '200':
          description: Issues in every state (pull requests left out); past 1000 the oldest are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: create-issue
      summary: Open an issue
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIssueRequest'
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues/{number}:
    get:
      operationId: get-issue
      summary: Read one issue
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      responses:
        '200':
          description: The issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueInfo'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/IssueNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues/{number}/comments:
    get:
      operationId: list-issue-comments
      summary: Read an issue's newest comments
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      - name: limit
        in: query
        required: true
        description: How many of the newest comments; 0 answers none.
        schema:
          type: integer
          minimum: 0
          maximum: 100
      responses:
        '200':
          description: The comments, oldest first, the platform's markers stripped and reported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCommentList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/IssueNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
    post:
      operationId: create-issue-comment
      summary: Comment on an issue
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCommentRequest'
      responses:
        '204':
          description: Commented
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues/{number}/close:
    post:
      operationId: close-issue
      summary: Close an issue as completed
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      responses:
        '204':
          description: Closed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues/{number}/reopen:
    post:
      operationId: reopen-issue
      summary: Reopen an issue (a no-op when open)
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      responses:
        '204':
          description: Open
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/GitHubAPIError'
        '503':
          $ref: '#/components/responses/Problem'
  /repos/{owner}/{repo}/issues/{number}/body:
    put:
      operationId: set-issue-body
      summary: Replace an issue's body
      tags:
      - Issues
      parameters:
      - $ref: '#/components/parameters/ImpersonateOrg'
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
      - $ref: '#/components/parameters/Number'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueBodyRequest'
      responses:
        '204':
          description: Replaced
        '400':
          $ref: '#/components/responses/Problem'
        '401':
