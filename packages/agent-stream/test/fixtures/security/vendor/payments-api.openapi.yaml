openapi: 3.0.3
info:
  title: Payments API
  version: "1.0.0"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://idp.example/oauth2/authorize
          tokenUrl: https://idp.example/oauth2/token
          scopes:
            payments:read: See payments
            payments:release: Release a payment
security:
  - oauth2: []
paths:
  /payments:
    get:
      operationId: listPayments
      security: [{ oauth2: [payments:read] }]
      responses:
        "200": { description: ok }
  /payments/{id}/release:
    post:
      operationId: releasePayment
      security: [{ oauth2: [payments:release] }]
      responses:
        "204": { description: released }
