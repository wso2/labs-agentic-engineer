# Client + models for the Turn socket (ae-studio-tools calls ae-design-agent),
# generated from packages/contracts/sockets/ae-studio/turn. The embedded spec
# is not needed on the client side. Run via `make gen-api`.
package: turnsock
generate:
  client: true
  models: true
compatibility:
  preserve-original-operation-id-casing-in-embedded-spec: true
output: internal/gen/turnsock/turnsock_gen.go
output-options:
  skip-prune: true
  prefer-skip-optional-pointer: true
  name-normalizer: ToCamelCaseWithInitialisms
