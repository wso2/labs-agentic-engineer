# Schema types generated INTO package gen (internal/gen), alongside the
# strict server that references them. Input: the single committed contract
# packages/contracts/api/v1/openapi.yaml (schemas + paths in one document) —
# the source of truth; run via `make gen-api`.
#
# A handful of schemas stay hand-written in models/ (gorm-tagged DB models that
# double as API shapes, plus the tri-state orgconfig patch/projection types
# codegen can't express). Each carries `x-go-type: models.X` in the contract, so
# this pass emits a transparent alias (`type X = models.X`) instead of a wrong
# generated struct — no exclude-schemas list to drift.
package: gen
generate:
  models: true
output: internal/gen/models_gen.go
output-options:
  # Keep schemas that no path references (e.g. types used only via x-go-type or
  # constructed directly in Go) — pruning would drop their generated form.
  skip-prune: true
  # Optional schema fields are value types + omitempty (stable wire shape, no
  # pointer ripple through the ~216 importers). Params that must tell "absent"
  # from the zero value opt back into pointers via x-go-type-skip-optional-pointer
  # in the contract.
  prefer-skip-optional-pointer: true
  # Match hand-written Go names (UUID, RepoURL, …), not Uuid/RepoUrl.
  name-normalizer: ToCamelCaseWithInitialisms
compatibility:
  # Enum constants are always type-prefixed (AeStudioStateReady, not Ready):
  # the bare form is exported only while names don't collide, so a new enum
  # could silently rename an existing constant.
  always-prefix-enum-values: true
