# Strict server + types for the internal S2S surface, generated from the
# committed internal contract (packages/contracts/api/internal/v1). Run via
# `make gen-api`. Self-contained: the internal shapes are private to this
# surface (the edge projects the domain structs onto these wire types).
#
# embedded-spec: the edge's request validator and body cap load the contract
# from GetSpec() (internal/edge/validator.go), exactly as /api/v1 does.
#
# exclude-operation-ids: call-mcp-tool is declared so the spec lists every
# internal route, but its handler is mcpdiscovery's raw JSON-RPC handler, not a
# strict-server method. oapi-codegen drops excluded ops before it embeds the
# spec, so GetSpec() lacks /mcp: MCP bodies are capped but not schema-validated.
#
# compatibility.preserve-original-operation-id-casing-in-embedded-spec: the
# edge keys the per-op body caps (internalBodyCaps) by the contract's
# operationId; without it the embedded copy carries the Go-normalized name.
# Generated code is unaffected.
package: igen
generate:
  std-http-server: true
  strict-server: true
  models: true
  embedded-spec: true
compatibility:
  preserve-original-operation-id-casing-in-embedded-spec: true
output: internal/igen/igen_gen.go
output-options:
  skip-prune: true
  prefer-skip-optional-pointer: true
  name-normalizer: ToCamelCaseWithInitialisms
  exclude-operation-ids:
  - call-mcp-tool
