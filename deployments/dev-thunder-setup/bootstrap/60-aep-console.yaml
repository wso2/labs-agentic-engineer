# AEP console client + test users for dev-thunder-setup (issue #91).
#
# NOTE ON THE TOKEN SHAPE: this stack pins ThunderID 0.47.0 (see
# ../docker-compose.yaml), which takes the access token's attributes at
# `accessToken.userAttributes`, as written below. ThunderID 1.0.0 — what the
# k3d cluster runs — moved them to `accessToken.userConfig.attributes` and
# silently DROPS the 0.47.0 shape, so the k3d seed and this file legitimately
# differ. Do not "align" them without checking the version each targets; the
# operator's identity_contract_test.go pins the 1.0.0 side.
#
# Mirrors the k3d seed (single-cluster/thunder-resources/87-aep-console-app.yaml):
# public PKCE client, authorization_code + refresh_token, ou* claims on both
# tokens. Applied by setup.sh after the image's built-in
# 01-default-resources.yaml, so the default OU / flows / admin already exist.

# resource_type: server_config
name: cors
value:
  allowedOrigins:
    - "http://localhost:8090"
---
# resource_type: application
id: 01900000-0000-7000-8000-0000000000a0
name: AEP Console
description: AEP Platform Console (dev-thunder-setup)
ouId: 01900000-0000-7000-8000-000000000001
url: "http://localhost:8090"
logoUrl: "emoji:🛠️"
# Default Basic Authentication Flow / Default Basic Registration Flow
# (built-in ids from 01-default-resources.yaml).
authFlowId: 01900000-0000-7000-8000-000000000061
registrationFlowId: 01900000-0000-7000-8000-000000000064
isRegistrationFlowEnabled: false
allowedUserTypes:
  - Person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: aep-console-client
      redirectUris:
        - "http://localhost:8090/callback"
      grantTypes:
        - authorization_code
        - refresh_token
      responseTypes:
        - code
      pkceRequired: true
      tokenEndpointAuthMethod: none
      publicClient: true
      token:
        accessToken:
          validityPeriod: 3600
          userAttributes:
            - given_name
            - family_name
            - username
            - groups
            - email
            - name
            - ouId
            - ouName
            - ouHandle
        idToken:
          validityPeriod: 3600
          userAttributes:
            - given_name
            - family_name
            - username
            - groups
            - email
            - name
            - ouId
            - ouName
            - ouHandle
      scopeClaims:
        profile:
          - name
          - given_name
          - family_name
          - picture
        email:
          - email
          - email_verified
        group:
          - groups
        ou:
          - ouId
          - ouName
          - ouHandle
---
# resource_type: user
id: 01900000-0000-7000-8000-0000000000a1
type: Person
ouHandle: default
attributes:
  username: mark
  sub: mark
  email: mark@testorg.com
  name: Mark Tester
  given_name: Mark
  family_name: Tester
credentials:
  password: admin
---
# resource_type: user
id: 01900000-0000-7000-8000-0000000000a2
type: Person
ouHandle: default
attributes:
  username: emily
  sub: emily
  email: emily@testorg.com
  name: Emily Tester
  given_name: Emily
  family_name: Tester
credentials:
  password: admin
