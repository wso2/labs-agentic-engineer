# resource_type: application
resource_type: application
id: aep-system-client
type: m2m # client_credentials only, no interactive login
name: "AEP System Client"
description: "System-level Thunder admin client. The BFF (clients/thundersvc) mints scope=system tokens with it to manage per-org publisher apps, and thunder-app-operator authenticates as it. Assigned into Thunder's built-in Administrator role by 84-aep-system-role.yaml."
ouId: "01900000-0000-7000-8000-000000000001"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "aep-system-client"
      clientSecret: "aep-system-client-secret"
      grantTypes: ["client_credentials"]
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
