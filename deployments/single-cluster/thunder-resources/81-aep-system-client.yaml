# resource_type: application
resource_type: application
id: aep-system-client
type: m2m # client_credentials only, no interactive login
name: "AEP System Client"
description: "System-level Thunder admin client. The BFF (clients/thundersvc) mints scope=system tokens with it to manage per-org publisher apps, and thunder-app-operator authenticates as it. Assigned into Thunder's built-in Administrator role by 84-aep-system-role.yaml."
ouId: "01900000-0000-7000-8000-000000000001"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "aep-system-client"
      clientSecret: "aep-system-client-secret"
      grantTypes: ["client_credentials"]
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      # `system` is what actually unlocks ThunderID's own admin API, and it is an
      # OAuth SCOPE read straight off the token — a different mechanism from the
      # resource-server role model. Being assigned into the Administrator role
      # (84-aep-system-role.yaml) is NOT sufficient on its own: without this
      # scope the client authenticates fine and then 403s on every admin call,
      # which is exactly how thunder-app-operator fails.
      #
      # openid/profile/email ride along so the same client can be used for
      # ordinary introspection; they grant nothing by themselves.
      scopes: ["openid", "profile", "email", "system"]
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
