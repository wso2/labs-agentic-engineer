# AE resource server + permission actions + ae-admin/ae-developer groups and
# roles, for the k3d/single-cluster platform IdP. Mirrors
# services/aep-api/internal/authz/role_permissions_catalog.go — every
# name/handle/permission set here must stay in sync with that file — and the
# equivalent bundle in ../../dev-thunder-setup/bootstrap/61-ae-roles.yaml
# (same ids, so the two stay trivially comparable; that file's schema note
# applies here too, verified against Thunder's own built-in role/group
# documents rather than the REST API reference).
#
# Numbered 92 (after the composed platform singletons 89-91) rather than
# slotted into 80-88: those are all taken by existing AEP documents, and
# `setup-thunder.sh`'s ordering guard only constrains `server_config`
# singletons of the same `name` — a resource_server/group/role/user document
# has no such constraint, so sorting after 89-91 is harmless.
#
# aeadmin (below) MUST be declared before the ae-admin group: Thunder only
# accepts a group's `members` list at group-CREATE time (see
# services/aep-api/internal/clients/thundersvc/directory.go) — a later
# update is silently ignored, so the ordering here is load-bearing, not
# stylistic.
#
# This bundle does NOT gate console login by user type. An earlier version
# declared a custom AEUser user_type and set allowedUserTypes: [AEUser] on
# 87-aep-console-app.yaml, on the assumption that would keep the platform
# IdP's own built-in admin out of the console. Confirmed against a live
# Thunder (GET /flows/{id} on the app's AUTHENTICATION flow) that this does
# nothing: allowedUserTypes is only consulted by the separate
# USER_ONBOARDING flow's UserTypeResolver executor, which runs when a new
# account is being auto-provisioned/invited into an app — never by the plain
# login flow this console uses. So aeadmin (below) is a regular `Person`
# user; access control is enforced entirely by aep-api's AE permission gate
# (services/aep-api/internal/authz), which already requires real ae-admin/
# ae-developer group membership regardless of who can authenticate.

# resource_type: resource_server
#
# identifier MUST be an absolute URI, not a bare string — confirmed the
# hard way: /oauth2/authorize rejects a non-URI `resource` param with
# invalid_target ("must be an absolute URI"). A client requesting an
# ae:* scope needs to send `resource=<this identifier>` (RFC 8707) or
# Thunder resolves the scope against the platform's default resource
# server instead (Agent Manager's, identifier urn:wso2:amp) and
# overwrites the token's aud with THAT identifier — which aep-api's own
# audience allowlist (JWT_AUDIENCE, default "aep-*,openchoreo-rca-agent")
# then rejects outright as invalid audience. Mirrors how
# 70-fix-thunder-system-rs-identifier.yaml documents the same requirement
# for Thunder's own System resource server.
resource_type: resource_server
id: 01900000-0000-7000-8000-0000000000b0
name: AEP API
description: Permissions for aep-api's console-facing endpoints.
identifier: "${PUBLIC_THUNDER_URL}/ae"
ouHandle: default
resources:
  - name: AE
    handle: ae
    description: AE permission actions
    actions:
      - name: Build
        handle: build
        description: Trigger and view builds
      - name: Build View
        handle: build-view
        description: View builds without triggering
      - name: Design View
        handle: design-view
        description: View design/spec artifacts
      - name: GitHub Config
        handle: github-config
        description: Configure the GitHub integration
      - name: Model Config
        handle: model-config
        description: Configure the coding-agent model
      - name: Requirement Update
        handle: requirement-update
        description: Author/update requirements
      - name: Requirement View
        handle: requirement-view
        description: View requirements
      - name: Skill Config
        handle: skill-config
        description: Configure skills
---
# resource_type: user
#
# A known AE-admin test account, distinct from the platform IdP's own
# built-in admin — sparing anyone from having to hand-enroll that account
# into a product-specific permission group. Declared here, before the
# ae-admin group, per this file's header note on group-membership ordering.
#
# password is set in BOTH attributes and credentials, deliberately: Schema
# validation checks `attributes` for required+credential fields at create
# time (per Agent Manager's own amp-thunder-bootstrap.yaml comment on this
# exact pattern) — omitting it there fails as "missing required field" even
# though credentials.password is also set. credentials.password is the one
# that actually stores a usable, hashed login.
resource_type: user
id: 01900000-0000-7000-8000-0000000000a3
type: Person
ouHandle: default
attributes:
  username: aeadmin
  password: admin
  sub: aeadmin
  email: aeadmin@testorg.com
  name: AE Admin
  given_name: AE
  family_name: Admin
credentials:
  password: admin
---
# resource_type: group
resource_type: group
id: 01900000-0000-7000-8000-0000000000b9
name: ae-admin
description: Full access to every AE permission.
ouHandle: default
# See this file's header: membership is only honored at group-CREATE time.
members:
  - id: 01900000-0000-7000-8000-0000000000a3
    type: user
---
# resource_type: group
resource_type: group
id: 01900000-0000-7000-8000-0000000000ba
name: ae-developer
description: Read/build access to AE requirements, design, and builds.
ouHandle: default
---
# resource_type: role
resource_type: role
id: 01900000-0000-7000-8000-0000000000bb
name: ae-admin
description: AE permissions for the ae-admin group.
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b0
    permissions:
      - "ae:build"
      - "ae:build-view"
      - "ae:design-view"
      - "ae:github-config"
      - "ae:model-config"
      - "ae:requirement-update"
      - "ae:requirement-view"
      - "ae:skill-config"
assignments:
  - id: 01900000-0000-7000-8000-0000000000b9
    type: group
---
# resource_type: role
resource_type: role
id: 01900000-0000-7000-8000-0000000000bc
name: ae-developer
description: AE permissions for the ae-developer group.
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b0
    permissions:
      - "ae:requirement-view"
      - "ae:design-view"
      - "ae:build"
assignments:
  - id: 01900000-0000-7000-8000-0000000000ba
    type: group
