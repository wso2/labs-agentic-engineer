# AE resource server + permission actions + ae-admin/ae-developer groups and
# roles, for the k3d/single-cluster platform IdP. Mirrors
# services/aep-api/internal/authz/role_permissions_catalog.go — every
# name/handle/permission set here must stay in sync with that file — and the
# equivalent bundle in ../../dev-thunder-setup/bootstrap/61-ae-roles.yaml
# (same ids, so the two stay trivially comparable; that file's schema note
# applies here too, verified against Thunder's own built-in role/group
# documents rather than the REST API reference).
#
# Numbered 92 (after the composed platform singletons 89-91) rather than
# slotted into 80-88: those are all taken by existing AEP documents, and
# `setup-thunder.sh`'s ordering guard only constrains `server_config`
# singletons of the same `name` — a resource_server/group/role/user document
# has no such constraint, so sorting after 89-91 is harmless.
#
# aeadmin (below) MUST be declared before the ae-admin group: Thunder only
# accepts a group's `members` list at group-CREATE time (see
# services/aep-api/internal/clients/thundersvc/directory.go) — a later
# update is silently ignored, so the ordering here is load-bearing, not
# stylistic.

# resource_type: user_type
#
# Must exist before aeadmin (below) sets type: AEUser or
# 87-aep-console-app.yaml sets allowedUserTypes: [AEUser] — Thunder has no
# free-form "type" string; `type` on a user is a genuine reference to a
# user_type resource. Schema mirrored from Agent Manager's own working
# example (wso2-amp-thunder-extension's 66-amp-user-type-engineer.yaml),
# extended with sub/name since aeadmin below sets those attributes.
id: AEUser
category: user
name: "AEUser"
ouHandle: default
allowSelfRegistration: false
systemAttributes:
  display: username
schema:
  username:
    type: string
    displayName: Username
    required: true
    unique: true
  password:
    type: string
    displayName: Password
    required: true
    credential: true
  sub:
    type: string
    displayName: Subject
  name:
    type: string
    displayName: Display Name
  given_name:
    type: string
    displayName: First Name
  family_name:
    type: string
    displayName: Last Name
  email:
    type: string
    displayName: Email
---
# resource_type: resource_server
id: 01900000-0000-7000-8000-0000000000b0
name: AEP API
description: Permissions for aep-api's console-facing endpoints.
identifier: ae
ouHandle: default
resources:
  - name: AE
    handle: ae
    description: AE permission actions
    actions:
      - name: Build
        handle: build
        description: Trigger and view builds
      - name: Build View
        handle: build-view
        description: View builds without triggering
      - name: Design View
        handle: design-view
        description: View design/spec artifacts
      - name: GitHub Config
        handle: github-config
        description: Configure the GitHub integration
      - name: Model Config
        handle: model-config
        description: Configure the coding-agent model
      - name: Requirement Update
        handle: requirement-update
        description: Author/update requirements
      - name: Requirement View
        handle: requirement-view
        description: View requirements
      - name: Skill Config
        handle: skill-config
        description: Configure skills
---
# resource_type: user
#
# The default AE admin login (replaces the platform IdP's own built-in
# admin for aep-console-client purposes — see the allowedUserTypes note in
# 87-aep-console-app.yaml). Declared here, before the ae-admin group, per
# this file's header note on group-membership ordering.
id: 01900000-0000-7000-8000-0000000000a3
type: AEUser
ouHandle: default
attributes:
  username: aeadmin
  sub: aeadmin
  email: aeadmin@testorg.com
  name: AE Admin
  given_name: AE
  family_name: Admin
credentials:
  password: admin
---
# resource_type: group
id: 01900000-0000-7000-8000-0000000000b9
name: ae-admin
description: Full access to every AE permission.
ouHandle: default
# See this file's header: membership is only honored at group-CREATE time.
members:
  - id: 01900000-0000-7000-8000-0000000000a3
    type: user
---
# resource_type: group
id: 01900000-0000-7000-8000-0000000000ba
name: ae-developer
description: Read/build access to AE requirements, design, and builds.
ouHandle: default
---
# resource_type: role
id: 01900000-0000-7000-8000-0000000000bb
name: ae-admin
description: AE permissions for the ae-admin group.
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b0
    permissions:
      - "ae:build"
      - "ae:build-view"
      - "ae:design-view"
      - "ae:github-config"
      - "ae:model-config"
      - "ae:requirement-update"
      - "ae:requirement-view"
      - "ae:skill-config"
assignments:
  - id: 01900000-0000-7000-8000-0000000000b9
    type: group
---
# resource_type: role
id: 01900000-0000-7000-8000-0000000000bc
name: ae-developer
description: AE permissions for the ae-developer group.
ouHandle: default
permissions:
  - resourceServerId: 01900000-0000-7000-8000-0000000000b0
    permissions:
      - "ae:requirement-view"
      - "ae:design-view"
      - "ae:build"
assignments:
  - id: 01900000-0000-7000-8000-0000000000ba
    type: group
