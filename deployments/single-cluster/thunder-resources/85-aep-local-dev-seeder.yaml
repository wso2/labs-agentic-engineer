# resource_type: application
resource_type: application
id: aep-local-dev-seeder
type: m2m # client_credentials only, no interactive login
name: "AEP Local Dev Seeder"
description: "Local-dev convenience client used by scripts/seed-dev.sh to POST a GitHub PAT and Anthropic key to the default org. Not used by any platform code path."
ouId: "01900000-0000-7000-8000-000000000001"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "aep-local-dev-seeder"
      clientSecret: "aep-local-dev-seeder-secret"
      grantTypes: ["client_credentials"]
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
