# postgres-cnpg — sample platform-resource ClusterResourceType (P5).
#
# Installed by the local deployments/ scripts (acting as the cluster PE would);
# app-factory's BFF only DISCOVERS and REFERENCES this type — it never authors a
# ClusterResourceType (see p5-constraints "app-factory authors only the Resource +
# binding"). This is the concrete `resourceType` an architect's platform-resource
# dependency names (resourceType == ClusterResourceType.metadata.name == "postgres-cnpg").
#
# It renders a CloudNativePG `Cluster` (postgresql.cnpg.io/v1). CNPG auto-generates
# a `<cluster>-app` Secret with keys: host, port, dbname, username, password, user,
# uri (+ pgpass / *-jdbc-uri variants). The Resource model resolves `${metadata.name}`
# to a hashed render name (e.g. `r-<binding>-<hash>`); CNPG names the app secret and
# the `-rw` Service off that same name, so the `${metadata.name}-...` refs line up.
#
# CEL context (per OC 1.1.1 ResourceType CRD docs): readyWhen/outputs are evaluated
# against metadata.*, parameters.*, environmentConfigs.*, dataplane.*, and — once the
# manifest is applied — applied.<id>.status.* (the rendered object's live status).
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: postgres-cnpg
  annotations:
    # description → the type's prose self-description; surfaced to the architect
    # via list_platform_resource_types (it picks the type whose description
    # matches the need) and to users in the console dependency drawer.
    aep.wso2.com/description: >-
      A dedicated PostgreSQL database cluster provisioned inside the platform
      (CloudNativePG). Declare on the service that owns the data.
spec:
  retainPolicy: Delete
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        version:
          type: string
          default: "16"
          # Bound the image tag to a small allowlist so a consumer can't request an
          # arbitrary `ghcr.io/cloudnative-pg/postgresql:<tag>` image.
          enum: ["16", "15"]
        storage:
          type: string
          default: "1Gi"
          # Fixed-size allowlist — closes the arbitrary-PVC-size over-provision surface.
          enum: ["1Gi", "5Gi", "10Gi"]
        instances:
          type: integer
          default: 1
          minimum: 1
          # Cap replica count so a consumer can't over-provision the data plane.
          maximum: 3
  resources:
    - id: cluster
      # readyWhen gates the binding's ResourcesReady/Ready on the CNPG Cluster
      # actually SERVING — not merely on a successful apply. This is load-bearing
      # for P5's async-provisioning safety: OC 1.1.1's getUnknownResourceHealth
      # returns `Healthy` UNCONDITIONALLY for unknown Kinds (a foreign CRD like the
      # CNPG `Cluster`), so WITHOUT this gate the binding flips Ready=True at APPLY
      # time — before Postgres serves — and the A5 watcher would mark the consumer
      # task `deployed` against a non-serving DB.
      #
      # OC 1.1.1 DOES copy the foreign CRD's FULL live `status` into
      # `applied.<id>.status` every reconcile, so `applied.cluster.status.phase` is
      # available once CNPG writes it. The `has()` chain makes both the brief
      # pre-APPLY window (the `applied.cluster` key does not exist yet) and the
      # pre-PHASE window (status object exists but `.phase` not yet written)
      # evaluate to `false` cleanly — fail-closed until the real CNPG healthy phase
      # "Cluster in healthy state" appears. LIVE-VERIFIED 2026-06-30: the binding
      # held Ready=False through "Setting up primary" / "Waiting for the instances
      # to become active" and flipped Ready=True ONLY after phase reached "Cluster
      # in healthy state" (gated transition, never an early flip).
      readyWhen: '${has(applied.cluster) && has(applied.cluster.status) && has(applied.cluster.status.phase) && applied.cluster.status.phase == "Cluster in healthy state"}'
      template:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          instances: ${parameters.instances}
          imageName: ghcr.io/cloudnative-pg/postgresql:${parameters.version}
          storage:
            size: ${parameters.storage}
          bootstrap:
            initdb:
              database: appdb
              owner: appuser
  outputs:
    # Plain coordinates — exposed as values (the BFF surfaces them un-masked).
    - name: host
      value: ${metadata.name}-rw.${metadata.namespace}.svc.cluster.local
    - name: port
      value: "5432"
    - name: dbname
      value: appdb
    # Credentials — resolved from the CNPG-generated `<cluster>-app` Secret as
    # references only (the BFF reads the secretKeyRef, never the value).
    - name: user
      secretKeyRef:
        name: ${metadata.name}-app
        key: username
    - name: password
      secretKeyRef:
        name: ${metadata.name}-app
        key: password
