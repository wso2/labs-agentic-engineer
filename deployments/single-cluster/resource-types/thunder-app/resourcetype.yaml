# thunder-app — sample platform-resource ClusterResourceType (P5).
#
# Installed by the local deployments/ scripts (acting as the cluster PE would);
# app-factory's BFF only DISCOVERS and REFERENCES this type — it never authors a
# ClusterResourceType (see p5-constraints "app-factory authors only the Resource +
# binding"). This is the concrete `resourceType` an architect's platform-resource
# dependency names (resourceType == ClusterResourceType.metadata.name == "thunder-app").
#
# It renders a `ThunderApplication` (aep.wso2.com/v1alpha1) — a namespaced CR the
# thunder-app-operator reconciles into a real OAuth app on the platform Thunder
# IdP. On success the operator sets `status.ready=true` + `status.clientId` (the
# client_id output below reads the latter) and additionally writes a ConfigMap
# `<cr-name>-oauth` with key `client_id`. The Resource model resolves
# `${metadata.name}` to a hashed render name (e.g. `r-<binding>-<hash>`).
#
# CEL context (per OC 1.1.1 ResourceType CRD docs): readyWhen/outputs are evaluated
# against metadata.*, parameters.*, environmentConfigs.*, dataplane.*, and — once the
# manifest is applied — applied.<id>.status.* (the rendered object's live status).
#
# ── Marker vocabulary (metadata labels/annotations) ────────────────────────────
# The labels/annotations below are how the PE (the type author) TELLS AEP which
# consumption behaviors this resource type needs. AEP keys its behavior ONLY on
# these markers — it has NO hardcoded type names, so "thunder-app" is just data.
# Adding a new auth flavor (or any new type) is a cluster install + a skill, never
# an app-factory release. The markers AEP understands:
#
#   aep.wso2.com/description: <prose>
#     Human prose describing what the type provides and when to depend on it.
#     Surfaced to the architect via the list_platform_resource_types MCP tool
#     (the architect picks the type whose description matches the need) and to
#     users in the console dependency drawer.
#
#   aep.wso2.com/role: end-user-auth
#     A service declaring a dependency of this type gets
#     `exposesAPI.auth: end-user-required` stamped at design save (an explicit
#     conflicting `service-required` is a validation error).
#
#   aep.wso2.com/consumer-url-env-config: redirectUris
#     Once the consuming web-app's public URL resolves, the platform patches
#     `<spaOrigin><consumer-url-path>` into this env-config key on the dep's
#     dev binding — here that fills `environmentConfigs.redirectUris` below.
#
#   aep.wso2.com/consumer-url-path: <path>   (OMITTED here on purpose)
#     Path appended to the consumer origin for the patch above. Absent, the
#     platform defaults to `/callback`, which is exactly what this type wants,
#     so we leave it off and let the default apply.
#
#   aep.wso2.com/skill: thunder-authentication
#     Design save ensures this skill is present in the design's `skillsApplied`
#     whenever a dependency of this type exists — the per-type teaching lives in
#     the skill, not in platform code.
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: thunder-app
  labels:
    # role → design-save stamps end-user-required auth on services that depend on this type.
    aep.wso2.com/role: end-user-auth
  annotations:
    # description → the type's prose self-description; surfaced to the architect
    # via list_platform_resource_types (it picks the type whose description
    # matches the need) and to users in the console dependency drawer.
    aep.wso2.com/description: >-
      End-user sign-in for this project's apps: provisions an OAuth (PKCE)
      client on the platform IdP. Declare on both the web app that signs
      users in and the service whose API it protects.
    # consumer-url-env-config → platform patches <spaOrigin><path> into this env-config key.
    aep.wso2.com/consumer-url-env-config: redirectUris
    # consumer-url-path omitted → defaults to /callback (the path this OAuth app expects).
    # skill → design-save appends this skill to the design's skillsApplied when this dep is present.
    aep.wso2.com/skill: thunder-authentication
spec:
  retainPolicy: Delete
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        displayName:
          type: string
          default: ""
        scopes:
          type: string
          # Space-separated OAuth scopes the SPA requests. `group` and `ou` are
          # required for role-aware apps: verified on Thunder 0.34 that `groups`
          # (and `ou*`) reach the ID TOKEN only when these scopes are granted —
          # the app's scopeClaims map them (set by the thunder-app operator). The
          # SPA reads roles from `user.profile.groups`; drop `group` and it sees
          # no role. See the thunder-authentication skill.
          default: "openid profile email group ou"
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        redirectUris:
          type: string
          # Comma-separated allowed redirect URIs; platform-managed (the BFF fills
          # this per environment). Defaults to empty so an unset env config renders
          # a bare "" rather than erroring on the ${environmentConfigs.redirectUris}
          # substitution.
          default: ""
  resources:
    - id: app
      # ─────────────────────────────────────────────────────────────────────────
      # INSTANT PROVISIONING — readyWhen relaxed to ${true} on purpose.
      #
      # The OAuth app's client_id is DETERMINISTIC: the operator always registers
      # it on Thunder as "aep-<cr-namespace>-<cr-name>" (see thunderAppName in the
      # operator's thunderapplication_controller.go), and Thunder honours a
      # caller-supplied client_id. So the client_id is fully known at render time
      # and does NOT need to be read back from the CR's live status (see the
      # client_id output below).
      #
      # Gating readyWhen on applied.app.status.ready would tie readiness to live CR
      # status, which OpenChoreo only re-observes on its ~5-minute "stable" requeue
      # (it has no health check for foreign CRDs like ThunderApplication —
      # getUnknownResourceHealth reports them Healthy immediately), making the
      # binding take ~5 min to go Ready. Tracking: openchoreo/openchoreo#4323.
      #
      # TRADE-OFF: with ${true} the binding reports Ready before Thunder finishes
      # registering the app, so a login attempt in the first ~few seconds can fail
      # and then self-heal. Acceptable for these local single-cluster dev types.
      readyWhen: '${true}'
      template:
        apiVersion: aep.wso2.com/v1alpha1
        kind: ThunderApplication
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          displayName: ${parameters.displayName}
          scopes: ${parameters.scopes}
          redirectUris: ${environmentConfigs.redirectUris}
  outputs:
    # client_id is DETERMINISTIC — the operator registers the OAuth app on Thunder
    # as "aep-<cr-namespace>-<cr-name>" (thunderAppName in the operator), and
    # Thunder honours that caller-supplied id. So we emit it as a rendered literal
    # instead of reading `applied.app.status.clientId`. This keeps the output
    # resolvable at APPLY time — no dependency on live CR status, which OpenChoreo
    # only re-observes every ~5 min (openchoreo/openchoreo#4323) — and it is the
    # `value` shape the aep-api runtimeconfig env-config.js path requires (it reads
    # `output.value` only; a configMapKeyRef-shaped output carries no value in
    # binding status). metadata.namespace / metadata.name here resolve to the same
    # rendered CR namespace/name the operator derives thunderAppName from, so the
    # literal matches the registered client_id exactly.
    #
    # The operator ALSO publishes client_id in the `<cr-name>-oauth` ConfigMap;
    # that stays useful as a k8s-native artifact and for generic valueFrom-style
    # env injection — but the authoritative binding output is this literal.
    - name: client_id
      value: aep-${metadata.namespace}-${metadata.name}
    # Plain coordinates — exposed as values (the BFF surfaces them un-masked). The
    # issuer/jwks_url are the browser-reachable Thunder addresses (they match the
    # compose PLATFORM_IDP_ISSUER host thunder.openchoreo.localhost:8080).
    - name: issuer
      value: http://thunder.openchoreo.localhost:8080
    - name: jwks_url
      value: http://thunder.openchoreo.localhost:8080/oauth2/jwks
    - name: scopes
      value: ${parameters.scopes}
