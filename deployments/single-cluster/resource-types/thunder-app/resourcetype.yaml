# thunder-app — sample platform-resource ClusterResourceType (P5).
#
# Installed by the local deployments/ scripts (acting as the cluster PE would);
# app-factory's BFF only DISCOVERS and REFERENCES this type — it never authors a
# ClusterResourceType (see p5-constraints "app-factory authors only the Resource +
# binding"). This is the concrete `resourceType` an architect's platform-resource
# dependency names (resourceType == ClusterResourceType.metadata.name == "thunder-app").
#
# It renders a `ThunderApplication` (aep.wso2.com/v1alpha1) — a namespaced CR the
# thunder-app-operator reconciles into a real OAuth app on the Thunder that
# serves this (organization, environment). WHICH instance that is comes from the
# environment's binding record, not from this file: the operator reads the
# `openchoreo.dev/namespace` and `openchoreo.dev/environment` labels that
# OpenChoreo's renderedrelease-controller stamps on the rendered CR (verified
# live — the template does not have to add them) and looks up the ConfigMap
# labelled `aep.wso2.com/kind=thunder-binding` for that pair. On success the
# operator sets `status.ready=true`, `status.clientId`, `status.issuer` and
# `status.jwksUrl` (the outputs below read the last three) and additionally
# writes a ConfigMap `<cr-name>-oauth` with keys `client_id`, `issuer`,
# `jwks_url`. The Resource model resolves `${metadata.name}` to a hashed render
# name (e.g. `r-<binding>-<hash>`).
#
# CEL context (per OC 1.1.1 ResourceType CRD docs): readyWhen/outputs are evaluated
# against metadata.*, parameters.*, environmentConfigs.*, dataplane.*, and — once the
# manifest is applied — applied.<id>.status.* (the rendered object's live status).
#
# ── Marker vocabulary (metadata labels/annotations) ────────────────────────────
# The labels/annotations below are how the PE (the type author) TELLS AEP which
# consumption behaviors this resource type needs. AEP keys its behavior ONLY on
# these markers — it has NO hardcoded type names, so "thunder-app" is just data.
# Adding a new auth flavor (or any new type) is a cluster install + a skill, never
# an app-factory release. The markers AEP understands:
#
#   aep.wso2.com/description: <prose>
#     Human prose describing what the type provides and when to depend on it.
#     Surfaced to the architect via the list_platform_resource_types MCP tool
#     (the architect picks the type whose description matches the need) and to
#     users in the console dependency drawer.
#
#   aep.wso2.com/role: end-user-auth
#     A service declaring a dependency of this type gets
#     `exposesAPI.auth: end-user-required` stamped at design save (an explicit
#     conflicting `service-required` is a validation error).
#
#   aep.wso2.com/consumer-url-env-config: redirectUris
#     Once the consuming web-app's public URL resolves, the platform patches
#     `<spaOrigin><consumer-url-path>` into this env-config key on the dep's
#     dev binding — here that fills `environmentConfigs.redirectUris` below.
#
#   aep.wso2.com/consumer-url-path: <path>   (OMITTED here on purpose)
#     Path appended to the consumer origin for the patch above. Absent, the
#     platform defaults to `/callback`, which is exactly what this type wants,
#     so we leave it off and let the default apply.
#
#   aep.wso2.com/skill: thunder-authentication
#     Design save ensures this skill is present in the design's `skillsPinned`
#     whenever a dependency of this type exists — the per-type teaching lives in
#     the skill, not in platform code.
---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterResourceType
metadata:
  name: thunder-app
  labels:
    # role → design-save stamps end-user-required auth on services that depend on this type.
    aep.wso2.com/role: end-user-auth
  annotations:
    # description → the type's prose self-description; surfaced to the architect
    # via list_platform_resource_types (it picks the type whose description
    # matches the need) and to users in the console dependency drawer.
    aep.wso2.com/description: >-
      End-user sign-in for this project's apps: provisions an OAuth (PKCE)
      client on this environment's identity provider. Declare on both the
      web app that signs users in and the service whose API it protects.
    # consumer-url-env-config → platform patches <spaOrigin><path> into this env-config key.
    aep.wso2.com/consumer-url-env-config: redirectUris
    # consumer-url-path omitted → defaults to /callback (the path this OAuth app expects).
    # skill → design-save appends this skill to the design's skillsPinned when this dep is present.
    aep.wso2.com/skill: thunder-authentication
spec:
  retainPolicy: Delete
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        displayName:
          type: string
          default: ""
        scopes:
          type: string
          # Space-separated OAuth scopes the SPA requests: the OIDC scopes plus
          # the project's API permission handles. Platform-derived — aep-api
          # overlays it from security.json's catalog, so an authored value never
          # reaches here. The operator splits it and writes the list to the
          # application's inboundAuthConfig[oauth2].config.scopes.
          #
          # `group` and `ou` are required for role-aware apps: verified on
          # Thunder 0.34 that `groups` (and `ou*`) reach the ID TOKEN only when
          # these scopes are granted — the app's scopeClaims map them (set by
          # the thunder-app operator). See the thunder-authentication skill.
          #
          # The list is a truthful RECORD of what the client asks for, NOT a
          # gate: ThunderID 1.0.0 stores it and never enforces it, and drops an
          # unknown or ungranted handle silently. The only narrowing is
          # group -> role -> permissions, intersected with the resource server
          # named below.
          default: "openid profile email group ou"
        resource:
          type: string
          # The OAuth 2.0 resource indicator (RFC 8707) naming the project's own
          # resource server — the audience its API tokens must carry. Platform-
          # derived: aep-api sets it to the deterministic per-project identifier
          # https://aep.wso2.com/orgs/<org>/projects/<project>, which is also
          # what the roles gate registers on the IdP.
          #
          # It is a pure pass-through: nothing in the rendered CR consumes it.
          # It exists so the binding can EMIT it (see the `resource` output),
          # which is how the generated SPA reads <DEP>_RESOURCE out of
          # window._env_ and sends it on /authorize.
          default: ""
        validityPeriod:
          type: integer
          # ACCESS token lifetime in seconds. The default keeps a returning user
          # signed in across a refresh/new tab; the ID token keeps the 24h
          # default regardless. A short value exists only so a fixture app can
          # exercise the silent renew in minutes instead of a day (spike P6 used
          # 300) — nothing in aep-api overrides it today, so shortening one app
          # is a deliberate `kubectl patch` on its ThunderApplication CR.
          default: 86400
          minimum: 60
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        redirectUris:
          type: string
          # Comma-separated allowed redirect URIs; platform-managed (the BFF fills
          # this per environment). Defaults to empty so an unset env config renders
          # a bare "" rather than erroring on the ${environmentConfigs.redirectUris}
          # substitution.
          default: ""
  resources:
    - id: app
      # ─────────────────────────────────────────────────────────────────────────
      # INSTANT PROVISIONING — readyWhen relaxed to ${true} on purpose.
      #
      # The OAuth app's client_id is DETERMINISTIC: the operator always registers
      # it on Thunder as "aep-<cr-namespace>-<cr-name>" (see thunderAppName in the
      # operator's thunderapplication_controller.go), and Thunder honours a
      # caller-supplied client_id. So the client_id is fully known at render time
      # and does NOT need to be read back from the CR's live status (see the
      # client_id output below).
      #
      # Gating readyWhen on applied.app.status.ready would tie readiness to live CR
      # status, which OpenChoreo only re-observes on its ~5-minute "stable" requeue
      # (it has no health check for foreign CRDs like ThunderApplication —
      # getUnknownResourceHealth reports them Healthy immediately), making the
      # binding take ~5 min to go Ready. Tracking: openchoreo/openchoreo#4323.
      #
      # readyWhen is not the whole gate anyway: the binding's Ready condition also
      # requires its outputs to resolve, and the issuer/jwks_url outputs below DO
      # read the CR's live status — so a binding still cannot go Ready before the
      # operator has registered the app and recorded where. What ${true} avoids is
      # a SECOND, redundant dependency on the same live status.
      readyWhen: '${true}'
      template:
        apiVersion: aep.wso2.com/v1alpha1
        kind: ThunderApplication
        metadata:
          name: ${metadata.name}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          displayName: ${parameters.displayName}
          scopes: ${parameters.scopes}
          validityPeriod: ${parameters.validityPeriod}
          redirectUris: ${environmentConfigs.redirectUris}
  outputs:
    # client_id is DETERMINISTIC — the operator registers the OAuth app on Thunder
    # as "aep-<cr-namespace>-<cr-name>" (thunderAppName in the operator), and
    # Thunder honours that caller-supplied id. So we emit it as a rendered literal
    # instead of reading `applied.app.status.clientId`. This keeps the output
    # resolvable at APPLY time — no dependency on live CR status, which OpenChoreo
    # only re-observes every ~5 min (openchoreo/openchoreo#4323) — and it is the
    # `value` shape the aep-api runtimeconfig env-config.js path requires (it reads
    # `output.value` only; a configMapKeyRef-shaped output carries no value in
    # binding status). metadata.namespace / metadata.name here resolve to the same
    # rendered CR namespace/name the operator derives thunderAppName from, so the
    # literal matches the registered client_id exactly.
    #
    # The operator ALSO publishes client_id in the `<cr-name>-oauth` ConfigMap;
    # that stays useful as a k8s-native artifact and for generic valueFrom-style
    # env injection — but the authoritative binding output is this literal.
    - name: client_id
      value: aep-${metadata.namespace}-${metadata.name}
    # Plain coordinates — exposed as values (the BFF surfaces them un-masked).
    #
    # These are READ BACK FROM THE CR's STATUS, unlike client_id above, because
    # they are not derivable at render time: which Thunder an app lives on is a
    # property of the (org, environment) it is rendered into, resolved by the
    # operator from that environment's binding record (the ConfigMap labelled
    # aep.wso2.com/kind=thunder-binding, written by
    # deployments/scripts/setup-environment-thunder.sh). Rendering a literal
    # here would be a second, independent copy of the issuer rule and would go
    # stale the moment an environment's Thunder is re-provisioned elsewhere.
    #
    # The ~5-minute re-observe that made client_id a literal
    # (openchoreo/openchoreo#4323) does not bite here: when the operator sets
    # status it patches an annotation on the owning ResourceReleaseBinding
    # (nudgeOwningBindings), which forces the one re-reconcile that resolves
    # these outputs — measured at a few seconds on the local cluster.
    - name: issuer
      value: ${applied.app.status.issuer}
    - name: jwks_url
      value: ${applied.app.status.jwksUrl}
    - name: scopes
      value: ${parameters.scopes}
    # resource is the second half of the binding the SPA needs: client_id says
    # WHO is asking, issuer/jwks_url say WHO signs, scopes say WHAT is asked
    # for, and `resource` says WHICH API the resulting token is for. The SPA
    # sends it on /authorize and Thunder stamps it as the token's `aud`, which
    # is exactly what the gateway validates.
    #
    # A parameter echo, like `scopes` — the value is authored by aep-api's
    # overlay from the project's own identity, so nothing has to be read back
    # from the CR's live status. That keeps the output resolvable at APPLY time
    # (see the client_id note above).
    - name: resource
      value: ${parameters.resource}
