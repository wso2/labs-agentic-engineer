# Cluster-scoped RBAC: the operator watches ThunderApplications in ALL
# namespaces and manages the ConfigMaps it publishes there, so a ClusterRole
# (not a namespaced Role) is required.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: thunder-app-operator
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
rules:
  # The CRD this operator owns — full lifecycle across all namespaces.
  - apiGroups: ["aep.wso2.com"]
    resources: ["thunderapplications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status subresource — the reconciler gates readiness via status.
  - apiGroups: ["aep.wso2.com"]
    resources: ["thunderapplications/status"]
    verbs: ["get", "update", "patch"]
  # Finalizers — the reconciler adds/removes a finalizer for ordered deletes.
  - apiGroups: ["aep.wso2.com"]
    resources: ["thunderapplications/finalizers"]
    verbs: ["update"]
  # Two cluster-wide ConfigMap uses: the published <cr-name>-oauth ConfigMaps
  # carrying the assigned client_id + issuer, and the read of the binding record
  # ConfigMap that says which Thunder an (org, environment) uses — that one
  # lives in the target Thunder's namespace, so the grant cannot be narrowed to
  # this release's namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events — controller-runtime records reconcile events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # OpenChoreo RenderedReleases — the operator nudges the RenderedRelease that
  # applied an app (annotation patch) when the app becomes ready, so OC
  # re-observes the app's status now instead of on its ~6-minute requeue; the
  # owning ResourceReleaseBinding then resolves its issuer/jwks_url outputs
  # from that fresh snapshot.
  - apiGroups: ["openchoreo.dev"]
    resources: ["renderedreleases"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thunder-app-operator
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: thunder-app-operator
subjects:
  - kind: ServiceAccount
    name: thunder-app-operator
    namespace: {{ .Release.Namespace }}
---
# Secrets are intentionally NOT in the ClusterRole above. The operator reads
# Secrets ONLY from its own release namespace: the credential half of every
# (org, environment) Thunder binding, which setup-environment-thunder.sh mirrors
# here precisely because this grant is namespace-scoped, and the client secrets
# of confidential CRs that live in this namespace. A namespace-scoped Role
# limits the blast radius: no CR can be used to read Secrets from other
# namespaces, and no binding credential is readable outside this release.
# list;watch are required in addition to get because the controller-runtime
# cache informer must be able to enumerate and subscribe to Secret changes
# before the manager starts serving reconcile requests.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: thunder-app-operator-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: thunder-app-operator-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: thunder-app-operator-secrets
subjects:
  - kind: ServiceAccount
    name: thunder-app-operator
    namespace: {{ .Release.Namespace }}
