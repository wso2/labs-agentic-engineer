apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-app-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "thunder-app-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "thunder-app-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: thunder-app-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # POD_NAMESPACE is the operator's whole configuration: it scopes the
            # Secret informer and names where binding Secrets are mirrored.
            # Thunder coordinates and credentials are per (org, environment) and
            # come from the binding records — see values.yaml.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
