{{- if not .Values.thunder.existingSecret }}
# Chart-managed Secret holding the operator's Thunder system client credentials.
# Rendered only when the caller has NOT supplied thunder.existingSecret. See the
# LOCAL DEV DEFAULTS ONLY warning in values.yaml — real clusters should point
# thunder.existingSecret at an externally managed Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: thunder-app-operator-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "thunder-app-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.thunder.systemClientID | quote }}
  client-secret: {{ .Values.thunder.systemClientSecret | quote }}
{{- end }}
