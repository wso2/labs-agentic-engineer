# Default values for the thunder-app-operator chart.

image:
  repository: ghcr.io/wso2/aep/thunder-app-operator
  # Empty by default so the deployment falls back to the chart's appVersion — an
  # immutable, version-pinned tag rather than a mutable `latest` (which pairs
  # badly with IfNotPresent: a cached `latest` node image is never refreshed).
  # The release workflow overrides this with the concrete release version at
  # package time; local/source installs get the appVersion (0.0.0-dev).
  tag: ""
  pullPolicy: IfNotPresent

# Number of manager replicas. Keep at 1 — the manager runs with leader election
# OFF (see main.go), so more than one replica would double-reconcile.
replicaCount: 1

# The operator has no Thunder of its own — nothing to configure here.
#
# Each ThunderApplication is registered on the Thunder that serves its (org,
# environment), resolved per CR at reconcile time from the BINDING RECORD that
# deployments/scripts/setup-environment-thunder.sh writes:
#
#   ConfigMap  labelled aep.wso2.com/kind=thunder-binding,
#              aep.wso2.com/org=<org>, aep.wso2.com/env=<env>, in that
#              environment's Thunder namespace. Selected by label, never by
#              name. Keys read here: issuer, adminURL,
#              systemResourceIdentifier, secretName, secretNamespace.
#   Secret     named by the ConfigMap's `secretName`, MIRRORED into this
#              release's namespace (the operator watches Secrets only there —
#              see the ClusterRole/Role in templates/rbac.yaml). Keys read
#              here: client-id, client-secret.
#
# A CR whose (org, environment) has no such record reports Ready=false with a
# message naming what is missing, and reconciles as soon as the record appears.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
