# AEP's system client on an ENVIRONMENT Thunder (T2). One instance of this
# document is imported into each per-environment Thunder; the client id is the
# same on every T2 (and on the platform IdP), the secret is per environment —
# generated by scripts/setup-environment-thunder.sh and stored in the T2
# namespace as Secret `<release>-aep-system-client`, mirrored to the
# thunder-app-operator's namespace as `thunder-binding-<org>-<env>`.
#
# `system` is the ONLY scope: this client exists so AEP (thunder-app-operator,
# aep-api's identity code) can drive THIS Thunder's admin API and publish
# per-component OAuth apps, roles and test users into it. It is not an
# interactive client and has no business with openid/profile/email here.
#
# Every mint MUST send `resource=<issuer>/mcp` (the System resource server's
# identifier, see 84-aep-system-role.yaml and the binding ConfigMap's
# systemResourceIdentifier). Without it a Thunder whose default resource server
# is someone else's returns 200 with a scope-less token and every admin call
# 403s — that is the platform IdP's trap; T2's bootstrap sets the default to the
# System RS so it does not bite here, but the rule is the same everywhere.
#
# ouId (not ouHandle): the importer never resolves ouHandle for `application`
# documents, so an app declared with ouHandle ends up with no OU at all.
# "01900000-0000-7000-8000-000000000001" is ThunderID's built-in `default` OU,
# fixed on every install. `attributes` opts the client_credentials token into
# carrying ouId/ouHandle claims, which org-scoped endpoints need.
resource_type: application
id: aep-system-client
type: m2m
name: "AEP System Client"
description: "AEP's system client for the ${ENV_NAME} environment Thunder (org ${ORG_NAME}). Mints scope=system tokens to publish AEP-owned OAuth apps, roles and users into this instance. Granted `system` by 84-aep-system-role.yaml."
ouId: "01900000-0000-7000-8000-000000000001"
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "aep-system-client"
      clientSecret: '${AEP_SYSTEM_CLIENT_SECRET}'
      grantTypes: ["client_credentials"]
      tokenEndpointAuthMethod: "client_secret_post"
      pkceRequired: false
      publicClient: false
      scopes: ["system"]
      token:
        accessToken:
          clientConfig:
            validityPeriod: 3600
            attributes: ["ouId", "ouHandle"]
