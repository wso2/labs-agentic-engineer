localSecrets:
  # LOCAL DEV ONLY. When true, ESO ExternalSecrets and SecretStore are not
  # deployed — the chart expects plain K8s Secrets with the right names to
  # already exist (created by deployments/scripts/setup-local-secrets.sh).
  # In production (false), ESO syncs secrets from OpenBao as normal.
  enabled: false

aepApi:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/aep-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  logLevel: "info"
  deploymentTier: "dev"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  serviceAuth:
    clientId: "aep-api-client"
  publicURL: "http://aep-api.openchoreo.localhost:8080"

aepAgents:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/agents
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  logLevel: "info"
  model: "claude-sonnet-5"
  maxSteps: 20
  bodyLimit: "10mb"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"


# Yjs/Hocuspocus collaboration server for the spec workspace. aep-agents joins
# rooms as a live peer (AGENT_COLLAB_WS_URL) and the console proxies /collab to
# it; it calls aep-api for room auth + spec seeding. Without it, agents spec
# generation returns 503 ("collab is not configured on this deployment").
collab:
  # mandatory: in-memory rooms Map; 2nd replica silently overwrites commits (doc-wins)
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/collab
    tag: latest
    pullPolicy: IfNotPresent
  port: 3400
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Streamable-HTTP MCP server wrapping aep-api's issue-create + coding-agent
# dispatch endpoints. The OpenChoreo SRE/RCA agent calls it (AE_API_URL) during
# the alert->RCA->AEP handoff so it can file issues + dispatch without holding
# AE's GitHub credentials. Stateless; forwards the caller's bearer to aep-api,
# which enforces org-scoped auth. Deployed by default (tiny); exercised once the
# SRE stack is installed via `aep sre install`.
aepMcpServer:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/aep-mcp-server
    tag: latest
    pullPolicy: IfNotPresent
  port: 3400
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

console:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/console
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  publicURL: "http://console.openchoreo.localhost:8080"
  thunderPublicURL: "http://thunder.openchoreo.localhost:8080"
  thunder:
    clientId: "aep-console-client"
    scopes: "openid profile email"

codingAgentRunner:
  # Docker image for the runner Job — ONE image for both task kinds
  # (implementation and validation; it bakes Playwright + chromium).
  # OpenChoreo renders the Job into the project's `dp-…` dataplane namespace
  # from the per-org `coding-agent` ComponentType.
  # The release pipeline pins this to ghcr.io/wso2/aep/remote-worker:<version>;
  # empty disables coding dispatch (it fails loudly).
  image: "ghcr.io/wso2/aep/remote-worker:latest"

# Coding-agent dispatch wiring.
#
# A run cycle is an ephemeral OpenChoreo Component created through the OC API;
# aep-api reads its pod logs and resource tree through that same API. The only
# switch left here is the local-dev stub toggle below.
codingAgentDispatch:
  localStubs:
    # LOCAL DEV ONLY. Sets OPENBAO_ADDR/TOKEN on aep-api for in-process secrets
    # delivery. NEVER set true in production — prod injects a real
    # SecretsProvider. `aep init` sets this true for local installs.
    enabled: false

# GitHub webhook delivery. GitHub delivers pull_request/push/issues events to
# deliveryURL, which aep-api registers on each repo; the events drive task state
# (a merged PR ends the coding execution and spawns the build). The HMAC secret
# is generated by aep init into OpenBao and synced via ESO (never a plaintext
# value here).
webhook:
  # deliveryURL: the URL registered on each repo's webhook.
  #   local  → your smee.io channel (localSmee.enabled forwards it into the cluster).
  #   prod   → the real public HTTPS URL of aep-api's /api/v1/webhooks/github
  #            (behind your ingress). NO smee in prod.
  deliveryURL: ""
  localSmee:
    # LOCAL DEV ONLY. Deploys an in-cluster smee-client that subscribes to the
    # smee.io channel in deliveryURL and forwards events to aep-api. smee.io is a
    # third-party public relay (payloads transit it; channel URL is an
    # unauthenticated bearer link), so it must NEVER run in production — set false
    # and use a real ingress + public deliveryURL instead.
    enabled: false
    image: "docker.io/deltaprojects/smee-client:latest"

# Local stand-in for cloud platform-api ProvisionOrgUnit. aep-api references a
# per-org NAMESPACED ComponentType (kind=ComponentType) for each component; the
# base OpenChoreo ClusterComponentType lacks the registry-pull-secret and the
# api-configuration trait, so builds fail "component type not found" without the
# per-org types. In cloud, ProvisionOrgUnit creates them per org; locally nothing
# does. This provisions the api-configuration ClusterTrait + the namespaced
# service/web-application ComponentTypes in the org's control-plane namespace.
localOrgProvisioning:
  # LOCAL DEV ONLY (single-org). PROD: false — platform-api ProvisionOrgUnit
  # creates these per-org, so the chart must not.
  enabled: false
  # The org's OpenChoreo control-plane namespace where the namespaced
  # ComponentTypes are created. For the local single-org install this is the OC
  # control-plane namespace ("default"), NOT the platform release namespace.
  orgNamespace: "default"

taskSigning:
  issuer: "aep-bff"
  audience: "git-service"

observer:
  clientId: "openchoreo-observer-resource-reader-client"

platformAPI:
  # In-cluster URL for the OpenChoreo platform API. aep init passes this from oc.api_url in ~/.aep/config.yaml.
  baseURL: "http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080"

thunder:
  # In-cluster URL for the Thunder service. Override if Thunder is deployed in a different namespace or port.
  adminURL: "http://thunder-service.thunder.svc.cluster.local:8090"
  jwksURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"

openbao:
  # Address of the OpenBao service. Matches: helm install aep ./bundle -n wso2-aep
  addr: "http://aep-aep-openbao.wso2-aep.svc.cluster.local:8200"

# Shared git workspaces (RWO PVC + co-located pods). aep-api writes; agents mounts RO.
# See services/aep-api/design/shared-workspace-volume.md.
workspaces:
  storage: "10Gi"
  storageClassName: ""
  accessMode: "ReadWriteOnce"
  snapshotMaxAge: "1h"
  trashMaxAge: "1h"
  orgQuotaBytes: "2147483648"
  diskHighPct: "85"
  diskLowPct: "70"
  reapInterval: "5m"

postgres:
  version: "16"
  database: aep
  user: aep
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Temporal workflow engine that drives the devflow workflows. aep-api runs the
# worker in-process and dials the frontend below. Backed by the postgres
# StatefulSet above (dedicated temporal / temporal_visibility databases), so
# workflow state is durable across Temporal pod restarts. enabled=false turns
# the whole feature off (no server deployed, no TEMPORAL_* env on aep-api, and
# /devflows answers 503).
temporal:
  enabled: true
  # Temporal namespace aep-api connects to; auto-setup registers it on startup.
  namespace: "default"
  # Task queue the in-process worker polls (matches the aep-api code default).
  taskQueue: "aep-devflow"
  # temporalio/auto-setup pinned to the server version used by
  # deployments/scripts/setup-temporal.sh (admin-tools 1.29.7).
  image: "temporalio/auto-setup:1.29.7"
  imagePullPolicy: IfNotPresent
  db:
    name: "temporal"
    visibilityName: "temporal_visibility"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"