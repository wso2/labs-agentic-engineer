localSecrets:
  # LOCAL DEV ONLY. When true, ESO ExternalSecrets and SecretStore are not
  # deployed — the chart expects plain K8s Secrets with the right names to
  # already exist (created by deployments/scripts/setup-local-secrets.sh).
  # In production (false), ESO syncs secrets from OpenBao as normal.
  enabled: false

aepApi:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/aep-api
    tag: latest
    pullPolicy: IfNotPresent
  port: 9090
  logLevel: "info"
  deploymentTier: "dev"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  serviceAuth:
    clientId: "aep-api-client"
  # Kubernetes API used to LIST ThunderApplication CRs after OpenChoreo Ready.
  # Empty baseURL uses the in-cluster apiserver (single-cluster). On a split
  # control-plane / data-plane install the CRD lives on the dataplane; set
  # baseURL to that apiserver and tokenSecret to a Secret in this namespace
  # with keys `token` and `ca.crt`.
  kubeAPI:
    baseURL: ""
    tokenSecret: ""

console:
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/console
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"
  publicURL: "http://console.ae.localhost:8080"
  thunderPublicURL: "http://thunder.openchoreo.localhost:8080"
  thunder:
    clientId: "aep-console-client"
    scopes: "openid profile email"

# Try it — the platform's test app (apps/tryit), the page an agent does not have
# of its own. The console links to it from "Try agent"; without it that button
# leads nowhere, while a web application's "Visit app" is unaffected because it
# opens the component's own URL.
#
# publicURL is agreed by THREE places and they move together:
#   - this route's hostname (templates/tryit/httproute.yaml)
#   - the console's VITE_TRY_IT_URL, which is the link it builds
#   - aep-api's TRY_IT_CALLBACK_URL, which registers {publicURL}/callback as a
#     redirect URI on every project's sign-in client at deploy time
# Two of the three agreeing is the failure that looks like a working install:
# the link opens and the sign-in is then refused as an unregistered redirect.
# AE Studio: the per-org design-agent / collab / studio-tools pod aep-api
# converges. Every value is optional at boot; an empty image or IdP value makes
# the AE Studio Ensure report "not configured" instead of failing aep-api.
# aectl derives the endpoint values from its config (aeStudioOverrides).
aeStudio:
  internalClient:
    id: "ae-studio-internal-client"
  images:
    designAgent: ""
    collab: ""
    studioTools: ""
  gatewayHost: ""
  publicScheme: "https"
  publicPortSuffix: ""
  listenerName: "https"
  consoleOrigins: []
  idp:
    issuer: ""
    jwksUrl: ""
    tokenUrl: ""
    # Empty falls back to console.thunder.clientId (== JWT_AUDIENCE), the
    # audience user tokens are minted for.
    userAudiences: []
  runtimeClassName: ""
  cilium: false
  extraEgress: []
  storage:
    sizeLimit: "3Gi"
    ephemeralRequest: "1Gi"
    budgetBytes: "2147483648"
  # Per-org webhook relay, for installs GitHub cannot reach (local
  # k3d). When enabled, aep-api reads the seed aep/webhook-relay-seed (ESO
  # Secret aep-webhook-relay) and gives each org's AE Studio pod a webhook-relay
  # container on its own smee.io channel, derived from the seed; the pod's repo
  # hooks deliver there. smee.io is a third-party public relay: never enable it
  # in production. aectl sets enabled from ae_studio.webhook_relay.enabled.
  webhookRelay:
    enabled: false
    image: "ghcr.io/chmouel/gosmee@sha256:60b8db1f68cc4b72366fff941fb2db9a53c3b7a94f23a5e45bd10a777cf7be2f"  # v0.32.0

tryIt:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/wso2/aep/tryit
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  publicURL: "http://tryit.ae.localhost:8080"
  # Where the app may send a token: the environments' public gateway vhost, which
  # is the ClusterDataPlane's ingress host. An endpoint on any other host is
  # refused before sign-in.
  gatewayHosts: "openchoreoapis.localhost"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

codingAgentRunner:
  # Docker image for the runner Job — ONE image for both task kinds
  # (implementation and validation).
  # OpenChoreo renders the Job into the project's `dp-…` dataplane namespace
  # from the per-org `coding-agent` ComponentType.
  # The release pipeline pins this to ghcr.io/wso2/aep/remote-worker:<version>;
  # empty disables coding dispatch (it fails loudly).
  # Never older than aep-api — see docs/developer-guide/releasing.md.
  image: "ghcr.io/wso2/aep/remote-worker:latest"
  # The OpenCode variant: the same Dockerfile's runner-opencode stage (the
  # image above plus the pinned OpenCode binary), used for organizations whose
  # coding-agent runtime is OpenCode. The release pipeline pins this to
  # ghcr.io/wso2/aep/remote-worker-opencode:<version>. Empty takes OpenCode off
  # the menu: GET /config omits it from agents.availableRuntimes, a save
  # choosing it is refused (agents_runtime_unavailable), and an org already on
  # it fails each dispatch naming AGENT_RUNNER_IMAGE_OPENCODE. Claude Code orgs
  # are unaffected.
  opencodeImage: ""
  # How long a finished cycle Job (and its pod) is kept before Kubernetes
  # deletes it, as a Go duration (CODING_AGENT_JOB_TTL; rendered as the Job's
  # ttlSecondsAfterFinished). The cycle's binding is suspended once the run is
  # over, so the Job OpenChoreo re-creates after the TTL never runs again.
  jobTTL: 600s
  # CPU each cycle Job requests (CODING_AGENT_CPU_REQUEST): a positive CPU
  # quantity such as 250m or 0.5, at most 3. Empty keeps the ComponentType's
  # 500m. Lower it on a CPU-starved dataplane. Memory is not tunable.
  cpuRequest: ""

# Coding-agent dispatch wiring.
#
# A run cycle is an ephemeral OpenChoreo Component created through the OC API;
# aep-api reads its pod logs and resource tree through that same API. The only
# switch left here is the local-dev stub toggle below.
codingAgentDispatch:
  openBaoDirect:
    # LOCAL DEV ONLY. Sets OPENBAO_ADDR and OPENBAO_AUTH_ROLE on aep-api for
    # in-process secrets delivery (Kubernetes auth, no token). NEVER set true
    # in production — prod injects a real SecretsProvider. `aectl platform
    # install` sets this true for local installs.
    enabled: false

# Local stand-in for cloud platform-api ProvisionOrgUnit / the org bootstrap.
# aep-api references a per-org NAMESPACED ComponentType (kind=ComponentType) for
# each component; the base OpenChoreo ClusterComponentType lacks the
# registry-pull-secret and the api-configuration trait, so builds fail
# "component type not found" without the per-org types. It also creates every
# project on the per-org NAMESPACED ProjectType/default, without which the
# project never reconciles (ProjectTypeNotFound). In cloud, the platform
# creates them per org; locally nothing does. This provisions the
# api-configuration ClusterTrait, the namespaced service/web-application/ai-agent
# ComponentTypes and ProjectType/default in the org's control-plane namespace.
localOrgProvisioning:
  # LOCAL DEV ONLY (single-org). PROD: false — the platform creates these
  # per-org, so the chart must not.
  enabled: false
  # The org's OpenChoreo control-plane namespace where the namespaced
  # ComponentTypes and ProjectType are created. For the local single-org install this is the OC
  # control-plane namespace ("default"), NOT the platform release namespace.
  orgNamespace: "default"

observer:
  # In-cluster URL of the OpenChoreo Observer. aectl init passes this from
  # oc.observability_api_url in ~/.aectl/config.yaml. Empty disables build-log
  # reading and coding-cycle log archiving (both degrade gracefully — see
  # computeDegradations in aep-api's app.go).
  baseURL: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"
  # How long the observability plane keeps pod logs; aep-api treats archived
  # logs older than this as expired. Matches the plane's OpenSearch retention.
  logRetention: 720h

platformAPI:
  # In-cluster URL for the OpenChoreo platform API. aectl init passes this from oc.api_url in ~/.aectl/config.yaml.
  baseURL: "http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080"

dataPlaneGateway:
  # Whether the DATA-PLANE gateway (the one components' external URLs point at)
  # terminates TLS. Defaults true — the same conservative default
  # config_loader.go's own DATA_PLANE_GATEWAY_TLS falls back to — because a
  # plane that genuinely fronts TLS needs aep-api's endpoint-reachability wait
  # (services/aep-api/internal/projects/endpoint_wait.go) to hold a component
  # at "converging" until its certificate has actually been issued; skipping
  # that unconditionally would reintroduce the race it exists to close. aectl
  # overrides this to false for its own installs via oc.data_plane_gateway_tls
  # (~/.aectl/config.yaml), since its gateway setup always advertises plain
  # http:// URLs with no certificate-issuance step to wait for.
  tls: true

thunder:
  # In-cluster URLs of the platform IdP (release `platform-idp`, namespace
  # `platform-idp`). Chart defaults are literals by nature; the source of truth
  # for the IdP's name is deployments/scripts/env.sh (THUNDER_INTERNAL_URL) and
  # these must agree with it. Override if the IdP moves.
  adminURL: "http://platform-idp-service.platform-idp.svc.cluster.local:8090"
  jwksURL: "http://platform-idp-service.platform-idp.svc.cluster.local:8090/oauth2/jwks"
  # OAuth resource indicator for ThunderID's own "System" resource server, the
  # one that owns the `system` scope aep-api's admin calls need. It is a name,
  # not an address: conventionally "<public issuer>/mcp", so the default derives
  # it from console.thunderPublicURL even though adminURL above is in-cluster.
  # Without it, a Thunder with a default resource server (Agent Manager's, on a
  # converged cluster) drops the scope silently and every admin call 403s.
  # Set only when the IdP registered a non-conventional identifier.
  systemResourceIdentifier: ""

openbao:
  # Address of OpenChoreo's built-in OpenBao service.
  addr: "http://openbao.openbao.svc.cluster.local:8200"

postgres:
  version: "16"
  database: aep
  user: aep
  storage: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# The OpenChoreo SRE agent's handoff into AE (config.SREHandoffConfig). Off by
# default; `aectl sre install` turns it on. aep-api then serves the agent's two
# MCP tools, which search and file a project's issues, at
# /internal/v1/sre-handoff/mcp, and attaches the default "error -> RCA" alert
# rule to service components. One SRE agent serves every org on its plane, so
# each call names its org (the alert's namespace), and aep-api acts only after
# the observer (observer.baseURL, read with aepApi.serviceAuth) confirms that
# alert really fired.
#
# The agent authenticates with one random key that aectl generates and writes
# into tokenSecret (key `token`) here and into the agent's own Secret on the
# observability plane. tokenHash is that key's sha256, which aectl sets so a
# rotated key rolls aep-api: env read from a Secret is fixed at pod start.
#
# The route reaches aep-api over https through the OpenChoreo control-plane
# gateway (templates/aep-api/sre-handoff-route.yaml): the agent's extension
# loader sends its Authorization header only to https URLs. mcpHostname must
# fall under the gateway's https listener hostname and certificate SANs, and
# `aectl sre install --mcp-hostname` must name the same host.
sreAgent:
  enabled: false
  tokenSecret: "sre-handoff"
  tokenHash: ""
  mcpHostname: "aep-mcp.openchoreo.localhost"

# Temporal workflow engine that drives the devflow workflows. aep-api runs the
# worker in-process and dials the frontend below. Backed by the postgres
# StatefulSet above (dedicated temporal / temporal_visibility databases), so
# workflow state is durable across Temporal pod restarts. enabled=false turns
# the whole feature off (no server deployed, no TEMPORAL_* env on aep-api, and
# /devflows answers 503).
temporal:
  enabled: true
  # Temporal namespace aep-api connects to; auto-setup registers it on startup.
  namespace: "default"
  # Task queue the in-process worker polls (matches the aep-api code default).
  taskQueue: "aep-devflow"
  # temporalio/auto-setup pinned to the server version used by
  # deployments/scripts/setup-temporal.sh (admin-tools 1.29.7).
  image: "temporalio/auto-setup:1.29.7"
  imagePullPolicy: IfNotPresent
  db:
    name: "temporal"
    visibilityName: "temporal_visibility"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"