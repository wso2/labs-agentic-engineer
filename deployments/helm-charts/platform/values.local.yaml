# Local dev overrides for the AEP platform chart.
# Applied on top of values.yaml by skaffold.yaml.
# Run `make setup-local` once after `setup-k3d.sh` before `make dev-cluster`.

# Skip ESO/OpenBao — plain K8s Secrets are created by setup-local-secrets.sh.
localSecrets:
  enabled: true

# Deploy the in-cluster cluster-gateway-proxy stub (reads pod logs for live
# coding-agent streaming). NEVER enable in production.
codingAgentDispatch:
  localStubs:
    enabled: true

# Provision per-org OC ComponentTypes locally (cloud does this via platform-api).
localOrgProvisioning:
  enabled: true
  orgNamespace: default

# GitHub webhooks via smee.io relay. Set webhook.deliveryURL to your smee.io
# channel URL and set webhook.localSmee.enabled: true to activate.
webhook:
  localSmee:
    enabled: false

# k3d's local-path provisioner does not support ReadWriteMany.
workspaces:
  accessMode: ReadWriteOnce

# Skaffold loads images directly into k3d by digest — IfNotPresent prevents
# the node from trying to pull from a registry that doesn't have the local build.
aepApi:
  image:
    pullPolicy: IfNotPresent
aepAgents:
  image:
    pullPolicy: IfNotPresent
collab:
  image:
    pullPolicy: IfNotPresent
aepMcpServer:
  image:
    pullPolicy: IfNotPresent
console:
  image:
    pullPolicy: IfNotPresent
