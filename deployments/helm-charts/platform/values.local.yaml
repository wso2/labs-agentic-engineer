# Local dev overrides for the AEP platform chart.
# Applied on top of values.yaml by skaffold.yaml.
# Run `make setup-local` once after `setup-k3d.sh` before `make dev-cluster`.

# Skip ESO/OpenBao — plain K8s Secrets are created by setup-local-secrets.sh.
localSecrets:
  enabled: true

# OPENBAO_* on aep-api for in-process secrets delivery. NEVER enable in
# production.
codingAgentDispatch:
  openBaoDirect:
    enabled: true

# Provision per-org OC ComponentTypes locally (cloud does this via platform-api).
localOrgProvisioning:
  enabled: true
  orgNamespace: default

# GitHub webhooks are OFF by default locally. To trigger component builds on PR
# merge, enable delivery in the git-ignored values.local.dev.yaml (copy from
# values.local.dev.yaml.example): set webhook.deliveryURL + localSmee.enabled.
webhook:
  localSmee:
    enabled: false

# OpenBao is pre-installed by setup-prerequisites.sh in its own namespace
# (standalone, not bundled as a subchart like the aep-init/bootstrap path).
openbao:
  addr: "http://openbao.openbao.svc:8200"

# setup-local.sh installs the operator as a standalone Helm release in
# thunder-app-operator-system. Disable the subchart to avoid a second instance
# that would race against the standalone one over the same ThunderApplication CRs.
thunder-app-operator:
  enabled: false

# k3d's local-path provisioner does not support ReadWriteMany.
workspaces:
  accessMode: ReadWriteOnce

# Skaffold loads images directly into k3d by digest — IfNotPresent prevents
# the node from trying to pull from a registry that doesn't have the local build.
aepApi:
  image:
    pullPolicy: IfNotPresent
aepAgents:
  image:
    pullPolicy: IfNotPresent
collab:
  image:
    pullPolicy: IfNotPresent
aepMcpServer:
  image:
    pullPolicy: IfNotPresent
console:
  image:
    pullPolicy: IfNotPresent
