apiVersion: v2
appVersion: 0.0.0-dev
description: >
  Deploys AEP platform services (aep-api, agents, aep-console)
  as plain Kubernetes Deployments in the OC control-plane namespace (wso2-aep),
  exposed via the OC control-plane gateway using HTTPRoute + ReferenceGrant.
  PostgreSQL is deployed as a direct StatefulSet (not an OC Resource).
keywords:
  - wso2
  - agentic-engineer
  - openchoreo
  - ai
maintainers:
  - name: WSO2
    url: https://wso2.com
name: aep-platform
type: application
version: 0.0.0-dev
dependencies:
  - name: thunder-app-operator
    version: "0.0.0-dev"
    repository: "file://../../single-cluster/resource-types/thunder-app/operator/helm"
    condition: thunder-app-operator.enabled
