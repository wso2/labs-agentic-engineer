{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collab-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  podSelector:
    matchLabels:
      app: collab-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # aep-agents joins rooms as a Yjs peer; aep-console proxies the browser's
    # /collab WebSocket here.
    - from:
        - podSelector:
            matchLabels:
              app: aep-agents
        - podSelector:
            matchLabels:
              app: aep-console
      ports:
        - protocol: TCP
          port: {{ .Values.collab.port }}
  egress:
    # Room-access oracle + spec seeding.
    - to:
        - podSelector:
            matchLabels:
              app: aep-api
      ports:
        - protocol: TCP
          port: {{ .Values.aepApi.port }}
{{- end }}
