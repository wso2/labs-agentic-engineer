apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: collab-server
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aep
spec:
  replicas: {{ .Values.collab.replicas | default 1 }}
  # replicas MUST stay 1: rooms are a process-local Map with no sticky sessions;
  # a second replica's flush doc-wins over the first (silent data loss).
  selector:
    matchLabels:
      app: collab-server
  template:
    metadata:
      labels:
        app: collab-server
        app.kubernetes.io/part-of: wso2-agentic-engineer
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: collab-server
          image: "{{ .Values.collab.image.repository }}:{{ .Values.collab.image.tag }}"
          imagePullPolicy: {{ .Values.collab.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.collab.port }}
              name: http
          # Boot is slow and variable: the image runs from TypeScript source via
          # tsx, so the first request is served only after the runtime has
          # compiled it. Liveness alone gives 5s + 3x10s, and on a loaded node
          # that expires while the process is still starting — the kubelet then
          # kills it before it can listen, which reads as a crash loop whose
          # logs end mid-startup with no error in them. A startupProbe holds
          # liveness off until the port answers, and only then applies the tight
          # interval that makes liveness useful for a hung process.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{ toYaml .Values.collab.resources | nindent 12 }}
          env:
            - name: COLLAB_PORT
              value: {{ .Values.collab.port | quote }}
            # aep-api origin incl. /api/v1 — the room-access oracle + spec seeder.
            # Without it (or COLLAB_MOCK_BFF / COLLAB_DEV) the server refuses to start;
            # dev/fixture mode is never implied by missing config.
            - name: AEP_API_BASE
              value: "http://aep-api:{{ .Values.aepApi.port }}/api/v1"
