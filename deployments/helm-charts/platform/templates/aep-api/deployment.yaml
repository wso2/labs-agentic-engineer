apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: aep-api
    app.kubernetes.io/managed-by: {{ .Release.Service}}
    app.kubernetes.io/part-of: aep
spec:
  replicas: {{ .Values.aepApi.replicas | default 1 }}
  selector: 
    matchLabels: 
      app: aep-api
  template:
    metadata:
      labels: 
        app: aep-api
        app.kubernetes.io/part-of: wso2-agentic-engineer
    spec:
      serviceAccountName: aep-api
      securityContext:
        # Group ownership for the mounted secret volumes, so the non-root
        # runtime user (uid 1000) can read them.
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres.{{ .Release.Namespace }}.svc.cluster.local 5432; do sleep 2; done']
      containers:
        - name: aep-api
          image: "{{ .Values.aepApi.image.repository }}:{{ .Values.aepApi.image.tag }}"
          imagePullPolicy: {{ .Values.aepApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aepApi.port }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{ toYaml .Values.aepApi.resources | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.aepApi.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.aepApi.logLevel | quote }}
            - name: DEPLOYMENT_TIER
              value: {{ .Values.aepApi.deploymentTier | quote }}
            # /api/v1 takes user tokens only, and the console client is the one
            # that issues them (Thunder sets aud = client id). Machine clients —
            # publisher, system, SRE — have their own /internal/v1 routes, and the
            # verifier refuses a client_credentials token here whatever its aud.
            - name: JWT_AUDIENCE
              value: {{ .Values.console.thunder.clientId | quote }}
            - name: SERVICE_AUTH_CLIENT_ID
              value: {{ .Values.aepApi.serviceAuth.clientId | quote }}
            - name: SERVICE_AUTH_TOKEN_URL
              value: "{{ .Values.thunder.adminURL }}/oauth2/token"
            - name: SERVICE_AUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aep-thunder-secrets
                  key: AEP_API_CLIENT_SECRET
            - name: SERVICE_AUTH_HOST_HEADER
              value: ""
            {{- if (default dict .Values.tryIt).enabled }}
            # Registered as a redirect URI on every project's sign-in client at
            # deploy time, so the test app can complete an OAuth round-trip
            # against that project's identity provider. Left unset, the app loads
            # and the sign-in is then refused — which reads as the app being
            # broken rather than unregistered. Origin must match the console's
            # VITE_TRY_IT_URL; both come from tryIt.publicURL.
            - name: TRY_IT_CALLBACK_URL
              value: "{{ .Values.tryIt.publicURL | trimSuffix "/" }}/callback"
            {{- end }}
            {{- if .Values.observer.baseURL }}
            - name: OBSERVER_URL
              value: {{ .Values.observer.baseURL | quote }}
            {{- end }}
            {{- if .Values.observer.logRetention }}
            - name: OBSERVER_LOG_RETENTION
              value: {{ .Values.observer.logRetention | quote }}
            {{- end }}
            # Without this, aep-api's own default assumes the data-plane
            # gateway terminates TLS and holds every component with an
            # external URL at "converging" forever waiting on a certificate
            # window that does not exist here — see dataPlaneGateway.tls's
            # comment in values.yaml.
            - name: DATA_PLANE_GATEWAY_TLS
              value: {{ .Values.dataPlaneGateway.tls | quote }}
            - name: PLATFORM_API_SERVICE_BASE_URL
              valueFrom: 
                configMapKeyRef:
                  name: platform-configs
                  key: PLATFORM_API_SERVICE_BASE_URL
            - name: JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-configs
                  key: THUNDER_JWKS_URL
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: platform-configs
                  key: THUNDER_ISSUER
            # The platform IdP the coding-agent dispatch mints its own
            # (PUBLISHER_*) client_credentials token against — same instance
            # as JWKS_URL/JWT_ISSUER above, read again under the names
            # config_loader.go's PlatformIDP struct expects. Without these,
            # PlatformIDP.JWKSURL falls back to a hostname no deployment of
            # this chart actually has, and every coding-agent dispatch fails
            # before it mints its first token.
            - name: PLATFORM_IDP_JWKS_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-configs
                  key: THUNDER_JWKS_URL
            - name: PLATFORM_IDP_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: platform-configs
                  key: THUNDER_ISSUER

            - name: THUNDER_ADMIN_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-configs
                  key: THUNDER_ADMIN_URL
            - name: THUNDER_SYSTEM_CLIENT_ID
              value: "aep-system-client"
            - name: THUNDER_SYSTEM_RESOURCE_IDENTIFIER
              value: {{ .Values.thunder.systemResourceIdentifier | default (printf "%s/mcp" .Values.console.thunderPublicURL) | quote }}
            - name: AGENT_PLATFORM_URL
              value: "http://aep-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.aepApi.port }}"
            # The Claude Code runner image, used by both task kinds.
            - name: AGENT_RUNNER_IMAGE
              value: {{ .Values.codingAgentRunner.image | quote }}
            # The OpenCode runner image, used for orgs whose runtime is OpenCode.
            - name: AGENT_RUNNER_IMAGE_OPENCODE
              value: {{ .Values.codingAgentRunner.opencodeImage | quote }}
            # How long a finished cycle Job (and its pod) is kept (Go duration).
            - name: CODING_AGENT_JOB_TTL
              value: {{ .Values.codingAgentRunner.jobTTL | quote }}
            {{- $ae := default dict .Values.aeStudio }}
            # AE Studio (all optional at boot; see values.yaml aeStudio).
            - name: AE_STUDIO_INTERNAL_CLIENT_ID
              value: {{ (default dict $ae.internalClient).id | default "ae-studio-internal-client" | quote }}
            - name: AE_STUDIO_INTERNAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aep-ae-studio-internal-secrets
                  key: AE_STUDIO_INTERNAL_CLIENT_SECRET
                  optional: true
            - name: AE_STUDIO_AEP_API_BASE_URL
              value: "http://aep-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.aepApi.port }}"
            {{- with (default dict $ae.images).designAgent }}
            - name: AE_STUDIO_IMAGE_DESIGN_AGENT
              value: {{ . | quote }}
            {{- end }}
            {{- with (default dict $ae.images).collab }}
            - name: AE_STUDIO_IMAGE_COLLAB
              value: {{ . | quote }}
            {{- end }}
            {{- with (default dict $ae.images).studioTools }}
            - name: AE_STUDIO_IMAGE_STUDIO_TOOLS
              value: {{ . | quote }}
            {{- end }}
            {{- with $ae.gatewayHost }}
            - name: AE_STUDIO_GATEWAY_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- with $ae.publicScheme }}
            - name: AE_STUDIO_PUBLIC_SCHEME
              value: {{ . | quote }}
            {{- end }}
            {{- with $ae.publicPortSuffix }}
            - name: AE_STUDIO_PUBLIC_PORT_SUFFIX
              value: {{ . | quote }}
            {{- end }}
            {{- with $ae.listenerName }}
            - name: AE_STUDIO_LISTENER_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with (default dict $ae.idp).issuer }}
            - name: AE_STUDIO_IDP_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with (default dict $ae.idp).jwksUrl }}
            - name: AE_STUDIO_IDP_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with (default dict $ae.idp).tokenUrl }}
            - name: AE_STUDIO_IDP_TOKEN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $ae.runtimeClassName }}
            - name: AE_STUDIO_RUNTIME_CLASS_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: AE_STUDIO_CONSOLE_ORIGINS
              value: {{ join "," ($ae.consoleOrigins | default list) | quote }}
            - name: AE_STUDIO_IDP_USER_AUDIENCES
              value: {{ join "," ((default dict $ae.idp).userAudiences | default (list .Values.console.thunder.clientId)) | quote }}
            - name: AE_STUDIO_CILIUM
              value: {{ $ae.cilium | default false | quote }}
            - name: AE_STUDIO_EXTRA_EGRESS
              value: {{ toJson ($ae.extraEgress | default list) | quote }}
            - name: AE_STUDIO_STORAGE_SIZE_LIMIT
              value: {{ (default dict $ae.storage).sizeLimit | default "3Gi" | quote }}
            - name: AE_STUDIO_STORAGE_EPHEMERAL_REQUEST
              value: {{ (default dict $ae.storage).ephemeralRequest | default "1Gi" | quote }}
            - name: AE_STUDIO_STORAGE_BUDGET_BYTES
              value: {{ (default dict $ae.storage).budgetBytes | default "2147483648" | quote }}
            {{- $relay := default dict $ae.webhookRelay }}
            {{- if $relay.enabled }}
            # Per-org webhook relay (values.yaml aeStudio.webhookRelay). The seed
            # is optional: aep-api boots, without a relay, before it is imported.
            - name: AE_STUDIO_WEBHOOK_RELAY_IMAGE
              value: {{ required "aeStudio.webhookRelay.image is required when the relay is enabled" $relay.image | quote }}
            - name: AE_STUDIO_WEBHOOK_RELAY_SEED
              valueFrom:
                secretKeyRef:
                  name: aep-webhook-relay
                  key: AE_STUDIO_WEBHOOK_RELAY_SEED
                  optional: true
            {{- end }}
            # OpenBao-direct secrets delivery (local-only). Cloud injects a
            # different SecretsProvider via the overlay; OPENBAO_* must be
            # absent there. No static token: aep-api logs in by Kubernetes
            # auth as its own service account (the projected token this pod
            # mounts), and the role binds it to the write-only aep-api-writer
            # policy (deployments/scripts/openbao-aep-api-auth.sh).
            {{- if .Values.codingAgentDispatch.openBaoDirect.enabled }}
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.addr | quote }}
            - name: OPENBAO_AUTH_ROLE
              value: aep-api
            {{- end }}
            # secrets — all values sourced from ESO-synced K8s Secrets (written by aep init)
            - name: THUNDER_SYSTEM_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aep-thunder-secrets
                  key: THUNDER_SYSTEM_CLIENT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode=disable"
            {{- if .Values.sreHandoff.enabled }}
            # SRE-agent issue-handoff shortcut (auth.SREHandoffVerifier). Off
            # by default (values.yaml) — omitting these env vars entirely
            # keeps the shortcut disabled, same secure default as every other
            # aep-api deployment target.
            - name: SRE_HANDOFF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aep-sre-handoff-secrets
                  key: SRE_HANDOFF_TOKEN
            - name: SRE_HANDOFF_ORG
              value: {{ .Values.sreHandoff.org | quote }}
            {{- end }}
            {{- if .Values.temporal.enabled }}
            # Temporal (devflow workflows). Points the in-process worker at the
            # in-cluster temporal-frontend Service. Plain host:port — CoreDNS
            # answers gRPC's SRV probe, so the compose `passthrough:///` scheme
            # is not needed. Disabled (temporal.enabled=false) omits these so
            # devflow is off: no worker starts and /devflows answers 503.
            - name: TEMPORAL_HOSTPORT
              value: {{ printf "temporal-frontend.%s.svc.cluster.local:7233" .Release.Namespace | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_TASKQUEUE
              value: {{ .Values.temporal.taskQueue | quote }}
            {{- end }}
            {{- with .Values.aepApi.kubeAPI }}
            {{- if .baseURL }}
            - name: KUBE_API_BASE_URL
              value: {{ .baseURL | quote }}
            {{- end }}
            {{- if .tokenSecret }}
            - name: KUBE_API_TOKEN_FILE
              value: /var/run/dp-kube/token
            - name: KUBE_API_CA_FILE
              value: /var/run/dp-kube/ca.crt
            {{- end }}
            {{- end }}
          {{- if and .Values.aepApi.kubeAPI .Values.aepApi.kubeAPI.tokenSecret }}
          volumeMounts:
            - name: dp-kube
              mountPath: /var/run/dp-kube
              readOnly: true
          {{- end }}
      {{- if and .Values.aepApi.kubeAPI .Values.aepApi.kubeAPI.tokenSecret }}
      volumes:
        - name: dp-kube
          secret:
            secretName: {{ .Values.aepApi.kubeAPI.tokenSecret | quote }}
      {{- end }}
