# OpenChoreo authorization: OC authorizes API calls against its own
# ClusterAuthzRoleBinding CRD, matching a token's `client_id` claim to a
# ClusterAuthzRole — it does NOT consult Thunder role assignments. aep-api's
# outbound service calls (coding-dispatch component pre-flight, ensure-authz-role
# onboarding bootstrap, etc.) present a client_credentials token whose identity
# is carried in client_id={{ .Values.aepApi.serviceAuth.clientId }} (Thunder
# 1.0.0 does not populate `sub` for client_credentials tokens); without this
# binding OC returns 403 "You do not have permission". Mirrors the legacy
# setup-aep.sh `aep-api-client-binding`. The ClusterAuthzRole `admin` is
# provided by the OpenChoreo control-plane install (the base platform).
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: aep-api-client-binding
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  effect: allow
  entitlement:
    claim: client_id
    value: {{ .Values.aepApi.serviceAuth.clientId | quote }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: admin
