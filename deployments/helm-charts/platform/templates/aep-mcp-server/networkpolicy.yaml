{{- if .Values.sreAgent.enabled }}
# With sreAgent enabled, the SRE agent reaches aep-mcp-server only through the
# OpenChoreo control-plane gateway (httproute.yaml), so only that gateway's
# proxy pods are admitted. Every request still needs a bearer that aep-api
# accepts (for the SRE agent, the handoff token minted for sreAgent.org);
# this policy narrows who can present one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aep-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: aep-mcp-server
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aep
spec:
  podSelector:
    matchLabels:
      app: aep-mcp-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openchoreo-control-plane
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway-default
      ports:
        - protocol: TCP
          port: http
{{- end }}
