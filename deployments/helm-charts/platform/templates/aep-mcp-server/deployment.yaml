apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: aep-mcp-server
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: aep
spec:
  replicas: {{ .Values.aepMcpServer.replicas | default 1 }}
  selector:
    matchLabels:
      app: aep-mcp-server
  template:
    metadata:
      labels:
        app: aep-mcp-server
        app.kubernetes.io/part-of: wso2-agentic-engineer
    spec:
      containers:
        - name: aep-mcp-server
          image: "{{ .Values.aepMcpServer.image.repository }}:{{ .Values.aepMcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.aepMcpServer.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aepMcpServer.port }}
              name: http
          resources: {{ toYaml .Values.aepMcpServer.resources | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.aepMcpServer.port | quote }}
            # aep-api REST base (same namespace). The MCP server forwards the
            # caller's bearer here; aep-api enforces org-scoped auth.
            - name: AEP_API_BASE_URL
              value: "http://aep-api:{{ .Values.aepApi.port }}"
            {{- if .Values.sreHandoff.enabled }}
            # SRE-handoff fallback bearer. The OC SRE extension loader will not
            # send an Authorization header to this plaintext in-cluster URL, so
            # the server supplies the shared handoff credential itself: the
            # same secret aep-api verifies as SRE_HANDOFF_TOKEN. Callers that
            # send their own header still win. networkpolicy.yaml limits who
            # can reach this port while the fallback is on.
            - name: AEP_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aep-sre-handoff-secrets
                  key: SRE_HANDOFF_TOKEN
            - name: AEP_MCP_DEFAULT_BEARER
              value: "Bearer $(AEP_MCP_TOKEN)"
            {{- end }}
