{{- if .Values.sreAgent.enabled }}
# The SRE agent's MCP endpoint. Bound to the gateway's https listener only:
# the agent's extension loader refuses to send its Authorization header
# (the handoff token aep-api minted for sreAgent.org) to a non-https URL.
# Only /mcp is exposed; aep-mcp-server serves nothing else a caller needs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aep-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
      sectionName: https
  hostnames:
    - {{ required "sreAgent.mcpHostname is required when sreAgent.enabled" .Values.sreAgent.mcpHostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: aep-mcp-server
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.aepMcpServer.port }}
---
# The Gateway lives in another namespace, so the route's cross-namespace
# backendRef needs this grant — same as the console's.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: aep-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openchoreo-control-plane
  to:
    - group: ""
      kind: Service
      name: aep-mcp-server
{{- end }}
