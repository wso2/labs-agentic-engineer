# api-configuration ClusterTrait (cluster-scoped).
# Verbatim from deployments/manifests/api-platform/api-configuration-trait.yaml.
# Not gated — this is a cluster-level platform capability, not a per-org resource.
# WSO2 API Platform API Configuration Trait for OpenChoreo
#
# This trait adds WSO2 API Platform API management to components by:
#   - Creating a kgateway Backend pointing to the WSO2 API Platform router
#   - Creating a WSO2 RestApi resource that defines the API in the gateway
#   - Patching the HTTPRoute backendRef to route traffic through the WSO2 router
#   - Patching the HTTPRoute URL rewrite to use the derived API context path
#
# WSO2 API Platform does not implement the Kubernetes Gateway API. It runs alongside
# the default kgateway, which continues to handle Gateway/HTTPRoute resources. Traffic
# is redirected through the WSO2 router via a kgateway Backend resource.
#
# Derived values (not user-configurable):
#   - displayName: <environment>-<namespace>-<componentName>-<endpointName>
#   - context:     /<environment>-<namespace>-<componentName>-<endpointName>
#   - version:     v1.0
#   - upstream:    http://<componentName>.<namespace>:<endpointName port>
#   - operations:  All methods (GET, POST, PUT, PATCH, DELETE, OPTIONS) on /*
#                  unless the caller passes an explicit `operations` list
#
# Per-operation authorization (scopes):
#   An `operations[]` item may carry `policies[]` (a `jwt-auth` policy whose
#   params name the scope the caller must hold) or `public: true`. Both are
#   projected from the component's OpenAPI contract by aep-api
#   (internal/projects/api_operations.go). See the DESIGN NOTE below.
#
# Policy configuration (per-environment via ReleaseBinding traitEnvironmentConfigs):
#   - cors:       CORS headers (enabled by default with wildcard origins)
#   - jwtAuth:    JWT authentication (disabled by default)
#   - rateLimit:  Request rate limiting (disabled by default)
#   - addHeaders: Custom request/response headers (disabled by default)
#
# Prerequisites:
#   - The environment's own WSO2 API Platform gateway (`api-platform-<org>-<env>`
#     in namespace `<org>-<env>`), installed by
#     deployments/scripts/setup-environment-gateway.sh. There is no cluster-wide
#     gateway: both the RestApi label and the Backend host below name the
#     per-environment one, and an environment without its gateway gets a RestApi
#     no gateway serves.
#   - WSO2 API Platform CRDs available (RestApi, APIGateway)
#   - kgateway installed (default) with Backend CRD support
#   - ComponentType must have HTTPRoute resources for the patch to target
#   - "api-configuration" must be listed in the ComponentType's allowedTraits
#   - Component must have at least one endpoint defined in its Workload
#   - The endpointName parameter must match a key in the Workload's endpoints map
#
# Usage:
#   1. Apply this trait to the control plane
#   2. Add "api-configuration" to the ComponentType's allowedTraits
#   3. Reference the trait in the Component's traits with endpointName parameter
#   4. Configure policies per-environment in the ReleaseBinding's traitEnvironmentConfigs
#   See component.yaml and release-binding for complete usage examples.
#
# ───────────────────────────────────────────────────────────────────────────
# DESIGN NOTE — per-operation scopes (measured, not assumed)
# ───────────────────────────────────────────────────────────────────────────
# Every claim below was measured against a running gateway, not read off a
# document. The stack it holds for, and the command that re-reads each version
# from any cluster (org `default`, environment `default` below):
#
#   gateway chart     gateway-1.2.2 (appVersion 1.2.0)
#     helm list -n default-default
#   gateway images    ghcr.io/wso2/api-platform/gateway-controller:1.2.1
#                     ghcr.io/wso2/api-platform/gateway-runtime:1.2.1
#     kubectl -n default-default get pods \
#       -o jsonpath='{range .items[*]}{.spec.containers[*].image}{"\n"}{end}'
#   gateway-operator  gateway-operator-0.11.0 (appVersion 0.10.1)
#     helm list -n openchoreo-data-plane
#   jwt-auth policy   v1.3.0
#     kubectl -n default-default exec <gateway-controller-pod> -- ls default-policies
#   RestApi CRD       v1 served + storage; v1alpha1 served, not storage
#     kubectl get crd restapis.gateway.api-platform.wso2.com \
#       -o jsonpath='{range .spec.versions[*]}{.name}{" storage="}{.storage}{"\n"}{end}'
#
# Re-measure before trusting any of it on a different stack.
#
# 1. Scopes are compared as WHOLE STRINGS. `claims:read-all` does NOT imply
#    `claims:read`; there is no prefix, hierarchy or wildcard matching
#    anywhere in the gateway. An operation that both a `read` holder and a
#    `read-all` holder may call must list both handles in `anyOf`.
#
# 2. `scopes.anyOf` is a UNION (hold at least one), `scopes.allOf` an
#    INTERSECTION (hold every one); when both are given they are AND-ed. The
#    projection emits exactly one handle in `anyOf` for a normal operation —
#    `allOf` exists here because the policy supports it, not because anything
#    renders it today. The deprecated `requiredScopes` param is never emitted;
#    it is ignored whenever `scopes` is set.
#
# 3. OIDC scopes are NEVER emitted as a required scope. Thunder puts
#    `openid profile email group ou` in the ACCESS token, so
#    `scopes.anyOf: [openid]` admits every signed-in user in the org — which
#    is the correct expression of "signed in, no particular permission", and
#    a silent wide-open failure if it is emitted by accident. This trait
#    expresses that class differently and more safely: a `jwt-auth` policy
#    with NO `scopes` param at all (issuer + audience still enforced).
#
# 4. Group gating is deliberately NOT used. The policy can do it —
#    `claims.allOf: [{claim: groups, values: [...]}]` was measured working and
#    matches the token's multi-valued `groups` claim — and this trait's schema
#    still does not expose it. There is ONE authorization authority for a
#    generated app: the scope. The roles → groups indirection belongs in the
#    identity directory, where a role's permission set is assembled; a second
#    copy of it at the gateway would be a second source of truth that nothing
#    keeps in sync. The schema omits `claims` so the decision cannot be
#    quietly reversed by a hand-edited ReleaseBinding.
#
# 5. An OPTIONS operation must be SYNTHESISED for every path. Routing happens
#    before policy: an undeclared method+path pair is a 404 before the CORS
#    policy ever runs, so a browser's preflight dies and every cross-origin
#    call with it. An OpenAPI contract never declares OPTIONS, so the
#    projection adds the row. Once declared, the preflight short-circuits
#    BEFORE jwt-auth (204, no token required) even when that OPTIONS operation
#    carries jwt-auth itself — so the OPTIONS row may safely carry the same
#    policy as its siblings, and does not need `public: true`.
#
# 6. ONE INVALID OPERATION UNSERVES THE WHOLE RestApi. A single rejected
#    parameter leaves the CR `Programmed=False`, and then *every* path on that
#    API answers 404 — including policy-free siblings — which is byte-identical
#    to "this API was never deployed". The renderer must therefore refuse to
#    emit a shape it cannot vouch for rather than emit it and hope. In
#    particular `onFailureStatusCode` is REJECTED at admission in
#    `spec.policies[].params` and in `spec.operations[].policies[].params`
#    (it is a cluster-wide gateway ConfigMap setting only), so it is never
#    emitted here and no operation can be made to answer 403: the gateway
#    answers 401 with a byte-identical body for no token, bad token, wrong
#    issuer, wrong audience AND missing scope, and never sends
#    `WWW-Authenticate`. 403 + `insufficient_scope` exists only in the
#    service's own middleware, behind the gateway.
#
# 7. AN APPLIED EDIT IS NOT LIVE WHEN `kubectl apply` RETURNS. The previous
#    generation keeps serving (~90 s observed while the gateway pods
#    restarted). Anything that edits an API and then asserts must poll for
#    `status.conditions[Programmed].status == True` AND
#    `status.observedGeneration == metadata.generation`, then allow a few
#    seconds more. `deployments/scripts/verify-scopes.sh` does exactly this.
#
# 8. Audience is pinned PER OPERATION, not per API, so one component may mix
#    operations pinned to its project resource server with operations pinned
#    to another audience. The per-operation `params.audiences` overrides the
#    environment's `jwtAuth.audience`; an empty list inherits it.
#
# 9. API-level vs per-operation jwt-auth. Per-operation policies ADD TO the
#    API-level ones, they do not replace them — so an API-level `jwt-auth`
#    would still demand a token on an operation marked `public`. This trait
#    therefore suppresses the API-level `jwt-auth` as soon as ANY operation
#    declares `public: true` or a non-empty `policies` list: those operations
#    own their authentication. Components with neither (the `/*` default)
#    keep exactly today's behaviour — one API-level `jwt-auth` governed by
#    `jwtAuth.enabled`. Note the asymmetry, which is deliberate: a declared
#    per-operation policy is emitted even when `jwtAuth.enabled` is false
#    (fail closed — the component's contract says that operation needs a
#    scope), while `jwtAuth.enabled: false` still opens a `/*`-default
#    component.
#
#    PRECEDENCE, for the same reason: an operation carrying BOTH `public: true`
#    and a non-empty `policies` list keeps its policies. `public` is read only
#    where no policy is declared. The projection never emits both — but a
#    hand-edited ReleaseBinding or Component can, and the other order made that
#    row unauthenticated twice over: it dropped the operation's own jwt-auth
#    AND suppressed the API-level one.
#
# A public operation is a TWO-WAY PASS-THROUGH: the gateway neither injects
# nor strips there, so a caller's forged `x-user-*` AND a real `Authorization`
# both reach the handler untouched. A public handler must read no identity
# header. On a protected operation the gateway overwrites every mapped
# `x-user-*` header (setting it to the EMPTY STRING when the claim is absent),
# strips the inbound `Authorization` and re-presents the token as
# `x-forwarded-authorization`.

---
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterTrait
metadata:
  name: api-configuration
spec:
  environmentConfigs:
    openAPIV3Schema:
      type: object
      $defs:
        # --- cors policy ---
        # Configures CORS headers for the API.
        # Enabled by default with wildcard origins, methods, and headers.
        # Note: when allowCredentials is true, wildcards cannot be used for
        # origins, methods, or headers (WSO2 API Platform restriction).
        CorsConfig:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            allowedOrigins:
              type: array
              items:
                type: string
              default: ["*"]
            allowedMethods:
              type: array
              items:
                type: string
              default: ["*"]
            allowedHeaders:
              type: array
              items:
                type: string
              default: ["*"]
            allowCredentials:
              type: boolean
              default: false

        # --- jwt-auth policy ---
        # Validates JWT access tokens in API requests.
        # System-level key manager configuration is set in the gateway-configuration ConfigMap
        # (`jwtauth_v1` block). The trait emits `jwt-auth v1` so each RestApi
        # can pin which issuers + audiences it trusts: without that filter a
        # RestApi accepts tokens from EVERY keymanager registered cluster-wide,
        # so any other tenant's identity provider can mint a token this API
        # honours.
        #
        #   - `issuers`  : list of OIDC issuer URLs this API trusts.
        #                  Empty → accept any cluster-configured keymanager.
        #                  aep-api fills this with the org's IDP issuer.
        #   - `audience` : list of accepted `aud` claim values. Empty
        #                  ⇒ skip the audience check. For a component whose
        #                  project has a resource server this carries that
        #                  RS identifier, which is what pins a token minted
        #                  for THIS project (a token minted for any other
        #                  resource server, including the platform's own,
        #                  is then rejected with the same opaque 401).
        #                  It is the default for every operation; an
        #                  operation may override it in its own
        #                  `policies[].params.audiences`.
        #
        # `claimMappings` is not configurable: the five mappings the trait
        # emits (`sub`, `username`, `ouHandle`, `groups`, `scope`) are the
        # contract the generated services and the `api-management` skill are
        # written against. `scope → x-user-scopes` is the authorization
        # authority: the RAW space-separated scope claim, OIDC scopes
        # included, so a reader must split on space and compare exact
        # handles — "holds some scope" is never "is authorized".
        JwtAuthConfig:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            issuers:
              type: array
              items:
                type: string
              default: []
            audience:
              type: array
              items:
                type: string
              default: []

        # --- basic-ratelimit policy ---
        # Restricts request rates using one or more time windows.
        # duration uses Go duration format (e.g., "1s", "1m", "1h", "24h").
        RateLimitEntry:
          type: object
          properties:
            requests:
              type: integer
            duration:
              type: string

        RateLimitConfig:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            limits:
              type: array
              items:
                $ref: "#/$defs/RateLimitEntry"
              default: []

        # --- add-headers policy ---
        # Adds arbitrary headers to the request or response.
        HeaderEntry:
          type: object
          properties:
            name:
              type: string
            value:
              type: string

        AddHeadersConfig:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
            requestHeaders:
              type: array
              items:
                $ref: "#/$defs/HeaderEntry"
              default: []
            responseHeaders:
              type: array
              items:
                $ref: "#/$defs/HeaderEntry"
              default: []

      properties:
        cors:
          $ref: "#/$defs/CorsConfig"
          default: {}
        jwtAuth:
          $ref: "#/$defs/JwtAuthConfig"
          default: {}
        rateLimit:
          $ref: "#/$defs/RateLimitConfig"
          default: {}
        addHeaders:
          $ref: "#/$defs/AddHeadersConfig"
          default: {}

  parameters:
    openAPIV3Schema:
      type: object
      properties:
        # Name of the workload endpoint this trait targets.
        # Must match an endpoint key defined in the Workload spec.
        endpointName:
          type: string
        # The API's operation table, projected from the component's OpenAPI
        # contract by aep-api (internal/projects/api_operations.go). The
        # default below — six methods on `/*` — is what a component with no
        # sign-in dependency keeps, and is exactly the pre-scopes behaviour.
        #
        # Parameters are PRUNED against this schema before the template runs:
        # a key that is not declared here is dropped silently and never
        # reaches the RestApi. Anything the renderer needs to emit must be
        # added here first.
        operations:
          type: array
          default:
            - method: GET
              path: "/*"
            - method: POST
              path: "/*"
            - method: PUT
              path: "/*"
            - method: PATCH
              path: "/*"
            - method: DELETE
              path: "/*"
            - method: OPTIONS
              path: "/*"
          items:
            type: object
            properties:
              method:
                type: string
                description: "HTTP method, uppercase. Synthesise an OPTIONS row per path (design note 5)."
              path:
                type: string
                description: "Route path with optional {param} placeholders, relative to the API context."
              public:
                type: boolean
                default: false
                description: >-
                  No authentication on this operation. Suppresses jwt-auth here
                  AND, because per-operation policies only ADD to API-level
                  ones, suppresses the API-level jwt-auth for the whole API
                  (design note 9). The gateway is then a two-way pass-through
                  on this operation: a caller's forged `x-user-*` and a real
                  `Authorization` both reach the handler, so a public handler
                  must read no identity header. Read only when the operation
                  declares no `policies`: a row carrying both keeps its
                  policies (design note 9, PRECEDENCE).
              policies:
                type: array
                default: []
                description: >-
                  Policies applied to this operation only. Declaring any
                  suppresses the API-level jwt-auth for the whole API. The
                  environment supplies `issuers`, `audiences` and the fixed
                  `claimMappings`; the operation supplies the scope.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      default: "jwt-auth"
                      enum: ["jwt-auth"]
                      description: >-
                        Policy name. `jwt-auth` is the only one this trait can
                        emit, and the enum is what keeps it that way: the
                        composition below puts jwt-auth's params (issuers,
                        audiences, claimMappings, scopes) on WHATEVER name is
                        given, so an unrecognised name would be rendered as a
                        policy the RestApi CRD rejects — and one rejected
                        operation leaves every path on the API unserved
                        (design note 6).
                    version:
                      type: string
                      default: "v1"
                      description: >-
                        Policy version as the RestApi CRD spells it — `v<major>`,
                        pattern ^v\d+$. The jwt-auth POLICY's own semantic version
                        is 1.3.0; the field here still reads `v1`.
                    params:
                      type: object
                      default: {}
                      properties:
                        scopes:
                          type: object
                          default: {}
                          description: >-
                            Omitted from the rendered policy when both lists are
                            empty, which is how "signed in, no particular
                            permission" is expressed (design note 3).
                          properties:
                            anyOf:
                              type: array
                              items:
                                type: string
                              default: []
                              description: "Caller must hold at least one. Exactly one handle in the normal case."
                            allOf:
                              type: array
                              items:
                                type: string
                              default: []
                              description: "Caller must hold every one. Not rendered by anything today."
                        audiences:
                          type: array
                          items:
                            type: string
                          default: []
                          description: >-
                            Per-operation audience override. Empty inherits the
                            environment's `jwtAuth.audience` (design note 8).
        upstreamPort:
          type: integer
          default: 0
          description: "Override upstream port. 0 = use endpoint port from workload."
        upstreamBasePath:
          type: string
          default: ""
          description: "Base path appended to the upstream URL."
      required:
        - endpointName

  creates:
    # --- Backend: kgateway static backend pointing to WSO2 API Platform router ---
    # This Backend resource tells kgateway to forward traffic to the WSO2 API Platform
    # router instead of directly to the component's Service. The HTTPRoute's backendRef
    # is patched (below) to reference this Backend.
    - template:
        apiVersion: gateway.kgateway.dev/v1alpha1
        kind: Backend
        metadata:
          name: ${metadata.componentName}-${parameters.endpointName}-api-gw-backend
          namespace: ${metadata.namespace}
        spec:
          type: Static
          static:
            hosts:
              # The environment's OWN gateway runtime, not a cluster-wide one.
              # There is one API Platform gateway per (org, environment) —
              # `api-platform-<org>-<env>` in namespace `<org>-<env>` — because
              # the gateway is where a managed API's authentication is
              # terminated, and it must be terminated against that
              # environment's identity tier and no other. componentNamespace IS
              # the org (the OpenChoreo namespace components are created in);
              # the same pair keys the RestApi label below.
              #
              # The `-gw-` infix comes from the API Platform gateway-operator:
              # from 0.11.0 it names the child Helm release for an APIGateway
              # "<apigateway-name>-gw". Port 22893 (not 8080) is the gateway
              # extension chart's runtime Service port. Both halves are the
              # chart's derivation — keep in lockstep with APIGatewayHost in
              # aep-api (projects/gateway_address.go) and with
              # deployments/scripts/setup-environment-gateway.sh, which
              # installs the gateway these names point at.
              - host: api-platform-${metadata.componentNamespace}-${metadata.environmentName}-gw-gateway-gateway-runtime.${metadata.componentNamespace}-${metadata.environmentName}
                port: 22893

    # --- RestApi: WSO2 API Platform API definition ---
    # Registers the API in the WSO2 gateway. The displayName, context, and version are
    # derived from the component metadata. The upstream URL points to the component's
    # Service using the endpoint port. Policies are conditionally included based
    # on the enabled flags in the environmentConfigs.
    - template:
        # v1, not v1alpha1: `kubectl get crd restapis.gateway.api-platform.wso2.com
        # -o jsonpath='{range .spec.versions[*]}{.name} served={.served} storage={.storage}{"\n"}{end}'`
        # reports v1 served+storage and v1alpha1 served-but-not-storage, so an
        # object written as v1alpha1 is converted on every read and is the one
        # that goes away when the alpha version is dropped.
        apiVersion: gateway.api-platform.wso2.com/v1
        kind: RestApi
        metadata:
          name: ${metadata.name}-${parameters.endpointName}
          namespace: ${metadata.namespace}
          labels:
            # Selects the environment's own APIGateway, which matches on exactly
            # this label (`apiSelector.scope: LabelSelector`). Required, not
            # decorative: no gateway is Cluster-scoped any more — that would
            # make every gateway serve every environment's APIs — so a RestApi
            # whose label names no existing APIGateway is served by nothing at
            # all, which presents as a 404 from the gateway with a
            # perfectly healthy-looking RestApi CR.
            #
            # The value is the APIGateway's name, derived by the gateway
            # extension chart as `api-platform-<org>-<env>`. verify-convergence
            # check 5 asserts every RestApi's label names a gateway that exists.
            gateway.api-platform.wso2.com/restapi-target: api-platform-${metadata.componentNamespace}-${metadata.environmentName}
        spec:
          displayName: ${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${parameters.endpointName}
          version: v1.0
          context: /${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${parameters.endpointName}
          upstream:
            main:
              url: "http://${metadata.componentName}.${metadata.namespace}:${parameters.upstreamPort > 0 ? parameters.upstreamPort : workload.endpoints[parameters.endpointName].port}${parameters.upstreamBasePath}"
          # API-level policies. The `jwt-auth` entry is the WHOLE-API
          # authentication of a component that declares no per-operation
          # policies and no public operation — today's behaviour, unchanged.
          # As soon as ANY operation declares `public: true` or a non-empty
          # `policies` list, this entry is suppressed: per-operation policies
          # add to API-level ones rather than replacing them, so leaving it in
          # would make every "public" operation demand a token anyway
          # (design note 9).
          policies: >-
            ${(environmentConfigs.cors.enabled ? [{"name": "cors", "version": "v1", "params": {"allowedOrigins": environmentConfigs.cors.allowedOrigins, "allowedMethods": environmentConfigs.cors.allowedMethods, "allowedHeaders": environmentConfigs.cors.allowedHeaders, "allowCredentials": environmentConfigs.cors.allowCredentials}}] : [])
              + ((environmentConfigs.jwtAuth.enabled && !parameters.operations.exists(op, (has(op.policies) && op.policies.size() > 0) || (has(op.public) && op.public)))
                  ? [{"name": "jwt-auth", "version": "v1", "params": {"issuers": environmentConfigs.jwtAuth.issuers, "audiences": environmentConfigs.jwtAuth.audience, "claimMappings": {"sub": "x-user-id", "username": "x-user-name", "ouHandle": "x-user-ou", "groups": "x-user-groups", "scope": "x-user-scopes"}}}] : [])
              + (environmentConfigs.rateLimit.enabled ? [{"name": "basic-ratelimit", "version": "v1", "params": {"limits": environmentConfigs.rateLimit.limits}}] : [])
              + (environmentConfigs.addHeaders.enabled ? [{"name": "add-headers", "version": "v1", "params": {"requestHeaders": environmentConfigs.addHeaders.requestHeaders, "responseHeaders": environmentConfigs.addHeaders.responseHeaders}}] : [])}
          # Operations. `method` and `path` pass through; the per-operation
          # policy list is COMPOSED here rather than passed through, because
          # the scope is a property of the component's contract (a trait
          # parameter, one value for every environment) while the issuers and
          # the audience are properties of the environment (the ReleaseBinding's
          # traitEnvironmentConfigs, a different value per environment). The
          # operation names the scope; the environment names whose tokens count.
          #
          # A non-empty `policies` list is composed FIRST, so `public: true`
          # can only ever be read on an operation that declares no policy of
          # its own (design note 9, PRECEDENCE).
          #
          # `oc_omit()` drops a key entirely: `policies` on a public or
          # policy-free operation, and `scopes` (or either of its lists) when
          # empty — an empty `scopes` object is not the same request as no
          # scope requirement, and `onFailureStatusCode` is never emitted at
          # all because the gateway rejects it (design note 6).
          operations: >-
            ${parameters.operations.map(op, {
              "method": op.method,
              "path": op.path,
              "policies": has(op.policies) && op.policies.size() > 0
                ? op.policies.map(p, {
                    "name": has(p.name) && p.name != "" ? p.name : "jwt-auth",
                    "version": has(p.version) && p.version != "" ? p.version : "v1",
                    "params": {
                      "issuers": environmentConfigs.jwtAuth.issuers,
                      "audiences": has(p.params) && has(p.params.audiences) && p.params.audiences.size() > 0
                        ? p.params.audiences : environmentConfigs.jwtAuth.audience,
                      "claimMappings": {"sub": "x-user-id", "username": "x-user-name", "ouHandle": "x-user-ou", "groups": "x-user-groups", "scope": "x-user-scopes"},
                      "scopes": has(p.params) && has(p.params.scopes)
                          && ((has(p.params.scopes.anyOf) && p.params.scopes.anyOf.size() > 0) || (has(p.params.scopes.allOf) && p.params.scopes.allOf.size() > 0))
                        ? {
                            "anyOf": has(p.params.scopes.anyOf) && p.params.scopes.anyOf.size() > 0 ? p.params.scopes.anyOf : oc_omit(),
                            "allOf": has(p.params.scopes.allOf) && p.params.scopes.allOf.size() > 0 ? p.params.scopes.allOf : oc_omit()
                          }
                        : oc_omit()
                    }
                  })
                : oc_omit()
            })}

  patches:
    # --- Patch HTTPRoute: Replace backendRef with WSO2 router Backend ---
    # Replaces the component's Service in the HTTPRoute backendRef with the kgateway
    # Backend pointing to the WSO2 API Platform router. This redirects all traffic
    # through the WSO2 router for policy enforcement before reaching the upstream service.
    #
    # The where clause matches the HTTPRoute by endpoint-name label, ensuring
    # only the correct endpoint's route is patched in multi-endpoint components.
    - target:
        group: gateway.networking.k8s.io
        version: v1
        kind: HTTPRoute
        where: '${resource.metadata.labels["openchoreo.dev/endpoint-name"] == parameters.endpointName}'
      operations:
        - op: replace
          path: /spec/rules/0/backendRefs/[?(@.name=='${metadata.componentName}')]
          value:
            group: gateway.kgateway.dev
            kind: Backend
            name: ${metadata.componentName}-${parameters.endpointName}-api-gw-backend
        # --- Patch HTTPRoute: Update URL rewrite to derived API context path ---
        # Sets the replacePrefixMatch to /<environment>-<namespace>-<componentName>-<endpointName>,
        # matching the RestApi context so the WSO2 router can route correctly.
        - op: replace
          path: /spec/rules/0/filters/0/urlRewrite/path
          value:
            type: ReplacePrefixMatch
            replacePrefixMatch: /${metadata.environmentName}-${metadata.componentNamespace}-${metadata.componentName}-${parameters.endpointName}
