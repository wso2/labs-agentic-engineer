apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-agents
  namespace: {{ .Release.Namespace }}
  labels:
    app: aep-agents
    app.kubernetes.io/managed-by: {{ .Release.Service}}
    app.kubernetes.io/part-of: aep
spec:
  replicas: {{ .Values.aepAgents.replicas | default 1 }}
  selector: 
    matchLabels: 
      app: aep-agents
  template:
    metadata:
      labels: 
        app: aep-agents
        app.kubernetes.io/part-of: wso2-agentic-engineer
    spec:
      securityContext:
        # Snapshots on the shared workspaces PVC stay readable for the
        # non-root runtime user (uid 1000) via the pod's fsGroup.
        fsGroup: 1000
      containers:
        - name: aep-agents
          image: "{{ .Values.aepAgents.image.repository }}:{{ .Values.aepAgents.image.tag }}"
          imagePullPolicy: {{ .Values.aepAgents.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aepAgents.port }}
              name: http
          resources: {{ toYaml .Values.aepAgents.resources | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.aepAgents.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.aepAgents.logLevel | quote }}
            - name: AGENT_MODEL
              value: {{ .Values.aepAgents.model | quote }}
            - name: AGENT_MAX_STEPS
              value: {{ .Values.aepAgents.maxSteps | quote }}
            - name: AGENT_BODY_LIMIT
              value: {{ .Values.aepAgents.bodyLimit | quote }}

            # Collab server the agents join as a live Yjs peer during spec
            # generation. Unset => /generate-spec answers 503.
            - name: AGENT_COLLAB_WS_URL
              value: "ws://collab-server:{{ .Values.collab.port }}"

            - name: WORKSPACE_MOUNT_ROOT
              value: "/workspaces"

            # secrets — no Anthropic key here on purpose: the model is built per
            # turn from the request's X-Anthropic-Key, which the BFF resolves
            # from the calling org's connected credential. Orgs bring their own
            # key and there is no platform fallback, so a boot-time key would be
            # read by nothing.
            - name: AGENT_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: aep-agents-secrets
                  key: AGENTS_JWT_SECRET

          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
              readOnly: true

      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: aep-workspaces
