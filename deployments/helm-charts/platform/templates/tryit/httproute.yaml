{{- if (default dict .Values.tryIt).enabled }}
# Served on its OWN hostname, not a path under the console's.
#
# The app is a separate OAuth client's redirect target: aep-api registers
# {publicURL}/callback as a redirect URI on every project's sign-in client, and
# a redirect URI is matched by origin. Hosting it under the console's origin
# would make the console's own origin a valid redirect target for every
# project's sign-in client, which is a wider grant than this app needs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aep-tryit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-control-plane
  hostnames:
    - {{ index (urlParse .Values.tryIt.publicURL) "hostname" | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aep-tryit
          namespace: {{ .Release.Namespace }}
          port: {{ .Values.tryIt.port }}
---
# The Gateway lives in another namespace, so the route's cross-namespace
# backendRef needs this grant — same as the console's.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: aep-tryit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openchoreo-control-plane
  to:
    - group: ""
      kind: Service
      name: aep-tryit
{{- end }}
