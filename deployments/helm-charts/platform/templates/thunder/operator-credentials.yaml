{{- if not .Values.localSecrets.enabled }}
# Namespace and ESO ExternalSecret for the thunder-app-operator.
# The operator reads THUNDER_SYSTEM_CLIENT_ID and THUNDER_SYSTEM_CLIENT_SECRET
# exclusively from the `thunder-app-operator-credentials` Secret created here.
# Creating these as part of the platform chart (rather than as addon PreManifests)
# means the Secret is ready before the addon installs the operator.
apiVersion: v1
kind: Namespace
metadata:
  name: thunder-app-operator-system
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thunder-app-operator-credentials
  namespace: thunder-app-operator-system
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: thunder-app-operator-credentials
  data:
    - secretKey: client-id
      remoteRef:
        key: aep/thunder-clients/system-client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: aep/thunder-clients/system-client
        property: value
{{- end }}
