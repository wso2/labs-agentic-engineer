---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-task-signing-key
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-task-signing-key
  data:
    - secretKey: task-signing.pem
      remoteRef:
        key: aep/task-signing-key
        property: value
---
# The AES-256 key aep-api encrypts every org's credentials under at rest
# (org_secrets, publisher_client_secret, webhook_secrets, test_users). Seeded
# once by `aectl platform install` and never regenerated — replacing it orphans
# every stored credential, so the installer treats this path as write-once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-credential-encryption-key
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-credential-encryption-key
  data:
    - secretKey: CREDENTIAL_ENCRYPTION_KEY
      remoteRef:
        key: aep/credential-encryption-key
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-oauth-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-oauth-secrets
  data:
    - secretKey: OAUTH_STATE_SIGNING_KEY
      remoteRef:
        key: aep/oauth-state-key
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-secrets
  data:
    - secretKey: OC_WORKLOAD_PUBLISHER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-workload-publisher
        property: value
    - secretKey: OC_OBSERVER_READER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-observer-reader
        property: value
    - secretKey: AEP_API_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/aep-api-client
        property: value
    - secretKey: BFF_TO_GIT_SERVICE_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-git-service
        property: value
    - secretKey: BFF_TO_REMOTE_WORKER_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-remote-worker
        property: value
    - secretKey: LOCAL_DEV_SEEDER_SECRET
      remoteRef:
        key: aep/thunder-clients/local-dev-seeder
        property: value
    - secretKey: THUNDER_SYSTEM_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/system-client
        property: value
    - secretKey: OC_RCA_AGENT_SECRET
      remoteRef:
        key: aep/thunder-clients/openchoreo-rca-agent
        property: value
{{- end }}
