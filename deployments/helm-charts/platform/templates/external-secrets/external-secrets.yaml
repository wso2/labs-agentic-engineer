{{- if not .Values.localSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-admin-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-admin-creds
  data:
    - secretKey: client-id
      remoteRef:
        key: aep/thunder-admin/client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: aep/thunder-admin/client-secret
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: aep/postgres-password
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-secrets
  data:
    - secretKey: OC_WORKLOAD_PUBLISHER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-workload-publisher
        property: value
    - secretKey: OC_OBSERVER_READER_SECRET
      remoteRef:
        key: aep/thunder-clients/oc-observer-reader
        property: value
    - secretKey: AEP_API_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/aep-api-client
        property: value
    - secretKey: BFF_TO_GIT_SERVICE_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-git-service
        property: value
    - secretKey: BFF_TO_REMOTE_WORKER_SECRET
      remoteRef:
        key: aep/thunder-clients/bff-remote-worker
        property: value
    - secretKey: LOCAL_DEV_SEEDER_SECRET
      remoteRef:
        key: aep/thunder-clients/local-dev-seeder
        property: value
    - secretKey: THUNDER_SYSTEM_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/system-client
        property: value
    - secretKey: OC_RCA_AGENT_SECRET
      remoteRef:
        key: aep/thunder-clients/openchoreo-rca-agent
        property: value
---
# The AE-only client secret lives in its own Secret: a missing vault key (an
# install seeded before this client existed) then fails only this sync, never
# aep-thunder-secrets. aep-api reads it as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-ae-studio-internal-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-ae-studio-internal-secrets
  data:
    - secretKey: AE_STUDIO_INTERNAL_CLIENT_SECRET
      remoteRef:
        key: aep/thunder-clients/ae-studio-internal
        property: value
{{- if (default dict (default dict .Values.aeStudio).webhookRelay).enabled }}
---
# The per-org webhook relay seed (values.yaml aeStudio.webhookRelay). Its own
# ExternalSecret: an install seeded before the relay existed fails only this
# sync, and aep-api reads the key as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-webhook-relay
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-webhook-relay
  data:
    - secretKey: AE_STUDIO_WEBHOOK_RELAY_SEED
      remoteRef:
        key: aep/webhook-relay-seed
        property: value
{{- end }}
{{- if .Values.sreHandoff.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-sre-handoff-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-sre-handoff-secrets
  data:
    # One shared credential at aep/aep-mcp-token: aep-api reads it as
    # SRE_HANDOFF_TOKEN and aep-mcp-server as its AEP_MCP_DEFAULT_BEARER
    # fallback (templates/aep-mcp-server/deployment.yaml), so there is no
    # second secret to keep in sync.
    - secretKey: SRE_HANDOFF_TOKEN
      remoteRef:
        key: aep/aep-mcp-token
        property: value
{{- end }}
{{- end }}
