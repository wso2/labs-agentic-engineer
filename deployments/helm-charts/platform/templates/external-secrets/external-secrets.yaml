        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
