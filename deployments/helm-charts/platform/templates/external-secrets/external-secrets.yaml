{{- if not .Values.localSecrets.enabled }}
{{- /* Where aectl registers the clients on a ThunderID it administers
(idp.clients thunder), it reads the ThunderID admin credentials and the secrets
of the clients it registers for OpenChoreo. On an IdP outside the cluster
(idp.clients imported or asgardeo) there are no ThunderID admin credentials,
and only the secrets of AE's own clients exist: stored by the IdP's admin, or
by aectl where it creates the clients in an Asgardeo organization. */}}
{{- $thunder := eq (default "thunder" .Values.idp.clients) "thunder" }}
{{- if $thunder }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-thunder-admin-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-thunder-admin-creds
  data:
    - secretKey: client-id
      remoteRef:
        key: aep/thunder-admin/client-id
        property: value
    - secretKey: client-secret
      remoteRef:
        key: aep/thunder-admin/client-secret
        property: value
---
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: postgres-secrets
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: aep/postgres-password
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-idp-client-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-idp-client-secrets
  data:
    {{- if $thunder }}
    - secretKey: OC_WORKLOAD_PUBLISHER_SECRET
      remoteRef:
        key: aep/idp-clients/oc-workload-publisher
        property: value
    - secretKey: OC_OBSERVER_READER_SECRET
      remoteRef:
        key: aep/idp-clients/oc-observer-reader
        property: value
    {{- end }}
    - secretKey: AEP_API_CLIENT_SECRET
      remoteRef:
        key: aep/idp-clients/aep-api-client
        property: value
    {{- if $thunder }}
    - secretKey: BFF_TO_GIT_SERVICE_SECRET
      remoteRef:
        key: aep/idp-clients/bff-git-service
        property: value
    - secretKey: BFF_TO_REMOTE_WORKER_SECRET
      remoteRef:
        key: aep/idp-clients/bff-remote-worker
        property: value
    - secretKey: LOCAL_DEV_SEEDER_SECRET
      remoteRef:
        key: aep/idp-clients/local-dev-seeder
        property: value
    - secretKey: OC_RCA_AGENT_SECRET
      remoteRef:
        key: aep/idp-clients/openchoreo-rca-agent
        property: value
    {{- end }}
---
# The AE-only client secret lives in its own Secret: a missing vault key (an
# install seeded before this client existed) then fails only this sync, never
# aep-idp-client-secrets. aep-api reads it as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-ae-studio-internal-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-ae-studio-internal-secrets
  data:
    - secretKey: AE_STUDIO_INTERNAL_CLIENT_SECRET
      remoteRef:
        key: aep/idp-clients/ae-studio-internal
        property: value
---
{{- if $thunder }}
# aectl's own client on the platform IdP (aectl.openchoreoClient.clientId),
# which it calls OpenChoreo's Secret API with. aectl reads this Secret to
# register the client and to get its token; no pod reads it, so it is kept out
# of the shared aep-idp-client-secrets. Its own ExternalSecret: a path not
# stored yet fails only this sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-aectl-client-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-aectl-client-secrets
  data:
    - secretKey: AECTL_OPENCHOREO_CLIENT_SECRET
      remoteRef:
        key: aep/idp-clients/aectl-openchoreo
        property: value
---
{{- end }}
# The one org's two pre-created clients on the platform IdP (values.yaml
# idp): aep-publisher-<org> and ae-studio-<org> are created before aep-api
# runs, by aectl on a ThunderID it administers and by the IdP's admin
# otherwise, and their secrets are stored at these paths. aep-api holds no
# rights to create them, so it stores these in the org's references on GitHub
# connect. Its own ExternalSecret: a path not stored yet fails only this sync,
# aep-api reads the keys as optional and names the missing one at boot.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-org-client-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-org-client-secrets
  data:
    - secretKey: PLATFORM_IDP_ORG_PUBLISHER_SECRET
      remoteRef:
        key: aep/idp-clients/org-publisher
        property: value
    - secretKey: PLATFORM_IDP_ORG_STUDIO_SECRET
      remoteRef:
        key: aep/idp-clients/org-studio
        property: value
{{- if (default dict (default dict .Values.aeStudio).webhookRelay).enabled }}
---
# The per-org webhook relay seed (values.yaml aeStudio.webhookRelay). Its own
# ExternalSecret: an install seeded before the relay existed fails only this
# sync, and aep-api reads the key as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-webhook-relay
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-webhook-relay
  data:
    - secretKey: AE_STUDIO_WEBHOOK_RELAY_SEED
      remoteRef:
        key: aep/webhook-relay-seed
        property: value
{{- end }}
{{- if (default dict (default dict .Values.aeStudio).jev).enabled }}
---
# The platform's one Jev key (values.yaml aeStudio.jev), for aep-api only. Its
# own ExternalSecret: an install that has not imported the key fails only this
# sync, and aep-api reads it as optional.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-jev
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aep-platform
    kind: ClusterSecretStore
  target:
    name: aep-jev
  data:
    - secretKey: AE_STUDIO_JEV_API_KEY
      remoteRef:
        key: aep/jev-api-key
        property: value
{{- end }}
{{- end }}
