{{- if .Values.codingAgentDispatch.localStubs.enabled }}
# LOCAL DEV ONLY — see values.yaml codingAgentDispatch.localStubs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: cluster-gateway-proxy
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-gateway-proxy
  template:
    metadata:
      labels:
        app: cluster-gateway-proxy
        app.kubernetes.io/part-of: wso2-aep
    spec:
      serviceAccountName: cluster-gateway-proxy
      containers:
        - name: cluster-gateway-proxy
          image: {{ .Values.codingAgentDispatch.clusterGatewayProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.codingAgentDispatch.clusterGatewayProxy.port }}
              name: http
          env:
            - name: LISTEN_ADDR
              value: ":{{ .Values.codingAgentDispatch.clusterGatewayProxy.port }}"
            - name: LOG_LEVEL
              value: "info"
          # No KUBECONFIG: the stub falls back to in-cluster config and uses the
          # pod ServiceAccount token (see local-cluster-gateway-proxy/main.go).
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
{{- end }}
