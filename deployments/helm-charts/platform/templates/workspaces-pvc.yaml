---
# Shared git-workspaces volume — bare repo mirrors + per-SHA snapshots.
# aep-api is the sole writer; agents mounts it read-only. ReadWriteOnce with
# co-located pods (shared-label hostname podAffinity). See
# services/aep-api/design/shared-workspace-volume.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aep-workspaces
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  accessModes:
    - {{ .Values.workspaces.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.workspaces.storageClassName }}
  storageClassName: {{ .Values.workspaces.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspaces.storage | quote }}
