---
# aep-api's workspace volume — coding-agent run recordings under runs/.
# aep-api is the sole writer and reader (ReadWriteOnce).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aep-workspaces
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-aep
spec:
  accessModes:
    - {{ .Values.workspaces.accessMode | default "ReadWriteOnce" }}
  {{- if .Values.workspaces.storageClassName }}
  storageClassName: {{ .Values.workspaces.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workspaces.storage | quote }}
