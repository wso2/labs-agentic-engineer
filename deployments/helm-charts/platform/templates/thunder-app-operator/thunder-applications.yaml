# Platform Thunder OAuth clients provisioned by the thunder-app-operator.
#
# Confidential clients (client_credentials): secrets are pre-generated by
# `aectl platform install` and synced from OpenBao via ESO into the
# aep-thunder-secrets Secret in this namespace. The operator reads the secret
# when reconciling each CR — if the Secret is not yet synced, the CR retries
# with a 30s backoff until ESO delivers it.
#
# Public clients (PKCE authorization_code): no secret needed. Redirect URIs
# are set from chart values and patched by aep-api once the SPA's public URL
# resolves.
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: oc-workload-publisher-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "OC Workload Publisher"
  clientType: confidential
  clientId: "openchoreo-workload-publisher-client"
  secretRef:
    name: aep-thunder-secrets
    key: OC_WORKLOAD_PUBLISHER_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: oc-observer-reader-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "OC Observer Resource Reader"
  clientType: confidential
  clientId: "openchoreo-observer-resource-reader-client"
  secretRef:
    name: aep-thunder-secrets
    key: OC_OBSERVER_READER_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: aep-api-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP API"
  clientType: confidential
  clientId: "aep-api-client"
  secretRef:
    name: aep-thunder-secrets
    key: AEP_API_CLIENT_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: bff-git-service-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP BFF → Git Service"
  clientType: confidential
  clientId: "bff-git-service"
  secretRef:
    name: aep-thunder-secrets
    key: BFF_TO_GIT_SERVICE_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: bff-remote-worker-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP BFF → Remote Worker"
  clientType: confidential
  clientId: "bff-remote-worker"
  secretRef:
    name: aep-thunder-secrets
    key: BFF_TO_REMOTE_WORKER_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: local-dev-seeder-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP Local Dev Seeder"
  clientType: confidential
  clientId: "local-dev-seeder"
  secretRef:
    name: aep-thunder-secrets
    key: LOCAL_DEV_SEEDER_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: system-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP System Client"
  clientType: confidential
  clientId: "aep-system-client"
  secretRef:
    name: aep-thunder-secrets
    key: THUNDER_SYSTEM_CLIENT_SECRET
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: oc-rca-agent-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "OC RCA Agent"
  clientType: confidential
  clientId: "openchoreo-rca-agent"
  secretRef:
    name: aep-thunder-secrets
    key: OC_RCA_AGENT_SECRET
---
# Public PKCE clients — browser SPAs.
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: console-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP Console"
  clientId: "aep-console-client"
  scopes: "openid profile email group ou"
  redirectUris: "{{ .Values.console.publicURL }}/callback"
---
apiVersion: aep.wso2.com/v1alpha1
kind: ThunderApplication
metadata:
  name: cli-client
  namespace: {{ .Release.Namespace }}
spec:
  displayName: "AEP CLI"
  clientId: "aep-cli-client"
  scopes: "openid profile email group ou"
  redirectUris: "http://localhost,http://127.0.0.1"
