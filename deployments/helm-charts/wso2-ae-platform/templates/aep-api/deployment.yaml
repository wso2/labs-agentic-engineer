apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: aep-api
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
spec:
  replicas: {{ .Values.aepApi.replicas | default 1 }}
  selector:
    matchLabels:
      app: aep-api
  template:
    metadata:
      labels:
        app: aep-api
        app.kubernetes.io/part-of: wso2-agentic-engineer
    spec:
      serviceAccountName: aep-api
      securityContext:
        # The shared workspaces PVC is handed to the pod's fsGroup so the
        # non-root runtime user (uid 1000) can write it.
        fsGroup: 1000
      containers:
        - name: aep-api
          image: "{{ .Values.aepApi.image.repository }}:{{ .Values.aepApi.image.tag }}"
          imagePullPolicy: {{ .Values.aepApi.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aepApi.port }}
              name: http
          resources: {{ toYaml .Values.aepApi.resources | nindent 12 }}
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: {{ .Values.aepApi.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.aepApi.logLevel | quote }}
            - name: DEPLOYMENT_TIER
              value: {{ .Values.aepApi.deploymentTier | quote }}
            - name: TEST_MODE
              value: "false"
            - name: LOCAL_OPENBAO_REPAIR
              value: "false"

            # ── Shared git workspaces (RWX PVC aep-workspaces) ────────────────
            # Bare mirrors + per-SHA snapshots
            # (docs/design/shared-volume-clone-architecture.md). Sole writer.
            - name: AEP_WORKSPACE_ROOT
              value: "/workspaces"

            # ── Database ──────────────────────────────────────────────────────
            {{- if .Values.postgres.url }}
            - name: DATABASE_URL
              value: {{ .Values.postgres.url | quote }}
            {{- else }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@aep-db:5432/{{ .Values.postgres.auth.database }}?sslmode=disable"
            {{- end }}

            # ── OpenChoreo ────────────────────────────────────────────────────
            - name: PLATFORM_API_SERVICE_BASE_URL
              value: {{ .Values.openchoreo.apiBaseURL | quote }}
            - name: PLATFORM_API_SERVICE_HOST
              value: {{ .Values.openchoreo.apiGatewayHost | quote }}

            # ── File-mutation agents service (services/agents) ────────────────
            # BFF→agents M2M: an HS256 bearer signed with the shared secret the
            # agents deployment verifies (AGENT_JWT_SECRET). Reached by Service
            # DNS, independent of the gateway HTTPRoute split.
            - name: AGENTS_SVC_BASE_URL
              value: "http://agents.{{ .Release.Namespace }}:{{ .Values.agents.port }}"
            - name: AGENTS_SVC_JWT_SECRET
              value: {{ .Values.agents.m2mSecret | quote }}
            - name: AGENTS_SVC_JWT_AUDIENCE
              value: {{ .Values.agents.jwtAudience | quote }}
            - name: AGENTS_SVC_JWT_ISSUER
              value: {{ .Values.agents.jwtIssuer | quote }}
            # The runner's /internal callback base. Points at the dedicated
            # internal host when bff.internalURL is set (pairs with the
            # aepApi.internalHostname HTTPRoute split); otherwise the public URL.
            - name: AGENT_PLATFORM_URL
              value: {{ .Values.bff.internalURL | default .Values.bff.publicURL | quote }}
            # The BFF's own base URL as reached by the agents service (in-cluster
            # Service DNS) for the internal MCP discovery surface. Enables the
            # `mcp` bundle handed to the agents service in the generation turn.
            # (Inert until the dependencies feature lands — Phase 4.)
            - name: AEP_API_INTERNAL_BASE_URL
              value: "http://aep-api.{{ .Release.Namespace }}:{{ .Values.aepApi.port }}"
            # ESO ClusterSecretStore backing the proxy-dispatched runners' per-run
            # ExternalSecrets. Empty → BFF default ("default", local k3d); a real
            # dataplane must set it to the DP app-secrets store or private-repo
            # build clones + agent creds silently resolve nothing.
            - name: AGENT_CLUSTER_SECRET_STORE
              value: {{ .Values.aepApi.agentClusterSecretStore | default "" | quote }}

            # ── Temporal orchestrator (dial-only client, R5) ───────────────────
            # aep-api starts/signals/queries development-flow workflows executed
            # by the `orchestrator` Deployment; it runs no worker itself. NOTE:
            # spelled differently than the orchestrator's own TEMPORAL_HOSTPORT
            # (no underscore between HOST and PORT) — see
            # services/aep-api/internal/config/config.go vs
            # services/orchestrator/internal/config/config.go.
            - name: TEMPORAL_HOST_PORT
              value: "temporal-frontend:7233"
            - name: TEMPORAL_NAMESPACE
              value: "default"
            - name: TEMPORAL_TASK_QUEUE
              value: "aep-orchestrator"

            # ── Identity Provider (OC Thunder) ────────────────────────────────
            - name: JWKS_URL
              value: {{ .Values.idp.jwksInternalURL | default .Values.idp.jwksURL | quote }}
            - name: JWT_ISSUER
              value: {{ .Values.idp.issuer | quote }}
            - name: JWT_AUDIENCE
              value: "aep-*"
            - name: THUNDER_ADMIN_URL
              value: {{ .Values.idp.adminURL | quote }}
            - name: THUNDER_SYSTEM_CLIENT_ID
              value: {{ .Values.thunderSystemClient.clientId | quote }}
            - name: THUNDER_SYSTEM_CLIENT_SECRET
              value: {{ .Values.thunderSystemClient.clientSecret | quote }}
            - name: PLATFORM_IDP_ISSUER
              value: {{ .Values.idp.issuer | quote }}
            - name: PLATFORM_IDP_JWKS_URL
              value: {{ .Values.idp.jwksInternalURL | default .Values.idp.jwksURL | quote }}
            - name: USER_APPS_OIDC_ISSUER
              value: {{ .Values.idp.issuer | quote }}
            - name: USER_APPS_OIDC_CLIENT_ID
              value: {{ .Values.console.thunder.clientId | quote }}
            - name: USER_APPS_OIDC_SCOPES
              value: "openid profile"

            # ── Service auth (BFF service identity for OC API calls) ──────────
            - name: SERVICE_AUTH_TOKEN_URL
              value: {{ .Values.aepApi.serviceAuth.tokenURL | quote }}
            - name: SERVICE_AUTH_CLIENT_ID
              value: {{ .Values.aepApi.serviceAuth.clientId | quote }}
            - name: SERVICE_AUTH_CLIENT_SECRET
              value: {{ .Values.aepApi.serviceAuth.clientSecret | quote }}
            - name: SERVICE_AUTH_HOST_HEADER
              value: ""
            - name: SERVICE_AUTH_GIT_TOKEN_URL
              value: {{ .Values.idp.tokenURL | quote }}
            - name: SERVICE_AUTH_GIT_CLIENT_ID
              value: "aep-bff-to-git-service"
            - name: SERVICE_AUTH_GIT_CLIENT_SECRET
              value: "aep-bff-to-git-service-secret"
            - name: SERVICE_AUTH_GIT_HOST_HEADER
              value: ""

            # ── Task JWT ──────────────────────────────────────────────────────
            - name: BFF_TASK_SIGNING_KEY_PATH
              value: "/app/keys/task-signing.pem"
            - name: BFF_TASK_TOKEN_ISSUER
              value: {{ .Values.taskSigning.issuer | quote }}
            - name: BFF_TASK_TOKEN_AUDIENCE
              value: {{ .Values.taskSigning.audience | quote }}
            - name: BFF_PUBLIC_URL
              value: {{ .Values.bff.publicURL | quote }}

            # ── GitHub ────────────────────────────────────────────────────────
            - name: GITHUB_APP_SLUG
              value: {{ .Values.github.appSlug | quote }}
            - name: GITHUB_REPO_VISIBILITY
              value: {{ .Values.github.repoVisibility | quote }}
            - name: GIT_COMMITTER_NAME
              value: {{ .Values.github.committerName | quote }}
            - name: GIT_COMMITTER_EMAIL
              value: {{ .Values.github.committerEmail | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_PATH
              value: "/etc/github-app/private-key.pem"
            - name: GITHUB_WEBHOOK_DELIVERY_URL
              value: {{ .Values.smee.url | default .Values.bff.publicURL | quote }}
            - name: GITHUB_WEBHOOK_SECRET
              value: {{ .Values.github.webhookSecret | quote }}
            - name: OAUTH_STATE_SIGNING_KEY
              value: {{ .Values.github.oauthStateKey | quote }}
            - name: GITHUB_APP_ID
              value: {{ .Values.github.appId | quote }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.github.clientId | quote }}
            - name: GITHUB_CLIENT_SECRET
              value: {{ .Values.github.clientSecret | quote }}

            # ── OpenBao ───────────────────────────────────────────────────────
            - name: OPENBAO_ADDR
              value: {{ .Values.openbao.addr | quote }}
            - name: OPENBAO_TOKEN
              value: {{ .Values.openbao.token | quote }}

            # ── Cloud service stubs ───────────────────────────────────────────
            - name: SECRET_MANAGER_API_URL
              value: {{ .Values.aepApi.smApiURL | default "" | quote }}
            - name: CLUSTER_GATEWAY_PROXY_URL
              value: {{ .Values.aepApi.clusterGatewayProxyURL | default "" | quote }}

            # ── Observer ──────────────────────────────────────────────────────
            - name: OBSERVER_URL
              value: {{ .Values.observer.url | quote }}
            - name: OBSERVER_OAUTH_TOKEN_URL
              value: {{ .Values.observer.oauth.tokenURL | quote }}
            - name: OBSERVER_OAUTH_CLIENT_ID
              value: {{ .Values.observer.oauth.clientId | quote }}
            - name: OBSERVER_OAUTH_CLIENT_SECRET
              value: {{ .Values.observer.oauth.clientSecret | quote }}
            - name: OBSERVER_OAUTH_HOST_HEADER
              value: ""

          volumeMounts:
            - name: task-signing-key
              mountPath: /app/keys
              readOnly: true
            - name: workspaces
              mountPath: /workspaces
            {{- if .Values.github.appPrivateKeyPem }}
            - name: github-app-key
              mountPath: /etc/github-app
              readOnly: true
            {{- end }}

      volumes:
        - name: task-signing-key
          configMap:
            name: aep-api-task-signing-key
        - name: workspaces
          persistentVolumeClaim:
            claimName: aep-workspaces
        {{- if .Values.github.appPrivateKeyPem }}
        - name: github-app-key
          configMap:
            name: aep-api-github-app-key
        {{- end }}
{{- if .Values.taskSigning.privateKeyPem }}
---
# ConfigMap holding the task-signing RSA private key (only if custom key provided).
# If not provided, the auto-generation hook job creates this ConfigMap instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aep-api-task-signing-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
data:
  task-signing.pem: {{ .Values.taskSigning.privateKeyPem | quote }}
{{- end }}
{{- if .Values.github.appPrivateKeyPem }}
---
# ConfigMap holding the GitHub App private key
apiVersion: v1
kind: ConfigMap
metadata:
  name: aep-api-github-app-key
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: wso2-agentic-engineer
data:
  private-key.pem: {{ .Values.github.appPrivateKeyPem | quote }}
{{- end }}
