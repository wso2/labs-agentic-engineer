# ── OC control-plane gateway ──────────────────────────────────────────────────
# The AEP HTTPRoutes are placed in this gateway's namespace so that the
# control-plane gateway routes external traffic to the services in wso2-ae.
ocGateway:
  namespace: "openchoreo-control-plane"
  name: "gateway-default"

# ── OpenChoreo platform API ───────────────────────────────────────────────────
openchoreo:
  apiBaseURL: "http://openchoreo-api.openchoreo-control-plane:8080"
  apiGatewayHost: "api.openchoreo.localhost"
  # OC organisation handle — used to name the workflows-<orgHandle> namespace
  # where the BFF pre-stages coding-agent secrets before each WorkflowRun.
  orgHandle: "default"

# ── Identity Provider (OC Thunder) ───────────────────────────────────────────
idp:
  # Public URL — must match the `iss` claim in tokens Thunder issues.
  issuer: "http://thunder.openchoreo.localhost:8080"
  # URL used by the browser / external clients for JWKS discovery.
  jwksURL: "http://thunder.openchoreo.localhost:8080/oauth2/jwks"
  # In-cluster URL the aep-api pod uses to fetch JWKS at runtime.
  jwksInternalURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
  tokenURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
  adminURL: "http://thunder-service.thunder.svc.cluster.local:8090"

# ── BFF public URL ────────────────────────────────────────────────────────────
# The stable gateway-routed URL for the BFF, reachable from:
#   - GitHub (webhook delivery)
#   - Coding-agent pods in WorkflowPlane (callback)
bff:
  publicURL: "http://aep-api.openchoreo.localhost:8080"
  # When set, the runner's AGENT_PLATFORM_URL (its /internal callback base)
  # points here — the dedicated internal host — instead of publicURL. Pairs with
  # aepApi.internalHostname. Empty = the runner keeps using publicURL and
  # /internal stays on the public host (the auth seam still protects it).
  internalURL: ""

# ── OpenBao ───────────────────────────────────────────────────────────────────
openbao:
  addr: "http://openbao.openbao.svc.cluster.local:8200"
  # Dev default — override for production
  token: "root"

# ── Observer ──────────────────────────────────────────────────────────────────
observer:
  url: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"
  oauth:
    tokenURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
    clientId: "openchoreo-observer-resource-reader-client"
    clientSecret: "openchoreo-observer-resource-reader-client-secret"

# ── PostgreSQL (direct StatefulSet — not an OC Resource) ─────────────────────
# Set postgres.url to use an external database and skip the bundled StatefulSet.
postgres:
  # If non-empty, use this as DATABASE_URL and skip bundled StatefulSet deployment.
  url: ""
  image: "postgres:16-alpine"
  auth:
    database: aep
    username: aep
    # WARNING: change this for production
    password: "aep-dev-password"
  storage: "5Gi"

# ── Temporal orchestrator server (R5, ADR-0005) ──────────────────────────────
# Postgres-backed, using the SAME shared Postgres instance as aep-api/agents
# (new `temporal` + `temporal_visibility` databases on it, not a dedicated
# StatefulSet — a deliberate simplicity trade-off; see R5-handover notes).
temporal:
  postgresHost: "aep-db"
  image:
    # temporalio/auto-setup runs schema create+migrate on boot against
    # POSTGRES_SEEDS — no separate schema-bootstrap Job needed for the server
    # itself (only the search-attribute Job below is separate).
    # UNVERIFIED TAG — no registry access at authoring time; confirm the
    # latest compatible auto-setup tag against Docker Hub before install.
    repository: temporalio/auto-setup
    tag: "1.28.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
  # CLI image for the search-attribute-job.yaml admin Job. DELIBERATELY a
  # different image family than temporal.image above: auto-setup bundles the
  # server binary + schema-setup tool, not necessarily the unified `temporal`
  # CLI this Job's script invokes. Matches the tag already pinned for the dev
  # docker-compose server (deployments/docker-compose.yml) — a known-good CLI
  # image, so no new tag to separately verify.
  cliImage:
    repository: temporalio/temporal
    tag: "1.7.2"
    pullPolicy: IfNotPresent

temporalUI:
  enabled: true
  hostname: "temporal.aep.openchoreo.localhost"
  image:
    repository: temporalio/ui
    tag: "2.31.2"
    pullPolicy: IfNotPresent

# ── Orchestrator worker (services/orchestrator) ──────────────────────────────
# The only process that registers/executes DevelopmentFlowWorkflow +
# TaskLifecycleWorkflow. No Service/HTTPRoute — polls Temporal only.
orchestrator:
  image:
    repository: ghcr.io/wso2/aep-orchestrator
    tag: 0.0.0-dev
    pullPolicy: Always
  replicas: 1
  # Bearer credential for the /internal/v1/orchestration/* S2S surface
  # (auth.SecurityRunner). Placeholder — wire the real minted credential once
  # R3's runner-auth story for the orchestrator is settled.
  aepAPIInternalBearer: ""
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

# ── Shared git workspaces (RWX PVC) ──────────────────────────────────────────
# Bare repo mirrors + per-SHA snapshots shared between aep-api (sole writer)
# and agents (read-only). See docs/design/shared-volume-clone-architecture.md §13.
workspaces:
  storage: "10Gi"
  # StorageClass for the ReadWriteMany claim. Empty = the cluster default. A
  # REAL RWX class (NFS / EFS / CephFS) is required to run more than one
  # aep-api replica; single-node k3d fakes RWX on the local-path provisioner,
  # which is fine locally but does not survive multi-node scheduling.
  storageClassName: ""

# ── Task JWT signing key ──────────────────────────────────────────────────────
taskSigning:
  issuer: "aep-bff"
  audience: "git-service"
  # Auto-generated by Helm hook Job (wso2-agentic-engineer-bundle/task-signing-key-job.yaml)
  # on first install. Subsequent helm upgrades preserve the existing key, ensuring that
  # task JWTs remain valid across pod restarts and cluster upgrades.
  #
  # To override with a custom key (for production):
  #   helm install ... --set-file taskSigning.privateKeyPem=my-key.pem
  #
  # If provided, this value is used; otherwise the hook Job auto-generates it.
  privateKeyPem: ""

# ── Smee webhook relay (optional) ────────────────────────────────────────────
# For local k3d clusters where GitHub cannot deliver webhooks directly.
# Set smee.url to a smee.io channel URL (https://smee.io/new).
# When set, the BFF's GITHUB_WEBHOOK_DELIVERY_URL is overridden to this URL
# so GitHub registers webhooks against the public smee.io address.
smee:
  url: ""
  image: "node:20-alpine"

# ── GitHub ────────────────────────────────────────────────────────────────────
github:
  appSlug: "aep-platform"
  repoVisibility: "private"
  committerName: "AEP Bot"
  committerEmail: "bot@aep.dev"
  webhookSecret: "dev-webhook-secret"
  oauthStateKey: "dev-oauth-state-key-32-chars-long!!"
  appId: ""
  clientId: ""
  clientSecret: ""
  # GitHub App private key PEM (optional — leave empty for PAT-based auth)
  # Pass via: --set-file github.appPrivateKeyPem=key.pem
  appPrivateKeyPem: ""

# ── aep-api (BFF) ──────────────────────────────────────────────────────────
aepApi:
  # Hostname for the OC control-plane gateway HTTPRoute (public/browser surface).
  hostname: "aep-api.openchoreo.localhost"
  # Optional dedicated internal-S2S host. When set, /internal moves OFF the
  # public host onto its own HTTPRoute on this hostname (defense-in-depth — the
  # auth seam is still the real boundary), and the public route is narrowed to
  # the browser/discovery prefixes. Requires a gateway listener for this
  # hostname + bff.internalURL pointed at it. Empty = /internal stays on the
  # public host (current behaviour, nothing to configure).
  internalHostname: ""
  image:
    repository: ghcr.io/wso2/aep-api
    tag: 0.0.0-dev
    pullPolicy: Always
  port: 9090
  logLevel: info
  deploymentTier: production
  replicas: 1
  # Service identity for OC API calls (registered in OC Thunder by bootstrap job)
  serviceAuth:
    clientId: "aep-api-client"
    clientSecret: "aep-api-client-secret"
    tokenURL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
  smApiURL: ""
  clusterGatewayProxyURL: ""
  # ESO ClusterSecretStore the proxy-dispatched coding-agent + build runners read
  # their per-run ExternalSecrets from. Empty → the BFF default ("default",
  # correct for local k3d). On a real dataplane this MUST be the DP's app-secrets
  # store (e.g. "application-secrets-read") or the ExternalSecrets silently
  # resolve nothing and private-repo clones / agent creds never materialise.
  agentClusterSecretStore: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# ── agents (file-mutation agents service — services/agents) ───────────────────
# Requirements/design/chat generation + task planning. Tenancy-blind; the per-org
# Anthropic key arrives per-turn (no boot-time key). Owns its own `conversations`
# table in the shared postgres (TTL-swept).
agents:
  image:
    repository: ghcr.io/wso2/aep-agents
    tag: 0.0.0-dev
    pullPolicy: Always
  port: 4000
  logLevel: info
  model: "claude-sonnet-5"
  # Per-step output-token ceiling (services/agents shared/config.ts).
  maxOutputTokens: 64000
  # SSE keep-alive cadence (ms) so long generations survive an idle-timeout ingress.
  keepAliveMs: 15000
  conversations:
    # TTL sweep on the `conversations` table (ms). Default 7 days.
    ttlMs: 604800000
    # Sweep interval (ms). Default 1 hour.
    sweepMs: 3600000
  # BFF→agents M2M shared secret (HS256). The BFF signs outbound bearers with
  # this same value (aep-api env AGENTS_SVC_JWT_SECRET) and agents verifies it
  # (AGENT_JWT_SECRET). WARNING: override for production.
  m2mSecret: "dev-agents-m2m-secret"
  # Must match the BFF's AGENTS_SVC_JWT_AUDIENCE / AGENTS_SVC_JWT_ISSUER.
  jwtAudience: "agents-service"
  jwtIssuer: "aep-bff"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# ── console ───────────────────────────────────────────────────────────────────
console:
  # Hostname for the OC control-plane gateway HTTPRoute
  hostname: "aep.openchoreo.localhost"
  image:
    repository: ghcr.io/wso2/aep-console
    tag: 0.0.0-dev
    pullPolicy: Always
  # nginx port inside the container
  port: 3000
  publicURL: "http://aep.openchoreo.localhost:8080"
  thunderPublicURL: "http://thunder.openchoreo.localhost:8080"
  thunder:
    clientId: "aep-console-client"
    scopes: "openid profile email"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

# ── Thunder system client ─────────────────────────────────────────────────────
# Used by aep-api to provision per-org OAuth clients via Thunder admin API.
# Must match the client registered in OC Thunder by the bootstrap job.
thunderSystemClient:
  clientId: "aep-system-client"
  clientSecret: "aep-system-client-secret"
