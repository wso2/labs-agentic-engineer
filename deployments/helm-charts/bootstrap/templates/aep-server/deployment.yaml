apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aep-server
    app.kubernetes.io/part-of: aep
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aep-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aep-server
        app.kubernetes.io/part-of: aep
    spec:
      serviceAccountName: aep-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aep-server
          image: "{{ .Values.aepServer.image.repository }}:{{ .Values.aepServer.image.tag }}"
          imagePullPolicy: {{ .Values.aepServer.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.aepServer.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: OPENBAO_ADDR
              value: "http://{{ .Release.Name }}-aep-openbao.{{ .Release.Namespace }}.svc.cluster.local:8200"
            - name: AEP_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ESO_NAMESPACE
              value: {{ .Values.aepServer.esoNamespace | quote }}
            - name: ESO_SA
              value: {{ .Values.aepServer.esoServiceAccount | quote }}
            - name: THUNDER_NAMESPACE
              value: {{ .Values.aepServer.thunderNamespace | quote }}
            - name: THUNDER_RELEASE
              value: {{ .Values.aepServer.thunderRelease | quote }}
            - name: CONSOLE_URL
              value: {{ .Values.console.publicURL | quote }}
            # LOCAL DEV ONLY — when true, Init keeps the OpenBao root token so the
            # in-process OpenBao-direct secrets provider (root-token auth) works.
            # Never in prod.
            - name: LOCAL_STUBS_ENABLED
              value: {{ .Values.localStubs.enabled | quote }}
          readinessProbe:
            grpc:
              port: {{ .Values.aepServer.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.aepServer.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
