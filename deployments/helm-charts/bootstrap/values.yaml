aep-openbao:
  injector:
    enabled: false
  server:
    standalone:
      enabled: true
    ha:
      enabled: false

aepServer:
  image:
    repository: ghcr.io/wso2/aep/aep-server
    tag: latest
    pullPolicy: IfNotPresent
  port: 9091
  esoNamespace: external-secrets
  esoServiceAccount: external-secrets
  thunderNamespace: thunder
  thunderRelease: thunder
  host: "aep-server.openchoreo.localhost"

console:
  publicURL: "http://console.openchoreo.localhost:8080"

# LOCAL DEV ONLY. When enabled, aep-server's Init keeps the OpenBao root token
# (does not revoke it) so the in-process OpenBao-direct secrets provider —
# which authenticates with the root token — can write delivery secrets.
# Must stay false in production, where the root token is always revoked.
# Pair with the platform chart's codingAgentDispatch.localStubs.enabled=true
# (which sets OPENBAO_* on aep-api).
localStubs:
  enabled: false
