services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — shared by aep-api (BFF) and git-service.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aep-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: aep
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: aep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aep"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aep

  # ---------------------------------------------------------------------------
  # workspace-init — one-shot chown of the shared workspaces volume. A fresh
  # named volume is root-owned, but both aep-api and agents run non-root
  # (uid 1000); hand the mount to uid 1000 once before either starts.
  # ---------------------------------------------------------------------------
  workspace-init:
    image: alpine:3.21
    container_name: aep-workspace-init
    command: ["chown", "1000:1000", "/workspaces"]
    volumes:
      - aep-workspaces:/workspaces
    restart: "no"
    networks:
      - aep

  # ---------------------------------------------------------------------------
  # aep-api — Go BFF + GitHub webhook receiver. Reaches OC via the k3d
  # docker network (k3d-openchoreo-serverlb) and Thunder via the same
  # loadbalancer routed by Host header.
  # ---------------------------------------------------------------------------
  aep-api:
    build:
      context: ../services/aep-api
      # The platform skill library (repo-root skills/) as a BuildKit named
      # context — the Dockerfile COPYs it to /app/skills. Keeps the single
      # authored source out of the aep-api module (no vendored copy).
      additional_contexts:
        skills: ../skills
    container_name: aep-api
    # Fast SYN-retransmit recovery for the local Colima env. Its docker-bridge
    # NAT intermittently drops a SYN under concurrent outbound bursts (the BFF's
    # parallel git fetches + GitHub API calls on a project page load); the kernel
    # default (tcp_syn_retries=6) then leaves the connect hanging ~50-76s before
    # a retransmit lands — surfacing as hanging tasks/versions endpoints. 2
    # retries recovers (or fails fast) within ~7s so reads degrade gracefully and
    # the console re-polls. Namespaced sysctl (per-netns); harmless elsewhere.
    # Proper durable fix tracked in docs/design/gitfs-fetch-on-read-followup.md.
    sysctls:
      net.ipv4.tcp_syn_retries: "2"
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_started
      workspace-init:
        condition: service_completed_successfully
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "9090"
      LOG_LEVEL: "debug"
      DATABASE_URL: "postgres://aep:aep@postgres:5432/aep?sslmode=disable"
      # The one runner image, used by BOTH task kinds (implementation and
      # validation). Defaults to the locally-built aep-runner:dev, which
      # setup-aep.sh builds + k3d-imports (`make build-runner`); it has no
      # published counterpart on this branch, and there is no fallback — an
      # unset/absent image makes coding dispatch fail loudly. Never :latest
      # for a local tag (that flips imagePullPolicy to Always and forces a
      # registry pull). Override to a published ghcr.io/wso2/aep/remote-worker
      # tag in cloud release bindings.
      AGENT_RUNNER_IMAGE: "${AGENT_RUNNER_IMAGE:-aep-runner:dev}"
      # Finished cycle Components are retained so their observer archive stays
      # queryable, then pruned oldest-first past this cap (code default 10).
      # Lowered locally only to make the prune observable in three cycles.
      CODING_AGENT_COMPONENT_RETENTION: "${CODING_AGENT_COMPONENT_RETENTION:-}"
      DEPLOYMENT_TIER: "${DEPLOYMENT_TIER:-dev}"
      # Central per-route tenant gate (§6.1b). ENFORCE by default (404s
      # cross-org); set TENANT_GATE_MODE=log for the observe-only canary
      # (emits [SHAKEOUT:would-deny] then passes through).
      TENANT_GATE_MODE: "${TENANT_GATE_MODE:-enforce}"
      TEST_MODE: "true"
      # Gates POST /_dev/v1/secret-ref-resync — in-process SecretRefWriter
      # resync after a local OpenBao reseed (status-only HTTP response).
      # Local-only by design — cloud release bindings never set this.
      # See deployments/scripts/repair-secrets.sh.
      LOCAL_OPENBAO_REPAIR: "true"
      # ── Shared git workspaces volume — bare mirrors + per-SHA snapshots
      # (services/aep-api/design/shared-workspace-volume.md). aep-api is the
      # SOLE writer; the agents service mounts the same volume read-only.
      AEP_WORKSPACE_ROOT: "/workspaces"
      AEP_WORKSPACE_REAP_INTERVAL: "5m"
      AEP_WORKSPACE_SNAPSHOT_MAX_AGE: "1h"
      AEP_WORKSPACE_TRASH_MAX_AGE: "1h"
      AEP_WORKSPACE_ORG_QUOTA_BYTES: "2147483648"
      AEP_WORKSPACE_DISK_HIGH_PCT: "85"
      AEP_WORKSPACE_DISK_LOW_PCT: "70"
      # Gates POST /internal/v1/mcp/playground-token — mints a short-lived MCP
      # token with NO caller auth so services/agents' playground CLI can drive
      # dependency discovery against this aep-api locally (AEP_MCP_URL et al.
      # in services/agents/.env.example). Local-only by design — never set in
      # helm release bindings.
      PLAYGROUND_TOKEN_ENABLED: "true"

      # Auto-merge coding-agent PRs on open (removes the human review gate so the
      # RCA→coding-agent→build fix loop runs end-to-end without a human, and the
      # path-based build fan-out deploys every component the PR changed). Enabled
      # for THIS local dev deployment by explicit opt-in; the aep-api source
      # default is FALSE (secure default) since it auto-deploys unreviewed
      # agent-authored code. Set to "false" to restore the human merge gate.
      AUTO_MERGE_CODING_PRS: "true"

      # ── OpenChoreo platform API (reached via k3d loadbalancer + Host header)
      PLATFORM_API_SERVICE_BASE_URL: "${PLATFORM_API_SERVICE_BASE_URL}"
      PLATFORM_API_SERVICE_HOST: "${PLATFORM_API_SERVICE_HOST:-api.openchoreo.localhost}"

      # ── Sister services on the aep compose network
      # File-mutation agents service (services/agents) — requirements/design/
      # chat generation + task planning. Plain HS256 M2M bearer; the secret must
      # match the service's AGENT_JWT_SECRET below.
      AGENTS_SVC_BASE_URL: "http://agents:4000"
      AGENTS_SVC_JWT_SECRET: "${AGENTS_M2M_SECRET:-dev-agents-m2m-secret}"
      AGENTS_SVC_JWT_AUDIENCE: "agents-service"
      # After WS0.1, git-service is folded into the aep-api binary. The
      # ── Coding-agent runner reach-back URL. The pod runs in
      # `workflows-<orgID>` inside the cluster, so it must reach the
      # compose services through k3d's host bridge. All former
      # git-service endpoints + the BFF live on the merged binary.
      AGENT_PLATFORM_URL: "http://host.k3d.internal:9090"
      # The BFF's own base URL as reached by the agents service (same compose
      # network) for the internal MCP discovery surface. Enables the `mcp`
      # bundle handed to agents in the generation turn so it can call back to
      # <this>/internal/v1/mcp with a BFF-signed MCP token. (Inert until the
      # dependencies feature lands — Phase 4.)
      AEP_API_INTERNAL_BASE_URL: "http://aep-api:9090"

      # ── GitHub webhook validation + connect-state HMAC.
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
      GITHUB_WEBHOOK_PROXY_URL: "${GITHUB_WEBHOOK_PROXY_URL}"
      OAUTH_STATE_SIGNING_KEY: "${OAUTH_STATE_SIGNING_KEY}"
      GIT_COMMITTER_NAME: "${GIT_COMMITTER_NAME:-AEP Bot}"
      GIT_COMMITTER_EMAIL: "${GIT_COMMITTER_EMAIL:-bot@aep.dev}"

      # ── App OAuth bind path: BFF builds /login/oauth/authorize with this client_id.
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-aep-platform}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      BFF_PUBLIC_URL: "${BFF_PUBLIC_URL:-http://localhost:8090}"

      # ── Inbound JWT verification (Thunder JWKS, audience prefix aep-*).
      JWKS_URL: "http://thunder.openchoreo.localhost:8080/oauth2/jwks"
      JWT_ISSUER: "${JWT_ISSUER:-http://thunder.openchoreo.localhost:8080}"
      # openchoreo-rca-agent: accept the OpenChoreo SRE/RCA agent's service-account
      # tokens (same Thunder issuer, ouHandle=default) so the AE-handoff stage can
      # call the issue/dispatch endpoints via aep-mcp-server. See
      # AE-HANDOFF-DESIGN.md §9 in openchoreo/agents/sre-agent.
      JWT_AUDIENCE: "${BFF_AUDIENCE:-aep-*,openchoreo-rca-agent}"

      # ── Phase 3 of api-platform-integration — Thunder admin client
      # for per-org publisher OAuth app lifecycle. The aep-system-client
      # OAuth app + Administrator role binding are provisioned by
      # values-thunder.yaml's 60-aep-system-role.sh bootstrap script.
      THUNDER_ADMIN_URL: "http://thunder.openchoreo.localhost:8080"
      THUNDER_SYSTEM_CLIENT_ID: "aep-system-client"
      # After setup-local.sh, Thunder holds the random secret in
      # aep-thunder-secrets/THUNDER_SYSTEM_CLIENT_SECRET — not the
      # values-thunder.yaml bootstrap literal. Export from that K8s
      # secret (or .env) before `compose up`, same as helm's secretKeyRef.
      THUNDER_SYSTEM_CLIENT_SECRET: "${THUNDER_SYSTEM_CLIENT_SECRET:-aep-system-client-secret}"
      PLATFORM_IDP_ISSUER: "http://thunder.openchoreo.localhost:8080"
      PLATFORM_IDP_JWKS_URL: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"

      # ── OIDC config handed to user web-apps whose design has
      # auth.kind=oidc-spa. v1 reuses the aep-console-client Thunder
      # OAuth client (already SPA-shaped with PKCE + public). Per-app
      # redirect URIs are appended at dispatch time. Per-project
      # clients are a v2 follow-up (see docs/design/oauth-protected-webapp.md).
      USER_APPS_OIDC_ISSUER: "http://thunder.openchoreo.localhost:8080"
      USER_APPS_OIDC_CLIENT_ID: "aep-console-client"
      USER_APPS_OIDC_SCOPES: "openid profile"

      # ── Outbound Service JWTs — one client_credentials principal per
      # target audience (git-service). The agents service is reached with a
      # plain HS256 M2M bearer (AGENTS_SVC_* above), not a Thunder client. The
      # remote-worker audience is gone — coding-agent runs as an OC Job Component
      # pod and authenticates back to git-service with a per-task Task JWT.
      SERVICE_AUTH_TOKEN_URL: "http://k3d-openchoreo-serverlb:8080/oauth2/token"
      SERVICE_AUTH_CLIENT_ID: "aep-api-client"
      # Matches setup-local's aep-thunder-secrets/AEP_API_CLIENT_SECRET
      # (helm already secretKeyRefs it). Hardcoded bootstrap literal
      # fails with Thunder 401 invalid_client after setup-local.
      SERVICE_AUTH_CLIENT_SECRET: "${AEP_API_CLIENT_SECRET:-aep-api-client-secret}"
      SERVICE_AUTH_HOST_HEADER: "thunder.openchoreo.localhost"
      SERVICE_AUTH_GIT_TOKEN_URL: "http://k3d-openchoreo-serverlb:8080/oauth2/token"
      SERVICE_AUTH_GIT_CLIENT_ID: "${SERVICE_AUTH_GIT_CLIENT_ID:-aep-bff-to-git-service}"
      SERVICE_AUTH_GIT_HOST_HEADER: "thunder.openchoreo.localhost"

      # ── Task JWT signing — RS256, PEM read from a bind-mounted file.
      # Docker-compose's `${VAR}` substitution doesn't preserve newlines
      # cleanly, so we mount the file rather than env-pass the contents.
      BFF_TASK_SIGNING_KEY_PATH: "/app/keys/task-signing.pem"
      BFF_TASK_TOKEN_ISSUER: "aep-bff"
      BFF_TASK_TOKEN_AUDIENCE: "git-service"

      # ── Folded-in git-service surface (after WS0.1) ─────────────────
      # All envs below previously lived on the standalone git-service
      # block. The merged binary owns the repo/credential/anthropic
      # endpoints on the same port; envs are renamed only where the
      # binary historically used different names.
      GITHUB_REPO_VISIBILITY: "${GITHUB_REPO_VISIBILITY:-private}"
      GITHUB_WEBHOOK_DELIVERY_URL: "${GITHUB_WEBHOOK_PROXY_URL}"
      OPENBAO_ADDR: "${OPENBAO_ADDR:-http://host.docker.internal:8200}"
      OPENBAO_TOKEN: "${OPENBAO_TOKEN:-root}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "${GITHUB_APP_PRIVATE_KEY_PATH:-/etc/github-app/private-key.pem}"

      # ── Temporal (devflow workflows). aep-api runs the worker in-process and
      # dials the k3d-hosted Temporal frontend via the k3d docker network.
      # Reaches the in-cluster Temporal dev server via the k3d node container on
      # the shared k3d-openchoreo docker network (NodePort 31733 from
      # setup-temporal.sh). The `passthrough:///` scheme is REQUIRED: aep-api is
      # built CGO_ENABLED=0 (pure-Go resolver) and the Temporal SDK's gRPC-Go
      # client otherwise does SRV lookups that hang against docker's embedded
      # DNS — passthrough skips gRPC's resolver and dials the hostname directly
      # via Go's net dialer. Unset disables the feature (no worker, /devflows 503).
      TEMPORAL_HOSTPORT: "${TEMPORAL_HOSTPORT:-passthrough:///k3d-openchoreo-server-0:31733}"
      TEMPORAL_NAMESPACE: "${TEMPORAL_NAMESPACE:-default}"
      TEMPORAL_TASKQUEUE: "${TEMPORAL_TASKQUEUE:-aep-devflow}"

      # ── Observer (task-progress) — reads workflow logs via OC Observer.
      # Optional: leave empty to disable; the BFF returns 503 on /progress.
      #
      # Routing: BFF runs in docker-compose, Observer runs in the k3d
      # cluster. We can't reach the in-cluster Service DNS, so we route
      # through the main kgateway at host-port 8080 (k3d serverlb) using
      # Host: observer.openchoreo.localhost. setup-observability.sh creates
      # the cross-namespace HTTPRoute on `openchoreo-control-plane/gateway-default`
      # that resolves that hostname → the Observer Service. The extra_hosts
      # below maps observer.openchoreo.localhost → docker host gateway so
      # the BFF reaches the k3d serverlb.
      OBSERVER_URL: "${OBSERVER_URL:-http://observer.openchoreo.localhost:8080}"
      OBSERVER_OAUTH_TOKEN_URL: "${OBSERVER_OAUTH_TOKEN_URL:-http://k3d-openchoreo-serverlb:8080/oauth2/token}"
      OBSERVER_OAUTH_CLIENT_ID: "${OBSERVER_OAUTH_CLIENT_ID:-openchoreo-observer-resource-reader-client}"
      OBSERVER_OAUTH_CLIENT_SECRET: "${OBSERVER_OAUTH_CLIENT_SECRET:-openchoreo-observer-resource-reader-client-secret}"
      OBSERVER_OAUTH_HOST_HEADER: "${OBSERVER_OAUTH_HOST_HEADER:-thunder.openchoreo.localhost}"
    volumes:
      - ./keys/task-signing.pem:/app/keys/task-signing.pem:ro
      - ./github-app-private-key.pem:/etc/github-app/private-key.pem:ro
      - aep-workspaces:/workspaces
    networks:
      - aep
      - k3d-openchoreo
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api.openchoreo.localhost:host-gateway"
      - "thunder.openchoreo.localhost:host-gateway"
      - "observer.openchoreo.localhost:host-gateway"

  # ---------------------------------------------------------------------------
  # agents — file-mutation agents service (services/agents). Serves the
  # requirements/design/chat generation turns AND task planning. The BFF
  # (aep-api/internal/feature/{genai,task}) is its only caller. Tenancy-blind:
  # the acting org rides the log-only X-Org-Id header; the per-org Anthropic key
  # arrives per-turn in X-Anthropic-Key (no boot-time key).
  # See docs/design/agents-generation-migration.md.
  # Built from the repo root so pnpm resolves the workspace:* deps
  # (@aep/agent-stream, @aep/excalidraw-dsl, @aep/design-projection).
  # ---------------------------------------------------------------------------
  agents:
    build:
      context: ..
      dockerfile: services/agents/Dockerfile
    container_name: aep-agents
    # See aep-api: bound the Colima docker-bridge SYN-drop stall to ~7s so the
    # agents service's Anthropic API calls (plan/design turns) don't hang.
    sysctls:
      net.ipv4.tcp_syn_retries: "2"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      workspace-init:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      AGENT_MODEL: "${AGENT_MODEL:-claude-sonnet-5}"
      # Anthropic reasoning effort per turn (low|medium|high|xhigh|max).
      AGENT_REASONING_EFFORT: "${AGENT_REASONING_EFFORT:-medium}"
      # Shared postgres — the service owns its own `conversations` table (TTL-swept).
      DATABASE_URL: "postgres://aep:aep@postgres:5432/aep?sslmode=disable"
      # M2M inbound auth — HS256 shared secret; the BFF mints a matching bearer
      # (AGENTS_SVC_JWT_SECRET). aud must match the BFF's AGENTS_SVC_JWT_AUDIENCE.
      AGENT_JWT_SECRET: "${AGENTS_M2M_SECRET:-dev-agents-m2m-secret}"
      AGENT_JWT_AUDIENCE: "agents-service"
      # Read-only view of the shared workspaces volume — per-SHA snapshots
      # written by aep-api. The :ro mount enforces the reader-only contract
      # structurally (design D3).
      WORKSPACE_MOUNT_ROOT: "/workspaces"
      # Room-scoped turns (#86 phase 4): the agents service joins spec rooms
      # as a live Yjs peer through the in-network collab server.
      AGENT_COLLAB_WS_URL: "ws://collab-server:3400"
      # AI SDK DevTools trace capture: wrap the model so every LLM call/step is
      # written to /repo/services/agents/.devtools/generations.json (bind-mounted
      # to deployments/data/agent-devtools). View with the host-side viewer:
      #   AI_SDK_DEVTOOLS_PORT=4983 npx @ai-sdk/devtools   (run in a dir whose
      #   .devtools points at deployments/data/agent-devtools) → localhost:4983.
      # The in-container notify to localhost:4983 is best-effort (swallowed); the
      # viewer reads the file, so a browser refresh surfaces new traces.
      AGENT_DEVTOOLS: "${AGENT_DEVTOOLS:-true}"
      AI_SDK_DEVTOOLS_PORT: "4983"
    volumes:
      - aep-workspaces:/workspaces:ro
      - ./data/agent-devtools:/repo/services/agents/.devtools
    networks:
      - aep

  # ---------------------------------------------------------------------------
  # aep-mcp-server — Streamable-HTTP MCP wrapper over aep-api's issue/dispatch
  # REST endpoints, so external agents (e.g. the OpenChoreo SRE/RCA agent) can
  # file a GitHub issue and dispatch the coding agent without holding AE's
  # GitHub credentials themselves — every call forwards the caller's bearer
  # straight through to aep-api, which does the actual org-scoped auth check.
  # See AE-HANDOFF-DESIGN.md in openchoreo/agents/sre-agent.
  # ---------------------------------------------------------------------------
  aep-mcp-server:
    build:
      context: ..
      dockerfile: services/aep-mcp-server/Dockerfile
    container_name: aep-mcp-server
    ports:
      - "3401:3400"
    environment:
      PORT: "3400"
      AEP_API_BASE_URL: "http://aep-api:9090"
    depends_on:
      - aep-api
    networks:
      - aep

  # ---------------------------------------------------------------------------
  # smee-client — forwards GitHub webhook events from the public smee.io
  # channel to aep-api /api/v1/webhooks/github (same path cloud uses). In
  # production this would be replaced by a real ingress to the BFF.
  # ---------------------------------------------------------------------------
  smee-client:
    image: deltaprojects/smee-client:latest
    container_name: aep-smee-client
    depends_on:
      - aep-api
    command:
      [
        "--url",
        "${GITHUB_WEBHOOK_PROXY_URL}",
        "--target",
        "http://aep-api:9090/api/v1/webhooks/github",
      ]
    networks:
      - aep
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # console (apps/console), served by nginx at :8090 (#98 retirement complete
  # — this replaced console-legacy). The browser hits Thunder directly via
  # thunder.openchoreo.localhost (resolved by /etc/hosts → 127.0.0.1 → k3d
  # loadbalancer); OIDC redirect URIs derive from window.location.origin, so
  # no redirect env is needed. All API requests go through the same-origin
  # /aep-api-service/ nginx proxy → aep-api:9090.
  # ---------------------------------------------------------------------------
  console:
    build:
      # Repo root — apps/console is a root-pnpm-workspace member and the
      # image build runs `pnpm gen` against packages/contracts.
      context: ..
      dockerfile: apps/console/Dockerfile
    container_name: aep-console
    ports:
      - "8090:3000"
    depends_on:
      - aep-api
      - collab-server
    environment:
      AEP_API_PROXY_URL: "http://aep-api:9090"
      VITE_THUNDER_URL: "${PUBLIC_THUNDER_URL}"
      VITE_THUNDER_CLIENT_ID: "${VITE_THUNDER_CLIENT_ID:-aep-console-client}"
      VITE_THUNDER_SCOPES: "${VITE_THUNDER_SCOPES:-openid profile email}"
    networks:
      - aep

  # ---------------------------------------------------------------------------
  # collab-server — Yjs/Hocuspocus collaboration rooms for the spec workspace
  # (#86 / #114). The browser reaches it same-origin through the console's
  # nginx /collab proxy (its default upstream is exactly `collab-server:3400`,
  # so the console needs no COLLAB_WS_URL/COLLAB_SERVER_URL overrides). Room
  # auth + seeding go to aep-api with the joining user's token: the oracle
  # (validate-collab-access) resolves the room's project, then the seeder
  # reads the spec via the Files API.
  # ---------------------------------------------------------------------------
  collab-server:
    build:
      # Repo root — @aep/collab is a root-pnpm-workspace member.
      context: ..
      dockerfile: services/collab/Dockerfile
    container_name: aep-collab
    ports:
      # Host mapping is for direct debugging only; the browser path is the
      # console's /collab proxy.
      - "3400:3400"
    depends_on:
      - aep-api
    environment:
      COLLAB_PORT: "3400"
      AEP_API_BASE: "http://aep-api:9090/api/v1"
      # Committer cadence (#133): quiet-period debounce + continuous-editing
      # cap; the final flush always runs when the last participant leaves.
      COLLAB_COMMIT_DEBOUNCE_MS: "${COLLAB_COMMIT_DEBOUNCE_MS:-60000}"
      COLLAB_COMMIT_MAX_DEBOUNCE_MS: "${COLLAB_COMMIT_MAX_DEBOUNCE_MS:-300000}"
    networks:
      - aep

volumes:
  pgdata:
  # Shared git workspaces — bare mirrors + per-SHA snapshots. A single Docker
  # host makes a named volume de-facto RWX; aep-api writes, agents reads (:ro).
  aep-workspaces:

networks:
  aep:
    driver: bridge
  k3d-openchoreo:
    external: true
