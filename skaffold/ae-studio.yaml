# The three images of the ae-studio data-plane pod (ae-design-agent,
# ae-collab, ae-studio-tools), build-only, with a unique tag per build.
#
# Unlike skaffold.yaml (one fixed dev-local tag, rolled by a restart), these
# refs are values aep-api writes into the OpenChoreo Resource's parameters.
# A mutable tag would leave those parameters unchanged, so converge would see
# no drift and the pod would never roll. An input-digest tag changes exactly
# when a source file in the artifact's context changes.
#
# `make dev-images` builds this with --file-output=.skaffold/ae-studio-images.json,
# imports the resulting refs into k3d and pins them; `make dev-update` and
# `make dev-env` read the same file to set aeStudio.images.* on the platform
# release.
#
# --provenance=false --sbom=false: with the containerd image store buildx emits
# an OCI index with attestation manifests, which `k3d image import` reports as
# imported but the node's containerd cannot run (the kubelet then tries a
# registry pull of this local-only ref). Same reasoning as build-runner.sh.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: ae-studio
build:
  tagPolicy:
    inputDigest: {}
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: ghcr.io/wso2/aep/ae-design-agent
      context: .
      docker:
        dockerfile: components/dataplane/ae-system-project/ae-studio/ae-design-agent/Dockerfile
        cliFlags: [--provenance=false, --sbom=false]
    - image: ghcr.io/wso2/aep/ae-collab
      context: .
      docker:
        dockerfile: components/dataplane/ae-system-project/ae-studio/ae-collab/Dockerfile
        cliFlags: [--provenance=false, --sbom=false]
    - image: ghcr.io/wso2/aep/ae-studio-tools
      context: components/dataplane/ae-system-project/ae-studio/ae-studio-tools
      docker:
        dockerfile: Dockerfile
        cliFlags: [--provenance=false, --sbom=false]
