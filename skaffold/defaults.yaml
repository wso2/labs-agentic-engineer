# The platform's browser-facing origins. Each is routed by Host header on the
# same gateway port, so they are separate hostnames rather than paths, and
# re-domaining an install means moving all of them together. Leave them as
# they are for local k3d; `--console-url` and `--tryit-url` override
# one run.
console:
  # What users open, and the origin the console's OAuth redirect URIs are
  # registered against during install.
  public_url: "http://console.ae.localhost:8080"

tryit:
  # The platform's test app, served on its OWN hostname — the console links to
  # it from "Try agent". One value feeds three places (this route's hostname,
  # the console's link, and aep-api's TRY_IT_CALLBACK_URL, which registers
  # {public_url}/callback as a redirect URI on every project's sign-in client),
  # so moving the console without moving this one gives you a link that opens
  # and a sign-in that is then refused as an unregistered redirect.
  public_url: "http://tryit.ae.localhost:8080"

oc:
  # In-cluster URL of the OpenChoreo platform API.
  # aep-api uses this to create Components, Deployments, and read pod logs.
  # Override if OC is on a different cluster or exposed via an external URL.
  api_url: "http://openchoreo-api.openchoreo-control-plane.svc.cluster.local:8080"

  # Namespace where the OpenChoreo control-plane is installed.
  # Used during install to verify the OC version meets the minimum requirement.
  # Override if your OC is deployed under a different namespace.
  system_namespace: "openchoreo-control-plane"

  # In-cluster URL of the OpenChoreo Observer — feeds build-log reading and
  # coding-cycle log archiving. Matches the "openchoreo-observability-plane"
  # namespace `aectl sre install` itself defaults to. Override if the
  # observability plane lives under a different namespace or release name.
  observability_api_url: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"

  # The OpenChoreo Environment aectl configures gateway ingress and the
  # environment Thunder on, at install time and before aep-api runs. Set it to
  # the root of the default org's DeploymentPipeline/default: on the k3d
  # quickstart (development -> staging -> production) that is "development",
  # which is the write target aep-api resolves for every project on that
  # pipeline. aep-api does not read this setting.
  pipeline_source_environment: "development"

  # The k8s namespace of the one org AEP ships with — AEP is single-org
  # today, so this is that default org's home namespace: where its Project,
  # Environment(s), DeploymentPipeline, and (when local_org_provisioning.enabled,
  # see below) per-org ComponentTypes and ProjectType all live.
  default_org_namespace: "default"

  local_org_provisioning:
    # Creates the per-org OC ComponentTypes (service, web-application,
    # ai-agent) and ProjectType/default directly from the Helm chart.
    # Required for local k3d installs where the platform's org provisioning
    # is not running. Must be false in production — the platform handles
    # this per-org automatically there.
    enabled: true

  # Whether the data-plane gateway this cluster's components deploy behind
  # terminates TLS. False here because this gateway (envidp's Thunder+gateway
  # install) always advertises plain http://*.openchoreoapis.localhost URLs —
  # there is no certificate-issuance step to wait for. aep-api gates its
  # endpoint-reachability wait on this: left at the chart's own true default,
  # it would probe those plain-HTTP URLs assuming a cert window exists, which
  # on this cluster can never resolve (the hostname resolves to loopback from
  # inside the pod) and holds every component with an external URL — a
  # web-application proxying to a sibling service, for instance — at
  # "converging" forever. Set true only against a gateway that genuinely
  # fronts TLS.
  data_plane_gateway_tls: false

codingagent:
  openbao_direct:
    # Injects OPENBAO_ADDR into aep-api (Kubernetes auth, no token) so it can write user secrets
    # (e.g. Anthropic API keys) directly into OpenBao. Required for local/OSS
    # installs. Production overlays inject a managed SecretsProvider instead
    # and must leave this false.
    enabled: true

openbao:
  # In-cluster URL of the OpenBao service — used when openbao_direct.enabled=true.
  # Override if OpenBao is deployed under a different namespace or service name.
  addr: "http://openbao.openbao.svc.cluster.local:8200"
  # No token: aep-api logs in by Kubernetes auth (deployments/scripts/openbao-aep-api-auth.sh).

gateway:
  # External hostname used for component HTTP endpoints (HTTPRoute hosts).
  # When set, aectl platform install configures ClusterDataPlane and
  # Environment/development automatically without an interactive prompt —
  # required for CI. Leave empty to be prompted during install.
  # Local: typically "openchoreoapis.localhost". Production: your public API hostname.
  hostname: "openchoreoapis.localhost"

# The environment tier (T2 — see deployments/design/two-tier-thunder.md): the
# per-environment identity provider and API gateway aectl installs alongside
# the platform. These are the DNS SUFFIXES they are published under, not whole
# hostnames — aectl composes "<env>-idp.<idp_base_domain>" and
# "<env>-<org>.<gateway_base_domain>". Scheme and port come from tls.enabled
# below (8080/19080 plain, 8443/19443 TLS).
#
# Both are browser-facing wherever the cluster is reachable by more than its
# own host. A generated app sends its END USERS to the IdP to sign in
# (thunder-app-operator republishes this as the app's OIDC issuer) and calls
# its own API through the gateway, so leaving these on *.localhost while
# moving the rest gives you a platform whose generated apps nobody can log
# into.
environment:
  # Must equal Agent Manager's ENV_IDP_BASE_DOMAIN
  # (deployments/scripts/setup-agent-manager.sh). Agent Manager composes the
  # environment IdP's origin from this suffix rather than being told an
  # address, so two different values leave the two products disagreeing on
  # agent identity — with nothing failing at install time.
  idp_base_domain: "openchoreo.localhost"
  gateway_base_domain: "gateway.localhost"

# Whether this cluster's public endpoints are served over HTTPS. One toggle,
# because the scheme and both gateway ports move together — 8080/19080 plain,
# 8443/19443 TLS. A cluster does not serve https on 8080.
#
# This decides whether an end user can sign in to a GENERATED APP at all.
# Browsers expose crypto.subtle only in a secure context, the OIDC login needs
# it for PKCE, and the environment identity provider's URL is built from this.
# false is correct only on localhost, which browsers already treat as secure;
# on any other domain the login cannot complete over plain HTTP.
#
# Must agree with WITH_TLS in deployments/scripts/setup-env-for-aectl.sh —
# that script stamps the platform IdP's issuer and provisions the certificate,
# and a disagreement installs clean, then fails at the first sign-in.
tls:
  enabled: false

ae_studio:
  webhook_relay:
    # Gives each org's AE Studio pod a webhook-relay container on its own
    # smee.io channel (derived from the OpenBao seed aep/webhook-relay-seed),
    # so GitHub reaches a local k3d install's repo hooks. smee.io is a
    # third-party public relay: never true in production (absent = false).
    enabled: true
  jev:
    # aep-api classifies the Issues agent's reports with the platform's Jev
    # key (import it first: `aectl platform secret import --path
    # aep/jev-api-key --value-file <file>`). Set here, not with `helm --set` or
    # `platform update --set`: `make dev-env` re-installs the release from this
    # file and drops any value set by hand. url: "" is Jev's default endpoint.
    enabled: false
    url: ""

# The ThunderID aectl administers. Read when aectl registers the platform
# IdP's clients (idp.clients thunder, below, or unset), where all four keys
# are required; refused with idp.clients imported, where nothing reads them.
thunder:
  # Kubernetes namespace where Thunder is deployed.
  # Used when patching Thunder's CORS config and rolling its Deployment.
  namespace: "thunder"

  # In-cluster URL of the Thunder service.
  # Used for all server-to-server OAuth calls: getting admin tokens,
  # registering AEP OAuth clients, and deriving the JWKS/token endpoints.
  url: "http://thunder-service.thunder.svc.cluster.local:8090"

  # OAuth client ID of AEP's system-level Thunder client.
  # Used to authenticate as admin during install to register other OAuth clients.
  # The corresponding secret is prompted interactively — never stored here.
  admin_client_id: "ae-install-client"

  # Externally reachable URL of Thunder — what the browser hits for login flows.
  # Must match the JWT issuer configured in Thunder. Injected into the console
  # and the SRE agent's auth config.
  # Local: the k3d ingress hostname. Production: your real public Thunder URL.
  public_url: "http://thunder.openchoreo.localhost:8080"

# The platform IdP: the identity provider that issues the tokens of AE's
# users and of its own clients. Its endpoints are not configured: `aectl`
# reads them from <issuer>/.well-known/openid-configuration at install and
# update.
idp:
  # Who creates AE's clients on the IdP:
  #   thunder   `aectl` registers them on the ThunderID of the thunder: block
  #             above, which it administers, and generates their secrets.
  #             Unset means this.
  #   imported  the IdP's admin created them and imports their secrets with
  #             `aectl platform secret import`. `aectl` administers nothing on
  #             the IdP. Use it for any IdP whose admin creates the clients.
  #   asgardeo  `aectl` creates them in the Asgardeo organization of the
  #             asgardeo: block below and generates their secrets. Install and
  #             `platform sync-clients` then take the credential of the
  #             organization's admin application from two files
  #             (--idp-admin-client-id-file, --idp-admin-client-secret-file).
  #             It is read for that run and never stored.
  clients: "thunder"
  # How the IdP's tokens name two things no standard defines: the caller's
  # org, and whether a token was issued to a machine or to a user. `aectl`
  # passes the values to aep-api, the AE Studio pod and the console, which
  # read tokens by them and know no IdP. A value comes from the preset, then
  # from a key set here. An AEP_IDP_CLAIMS_* environment variable is refused:
  # a claim value belongs in this file. Install, update and
  # `platform config test` print each value with where it came from.
  claims:
    # The shipped values to start from: `thunder` (unset means this) or
    # `asgardeo`. `none` starts from nothing, for another IdP: every value
    # marked required below then has to be set, and a missing one stops the
    # install.
    preset: "thunder"
    # Each is the name of a top-level text claim of the IdP's tokens.
    # org:
    #   handle: ""   # required: the handle the IdP knows the caller's org by
    #   id: ""       # required: the IdP's own id for that org, a UUID
    #   name: ""     # optional: a display name for the org
    # caller_type:
    #   claim: ""    # required: the claim that says who a token was issued to
    #   machine: ""  # required: its value that means a machine
    #   user: ""     # optional: its value that means a user. Set: only these
    #                # two values are accepted. Unset: any value other than
    #                # the machine's is read as a user's.
  # The handle the IdP's tokens name the one org by: the handle of a ThunderID
  # organization unit (local: the built-in `default` unit), or the handle of
  # an Asgardeo organization. aep-api maps it to oc.default_org_namespace and
  # reads a token of any other org as no org. On ThunderID aectl registers the
  # org's two clients under that organization unit, which has to exist.
  org_handle: "default"
  # The IdP's issuer: the `iss` of every token. Required, and https, with
  # idp.clients imported or asgardeo (an Asgardeo organization's is
  # https://api.asgardeo.io/t/<handle>/oauth2/token). Optional on the
  # ThunderID aectl administers: unset, it is thunder.public_url.
  # See "Install with Asgardeo as the platform IdP" in deployments/README.md
  # for both ways to create AE's applications in an Asgardeo organization.
  # issuer: ""

# The Asgardeo organization where `aectl` creates AE's applications. Read only
# with idp.clients asgardeo, and refused otherwise.
# asgardeo:
#   # The address of the organization's management API. It is a key of its
#   # own because the IdP's discovery document does not name it.
#   api_url: "https://api.asgardeo.io/t/<handle>/api/server/v1"
