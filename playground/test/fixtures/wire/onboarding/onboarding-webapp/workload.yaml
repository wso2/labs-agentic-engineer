apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: onboarding-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - external

dependencies:
  endpoints:
    - component: track-each-hire9665-onboarding-api
      name: http
      visibility: project
      envBindings:
        address: ONBOARDING_API_URL
  resources:
    - ref: user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        scopes: USER_AUTH_SCOPES
        resource: USER_AUTH_RESOURCE
