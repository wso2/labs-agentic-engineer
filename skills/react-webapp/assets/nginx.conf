# Replaces the stock /etc/nginx/nginx.conf so the image runs as any non-root
# UID on a read-only root filesystem — what the cloud `web-application` type
# enforces. Every path nginx writes at runtime lives under /dev/shm/nginx:
# /dev/shm is the tmpfs the container runtime mounts writable in every pod,
# and the type mounts nothing else (/tmp is part of the read-only root).
# 15-aep-api-proxy.sh creates the directory and renders default.conf into it.

worker_processes auto;
pid /dev/shm/nginx/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /dev/shm/nginx/client_body;
    proxy_temp_path /dev/shm/nginx/proxy;
    fastcgi_temp_path /dev/shm/nginx/fastcgi;
    uwsgi_temp_path /dev/shm/nginx/uwsgi;
    scgi_temp_path /dev/shm/nginx/scgi;

    include /dev/shm/nginx/default.conf;
}
