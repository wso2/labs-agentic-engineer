# How a ThunderID token names the caller's org and caller type: the values of
# aectl's platform.idp.claims block that `platform.idp.claims.preset: thunder` (and an unset
# preset) starts from.
#
# The org is an organization unit. The caller type is the OAuth grant the
# token came from: client_credentials is a machine's, and ThunderID has
# several user grants (authorization_code, refresh_token), so no single user
# value is named and any other grant is read as a user's.
org:
  handle: ouHandle
  id: ouId
  name: ouName
caller_type:
  claim: grant_type
  machine: client_credentials
