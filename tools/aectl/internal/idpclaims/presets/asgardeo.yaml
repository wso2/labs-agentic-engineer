# How an Asgardeo token names the caller's org and caller type: the values of
# aectl's platform.idp.claims block that `platform.idp.claims.preset: asgardeo` starts from.
#
# The org is the Asgardeo organization, which stamps its handle, id and name
# on every token. The caller type is the aut claim, with two values, so both
# are named and any third value is refused.
org:
  handle: org_handle
  id: org_id
  name: org_name
caller_type:
  claim: aut
  machine: APPLICATION
  user: APPLICATION_USER
