syntax = "proto3";

package aep.admin.v1;

option go_package = "github.com/wso2/aepclt/internal/adminpb";

service AEPAdmin {
  // Init provisions OpenBao, seeds secrets, and configures ESO Kubernetes auth.
  // Streams progress events and ends with credentials the operator must store.
  rpc Init(InitRequest) returns (stream InitEvent);

  // ThunderSetup registers AEP OAuth clients in Thunder and patches CORS.
  rpc ThunderSetup(ThunderSetupRequest) returns (stream ProgressEvent);

  // OpenbaoUnseal unseals the AEP OpenBao instance after a pod restart.
  rpc OpenbaoUnseal(UnsealRequest) returns (UnsealResponse);
}

message InitRequest {
  string anthropic_api_key = 1;
  // postgres_password is optional; server auto-generates if empty.
  string postgres_password = 2;
}

message InitEvent {
  oneof payload {
    string       progress = 1;  // real-time log line
    InitComplete complete = 2;  // final event — credentials to store
    string       error    = 3;  // terminal error
  }
}

message InitComplete {
  repeated string unseal_keys = 1;
  string          root_token  = 2;
}

message ThunderSetupRequest {
  string console_url = 1;
}

message ProgressEvent {
  string message = 1;
}

message UnsealRequest {
  // Provide exactly 3 of the 5 unseal keys printed during Init.
  repeated string keys = 1;
}

message UnsealResponse {
  bool   success = 1;
  string message = 2;
}
