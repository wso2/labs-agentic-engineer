openapi: 3.0.3
info:
  title: Circulation API
  version: 0.1.0
servers:
  - url: /
security:
  - oauth2: []
paths:
  /titles:
    get:
      operationId: listTitles
      summary: Search titles with availability
      security:
        - oauth2: [catalogue:read]
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches name, author or subject }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of titles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TitlePage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTitle
      summary: Add a title
      security:
        - oauth2: [catalogue:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /titles/{titleId}:
    parameters:
      - { name: titleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTitle
      summary: Get a title
      security:
        - oauth2: [catalogue:read]
      responses:
        '200':
          description: The title
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateTitle
      summary: Edit a title
      security:
        - oauth2: [catalogue:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Title' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTitle
      summary: Remove a title
      security:
        - oauth2: [catalogue:manage]
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /titles/{titleId}/copies:
    parameters:
      - { name: titleId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCopies
      summary: List copies of a title
      security:
        - oauth2: [catalogue:manage]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of copies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyPage' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCopy
      summary: Add a copy to a title
      security:
        - oauth2: [catalogue:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copy' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /copies/{copyId}:
    parameters:
      - { name: copyId, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateCopy
      summary: Edit a copy or withdraw it
      security:
        - oauth2: [catalogue:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Copy' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/loans:
    get:
      operationId: listMyLoans
      summary: The caller's loans
      security:
        - oauth2: [loans:read]
      parameters:
        - { name: active, in: query, schema: { type: boolean }, description: Only loans not yet returned }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's loans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPage' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: borrowTitle
      summary: Borrow an available copy of a title for the caller
      security:
        - oauth2: [loans:borrow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleRef' }
      responses:
        '201':
          description: Loan created with its due date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/holds:
    get:
      operationId: listMyHolds
      summary: The caller's holds
      security:
        - oauth2: [holds:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's holds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldPage' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: placeHold
      summary: Place a hold for the caller on a title with no available copy
      security:
        - oauth2: [holds:place]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleRef' }
      responses:
        '201':
          description: Hold queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /me/holds/{holdId}:
    parameters:
      - { name: holdId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: cancelMyHold
      summary: Cancel the caller's hold
      security:
        - oauth2: [holds:cancel]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /me/fees:
    get:
      operationId: listMyFees
      summary: The caller's fees
      security:
        - oauth2: [fees:read]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of the caller's fees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeePage' }
        '401': { $ref: '#/components/responses/Error' }
  /loans:
    get:
      operationId: listLoans
      summary: Every loan
      security:
        - oauth2: [loans:read-all]
      parameters:
        - { name: memberId, in: query, schema: { type: string } }
        - { name: copyId, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean }, description: Only loans not yet returned }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of loans
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoanPage' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      operationId: checkOutCopy
      summary: Check a copy out to any member
      security:
        - oauth2: [loans:checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201':
          description: Loan created with its due date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /loans/{loanId}/return:
    parameters:
      - { name: loanId, in: path, required: true, schema: { type: string } }
    post:
      operationId: checkInLoan
      summary: Check in a loan; a late return creates a fee
      security:
        - oauth2: [loans:checkin]
      responses:
        '200':
          description: Loan closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /holds:
    get:
      operationId: listHolds
      summary: Every hold, optionally for one title
      security:
        - oauth2: [holds:read-all]
      parameters:
        - { name: titleId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of holds in queue order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldPage' }
        '401': { $ref: '#/components/responses/Error' }
  /holds/{holdId}:
    parameters:
      - { name: holdId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: cancelHold
      summary: Cancel any hold
      security:
        - oauth2: [holds:manage]
      responses:
        '204': { description: Cancelled }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /fees:
    get:
      operationId: listFees
      summary: Every fee
      security:
        - oauth2: [fees:read-all]
      parameters:
        - { name: memberId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unpaid, paid] } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: A page of fees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeePage' }
        '401': { $ref: '#/components/responses/Error' }
  /fees/{feeId}/pay:
    parameters:
      - { name: feeId, in: path, required: true, schema: { type: string } }
    post:
      operationId: markFeePaid
      summary: Mark any fee paid
      security:
        - oauth2: [fees:manage]
      responses:
        '200':
          description: Fee paid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Fee' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            catalogue:read: Search and view titles with availability
            catalogue:manage: Manage titles and copies
            loans:read: The caller's own loans
            loans:borrow: Borrow a copy for the caller
            loans:read-all: Every loan
            loans:checkout: Check a copy out to any member
            loans:checkin: Check a copy in
            holds:read: The caller's own holds
            holds:place: Place a hold for the caller
            holds:cancel: Cancel the caller's own hold
            holds:read-all: Every hold
            holds:manage: Cancel any hold
            fees:read: The caller's own fees
            fees:read-all: Every fee
            fees:manage: Mark any fee paid
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    CopyStatus:
      type: string
      enum: [available, on-loan, on-hold, withdrawn]
    TitleInput:
      type: object
      required: [name, author]
      properties:
        name: { type: string }
        author: { type: string }
        subject: { type: string }
        isbn: { type: string }
    Title:
      allOf:
        - $ref: '#/components/schemas/TitleInput'
        - type: object
          required: [id, availableCopies]
          properties:
            id: { type: string }
            availableCopies: { type: integer, description: Copies with status available }
    CopyInput:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string }
    CopyUpdate:
      type: object
      properties:
        barcode: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }
    Copy:
      type: object
      required: [id, titleId, barcode, status]
      properties:
        id: { type: string }
        titleId: { type: string }
        barcode: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }
    TitleRef:
      type: object
      required: [titleId]
      properties:
        titleId: { type: string }
    CheckoutRequest:
      type: object
      required: [copyId, memberId]
      properties:
        copyId: { type: string }
        memberId: { type: string }
    Loan:
      type: object
      required: [id, titleId, copyId, memberId, checkedOutAt, dueDate]
      properties:
        id: { type: string }
        titleId: { type: string }
        copyId: { type: string }
        memberId: { type: string }
        checkedOutAt: { type: string, format: date }
        dueDate: { type: string, format: date, description: Checkout date plus 14 days }
        returnedAt: { type: string, format: date, nullable: true }
        feeAmount: { type: number, description: Late fee created at return; 0 when on time }
    Hold:
      type: object
      required: [id, titleId, memberId, placedAt, status]
      properties:
        id: { type: string }
        titleId: { type: string }
        memberId: { type: string }
        placedAt: { type: string, format: date-time }
        status: { type: string, enum: [waiting, ready, fulfilled, cancelled] }
        position: { type: integer, description: 1-based place in the title's queue }
    Fee:
      type: object
      required: [id, loanId, memberId, amount, status]
      properties:
        id: { type: string }
        loanId: { type: string }
        memberId: { type: string }
        amount: { type: number, description: Fee in the library's currency }
        status: { type: string, enum: [unpaid, paid] }
    TitlePage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Title' } }
    CopyPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Copy' } }
    LoanPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Loan' } }
    HoldPage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Hold' } }
    FeePage:
      type: object
      required: [count, data]
      properties:
        count: { type: integer, description: total matching items }
        next: { type: string, nullable: true }
        previous: { type: string, nullable: true }
        data: { type: array, items: { $ref: '#/components/schemas/Fee' } }
