name: procurement-inventory
description: "Procurement and stock: requesters raise purchase requests for
  catalogue items, approvers approve or reject them within their approval limit,
  warehouse clerks receive goods against approved orders, which raises stock;
  every stock change is a ledger entry, and a low-stock view lists items below
  their reorder level. Keep stock (items, levels, ledger) in its own inventory
  service that only the procurement API calls; the web app calls only the
  procurement API. No email or notifications, no file uploads or object storage,
  no scheduled or background jobs, no external integrations or AI features."
