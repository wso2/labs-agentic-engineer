name = "helpdesk-tickets"
createdAt = "2026-10-04T11:37:21.435Z"
idea = "Internal IT help desk: employees raise support tickets, support agents triage, assign and resolve them, and a team lead watches the queue. Tickets move open, triaged, in progress, resolved, reopened; priority sets an SLA due time computed by the API; each ticket has a comment thread; the queue filters by status, priority, assignee and SLA breach. One web app and one API service. No email or notifications, no file uploads or object storage, no scheduled or background jobs, no external integrations or AI features."

