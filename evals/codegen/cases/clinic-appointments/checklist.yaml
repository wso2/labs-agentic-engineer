# Derived by the planner (save / replan) and frozen: every attempt walks this
# list, in this order, from an empty database. HAND-EDITABLE — fix, reorder,
# reweight or delete items freely; only an explicit replan re-derives it.

# role: one of Patient, Doctor, Receptionist, no role, signed out
# weight: default 1. extras.mustCover items are walked and scored like items;
# extras.mustNot entries ({id, description}) cap the band at review when violated.

# Planner gaps — what the walk cannot cover, and where the PRD and the wireframes disagree:
#  - The wireframe NoAccess screen is not drawn in wireframes.dsl; items using it assume the app's generic no-access page.
#  - Front desk 'Reschedule' button has no destination screen and no slot picker is drawn, so no receptionist reschedule item is written (story 8 reschedule is untested). A person could add one after confirming how it picks a new slot.
#  - Only one test identity exists per role name, so 'a doctor sees only their own schedule/notes' and 'other doctors cannot read notes' (stories 10 and 12) cannot be walked with a second doctor. Likewise the receptionist cannot read notes: no screen draws that, so no item.
#  - Receptionist grants include slots:browse, so the receptionist is not refused the patient's Available slots screen; no refusal item for that screen. Refusal items cover one foreign screen per role only (patient, doctor, receptionist); other foreign screens (patient to Front desk, doctor to Front desk, receptionist to My appointments) could be added by hand using addresses from the landing items.
#  - Slot and appointment dates for 'today' items depend on the tester's clock (a slot about 1 hour ahead, within today); run them before about 21:00. Past appointments cannot be created through the UI, so the Past tab can only be checked for loading and for excluding future bookings.
#  - The status filter option labels and the Doctor select's option list are not specified; items assume 'Booked' and the publishing doctor's name appear.
#  - Whether cancelled appointments or slots still appear in lists (Upcoming, Front desk) is not specified, so items only expect them to no longer show as Booked.

items:
  - id: doctor-lands-on-schedule
    role: Doctor
    screen: DoctorSchedule
    flow: "My day: landing"
    steps: Observe the screen the app opens on. Note the Date input and the table. Remember how this screen is addressed (My day).
    expect: The My day screen (DoctorSchedule) is shown with its Date input, 'Publish slots' button and an appointments table. With no appointments yet the table is empty or shows an empty state, with no crash.
    weight: 2
  - id: doctor-my-slots-opens
    role: Doctor
    screen: MySlots
    flow: "My day: my slots"
    steps: Click 'My slots' in the sidebar.
    expect: The My slots screen loads with a Date input and a slots table. No slots exist yet, so the table is empty or shows an empty state.
    weight: 1
  - id: doctor-publish-screen-opens
    role: Doctor
    screen: PublishSlots
    flow: Publish slots
    steps: Click 'My day' in the sidebar, then click 'Publish slots'.
    expect: The Publish slots screen opens with Window start, Window end, Slot length (minutes) and Cancel / Publish buttons.
    weight: 1
  - id: doctor-publish-cancel
    role: Doctor
    screen: MySlots
    flow: Publish slots
    steps: On Publish slots, enter Window start 2026-12-20 09:00 and Window end 2026-12-20 10:00, then click 'Cancel'. On My slots set Date 2026-12-20.
    expect: Arrives on My slots. No slots exist for 2026-12-20.
    weight: 1
  - id: doctor-publishes-slots
    role: Doctor
    screen: MySlots
    flow: "Story 1: publish slots"
    steps: Click 'Publish slots' (from My day, or sidebar then button). Enter Window start 2026-12-14 09:00, Window end 2026-12-14 11:00, Slot length 30. Click 'Publish'. Set the Date input on My slots to 2026-12-14.
    expect: Arrives on My slots. Four slots for 14 Dec at 09:00, 09:30, 10:00 and 10:30 are listed, each as Available.
    weight: 2
  - id: doctor-publishes-near-term-slots
    role: Doctor
    screen: MySlots
    flow: "Story 1: publish slots"
    steps: Open Publish slots. Using the tester's current clock, enter Window start = today's date at a time 1 hour from now (rounded to :00 or :30), Window end = 2 hours after that start, Slot length 30 (run before about 21:00 so it stays within today). Click 'Publish'. Set Date on My slots to today.
    expect: Arrives on My slots. Two Available slots for today are listed, the first starting about 1 hour from now.
    weight: 1
  - id: doctor-my-slots-date-filter
    role: Doctor
    screen: MySlots
    flow: "My slots: date filter"
    steps: On My slots set Date to 2026-12-14, then change it to 2026-12-20.
    expect: With 2026-12-14 the four slots from doctor-publishes-slots are listed. With 2026-12-20 none of them are listed.
    weight: 1
  - id: doctor-removes-unbooked-slot
    role: Doctor
    screen: MySlots
    flow: "Story 2: remove unbooked slot"
    steps: On My slots set Date 2026-12-14. Select the 10:30 slot (Available) and click 'Remove selected slot'.
    expect: The 10:30 slot disappears from the list; 09:00, 09:30 and 10:00 remain.
    weight: 2
  - id: patient-lands-on-appointments
    role: Patient
    screen: MyAppointments
    flow: "My appointments: landing"
    steps: Observe the screen the app opens on. Remember how this screen is addressed (My appointments).
    expect: The My appointments screen is shown with the Upcoming / Past tabs, a 'Book a slot' button and the appointments table. No appointments exist yet, so it is empty or shows an empty state.
    weight: 2
  - id: patient-refused-doctor-schedule
    role: Patient
    screen: MyAppointments
    flow: Role reach
    steps: Open the address the My day screen had in doctor-lands-on-schedule.
    expect: The doctor's My day screen and its data are not shown to the patient; the app refuses it or shows a no-access outcome, without crashing.
    weight: 1
  - id: patient-opens-browse-slots
    role: Patient
    screen: BrowseSlots
    flow: "Story 3: browse slots"
    steps: On My appointments click 'Book a slot'.
    expect: The Available slots screen opens with a Doctor select, a Date input, a Search box, a slots table and a 'Book selected slot' button.
    weight: 1
  - id: patient-browse-filter
    role: Patient
    screen: BrowseSlots
    flow: "Story 3: browse slots"
    steps: On Available slots choose the doctor who published the slots in the Doctor select, enter Date 2026-12-14 and use Search.
    expect: The table lists that doctor's slots on 14 Dec at 09:00, 09:30 and 10:00. The removed 10:30 slot is not listed.
    weight: 2
  - id: patient-books-slot
    role: Patient
    screen: MyAppointments
    flow: "Story 4: book a slot"
    steps: On Available slots filter to the doctor and Date 2026-12-14. Select the 09:00 row and click 'Book selected slot'. Stay on the Upcoming tab.
    expect: Arrives on My appointments. The Upcoming tab shows an appointment with the doctor, 14 Dec, 09:00, status Booked.
    weight: 2
  - id: patient-booked-slot-leaves-browse
    role: Patient
    screen: BrowseSlots
    flow: "Story 4: no double booking"
    steps: Click 'Book a slot'. Filter to the doctor and Date 2026-12-14.
    expect: The 09:00 slot is no longer listed; 09:30 and 10:00 are.
    weight: 1
  - id: patient-reschedule-screen-opens
    role: Patient
    screen: RescheduleAppointment
    flow: "Story 5: reschedule"
    steps: Click 'My appointments' in the sidebar. Click the 14 Dec 09:00 row.
    expect: The Reschedule appointment screen opens showing the current appointment (the doctor, 14 Dec 09:00), a table of available slots, and Back / Confirm new slot buttons.
    weight: 1
  - id: patient-reschedule-back
    role: Patient
    screen: MyAppointments
    flow: "Story 5: reschedule"
    steps: On Reschedule appointment click 'Back'.
    expect: Arrives on My appointments with the 14 Dec 09:00 appointment still Booked.
    weight: 1
  - id: patient-reschedules
    role: Patient
    screen: MyAppointments
    flow: "Story 5: reschedule"
    steps: Click the 14 Dec 09:00 row. In the slot table select the 14 Dec 09:30 slot and click 'Confirm new slot'.
    expect: Arrives on My appointments. The appointment now shows 14 Dec 09:30, status Booked, and there is no 09:00 appointment.
    weight: 2
  - id: patient-old-slot-available
    role: Patient
    screen: BrowseSlots
    flow: "Story 5: old slot freed"
    steps: Click 'Book a slot'. Filter to the doctor and Date 2026-12-14.
    expect: 09:00 and 10:00 are listed; 09:30 is not.
    weight: 1
  - id: patient-cancels-appointment
    role: Patient
    screen: MyAppointments
    flow: "Story 6: cancel"
    steps: Click 'My appointments'. Select the 14 Dec 09:30 appointment and click 'Cancel appointment'.
    expect: The appointment is cancelled in place and no longer appears as a Booked upcoming appointment.
    weight: 2
  - id: patient-cancelled-slot-freed
    role: Patient
    screen: BrowseSlots
    flow: "Story 6: slot freed"
    steps: Click 'Book a slot'. Filter to the doctor and Date 2026-12-14.
    expect: 09:00, 09:30 and 10:00 are all listed again.
    weight: 1
  - id: patient-past-tab
    role: Patient
    screen: MyAppointments
    flow: "Story 7: upcoming and past"
    steps: Click 'My appointments', then click the 'Past' tab, then the 'Upcoming' tab.
    expect: Each tab loads without error. No future Booked appointment is shown under Past.
    weight: 1
  - id: patient-books-near-term-slot
    role: Patient
    screen: MyAppointments
    flow: "Story 4: book a slot"
    steps: Click 'Book a slot'. Choose the doctor and set Date to today. Select the earlier of today's two slots (starting about 1 hour from now) and click 'Book selected slot'.
    expect: Arrives on My appointments. The Upcoming tab shows the appointment for today at that time, status Booked.
    weight: 1
  - id: patient-cancel-refused-near
    role: Patient
    screen: MyAppointments
    flow: "Story 6: 2-hour rule"
    steps: Select today's appointment (starts within 2 hours) and click 'Cancel appointment'.
    expect: "The cancellation is refused: the appointment is still listed as Booked."
    weight: 1
  - id: patient-reschedule-refused-near
    role: Patient
    screen: MyAppointments
    flow: "Story 5: 2-hour rule"
    steps: Click today's appointment row. Select the 14 Dec 09:00 slot and click 'Confirm new slot'. Return to My appointments if not already there.
    expect: "The move is refused: the appointment is still today at its original time, Booked, and not on 14 Dec."
    weight: 1
  - id: doctor-refused-my-appointments
    role: Doctor
    screen: DoctorSchedule
    flow: Role reach
    steps: Open the address the My appointments screen had in patient-lands-on-appointments.
    expect: The patient's My appointments screen and its data are not shown to the doctor; the app refuses it or shows a no-access outcome, without crashing.
    weight: 1
  - id: receptionist-lands-on-front-desk
    role: Receptionist
    screen: FrontDesk
    flow: "Front desk: landing"
    steps: Observe the screen the app opens on.
    expect: The Front desk screen is shown with Date input, Status select, 'Book for patient' button and the appointments table, loading without error.
    weight: 2
  - id: front-desk-date-filter
    role: Receptionist
    screen: FrontDesk
    flow: "Front desk: date filter"
    steps: Set Date to today's date.
    expect: The table lists today's appointment booked by the patient (the doctor, patient, status Booked). No 14 Dec appointment is listed.
    weight: 1
  - id: front-desk-status-filter
    role: Receptionist
    screen: FrontDesk
    flow: "Front desk: status filter"
    steps: With Date set to today, choose Status 'Booked'.
    expect: Today's appointment with status Booked is listed.
    weight: 1
  - id: receptionist-refused-doctor-schedule
    role: Receptionist
    screen: FrontDesk
    flow: Role reach
    steps: Open the address the My day screen had in doctor-lands-on-schedule.
    expect: The doctor's My day screen and its data are not shown to the receptionist; the app refuses it or shows a no-access outcome, without crashing.
    weight: 1
  - id: book-for-patient-opens
    role: Receptionist
    screen: BookForPatient
    flow: "Story 8: book for patient"
    steps: On Front desk click 'Book for patient'.
    expect: The Book for patient screen opens with Patient username, Patient name, Doctor select, Date input, a slots table, and Back / Book slot buttons.
    weight: 1
  - id: book-for-patient-filter
    role: Receptionist
    screen: BookForPatient
    flow: "Story 8: book for patient"
    steps: Choose the doctor in the Doctor select and enter Date 2026-12-14.
    expect: "The table lists the doctor's available slots on 14 Dec: 09:00, 09:30 and 10:00."
    weight: 1
  - id: book-for-patient-back
    role: Receptionist
    screen: FrontDesk
    flow: "Story 8: book for patient"
    steps: On Book for patient click 'Back'.
    expect: Arrives on the Front desk screen.
    weight: 1
  - id: receptionist-books-for-patient
    role: Receptionist
    screen: FrontDesk
    flow: "Story 8: book for patient"
    steps: Click the sidebar 'Book for patient'. Patient username 'test-patient-2', Patient name 'Pat Two', choose the doctor, Date 2026-12-14. Select the 10:00 row and click 'Book slot'. On Front desk set Date 2026-12-14.
    expect: Arrives on Front desk. A 10:00 row for Pat Two with the doctor, status Booked, is listed.
    weight: 2
  - id: receptionist-books-second
    role: Receptionist
    screen: FrontDesk
    flow: "Story 8: book for patient"
    steps: Click 'Book for patient'. Patient username 'test-patient-2', Patient name 'Pat Two', choose the doctor, Date 2026-12-14. Select the 09:00 row and click 'Book slot'. On Front desk keep Date 2026-12-14.
    expect: A 09:00 row for Pat Two, status Booked, is listed alongside the 10:00 row.
    weight: 1
  - id: receptionist-cancel-refused-near
    role: Receptionist
    screen: FrontDesk
    flow: "Story 8: 2-hour rule"
    steps: Set Date to today. Select today's appointment (starting within 2 hours) and click 'Cancel appointment'.
    expect: "The cancellation is refused: the appointment is still listed with status Booked."
    weight: 1
  - id: receptionist-checks-in-today
    role: Receptionist
    screen: FrontDesk
    flow: "Story 9: check in"
    steps: With Date set to today, select today's appointment and click 'Check in'.
    expect: The appointment's status changes to Checked in in place.
    weight: 2
  - id: receptionist-checkin-future-refused
    role: Receptionist
    screen: FrontDesk
    flow: "Story 9: same-day only"
    steps: Set Date 2026-12-14. Select the 10:00 Pat Two appointment and click 'Check in'.
    expect: "The check-in is refused: the appointment still has status Booked."
    weight: 1
  - id: receptionist-cancels-appointment
    role: Receptionist
    screen: FrontDesk
    flow: "Story 8: cancel for patient"
    steps: With Date 2026-12-14, select the 09:00 Pat Two appointment and click 'Cancel appointment'.
    expect: The 09:00 appointment is cancelled and is no longer shown as Booked; the 10:00 appointment is unchanged.
    weight: 2
  - id: patient-sees-checked-in
    role: Patient
    screen: MyAppointments
    flow: "Story 9: check in"
    steps: On My appointments view the Upcoming tab.
    expect: Today's appointment is shown with status Checked in.
    weight: 1
  - id: patient-sees-only-own
    role: Patient
    screen: MyAppointments
    flow: "Story 7: own appointments only"
    steps: Look at the Upcoming and Past tabs.
    expect: Only this patient's own appointment(s) appear. The 14 Dec 10:00 appointment booked for Pat Two is not shown.
    weight: 1
  - id: doctor-day-date-filter
    role: Doctor
    screen: DoctorSchedule
    flow: "Story 10: my day"
    steps: On My day set Date 2026-12-14.
    expect: A 10:00 row for patient Pat Two with status Booked is listed.
    weight: 2
  - id: doctor-day-today
    role: Doctor
    screen: DoctorSchedule
    flow: "Story 10: my day"
    steps: On My day set Date to today.
    expect: Today's appointment is listed with status Checked in.
    weight: 1
  - id: doctor-opens-visit-note
    role: Doctor
    screen: VisitNote
    flow: "Story 11: visit note"
    steps: Set Date 2026-12-14 and click the 10:00 Pat Two row.
    expect: The Visit note screen opens showing Pat Two and the appointment time, the status badge, and a 'Visit notes (visible to doctors only)' text area with Back / Save note buttons.
    weight: 1
  - id: doctor-saves-note
    role: Doctor
    screen: VisitNote
    flow: "Story 11: visit note"
    steps: Type 'Mild fever, rest advised' into the visit notes area and click 'Save note'. Click 'Back', then reopen the 10:00 Pat Two row.
    expect: The note is saved in place and, after reopening, the text 'Mild fever, rest advised' is shown.
    weight: 2
  - id: doctor-note-back
    role: Doctor
    screen: DoctorSchedule
    flow: "Story 11: visit note"
    steps: On Visit note click 'Back'.
    expect: Arrives on My day.
    weight: 1
  - id: doctor-remove-booked-slot-refused
    role: Doctor
    screen: MySlots
    flow: "Story 2: only unbooked"
    steps: Click 'My slots', set Date 2026-12-14, select the 10:00 slot (Booked) and click 'Remove selected slot'.
    expect: The booked slot is not removed and stays listed as Booked.
    weight: 1
  - id: no-role-no-access
    role: no role
    screen: NoAccess
    flow: "Story 13: sign-in"
    steps: Observe the screen the app shows.
    expect: A no-access page is shown instead of the app; no role's screens or data are visible.
    weight: 1
  - id: signed-out-guard
    role: signed out
    screen: NoAccess
    flow: "Story 13: sign-in"
    steps: Load the app signed out and wait for it to settle.
    expect: The app's sign-in guard runs, the address loses auth=out and the app reloads into a session without a blank page or crash.
    weight: 1
  - id: patient-signs-out
    role: Patient
    screen: NoAccess
    flow: "Story 13: sign out"
    steps: Click 'Sign out' in the sidebar.
    expect: The patient's screens and appointments are gone and the app shows its no-access state, with no sign-in form.
    weight: 1
extras:
  mustCover: []
  mustNot: []
