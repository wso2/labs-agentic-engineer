prompt: |
  An HTTP gateway our trading partners call. Every request carries a bearer JWT.
  The service validates it against a configurable issuer, audience and JWKS
  endpoint, then reads the partner id off a named claim in the payload — a token
  that fails validation is a 401, a claim naming a partner we do not know is a
  403, and `/whoami` reports back what the token resolved to.

  Behind it sits a supplier API secured with OAuth2 client credentials.
  Catalogue searches and quote pricing go there under a token this service
  obtains itself and reuses until shortly before it expires rather than fetching
  one per request. A quote is priced from the supplier's catalogue, stored
  against the partner that asked for it, and only that partner can fetch it back.

  Generate the service from `openapi.yaml`. The issuer, audience, JWKS url,
  claim name, the supplier's base url, token endpoint and client credentials,
  and the entitled partners stay configurable. No tests.

fixtures:
  openapi.yaml: openapi/partner-gateway-jwt.yaml

expect:
  builds: true
  imports:
    - ballerina/http
    - ballerina/jwt
