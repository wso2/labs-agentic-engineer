# Design section, standalone: the Expense Tracker PRD from the generated-app
# scopes design (two roles, one API, own vs all rows). This scenario exists to
# exercise the design lineup's SECURITY step — specs/design/security.json v3 —
# so its rubric leans on the permission catalog and the grants guidance the
# `security-design` skill states.

brief:
  name: expense-tracker
  idea: >-
    A shared expense tracker: an employee files a claim for money they spent at
    work and follows its status, an approver works one queue of everything
    waiting for a decision and approves or rejects each one, and Finance reads
    the monthly total from the same record.
  persona: >-
    Finance operations lead at a 300-person company; knows the claim lifecycle
    cold, has no interest in technology choices, answers in plain language.
  facts:
    - Two actors only — Employee (files claims, sees their own) and Approver (works the queue, sees every claim).
    - Sign-in is SSO through the platform identity provider; the app stores nothing about who a person is.
    - An Employee sees their own claims only; an Approver sees every claim. That is a permission difference, not two copies of the data.
    - Approvers do not file claims in this release; somebody who does both holds both roles.
    - A claim is submitted, approved or rejected — no draft state, no multi-step approval chain.
    - A decision is final; an approved or rejected claim cannot be decided again. A rejection carries a reason the employee can read.
    - The monthly report is the total of approved claims per calendar month, read-only, no export in this release.
    - Finance already exists as a group in the company directory; the people who approve claims are exactly that group.
    - Out of scope - receipt images and OCR, per-department budgets and approval limits, and the reimbursement payment itself.
    - "Notifications: everything is in-app; no email and no chat integration."
  fallback: >-
    Prefer the smallest reasonable v1; when genuinely indifferent, take the
    recommended option and keep the claim lifecycle simple.

fixture: expense-tracker-requirements

rubric:
  mustCover:
    - item: A web application component and a protected service component are both designed, with the service owning claims and the monthly report
      weight: 2
    - item: "specs/design/security.json is written at version 3 with a permissions catalog of handles and descriptions and no ownership field — which rows an operation reaches is its path in openapi.yaml"
      weight: 2
    - item: Exactly two roles, named Employee and Approver, each citing the PRD story numbers it serves, and each assigned to an organisation group (the Approver reusing the directory's existing Finance group rather than inventing one)
      weight: 2
    - item: "The service's openapi.yaml puts the employee's own claims under /me/claims (guarded by claims:read) and every claim at /claims (guarded by claims:read-all): two operations, two handles, no handle guarding both sides of /me/"
      weight: 3
    - item: "security.json names no screen (no screens table, no requires), and each role's grants cover the operation every screen that role reaches loads, at the reach the screen shows (the approvals queue lists every claim via GET /claims, so the Approver holds claims:read-all; My Claims loads GET /me/claims, so the Employee holds claims:read)"
      weight: 2
    - item: "The service's openapi.yaml declares an oauth2 security scheme whose scope keys are catalog handles, a document-level default of any signed-in user, and at most one scope on any operation"
      weight: 2
    - "Test users are declared one per role, each with a roles list, and no password appears anywhere in the design"
  mustNot:
    - "A coldStartRole, publicComponents or thunder block (version-1 fields), an ownership field (version 2), or a screens table in security.json — version 3 has none of them"
    - "More than one scope on a single operation's security requirement, or a bearerAuth security scheme"
    - An auth, login, registration or token-issuance endpoint specced on the service
    - Receipt image upload or OCR, or any payment/reimbursement integration
