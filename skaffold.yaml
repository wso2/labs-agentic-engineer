# Local dev inner loop: build → load into k3d. Build-only — no `deploy:`
# section — one-shot, not a watch loop: edit source, then `make dev-update`
# (which runs `skaffold build` here, then a plain `helm upgrade --reuse-values`
# in the Makefile to re-point the aep-platform release at the new images).
#
# Why no `deploy:` here: this v4beta11 HelmRelease schema has no field for
# passing `--reuse-values` (or any other raw CLI flag) to `helm upgrade` —
# skaffold's own helm deploy would otherwise reset every value `aectl platform
# install` set (Thunder/OpenBao/webhook URLs, etc.) back to chart defaults on
# every redeploy. A plain `helm upgrade --reuse-values` run directly has no
# such restriction, so that step lives in the Makefile instead.
#
# tagPolicy is pinned to a fixed string, not skaffold's default (gitCommit),
# so the Makefile's `helm upgrade --set ...image.tag=` can hardcode the same
# value without parsing skaffold's build output.
#
# Runs AFTER `make dev-env` (deployments/scripts/setup-env-for-aectl.sh +
# `aectl platform config import` + `aectl platform install`), which is what
# actually installs the aep-platform release.
#
# Usage:
#   make dev-env       # one-time: cluster + platform install, via aectl
#   make dev-update    # this file — edit source, then run to redeploy the change

apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: aep

build:
  tagPolicy:
    customTemplate:
      template: "dev-local"
  local:
    # k3d is detected automatically — Skaffold loads images via `k3d image import`
    # instead of pushing to a registry. TS service images use this path.
    push: false
    # Dockerfiles use BuildKit features (--mount); Skaffold's API builder
    # defaults to the legacy builder even on daemons whose CLI defaults to
    # BuildKit.
    useBuildkit: true
  artifacts:
    # aep-api requires a BuildKit named context for the skills/ directory.
    # A custom builder passes --build-context so the existing Dockerfile is
    # unchanged and production CI is unaffected.
    - image: ghcr.io/wso2/aep/aep-api
      custom:
        buildCommand: |
          docker build \
            --build-context skills=./skills \
            -f services/aep-api/Dockerfile \
            -t "$IMAGE" \
            ./services/aep-api
          if [ "${PUSH_IMAGE}" = "false" ]; then
            k3d image import "$IMAGE" --cluster openchoreo
          fi
        dependencies:
          paths:
            - services/aep-api/**
            - skills/**
          ignore:
            - services/aep-api/bin/**

    - image: ghcr.io/wso2/aep/agents
      context: .
      docker:
        dockerfile: services/agents/Dockerfile

    - image: ghcr.io/wso2/aep/collab
      context: .
      docker:
        dockerfile: services/collab/Dockerfile

    - image: ghcr.io/wso2/aep/aep-mcp-server
      context: .
      docker:
        dockerfile: services/aep-mcp-server/Dockerfile

    - image: ghcr.io/wso2/aep/console
      context: .
      docker:
        dockerfile: apps/console/Dockerfile

    # Try it, the test app an agent's "Try agent" button opens. Built here
    # because no registry publishes it — it arrived as a Docker Compose service
    # and this is the flow that replaced Compose.
    - image: ghcr.io/wso2/aep/tryit
      context: .
      docker:
        dockerfile: apps/tryit/Dockerfile

# No deploy: section (see header) — the Makefile's `dev-update` target runs
# `helm upgrade --reuse-values` directly after `skaffold build` finishes.
#
# No portForward stanza either: that's a `skaffold dev`/`run --port-forward`
# behavior, and this file only ever runs `skaffold build`. Reach the BFF with
# `kubectl -n wso2-aep port-forward svc/aep-api 9090:9090` instead.
