# pnpm workspace — every TypeScript package in the monorepo.
# Go modules (no package.json) are skipped by pnpm and live in go.work instead.
packages:
  - "apps/*"
  - "evals/*"
  - "playground"
  - "packages/*"
  - "packages/ui/*"
  - "services/*"
  - "components/dataplane/ae-system-project/ae-studio/*"
  - "runners/*"
